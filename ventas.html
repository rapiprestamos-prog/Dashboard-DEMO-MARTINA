<head>
<meta charset="utf-8">

<title>Pulso Comercial — M&amp;A Capital</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

<style>
:root{
  color-scheme:light;
  --bg:#f3f5f9; --surface:#fff; --surface-2:#f0f3f8; --border:#dde3ec; --grid:#edf1f6;
  --text:#0f1c2e; --text-2:#44546a; --muted:#7d889a;
  --navy:#1b3a5c; --navy-d:#0f2440; --teal:#0f6f6e; --gold:#e3c27a; --gold-d:#b98b2f;
  --good:#1c7a46; --bad:#b03a32; --warn:#9a6b0f;
  --c1:#2a62a0; --c2:#0d9488; --c3:#b7821c;
  --shadow:0 1px 2px rgba(15,23,42,.05),0 6px 18px rgba(15,23,42,.06);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,"Segoe UI",sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
.hidden{display:none!important}
.wrap{max-width:1380px;margin:0 auto;padding:18px 24px 50px}
.hero{position:relative;overflow:hidden;border-radius:18px;padding:22px 28px;color:#fff;background:linear-gradient(115deg,#0f2440 0%,#1b3a5c 55%,#0f5560 100%);box-shadow:0 10px 30px rgba(15,36,64,.22)}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,#e3c27a,#b98b2f 60%,transparent)}
.hero .k{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:700}
.hero h1{margin:4px 0 2px;font-family:"Playfair Display",Georgia,serif;font-weight:600;font-size:30px}.hero h1 i{color:var(--gold)}
.hero .sub{color:#c9d5e4;font-size:13.5px}
.hero .acc{position:absolute;right:24px;top:22px;display:flex;gap:8px;flex-wrap:wrap}
.hbtn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:#fff;font-weight:600;font-size:13px;cursor:pointer}
.hbtn:hover{background:rgba(255,255,255,.16)}.hbtn.pri{background:var(--gold);border-color:var(--gold);color:var(--navy-d)}
@media (max-width:900px){.hero .acc{position:static;margin-top:12px}}
.ctrl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0}
.chips{display:flex;gap:4px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:4px;flex-wrap:wrap}
.chip{border:0;background:none;padding:7px 12px;border-radius:9px;font-weight:600;font-size:13px;color:var(--text-2);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--navy);color:#fff}
.inp{padding:8px 11px;border-radius:10px;border:1px solid var(--border);background:var(--surface);outline:none;font-size:13px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:10px;border:1px solid var(--border);background:var(--surface);font-weight:700;font-size:13px;cursor:pointer}
.per{font-size:12.5px;color:var(--text-2)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:14px;overflow-x:auto}
.tab{border:0;background:none;padding:10px 14px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--navy);border-bottom-color:var(--gold-d)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:12px}
@media (max-width:1000px){.kpis{grid-template-columns:1fr 1fr}}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:13px 15px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--gold-d)}
.kpi .l{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;display:flex;justify-content:space-between;gap:8px}
.kpi .v{font-size:25px;font-weight:800;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12px;color:var(--text-2);margin-top:2px;display:flex;justify-content:space-between;gap:8px}
.var{font-size:11px;font-weight:800;padding:2px 7px;border-radius:999px;white-space:nowrap}
.var.up{background:#e9f6ef;color:var(--good)}.var.dn{background:#fbeceb;color:var(--bad)}.var.eq{background:var(--surface-2);color:var(--muted)}
.pos{color:var(--good)}.neg{color:var(--bad)}
.g2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.gh{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:1000px){.g2,.g3,.gh{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow)}
.pad{padding:16px 18px}
.ch-t{font-weight:800;font-size:14px;margin:0 0 2px}.ch-s{font-size:12px;color:var(--muted);margin-bottom:10px}
.box{position:relative;height:260px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text-2);margin-bottom:6px}.legend span{display:inline-flex;align-items:center;gap:6px}.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.big{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--grid);font-size:13px}.li:last-child{border-bottom:0}.li b{font-variant-numeric:tabular-nums}
.barra{height:10px;border-radius:5px;background:var(--grid);overflow:hidden;margin:10px 0 4px}.barra i{display:block;height:100%;background:var(--c3);border-radius:5px}
.tag{display:inline-block;font-size:11px;font-weight:800;padding:2px 9px;border-radius:999px}
.tag.ok{background:#e9f6ef;color:var(--good)}.tag.rev{background:#fdf6e6;color:var(--warn)}.tag.bad{background:#fbeceb;color:var(--bad)}
.nota{font-size:12px;color:var(--text-2);background:var(--surface-2);border-radius:10px;padding:9px 11px;margin-top:10px;line-height:1.5}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:right;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:9px 10px;border-bottom:1px solid var(--border);background:var(--surface-2);white-space:nowrap;cursor:pointer}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t td{text-align:right;padding:8px 10px;border-bottom:1px solid var(--grid);font-variant-numeric:tabular-nums;white-space:nowrap}
.inl{display:inline-block;height:6px;border-radius:3px;background:var(--c1);vertical-align:middle;margin-right:6px}
.vacio{padding:26px 16px;text-align:center;color:var(--muted);font-size:13px;line-height:1.55}.vacio>b{display:block;color:var(--text);font-size:14.5px;margin-bottom:4px}
.guia{line-height:1.7;font-size:14px;color:var(--text-2)}.guia h3{color:var(--text);font-size:16px;margin:18px 0 6px}.guia h3:first-child{margin-top:0}.guia b{color:var(--text)}.guia ul,.guia ol{padding-left:20px;margin:6px 0}
.prompt{background:#0f1c2e;color:#e6ecf5;border-radius:12px;padding:16px 18px;font-family:ui-monospace,Consolas,monospace;font-size:12.5px;line-height:1.6;white-space:pre-wrap;max-height:480px;overflow:auto}
.spin{display:inline-block;width:16px;height:16px;border-radius:50%;border:2px solid #dbe3ee;border-top-color:var(--navy);animation:sp .8s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
@media print{.hero .acc,.ctrl,.tabs,#maHdr{display:none!important}.card,.kpi{box-shadow:none;break-inside:avoid}}
</style>
</head>

<!-- ===== M&A Capital · acceso (cada página es independiente; mismo usuario y clave en todas) ===== -->
<style>
.ma-hdr{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:10px 12px 0;padding:7px 14px;border-radius:12px;color:#fff;
  background:linear-gradient(115deg,#0f2440,#1b3a5c 55%,#0f5560);box-shadow:0 1px 2px rgba(15,23,42,.05),0 4px 14px rgba(15,23,42,.05);font-family:Inter,system-ui,"Segoe UI",sans-serif;line-height:1.3}
.ma-hdr .ma-b{display:flex;align-items:center;gap:12px;min-width:0}
.ma-hdr .ma-logo{height:40px;width:auto;flex:none;filter:drop-shadow(0 2px 6px rgba(0,0,0,.25))}
.ma-hdr .ma-sep{width:1px;align-self:stretch;margin:4px 0;background:linear-gradient(180deg,transparent,rgba(227,194,122,.7),transparent)}
.ma-hdr .ma-k{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#e3c27a;font-weight:700;text-decoration:none}
.ma-hdr .ma-k:hover{color:#fff}
.ma-hdr h1{margin:0;font-size:17px;font-weight:800;color:#fff}
.ma-hdr .ma-sub{font-size:11.5px;color:rgba(255,255,255,.75);margin-top:1px}
.ma-hdr .ma-der{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ma-chip{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:rgba(227,194,122,.2);color:#e3c27a;border:1px solid rgba(227,194,122,.45)}
.ma-hbtn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:9px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;font:600 12.5px Inter,system-ui,sans-serif;cursor:pointer;text-decoration:none}
.ma-hbtn:hover{background:rgba(255,255,255,.16)}
.ma-oculto{display:none!important}
body.ma-fuera>*:not(.ma-hdr):not(.ma-login):not(script):not(style):not(link){display:none!important}
.ma-login{flex:1;min-height:0;overflow:auto;display:flex;align-items:center;justify-content:center;padding:24px;font-family:Inter,system-ui,"Segoe UI",sans-serif;background:#f3f5f9}
.ma-card{width:100%;max-width:420px;background:#fff;border:1px solid #dde3ec;border-radius:18px;box-shadow:0 18px 50px rgba(15,23,42,.12);overflow:hidden}
.ma-top{padding:26px 28px 20px;color:#fff;text-align:center;background:radial-gradient(120% 160% at 12% 0%,#2b5a86 0%,#1b3a5c 40%,#0f2440 80%)}
.ma-top img{height:62px;margin-bottom:10px}
.ma-top .ma-ey{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#e3c27a;font-weight:700}
.ma-top h2{margin:4px 0 0;font-size:19px;font-weight:800}
.ma-body{padding:24px 28px 22px}
.ma-body form{display:flex;flex-direction:column;gap:10px}
.ma-inp{padding:10px 12px;border-radius:9px;border:1px solid #dde3ec;font:14px Inter,system-ui,sans-serif;color:#0f1c2e;background:#fff;outline:none}
.ma-inp:focus{border-color:#1b3a5c}
.ma-ok{padding:11px 22px;border-radius:9px;border:1px solid #e3c27a;background:#e3c27a;color:#0f2440;font:700 14px Inter,system-ui,sans-serif;cursor:pointer}
.ma-ok:disabled{opacity:.6;cursor:default}
.ma-err{color:#b03a32;min-height:16px;font-size:12.5px;text-align:center}
.ma-nota{margin:14px 0 0;font-size:11.5px;color:#8792a4;text-align:center;line-height:1.5}
.ma-nota a{color:#1b3a5c;font-weight:600}
.ma-idle{position:fixed;right:22px;bottom:22px;z-index:9999;max-width:360px;background:#fff;border:1px solid #f0dcaa;border-left:5px solid #b98b2f;border-radius:12px;padding:14px 16px;box-shadow:0 18px 40px rgba(15,23,42,.22);font:13px Inter,system-ui,sans-serif;color:#0f1c2e}
.ma-idle b{display:block;margin-bottom:4px;font-size:14px}
.ma-idle button{margin-top:10px;padding:6px 12px;border-radius:8px;border:none;background:#1b3a5c;color:#fff;font:600 12.5px Inter,system-ui,sans-serif;cursor:pointer}
</style>

      <div class="ma-der"><span id="maExtra"></span><span class="ma-chip ma-oculto" id="maChip"></span><button class="ma-hbtn ma-oculto" id="maSalir" title="Cerrar sesión">⎋ Salir</button></div>`;
    document.body.prepend(h); $("maSalir").onclick=()=>salir();
  }
  function pantallaLogin(msg,sinPermiso){
    document.body.classList.add("ma-fuera");
    let l=$("maLogin"); if(l) l.remove();
    l=document.createElement("div"); l.className="ma-login"; l.id="maLogin";
    const titulo=O.soloAdmin?"Usuarios y permisos":(O.titulo||"Dashboard Interno Ultimate");
    l.innerHTML=`<div class="ma-card"><div class="ma-top"><img src="${LOGO}" alt="M&amp;A Capital Inc"><div class="ma-ey">M&amp;A Capital · Uso interno</div><h2>${esc(titulo)}</h2></div>
      <div class="ma-body">${sinPermiso?`<div class="ma-err" style="margin-bottom:14px">${esc(msg)}</div>
        <button class="ma-ok" id="maOtro" style="width:100%">Entrar con otro usuario</button>`:`<form id="maForm">
        <input class="ma-inp" type="email" id="maEmail" placeholder="correo@empresa.com" autocomplete="username" required>
        <input class="ma-inp" type="password" id="maPass" placeholder="Contraseña" autocomplete="current-password" required>
        <button class="ma-ok" type="submit" id="maEntrar">Entrar</button>
        <div class="ma-err" id="maErr">${esc(msg||"")}</div></form>`}
        <p class="ma-nota">La sesión se cierra al pulsar “Salir”, al cerrar la pestaña o tras 10 minutos sin actividad.<br><a href="index.html">← Volver al inicio</a></p></div></div>`;
    const hdr=$("maHdr"); if(hdr) hdr.after(l); else document.body.prepend(l);
    if(sinPermiso){ $("maOtro").onclick=async()=>{ try{ await sb.auth.signOut(); }catch(e){} pantallaLogin(""); }; return; }
    $("maForm").onsubmit=async e=>{
      e.preventDefault(); $("maErr").textContent=""; $("maEntrar").disabled=true;
      const {error}=await sb.auth.signInWithPassword({email:$("maEmail").value.trim(),password:$("maPass").value});
      $("maEntrar").disabled=false; $("maPass").value="";
      if(error){ $("maErr").textContent=/invalid/i.test(error.message)?"Correo o contraseña incorrectos.":error.message; return; }
      ss.setItem(KACT,String(Date.now())); await validar();
    };
    setTimeout(()=>{ try{ $("maEmail").focus(); }catch(e){} },50);
  }
  // ¿quién es y qué puede ver? (ma_usuarios: rol, módulos, activo)
  async function leerUsuario(){
    if(!sb) return null;
    const {data:{session}}=await sb.auth.getSession(); if(!session) return null;
    const ult=+ss.getItem(KACT)||0;
    if(ult&&Date.now()-ult>IDLE){ try{ await sb.auth.signOut(); }catch(e){} ss.setItem(KMSG,"La sesión se cerró por 10 minutos sin actividad."); return null; }
    const email=session.user.email.toLowerCase();
    const {data:yo,error}=await sb.from("ma_usuarios").select("rol,modulos,activo").eq("email",email).maybeSingle();
    if(error) return {error:"No se pudo validar tu acceso: "+error.message};
    if(!yo||!yo.activo){ try{ await sb.auth.signOut(); }catch(e){} return {error:"Tu usuario no tiene acceso al dashboard o está desactivado. Pídele acceso a la administradora."}; }
    return {sb,email,rol:yo.rol,modulos:yo.modulos||[],token:session.access_token,user:session.user,url:URL_,anon:ANON};
  }
  const puede=(c,id)=>c&&(c.rol==="admin"||(c.modulos||[]).includes(id));
  function avisarPagina(){ if(!ctx) return; try{ window.postMessage({type:"MA_SESSION",url:URL_,anon:ANON,token:ctx.token,email:ctx.email,rol:ctx.rol,modulos:ctx.modulos},"*"); }catch(e){} }
  async function validar(){
    const c=await leerUsuario();
    if(!c){ const m=ss.getItem(KMSG)||""; ss.removeItem(KMSG); pantallaLogin(m); return; }
    if(c.error){ pantallaLogin(c.error); return; }
    if(O.soloAdmin? c.rol!=="admin" : (O.modulo&&!puede(c,O.modulo))){
      pantallaLogin(O.soloAdmin?"Solo la administradora puede manejar usuarios.":"Tu usuario ("+c.email+") no tiene acceso a "+(O.titulo||"este módulo")+". Pídele acceso a la administradora.",true); return; }
    ctx=c; const l=$("maLogin"); if(l) l.remove(); document.body.classList.remove("ma-fuera");
    if($("maSub")) $("maSub").textContent=c.email;
    if($("maChip")){ $("maChip").textContent=ROL_TXT[c.rol]||c.rol; $("maChip").classList.remove("ma-oculto"); }
    if($("maSalir")) $("maSalir").classList.remove("ma-oculto");
    actividad(); avisarPagina(); listo(c);
    try{ window.dispatchEvent(new CustomEvent("ma:sesion",{detail:c})); }catch(e){}
  }
  // ---- inactividad (cuenta en todas las páginas de la pestaña) ----
  let ultEsc=0;
  function actividad(){ const n=Date.now(); if(n-ultEsc>1000){ ultEsc=n; ss.setItem(KACT,String(n)); } const b=$("maIdle"); if(b) b.remove(); }
  ["mousemove","mousedown","keydown","wheel","touchstart","scroll"].forEach(ev=>addEventListener(ev,()=>{ if(ctx) actividad(); },{passive:true,capture:true}));
  setInterval(()=>{
    if(!ctx) return;
    const resta=IDLE-(Date.now()-(+ss.getItem(KACT)||Date.now()));
    if(resta<=0){ salir("La sesión se cerró por 10 minutos sin actividad."); return; }
    if(resta<=AVISO){ let b=$("maIdle");
      if(!b){ b=document.createElement("div"); b.id="maIdle"; b.className="ma-idle"; b.innerHTML=`<b>¿Sigues ahí?</b>La sesión se cerrará en <span id="maSeg"></span> s por inactividad.<br><button type="button">Seguir conectado</button>`; document.body.appendChild(b); b.querySelector("button").onclick=()=>{ ultEsc=0; actividad(); }; }
      $("maSeg").textContent=Math.ceil(resta/1000); }
  },1000);
  async function salir(msg){
    ctx=null; try{ await sb.auth.signOut(); }catch(e){}
    ss.removeItem(KACT); if(msg) ss.setItem(KMSG,msg); else ss.setItem(KMSG,"Sesión cerrada.");
    location.reload();   // la página vuelve a empezar limpia, sin datos en pantalla
  }
  if(sb) sb.auth.onAuthStateChange((ev,session)=>{
    if(ev==="TOKEN_REFRESHED"&&ctx&&session){ ctx.token=session.access_token; avisarPagina(); }
    if(ev==="SIGNED_OUT"&&ctx) salir("La sesión expiró. Vuelve a entrar.");
  });
  addEventListener("load",()=>{ if(ctx) avisarPagina(); });

  return {
    MODULOS, ROL_TXT, VERSION, sb, puede, esc, actividad:()=>{ if(ctx) actividad(); },
    listo:listoP, ctx:()=>ctx, salir,
    // Página que exige usuario: {modulo, titulo, soloAdmin, cabecera}
    iniciar(o){ O=o||{}; document.body.classList.add("ma-fuera"); cabecera();
      if(!ON){ pantallaLogin("Falta configurar Supabase en el dashboard."); return listoP; }
      validar(); return listoP; },
    // Inicio: no exige usuario; si ya entró en esta pestaña, devuelve quién es
    async opcional(){ if(!ON) return null; const c=await leerUsuario(); if(!c||c.error) return null; ctx=c; actividad(); return c; }
  };
})();
</script>
<script>
/* ===== Fuentes automáticas de carpetas (sin que Chrome pregunte) =====
   1) ACCESO DIRECTO: la página se abre desde la carpeta de OneDrive de la PC con el acceso directo
      "Dashboard M&A" (Chrome con --allow-file-access-from-files en un perfil aparte). Lee la carpeta
      que está al lado de la página (o la propia carpeta de la página). Solo lectura.
   2) MICROSOFT 365: lee la carpeta de OneDrive en la nube con la cuenta Microsoft de la persona
      (Microsoft Graph). Necesita una app registrada por el administrador de Microsoft 365 de M&A
      (clientId) y el enlace de la carpeta. Lee y guarda.
   Si ninguna está disponible, cada módulo usa lo de siempre (elegir carpeta en Chrome). */
(function(){
  const MS={clientId:"",tenant:""||"organizations",
    carpetas:{PruebaDashboard:"",Contabilidad:"",Legal:""}};
  const msOn=()=>/^[0-9a-f-]{36}$/i.test(MS.clientId);

  /* ---------- 1) acceso directo (file://) ---------- */
  const xhr=(url,tipo)=>new Promise((ok,no)=>{ const x=new XMLHttpRequest(); x.open("GET",url); if(tipo) x.responseType=tipo;
    x.onload=()=>(x.status===0||x.status===200)?ok(x.response):no(new Error("HTTP "+x.status)); x.onerror=()=>no(new Error("sin acceso")); x.send(); });
  async function listarLocal(url){
    const t=await xhr(url); const out=[]; const re=/addRow\((.*?)\);<\/script>/g; let m;
    if(!/addRow\(/.test(t)) throw new Error("no es una carpeta");
    while((m=re.exec(t))){ try{ const a=JSON.parse("["+m[1]+"]"); if(a[0]==="."||a[0]==="..") continue;
      let n=a[0]; try{ n=decodeURIComponent(String(a[1]).replace(/\/$/,""))||a[0]; }catch(e){}
      out.push({name:n,url:a[1],dir:!!a[2],size:a[3],mod:(a[5]||0)*1000}); }catch(e){} }
    return out;
  }
  function dirLocal(url,name){
    return {kind:"directory",name,auto:"local",
      async *entries(){ for(const e of await listarLocal(url)){
        if(e.dir){ let u=url+e.url; if(!u.endsWith("/")) u+="/"; yield [e.name,dirLocal(u,e.name)]; } else yield [e.name,fileLocal(url+e.url,e)]; } },
      async getDirectoryHandle(n){ const e=(await listarLocal(url)).find(x=>x.dir&&x.name===n); if(!e){ const er=new Error("no existe"); er.name="NotFoundError"; throw er; } let u=url+e.url; if(!u.endsWith("/")) u+="/"; return dirLocal(u,n); },
      async getFileHandle(n,o){ const e=(await listarLocal(url)).find(x=>!x.dir&&x.name===n); if(!e||(o&&o.create&&!e)){ const er=new Error(o&&o.create?"Con el acceso directo la carpeta es solo de lectura. Para guardar, abre el dashboard en línea.":"no existe"); er.name=o&&o.create?"NotAllowedError":"NotFoundError"; throw er; } const f=fileLocal(url+e.url,e); f.createWritable=async()=>{ throw new Error("Con el acceso directo la carpeta es solo de lectura. Para guardar, abre el dashboard en línea."); }; return f; },
      async queryPermission(o){ return o&&o.mode==="readwrite"?"denied":"granted"; }, async requestPermission(o){ return o&&o.mode==="readwrite"?"denied":"granted"; }};
  }
  const fileLocal=(u,e)=>({kind:"file",name:e.name,meta:{mod:e.mod,size:e.size},async getFile(){ return new File([await xhr(u,"arraybuffer")],e.name,{lastModified:e.mod}); }});
  async function fuenteLocal(nombre){
    if(location.protocol!=="file:") return null;
    const base=location.href.replace(/[?#].*$/,"").replace(/[^/]*$/,"");
    const actual=decodeURIComponent(base.split("/").filter(Boolean).pop()||"");
    const norm=s=>String(s).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
    try{
      if(norm(actual)===norm(nombre)){ await listarLocal(base); return dirLocal(base,actual); }     // la página está dentro de la carpeta del módulo
      const hijos=await listarLocal(base); const h=hijos.find(e=>e.dir&&norm(e.name)===norm(nombre));     // la carpeta está al lado de la página
      if(h){ let u=base+h.url; if(!u.endsWith("/")) u+="/"; return dirLocal(u,h.name); }
    }catch(e){}
    return null;
  }

  /* ---------- 2) Microsoft 365 (OneDrive en la nube) ---------- */
  const GRAPH="https://graph.microsoft.com/v1.0", ALCANCE=["Files.ReadWrite.All"];
  let msal=null, msalP=null;
  function cargarMsal(){ if(window.msal) return Promise.resolve(window.msal); if(msalP) return msalP;
    msalP=new Promise((ok,no)=>{ const s=document.createElement("script"); s.src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.27.0/lib/msal-browser.min.js"; s.onload=()=>ok(window.msal); s.onerror=()=>no(new Error("No se pudo cargar el inicio de sesión de Microsoft.")); document.head.appendChild(s); });
    return msalP; }
  async function token(gesto){
    const lib=await cargarMsal();
    if(!msal){ msal=new lib.PublicClientApplication({auth:{clientId:MS.clientId,authority:"https://login.microsoftonline.com/"+MS.tenant,redirectUri:location.href.replace(/[?#].*$/,"").replace(/[^/]*$/,"")},cache:{cacheLocation:"localStorage"}}); if(msal.initialize) await msal.initialize(); }
    const cuenta=msal.getAllAccounts()[0];
    const pista=(window.MA&&MA.ctx()&&MA.ctx().email)||undefined;
    if(cuenta){ try{ return (await msal.acquireTokenSilent({scopes:ALCANCE,account:cuenta})).accessToken; }catch(e){} }
    else if(pista){ try{ return (await msal.ssoSilent({scopes:ALCANCE,loginHint:pista})).accessToken; }catch(e){} }
    if(!gesto) return null;
    return (await msal.acquireTokenPopup({scopes:ALCANCE,loginHint:pista})).accessToken;
  }
  async function g(tok,ruta,op){ op=op||{}; const r=await fetch(ruta.startsWith("http")?ruta:GRAPH+ruta,{method:op.method||"GET",headers:{Authorization:"Bearer "+tok,...(op.tipo?{"Content-Type":op.tipo}:{})},body:op.body});
    if(r.status===404){ const e=new Error("no existe"); e.name="NotFoundError"; throw e; }
    if(!r.ok){ let m=r.statusText; try{ m=(await r.json()).error.message; }catch(e){} throw new Error("Microsoft 365: "+m); }
    return op.crudo?r:(r.status===204?null:r.json()); }
  const b64u=s=>"u!"+btoa(unescape(encodeURIComponent(s))).replace(/=+$/,"").replace(/\//g,"_").replace(/\+/g,"-");
  function dirMS(tok,drive,item){
    const hijos=async()=>{ let url=`/drives/${drive}/items/${item.id}/children?$top=999`, out=[]; while(url){ const j=await g(tok,url); out.push(...(j.value||[])); url=j["@odata.nextLink"]||null; } return out; };
    return {kind:"directory",name:item.name,auto:"ms365",
      async *entries(){ for(const c of await hijos()) yield [c.name,c.folder?dirMS(tok,drive,c):fileMS(tok,drive,c,item.id)]; },
      async getDirectoryHandle(n,o){ const c=(await hijos()).find(x=>x.folder&&x.name===n); if(c) return dirMS(tok,drive,c);
        if(!(o&&o.create)){ const e=new Error("no existe"); e.name="NotFoundError"; throw e; }
        return dirMS(tok,drive,await g(tok,`/drives/${drive}/items/${item.id}/children`,{method:"POST",tipo:"application/json",body:JSON.stringify({name:n,folder:{},"@microsoft.graph.conflictBehavior":"fail"})})); },
      async getFileHandle(n,o){ const c=(await hijos()).find(x=>x.file&&x.name===n); if(c) return fileMS(tok,drive,c,item.id);
        if(!(o&&o.create)){ const e=new Error("no existe"); e.name="NotFoundError"; throw e; }
        return fileMS(tok,drive,{name:n,size:0,lastModifiedDateTime:new Date().toISOString()},item.id); },
      async removeEntry(n){ const c=(await hijos()).find(x=>x.name===n); if(!c){ const e=new Error("no existe"); e.name="NotFoundError"; throw e; } await g(tok,`/drives/${drive}/items/${c.id}`,{method:"DELETE"}); },
      async queryPermission(){ return "granted"; }, async requestPermission(){ return "granted"; }};
  }
  function fileMS(tok,drive,c,padre){
    const mod=Date.parse(c.lastModifiedDateTime)||0;
    return {kind:"file",name:c.name,meta:{mod,size:c.size},
      async getFile(){ const u=c["@microsoft.graph.downloadUrl"]; const r=u?await fetch(u):await g(tok,`/drives/${drive}/items/${c.id}/content`,{crudo:true}); return new File([await r.arrayBuffer()],c.name,{lastModified:mod}); },
      async createWritable(){ const partes=[]; return {async write(d){ partes.push(d); }, async close(){ const blob=new Blob(partes);
        await g(tok,`/drives/${drive}/items/${padre}:/${encodeURIComponent(c.name)}:/content`,{method:"PUT",tipo:"application/octet-stream",body:blob}); }}; }};
  }
  async function fuenteMS(nombre,gesto){
    if(!msOn()) return null; const link=MS.carpetas[nombre]; if(!/^https?:\/\//.test(link||"")) return null;
    const tok=await token(gesto); if(!tok) return null;
    const it=await g(tok,`/shares/${b64u(link)}/driveItem`);
    return dirMS(tok,it.parentReference.driveId,it);
  }

  // abierto desde la PC pero sin el permiso del acceso directo (el navegador ya estaba abierto): avisarlo claro
  async function avisoLocal(){
    if(location.protocol!=="file:"||document.getElementById("maAvisoLocal")) return;
    try{ await listarLocal(location.href.replace(/[?#].*$/,"").replace(/[^/]*$/,"")); return; }catch(e){}
    const d=document.createElement("div"); d.id="maAvisoLocal";
    d.style.cssText="position:fixed;left:50%;transform:translateX(-50%);top:14px;z-index:9998;max-width:760px;width:calc(100% - 32px);background:#fdf6e6;border:1px solid #f0dcaa;border-left:5px solid #b98b2f;border-radius:12px;padding:14px 18px;box-shadow:0 18px 40px rgba(15,23,42,.22);font:13.5px Inter,system-ui,sans-serif;color:#6b4d12;line-height:1.5";
    d.innerHTML='<b style="display:block;font-size:15px;color:#0f1c2e;margin-bottom:4px">El navegador ya estaba abierto y no tomó el permiso del acceso directo</b>Cierra <b>todas</b> las ventanas de Chrome (y en la bandeja junto al reloj, clic derecho en Chrome → Salir) y vuelve a abrir el acceso directo. Así lee la carpeta solo, sin pedirla.<br><button type="button" style="margin-top:8px;padding:6px 12px;border-radius:8px;border:none;background:#1b3a5c;color:#fff;font:600 12.5px Inter,system-ui,sans-serif;cursor:pointer">Entendido</button>';
    d.querySelector("button").onclick=()=>d.remove(); document.body.appendChild(d);
  }
  window.MA.fuente=async(nombre,o)=>{ o=o||{};
    const l=await fuenteLocal(nombre); if(l) return l;
    avisoLocal();
    try{ return await fuenteMS(nombre,!!o.gesto); }catch(e){ if(o.gesto) throw e; return null; } };
  window.MA.ms365=()=>msOn()&&Object.values(MS.carpetas).some(x=>/^https?:\/\//.test(x||""));
})();
</script>
<script>
/* ===== Consolidado de Excel conservando el formato =====
   Copia cada hoja tal como está en el Excel original: anchos de columna, alto de filas, fuentes,
   colores, bordes, formato de números, celdas combinadas y paneles fijos. Las fórmulas se pasan
   con su valor (para que no queden apuntando a otros libros). Agrega una hoja "Índice" con enlaces.
   lista: [{nombre, carpeta, getFile:async()=>File}] */
(function(){
  let P=null;
  const cargar=()=>window.ExcelJS?Promise.resolve(window.ExcelJS):(P=P||new Promise((ok,no)=>{ const s=document.createElement("script"); s.src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"; s.onload=()=>ok(window.ExcelJS); s.onerror=()=>no(new Error("No se pudo cargar el armador de Excel (revisa internet).")); document.head.appendChild(s); }));
  const limpio=s=>String(s).replace(/[\\/?*[\]:]/g," ").replace(/\s+/g," ").trim();
  const valor=v=>{ if(v&&typeof v==="object"&&!(v instanceof Date)){ if("formula" in v||"sharedFormula" in v) return v.result===undefined?null:(v.result&&typeof v.result==="object"&&v.result.error?null:v.result); } return v; };
  const copia=o=>o?JSON.parse(JSON.stringify(o)):o;
  window.MA.consolidarExcel=async(lista,nombreSalida,titulo,progreso)=>{
    const ExcelJS=await cargar(); const out=new ExcelJS.Workbook(); out.creator="M&A Capital · Dashboard";
    const ind=out.addWorksheet("Índice",{views:[{showGridLines:false}]});
    const usados=new Set(["índice"]), filas=[], fallos=[]; let n=0;
    for(let k=0;k<lista.length;k++){ const it=lista[k]; progreso&&progreso(`Armando ${k+1} de ${lista.length}: ${it.nombre}`);
      try{
        let buf=await (await it.getFile()).arrayBuffer();
        const wbx=XLSX.read(buf,{type:"array"});   // valores guardados en el archivo (sirve para fórmulas cuyo resultado es 0)
        if(!/\.(xlsx|xlsm)$/i.test(it.nombre)) buf=XLSX.write(wbx,{bookType:"xlsx",type:"array"});   // .xls/.csv
        const src=new ExcelJS.Workbook(); await src.xlsx.load(buf);
        const hojas=src.worksheets.filter(w=>w.state!=="hidden"&&w.state!=="veryHidden"&&w.actualRowCount>0);
        const base=limpio(it.nombre.replace(/\.[^.]+$/,""));
        for(const ws of hojas){ n++;
          let nom=(String(n).padStart(2,"0")+" "+(hojas.length>1?base.slice(0,14).trim()+" · "+limpio(ws.name):base)).slice(0,31).trim(), i=2;
          while(usados.has(nom.toLowerCase())){ nom=nom.slice(0,28)+" "+(i++); } usados.add(nom.toLowerCase());
          const dst=out.addWorksheet(nom,{properties:copia(ws.properties),pageSetup:copia(ws.pageSetup),views:copia(ws.views)});
          if(ws.properties&&ws.properties.tabColor) dst.properties.tabColor=copia(ws.properties.tabColor);
          (ws.columns||[]).forEach((c,ci)=>{ const d=dst.getColumn(ci+1); if(c.width) d.width=c.width; if(c.hidden) d.hidden=true; if(c.style&&Object.keys(c.style).length) d.style=copia(c.style); });
          ws.eachRow({includeEmpty:true},(row,ri)=>{ const r=dst.getRow(ri); if(row.height) r.height=row.height; if(row.hidden) r.hidden=true;
            row.eachCell({includeEmpty:true},(cell,ci)=>{ const c=r.getCell(ci); let v=valor(cell.value);
              if((v===null||v===undefined)&&cell.value&&typeof cell.value==="object"&&("formula" in cell.value||"sharedFormula" in cell.value)){ const sx=wbx.Sheets[ws.name]&&wbx.Sheets[ws.name][cell.address]; if(sx&&sx.v!==undefined&&sx.t!=="e") v=sx.v; } if(v!==null&&v!==undefined) c.value=(v instanceof Date||typeof v!=="object")?v:copia(v); c.style=copia(cell.style)||{}; }); });
          ((ws.model&&ws.model.merges)||[]).forEach(m=>{ try{ dst.mergeCells(m); }catch(e){} });
          filas.push([it.carpeta||"",it.nombre,ws.name,nom]);
        }
      }catch(e){ fallos.push(it.nombre); }
    }
    // Índice
    ind.columns=[{width:6},{width:16},{width:58},{width:30},{width:34}];
    ind.mergeCells("A1:E1"); const t=ind.getCell("A1"); t.value=titulo||"Consolidado"; t.font={bold:true,size:16,color:{argb:"FF0F2440"}};
    ind.mergeCells("A2:E2"); ind.getCell("A2").value=`${filas.length} hoja(s) de ${lista.length-fallos.length} archivo(s) · generado ${new Date().toLocaleString("es-PA")}`; ind.getCell("A2").font={color:{argb:"FF8792A4"},size:10};
    const h=ind.getRow(4); ["#","Carpeta","Archivo original","Hoja original","Hoja en este libro"].forEach((x,i)=>{ const c=h.getCell(i+1); c.value=x; c.font={bold:true,color:{argb:"FFFFFFFF"}}; c.fill={type:"pattern",pattern:"solid",fgColor:{argb:"FF1B3A5C"}}; c.alignment={vertical:"middle"}; }); h.height=20;
    filas.forEach((f,i)=>{ const r=ind.getRow(5+i); r.getCell(1).value=i+1; r.getCell(2).value=f[0]; r.getCell(3).value=f[1]; r.getCell(4).value=f[2];
      r.getCell(5).value={text:f[3],hyperlink:"#'"+f[3].replace(/'/g,"''")+"'!A1"}; r.getCell(5).font={color:{argb:"FF1A3FBF"},underline:true};
      if(i%2) for(let c=1;c<=5;c++) r.getCell(c).fill={type:"pattern",pattern:"solid",fgColor:{argb:"FFF3F5F9"}}; });
    if(fallos.length){ const r=ind.getRow(6+filas.length); r.getCell(3).value="No se pudieron leer: "+fallos.join(", "); r.getCell(3).font={color:{argb:"FFB03A32"}}; }
    ind.views=[{state:"frozen",ySplit:4,showGridLines:false}];
    const blob=new Blob([await out.xlsx.writeBuffer()],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=nombreSalida; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),3000);
    return {hojas:filas.length,fallos};
  };
})();
</script>
<script>
/* ===== Instalar el dashboard como app (solo en línea, desde GitHub) =====
   Una app instalada guarda el permiso de las carpetas: después de darlo una vez, ya no vuelve a pedir "Abrir carpeta". */
(function(){
  if(!/^https:/.test(location.protocol)&&location.hostname!=="localhost") { window.MA.instalable=()=>false; window.MA.instalar=async()=>false; window.MA.esApp=()=>false; return; }
  const l=document.createElement("link"); l.rel="manifest"; l.href="manifest.webmanifest"; document.head.appendChild(l);
  try{ if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{}); }catch(e){}
  let ev=null; const avisar=()=>document.dispatchEvent(new CustomEvent("ma-instalable"));
  window.addEventListener("beforeinstallprompt",e=>{ e.preventDefault(); ev=e; avisar(); });
  window.addEventListener("appinstalled",()=>{ ev=null; avisar(); });
  window.MA.esApp=()=>{ try{ return matchMedia("(display-mode: standalone)").matches||matchMedia("(display-mode: window-controls-overlay)").matches; }catch(e){ return false; } };
  window.MA.instalable=()=>!!ev;
  window.MA.instalar=async()=>{ if(!ev) return false; ev.prompt(); const r=await ev.userChoice.catch(()=>({})); ev=null; avisar(); return r&&r.outcome==="accepted"; };
  // Botón en la cabecera común
  function boton(){ const der=document.getElementById("maExtra"); if(!der) return;
    let b=document.getElementById("maInstalar");
    if(!window.MA.instalable()){ if(b) b.remove(); return; }
    if(!b){ b=document.createElement("button"); b.id="maInstalar"; b.className="ma-hbtn"; b.title="Instalar el dashboard como app: así no vuelve a pedir la carpeta"; b.textContent="⬇ Instalar app"; b.onclick=()=>window.MA.instalar(); der.appendChild(b); } }
  document.addEventListener("ma-instalable",boton); setTimeout(boton,1500);
})();
</script>

<script>
/* Conexión con la Hoja de Google (Apps Script) que usan Bitácora Ejecutiva y Pulso Comercial.
   La URL fija viene del build; mientras no exista, la administradora puede pegarla aquí (se guarda en este navegador). */
window.GS=(function(){
  const FIJA="https://script.google.com/macros/s/AKfycbxsZaPZuyCN59GoLi5SkjROyBhmW0-SlrVpMahyFZ8lP7qMrwcnElC38nAecyCLtIwFfw/exec", K="ma_gs_url", CODIGO="/**\n * M&A Capital — Bitácora Ejecutiva, Tablero de Notas y Pulso Comercial\n * Servidor en Google Apps Script. La base de datos es esta misma Hoja de cálculo de Google.\n *\n * Cómo se instala (una sola vez):\n *   1. Crea una Hoja de cálculo de Google nueva (por ejemplo «M&A · Bitácora y Ventas»).\n *   2. Extensiones › Apps Script. Borra lo que haya y pega TODO este archivo. Guarda.\n *   3. Implementar › Nueva implementación › tipo «Aplicación web».\n *        Ejecutar como: Yo        ·        Quién tiene acceso: Cualquier usuario\n *      Autoriza los permisos que pide Google (es tu propia cuenta).\n *   4. Copia la URL que termina en /exec y pégala en el dashboard (o envíala para dejarla fija).\n *   5. (Opcional) Ejecuta una vez la función instalarAvisoDiario para el correo de cada mañana.\n *\n * Seguridad: aunque la URL sea pública, cada pedido trae la sesión del dashboard M&A.\n * El script la verifica con Supabase y solo responde a usuarios con el módulo correspondiente.\n */\n\nconst SB_URL  = 'https://oiongsqkcbovzsavjwql.supabase.co';\nconst SB_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9pb25nc3FrY2JvdnpzYXZqd3FsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE3Njc5NTEsImV4cCI6MjEwNzM0Mzk1MX0.nV1qgE1gd3TybJKhF8q_JphvkqbJtCLldl63YBTaLqs';\n\nconst TABLAS = {\n  Tareas: ['id','titulo','descripcion','responsable','proyecto','prioridad','estado','avance','inicio','limite','obstaculo','impacto','creado','creado_por','actualizado','actualizado_por','cerrado','etiquetas','recurrencia','depende_de','enlace','aprobador','aprobacion'],\n  Notas:  ['id','titulo','texto','color','fijada','tarea_id','autor','creado','actualizado','tablero','etiquetas','recordar','orden'],\n  Comentarios: ['id','tarea_id','texto','autor','creado'],\n  Historial: ['fecha','usuario','tarea_id','titulo','cambio'],\n  Ventas: ['Fecha','Producto','Categoria','Cliente','Vendedor','Cantidad','Precio_unitario','Costo_unitario'],\n  Gastos: ['Fecha','Concepto','Categoria','Tipo','Monto'],\n  Stock:  ['Producto','Categoria','Stock','Stock_minimo','Costo_unitario','Precio_venta']\n};\n\n/* ---------------- entrada ---------------- */\nfunction doGet() {\n  return ContentService.createTextOutput('M&A Capital · servicio de Bitácora Ejecutiva y Pulso Comercial activo.');\n}\n\nfunction doPost(e) {\n  let r;\n  try {\n    const b = JSON.parse((e && e.postData && e.postData.contents) || '{}');\n    prepararHoja_();\n    const yo = usuario_(b.token);\n    const [area, accion] = String(b.accion || '').split('.');\n    if (area === 'bitacora') { exigir_(yo, b.token, 'bitacora'); r = bitacora_(accion, b, yo); }\n    else if (area === 'ventas') { exigir_(yo, b.token, 'ventas'); r = ventas_(accion, b, yo); }\n    else if (area === 'notas') { exigir_(yo, b.token, 'notas'); r = notas_(accion, b, yo); }\n    else if (area === 'info') r = { email: yo.email, hoja: SpreadsheetApp.getActive().getUrl() };\n    else throw new Error('Acción desconocida');\n    r = { ok: true, datos: r };\n  } catch (err) {\n    r = { ok: false, error: String(err && err.message || err) };\n  }\n  return ContentService.createTextOutput(JSON.stringify(r)).setMimeType(ContentService.MimeType.JSON);\n}\n\n/* ---------------- sesión del dashboard (Supabase) ---------------- */\nfunction usuario_(token) {\n  if (!token) throw new Error('Falta la sesión: entra desde el dashboard M&A.');\n  const cache = CacheService.getScriptCache(), k = 'u_' + Utilities.base64Encode(Utilities.computeDigest(Utilities.DigestAlgorithm.SHA_256, token));\n  const c = cache.get(k); if (c) return JSON.parse(c);\n  const res = UrlFetchApp.fetch(SB_URL + '/auth/v1/user', { headers: { apikey: SB_ANON, Authorization: 'Bearer ' + token }, muteHttpExceptions: true });\n  if (res.getResponseCode() !== 200) throw new Error('La sesión venció: vuelve a entrar al dashboard.');\n  const u = { email: String(JSON.parse(res.getContentText()).email || '').toLowerCase() };\n  cache.put(k, JSON.stringify(u), 300);\n  return u;\n}\nfunction exigir_(yo, token, modulo) {\n  const cache = CacheService.getScriptCache(), k = 'm_' + modulo + '_' + yo.email;\n  if (cache.get(k) === '1') return;\n  const res = UrlFetchApp.fetch(SB_URL + '/rest/v1/rpc/ma_tiene_modulo', { method: 'post', contentType: 'application/json',\n    payload: JSON.stringify({ p_modulo: modulo }), headers: { apikey: SB_ANON, Authorization: 'Bearer ' + token }, muteHttpExceptions: true });\n  if (res.getResponseCode() !== 200 || res.getContentText().trim() !== 'true') throw new Error('Tu usuario no tiene acceso a este módulo.');\n  cache.put(k, '1', 300);\n}\n\n/* ---------------- hoja ---------------- */\nfunction prepararHoja_() {\n  const ss = SpreadsheetApp.getActive();\n  Object.keys(TABLAS).forEach(n => {\n    let h = ss.getSheetByName(n);\n    if (!h) { h = ss.insertSheet(n); h.getRange(1, 1, 1, TABLAS[n].length).setValues([TABLAS[n]]).setFontWeight('bold').setBackground('#1b3a5c').setFontColor('#ffffff'); h.setFrozenRows(1); return; }\n    const cab = h.getLastColumn() ? h.getRange(1, 1, 1, h.getLastColumn()).getValues()[0].map(String) : [];\n    const faltan = TABLAS[n].filter(c => cab.indexOf(c) < 0);\n    if (faltan.length) h.getRange(1, cab.length + 1, 1, faltan.length).setValues([faltan]).setFontWeight('bold').setBackground('#1b3a5c').setFontColor('#ffffff');\n  });\n  const hoja1 = ss.getSheetByName('Hoja 1') || ss.getSheetByName('Sheet1');\n  if (hoja1 && ss.getSheets().length > Object.keys(TABLAS).length && hoja1.getLastRow() === 0) ss.deleteSheet(hoja1);\n}\nfunction zona_() { return SpreadsheetApp.getActive().getSpreadsheetTimeZone(); }\nfunction valor_(v) {\n  if (v instanceof Date) return Utilities.formatDate(v, zona_(), v.getHours() || v.getMinutes() ? \"yyyy-MM-dd'T'HH:mm:ss\" : 'yyyy-MM-dd');\n  return v;\n}\nfunction leer_(nombre) {\n  const h = SpreadsheetApp.getActive().getSheetByName(nombre);\n  const n = h.getLastRow(); if (n < 2) return [];\n  const datos = h.getRange(1, 1, n, h.getLastColumn()).getValues(), cab = datos[0].map(String);\n  return datos.slice(1).filter(f => f.some(x => x !== '' && x !== null)).map(f => { const o = {}; cab.forEach((c, i) => { if (c) o[c] = valor_(f[i]); }); return o; });\n}\nfunction guardar_(nombre, obj) {\n  const lock = LockService.getScriptLock(); lock.waitLock(20000);\n  try {\n    const h = SpreadsheetApp.getActive().getSheetByName(nombre), cab = h.getRange(1, 1, 1, h.getLastColumn()).getValues()[0].map(String);\n    const col = cab.indexOf('id') + 1;\n    const ids = col && h.getLastRow() > 1 ? h.getRange(2, col, h.getLastRow() - 1, 1).getValues().map(x => String(x[0])) : [];\n    const fila = cab.map(c => obj[c] == null ? '' : obj[c]);\n    const i = ids.indexOf(String(obj.id));\n    if (i >= 0) h.getRange(i + 2, 1, 1, cab.length).setValues([fila]); else h.appendRow(fila);\n    return obj;\n  } finally { lock.releaseLock(); }\n}\nfunction borrar_(nombre, id) {\n  const lock = LockService.getScriptLock(); lock.waitLock(20000);\n  try {\n    const h = SpreadsheetApp.getActive().getSheetByName(nombre);\n    if (h.getLastRow() < 2) return false;\n    const col = h.getRange(1, 1, 1, h.getLastColumn()).getValues()[0].map(String).indexOf('id') + 1;\n    const ids = h.getRange(2, col, h.getLastRow() - 1, 1).getValues().map(x => String(x[0]));\n    const i = ids.indexOf(String(id)); if (i < 0) return false;\n    h.deleteRow(i + 2); return true;\n  } finally { lock.releaseLock(); }\n}\nconst ahora_ = () => Utilities.formatDate(new Date(), zona_(), \"yyyy-MM-dd'T'HH:mm:ss\");\nfunction anotar_(yo, t, cambio) {\n  SpreadsheetApp.getActive().getSheetByName('Historial').appendRow([ahora_(), yo.email, t.id, t.titulo, cambio]);\n}\nfunction mover_(fecha, rec) {\n  if (!fecha) return '';\n  const d = new Date(String(fecha).slice(0, 10) + 'T12:00:00');\n  if (rec === 'Semanal') d.setDate(d.getDate() + 7);\n  else if (rec === 'Quincenal') d.setDate(d.getDate() + 14);\n  else if (rec === 'Mensual') d.setMonth(d.getMonth() + 1);\n  else if (rec === 'Trimestral') d.setMonth(d.getMonth() + 3);\n  else return fecha;\n  return Utilities.formatDate(d, zona_(), 'yyyy-MM-dd');\n}\n\n/* ---------------- Bitácora Ejecutiva ---------------- */\nfunction bitacora_(accion, b, yo) {\n  if (accion === 'listar') return { tareas: leer_('Tareas'), notas: leer_('Notas'), comentarios: leer_('Comentarios'), historial: leer_('Historial').slice(-400), hoja: SpreadsheetApp.getActive().getUrl() };\n  if (accion === 'guardarTarea') {\n    const t = Object.assign({}, b.tarea || {});\n    if (!t.titulo) throw new Error('La tarea necesita un título.');\n    const antes = t.id ? leer_('Tareas').filter(x => String(x.id) === String(t.id))[0] : null;\n    if (!t.id) { t.id = Utilities.getUuid(); t.creado = ahora_(); t.creado_por = yo.email; }\n    t.actualizado = ahora_(); t.actualizado_por = yo.email;\n    if (t.estado === 'Hecha' && !t.cerrado) t.cerrado = ahora_().slice(0, 10);\n    if (t.estado !== 'Hecha') t.cerrado = '';\n    guardar_('Tareas', t);\n    if (!antes) anotar_(yo, t, 'Creó la tarea');\n    else {\n      if (antes.estado !== t.estado) anotar_(yo, t, 'Estado: ' + (antes.estado || '—') + ' → ' + t.estado + (t.estado === 'Bloqueada' && t.obstaculo ? ' (' + t.obstaculo + ')' : ''));\n      if (String(antes.responsable || '') !== String(t.responsable || '')) anotar_(yo, t, 'Responsable: ' + (t.responsable || '—'));\n      if (String(antes.aprobacion || '') !== String(t.aprobacion || '') && t.aprobacion) anotar_(yo, t, 'Aprobación: ' + t.aprobacion);\n    }\n    // tarea recurrente: al cerrarla se crea la siguiente\n    let siguiente = null;\n    if (t.estado === 'Hecha' && (!antes || antes.estado !== 'Hecha') && t.recurrencia && t.recurrencia !== 'No') {\n      siguiente = Object.assign({}, t, { id: Utilities.getUuid(), estado: 'Pendiente', avance: 0, cerrado: '', obstaculo: '', impacto: '', aprobacion: t.aprobador ? 'Pendiente' : '',\n        inicio: mover_(t.inicio, t.recurrencia), limite: mover_(t.limite, t.recurrencia), creado: ahora_(), creado_por: yo.email });\n      guardar_('Tareas', siguiente); anotar_(yo, siguiente, 'Creada automáticamente (' + t.recurrencia.toLowerCase() + ')');\n    }\n    return siguiente ? Object.assign({}, t, { _siguiente: siguiente }) : t;\n  }\n  if (accion === 'comentar') {\n    if (!b.tarea_id || !String(b.texto || '').trim()) throw new Error('Escribe el comentario.');\n    return guardar_('Comentarios', { id: Utilities.getUuid(), tarea_id: b.tarea_id, texto: String(b.texto).trim(), autor: yo.email, creado: ahora_() });\n  }\n  if (accion === 'borrarComentario') return borrar_('Comentarios', b.id);\n  if (accion === 'borrarTarea') return borrar_('Tareas', b.id);\n  if (accion === 'guardarNota') {\n    const n = Object.assign({}, b.nota || {});\n    if (!n.id) { n.id = Utilities.getUuid(); n.creado = ahora_(); n.autor = yo.email; }\n    n.actualizado = ahora_();\n    return guardar_('Notas', n);\n  }\n  if (accion === 'borrarNota') return borrar_('Notas', b.id);\n  throw new Error('Acción desconocida');\n}\n\n/* ---------------- Tablero de Notas ---------------- */\nfunction notas_(accion, b, yo) {\n  if (accion === 'listar') return { notas: leer_('Notas'), tareas: leer_('Tareas').filter(t => t.estado !== 'Hecha').map(t => ({ id: t.id, titulo: t.titulo })), hoja: SpreadsheetApp.getActive().getUrl() };\n  if (accion === 'guardar') return bitacora_('guardarNota', b, yo);\n  if (accion === 'borrar') return borrar_('Notas', b.id);\n  throw new Error('Acción desconocida');\n}\n\n/* ---------------- Pulso Comercial ---------------- */\nfunction ventas_(accion, b, yo) {\n  if (accion === 'datos') return { ventas: leer_('Ventas'), gastos: leer_('Gastos'), stock: leer_('Stock'), hoja: SpreadsheetApp.getActive().getUrl() };\n  throw new Error('Acción desconocida');\n}\n\n/* ---------------- correo de cada mañana (opcional) ---------------- */\nfunction instalarAvisoDiario() {\n  ScriptApp.getProjectTriggers().filter(t => t.getHandlerFunction() === 'avisoDiario').forEach(t => ScriptApp.deleteTrigger(t));\n  ScriptApp.newTrigger('avisoDiario').timeBased().everyDays(1).atHour(7).create();\n}\nfunction avisoDiario() {\n  prepararHoja_();\n  const hoy = Utilities.formatDate(new Date(), zona_(), 'yyyy-MM-dd');\n  const abiertas = leer_('Tareas').filter(t => t.estado !== 'Hecha' && String(t.responsable || '').indexOf('@') > 0);\n  const porPersona = {}, aprobar = {}, recordar = {};\n  abiertas.forEach(t => { const l = String(t.limite || ''); if ((l && l <= hoy) || t.estado === 'Bloqueada') (porPersona[t.responsable] = porPersona[t.responsable] || []).push(t); });\n  leer_('Tareas').forEach(t => { if (t.aprobacion === 'Pendiente' && String(t.aprobador || '').indexOf('@') > 0) (aprobar[t.aprobador] = aprobar[t.aprobador] || []).push(t); });\n  leer_('Notas').forEach(n => { if (String(n.recordar || '').slice(0, 10) === hoy && String(n.autor || '').indexOf('@') > 0) (recordar[n.autor] = recordar[n.autor] || []).push(n); });\n  Object.keys(aprobar).concat(Object.keys(recordar)).forEach(e => { porPersona[e] = porPersona[e] || []; });\n  Object.keys(porPersona).forEach(email => {\n    const ts = porPersona[email].sort((a, b) => String(a.limite).localeCompare(String(b.limite)));\n    const extra = (aprobar[email] || []).map(t => `<li>Por aprobar: <b>${t.titulo}<\/b>${t.responsable ? ' (' + t.responsable + ')' : ''}<\/li>`).join('') +\n      (recordar[email] || []).map(n => `<li>Recordatorio: <b>${n.titulo || ''}<\/b> ${n.texto || ''}<\/li>`).join('');\n    const filas = ts.map(t => `<tr><td style=\"padding:6px 10px;border-bottom:1px solid #eee\"><b>${t.titulo}<\/b>${t.proyecto ? '<br><span style=\"color:#888\">' + t.proyecto + '<\/span>' : ''}<\/td>\n      <td style=\"padding:6px 10px;border-bottom:1px solid #eee\">${t.limite || '—'}<\/td><td style=\"padding:6px 10px;bor or (let k = 0; k < n; k++) { const p = P[Math.floor(rnd() * P.length)];\n      ventas.push([f(d), p[0] + E, p[1], CL[Math.floor(rnd() * CL.length)], VE[Math.floor(rnd() * VE.length)], p[1] === 'Comercial' ? 1 + Math.floor(rnd() * 6) : 1, p[2], p[3]]); }\n  }\n  const gastos = [];\n  for (let m = 4; m >= 0; m--) {\n    const d1 = new Date(hoy.getFullYear(), hoy.getMonth() - m, 1, 12), d15 = new Date(hoy.getFullYear(), hoy.getMonth() - m, 15, 12);\n    [['Alquiler de oficina','Oficina','Fijo',4200],['Planilla','Personal','Fijo',18500],['Software y licencias','Tecnología','Fijo',900]].forEach(g => gastos.push([f(d1), g[0] + E, g[1], g[2], g[3]]));\n    if (d15 <= hoy) [['Comisiones de venta','Comercial','Variable',1500 + Math.round(rnd() * 900)],['Viáticos','Operación','Variable',400 + Math.round(rnd() * 500)],['Publicidad','Comercial','Variable',700 + Math.round(rnd() * 600)]]\n      .forEach(g => gastos.push([f(d15), g[0] + E, g[1], g[2], g[3]]));\n  }\n  const stock = [['Papelería corporativa','Insumos',12,20,8,0],['Tóner de impresora','Insumos',3,4,65,0],['Carpetas de cierre','Insumos',140,50,1.2,0],['Kits de bienvenida','Comercial',40,10,35,60],['Licencias de software','Tecnología',25,5,120,0]]\n    .map(s => [s[0] + E].concat(s.slice(1)));\n  const ss = SpreadsheetApp.getActive();\n  [['Ventas', ventas], ['Gastos', gastos], ['Stock', stock]].forEach(([n, filas]) => {\n    if (!filas.length) return; const h = ss.getSheetByName(n);\n    h.getRange(h.getLastRow() + 1, 1, filas.length, filas[0].length).setValues(filas);\n  });\n  return { ventas: ventas.length, gastos: gastos.length, stock: stock.length };\n}\nfunction borrarEjemplos() {\n  const ss = SpreadsheetApp.getActive();\n  [['Ventas', 'Producto'], ['Gastos', 'Concepto'], ['Stock', 'Producto']].forEach(([n, col]) => {\n    const h = ss.getSheetByName(n); if (!h || h.getLastRow() < 2) return;\n    const c = h.getRange(1, 1, 1, h.getLastColumn()).getValues()[0].map(String).indexOf(col) + 1; if (!c) return;\n function rango(){
  const h=hoy(), d=new Date(h+"T12:00:00");
  if(PER==="hoy") return [h,h];
  if(PER==="7d") return [masDias(h,-6),h];
  if(PER==="30d") return [masDias(h,-29),h];
  if(PER==="mes") return [iso(new Date(d.getFullYear(),d.getMonth(),1)),h];
  if(PER==="mesant") return [iso(new Date(d.getFullYear(),d.getMonth()-1,1)),iso(new Date(d.getFullYear(),d.getMonth(),0))];
  if(PER==="anio") return [iso(new Date(d.getFullYear(),0,1)),h];

function anterior([a,b]){

  const mb=ing-cmv, gas=fij+vari, res=mb-gas, mc=ing-cmv-vari, rmc=ing?mc/ing:null, pe=rmc>0?fij/rmc:null;

/* ---------- Guía y prompt ---------- */
const PROMPT=`Actúa como desarrollador senior de Google Apps Script y analista financiero.
Quiero un dashboard comercial ejecutivo, "Pulso Comercial", conectado a una Hoja de cálculo de Google, para M&A Capital (estilo azul marino y dorado).

DATOS (pestañas de la hoja, fila 1 = encabezados):
- Ventas: Fecha, Producto, Categoria, Cliente, Vendedor, Cantidad, Precio_unitario, Costo_unitario
- Gastos: Fecha, Concepto, Categoria, Tipo (Fijo/Variable), Monto
- Stock: Producto, Categoria, Stock, Stock_minimo, Costo_unitario, Precio_venta

SERVIDOR (Codigo.gs, aplicación web): doPost con acción "ventas.datos" que devuelve las tres tablas; valida la sesión del usuario (token de Supabase) y el módulo "ventas"; crea las pestañas si no existen.

PÁGINA:
- Filtros de período: Hoy, 7 días, 30 días, Mes actual, Mes anterior, Año y Rango; todo se compara con el período anterior equivalente (▲/▼ en verde o rojo según si es bueno o malo).
- General: ingresos, CMV, margen bruto, resultado neto; estructura de gastos fijos/variables; margen de contribución y su ratio; punto de equilibrio = gastos fijos / ratio MC con barra de cobertura y DÉFICIT/SUPERÁVIT; evolución diaria o mensual de ingresos, costos+gastos y resultado; ticket promedio; proyección lineal al cierre del mes (marcada como estimación).
- Ventas: por categoría, por vendedor, top 10 productos con margen y variación, concentración 80/20, mejores clientes.
- Gastos: por categoría con variación, fijos vs variables, últimos gastos.

/* ============================ ejemplo (datos inventados) ============================ */
function ejemplo(){
  let sem=7; const rnd=()=>(sem=(sem*16807)%2147483647)/2147483647;
  const P=[["Consultoría financiera","Servicios",1200,420],["Avalúo de inmueble","Servicios",650,210],["Due diligence","Legal",2400,900],["Redacción de contrato","Legal",380,90],["Gestión de alquileres","Inmobiliario",520,180],["Administración de fondo","Inmobiliario",3100,1400],["Informe de mercado","Servicios",290,60],["Auditoría interna","Servicios",1800,820]];
  const CL=["Inversiones Alfa","Grupo Beta","Comercial Delta","Fundación Omega","Constructora Sigma","Particular"], VE=["Ana Pérez","Luis Gómez","Carlos Díaz"];
  const h=hoy(), ventas=[], gastos=[];
  for(let i=120;i>=0;i--){ const f=masDias(h,-i), n=Math.floor(rnd()*4); for(let k=0;k<n;k++){ const p=P[Math.floor(rnd()*P.length)]; ventas.push({Fecha:f,Producto:p[0],Categoria:p[1],Cliente:CL[Math.floor(rnd()*CL.length)],Vendedor:VE[Math.floor(rnd()*VE.length)],Cantidad:1+Math.floor(rnd()*3),Precio_unitario:Math.round(p[2]*(0.9+rnd()*0.2)),Costo_unitario:p[3]}); } }
  const d0=new Date(h+"T12:00:00");
  for(let m=4;m>=0;m--){ const y=d0.getFullYear(), mm=d0.getMonth()-m, f=iso(new Date(y,mm,1)), f15=iso(new Date(y,mm,15));
    [["Alquiler de oficina","Oficina","Fijo",4200],["Planilla","Personal","Fijo",18500],["Software y licencias","Tecnología","Fijo",900]].forEach(g=>gastos.push({Fecha:f,Concepto:g[0],Categoria:g[1],Tipo:g[2],Monto:g[3]}));
    if(f15<=h) [["Comisiones de venta","Comercial","Variable",1500+Math.round(rnd()*900)],["Viáticos","Operación","Variable",400+Math.round(rnd()*500)],["Publicidad","Comercial","Variable",700+Math.round(rnd()*600)]].forEach(g=>gastos.push({Fecha:f15,Concepto:g[0],Categoria:g[1],Tipo:g[2],Monto:g[3]})); }
  const stock=[["Papelería corporativa","Insumos",12,20,8,0],["Tóner de impresora","Insumos",3,4,65,0],["Carpetas de cierre","Insumos",140,50,1.2,0],["Kits de bienvenida","Comercial",0,10,35,60],["Licencias de software","Tecnología",25,5,120,0]]
    .map(s=>({Producto:s[0],Categoria:s[1],Stock:s[2],Stock_minimo:s[3],Costo_unitario:s[4],Precio_venta:s[5]}));
  return {ventas,gastos,stock};
}
