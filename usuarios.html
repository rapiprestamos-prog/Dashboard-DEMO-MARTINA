<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Usuarios y permisos — M&amp;A Capital</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#f3f5f9; --surface:#ffffff; --surface-2:#f0f3f8; --surface-3:#e7ecf3; --border:#dde3ec;
  --text:#0f1c2e; --text-2:#44546a; --muted:#8792a4;
  --navy:#1b3a5c; --navy-d:#0f2440; --teal:#0f6f6e; --gold:#e3c27a; --gold-d:#b98b2f;
  --good:#1c7a46; --bad:#b03a32; --grid:#edf1f6; --zebra:#f8fafc;
  --shadow:0 1px 2px rgba(15,23,42,.05),0 4px 14px rgba(15,23,42,.05);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
.wrap{max-width:none;margin:0;padding:12px 14px}
.hidden{display:none!important}

/* ---------- Home ---------- */
.home-hdr{position:relative;overflow:hidden;border-radius:18px;padding:28px 30px;margin-bottom:20px;color:#fff;
  background:radial-gradient(120% 160% at 12% 0%,#2b5a86 0%,#1b3a5c 40%,#0f2440 80%);box-shadow:var(--shadow)}
.home-hdr .eyebrow{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:700;margin:0 0 6px}
.home-hdr h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.015em}
.home-hdr p{margin:6px 0 0;font-size:13.5px;opacity:.8;max-width:640px;line-height:1.55}
.home-bar{height:4px;border-radius:999px;margin-top:20px;background:linear-gradient(90deg,var(--gold),#7dd3fc 45%,rgba(255,255,255,.15))}
.search-card{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px 16px;margin-bottom:24px;box-shadow:var(--shadow)}
.search-count{font-weight:700;font-size:13.5px;color:var(--text-2);white-space:nowrap}
.search-box{flex:1;display:flex;align-items:center;gap:9px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:9px 12px}
.search-box input{flex:1;border:none;background:transparent;font:inherit;color:var(--text);outline:none}
.cat-hdr{display:flex;align-items:center;gap:11px;margin-bottom:14px}
.cat-ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:#e8eef6;border:1px solid #d6e0ec}
.cat-title{font-size:17px;font-weight:800;margin:0}
.pill{font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--surface-2);color:var(--text-2);border:1px solid var(--border)}
.cat-line{flex:1;height:2px;border-radius:999px;background:var(--grid)}
.mod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:22px}
.cat{margin-bottom:30px}
.cat-ic svg{width:19px;height:19px;stroke:var(--navy);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mod-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 20px;text-align:center;cursor:pointer;box-shadow:var(--shadow);
  transition:transform .14s ease,box-shadow .14s ease,border-color .14s ease}
.mod-card:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(15,23,42,.12);border-color:#c9d4e3}
.mod-ic{width:60px;height:60px;border-radius:18px;margin:0 auto 14px;display:grid;place-items:center;font-size:28px;background:linear-gradient(135deg,#f8e7b9,var(--gold))}
.mod-card h3{margin:0 0 6px;font-size:15.5px;font-weight:800}
.mod-card p{margin:0 0 14px;font-size:12.5px;color:var(--muted);line-height:1.5}
.mod-card.sin{cursor:default}.mod-card.sin .mod-tag{background:var(--muted)}
.mod-card.sin h3{margin-bottom:14px}
.mod-tag{display:inline-block;font-size:11px;font-weight:700;padding:5px 12px;border-radius:999px;color:#fff;background:var(--navy)}

/* ---------- Módulo ---------- */
.back{display:inline-flex;align-items:center;gap:6px;color:var(--text-2);font-size:12.5px;font-weight:600;cursor:pointer;margin-bottom:8px;background:none;border:none;padding:0}
.back:hover{color:var(--navy)}
.mhdr{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;border-radius:14px;padding:12px 18px;margin-bottom:10px;color:#fff;
  background:linear-gradient(115deg,var(--navy-d),var(--navy) 55%,#0f5560);box-shadow:var(--shadow)}
.mhdr .k{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:700}
.mhdr h1{margin:1px 0 0;font-size:19px;font-weight:800}
.mhdr .sub{margin-top:3px;font-size:12.5px;color:rgba(255,255,255,.75)}
.hbtns{display:flex;gap:8px;flex-wrap:wrap}
.hbtn{display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;font-size:13px;font-weight:600;cursor:pointer}
.hbtn:hover{background:rgba(255,255,255,.16)}
.hbtn.pri{background:var(--gold);border-color:var(--gold);color:var(--navy-d)}
.hbtn:disabled{opacity:.5;cursor:not-allowed}

.mtabs{display:flex;gap:4px;padding:4px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:11px;max-width:100%;overflow-x:auto}
.kback{background:none;border:none;padding:0;cursor:pointer;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:700}
.kback:hover{color:#fff}
.mtab{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:8px;border:none;background:transparent;color:rgba(255,255,255,.8);font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.mtab:hover{background:rgba(255,255,255,.1)}
.mtab[aria-selected="true"]{background:var(--gold);color:var(--navy-d)}
.mtab .cnt{font-size:11px;padding:1px 7px;border-radius:999px;background:rgba(0,0,0,.08)}
.mtab[aria-selected="true"] .cnt{background:rgba(255,255,255,.2)}

.banner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:6px 8px 6px 14px;border-radius:10px;margin-bottom:10px;font-size:12.5px;background:#fdf6e6;border:1px solid #f0dcaa;color:#6b4d12}
.banner.err{background:#fbeceb;border-color:#efc4c0;color:#7c2620}
.banner.ok{background:#e9f6ef;border-color:#bfe3cf;color:#155a35}
.banner .grow{flex:1;min-width:220px}
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:9px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:13px;font-weight:600;cursor:pointer}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.pri:hover{filter:brightness(1.12)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--navy-d)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}

/* ---------- Lector ---------- */
.lector{display:grid;grid-template-columns:270px minmax(0,1fr);gap:12px;align-items:stretch;height:100%}
.sideoff .lector{grid-template-columns:1fr}
.sideoff .lector>.panel:first-child{display:none}
#viewer{min-width:0}
#viewer.full{position:fixed;inset:10px;height:auto;z-index:60;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(15,23,42,.35)}
#viewer.full .tbl-wrap{flex:1;max-height:none}
.fullbg{position:fixed;inset:0;background:rgba(15,28,46,.45);z-index:55}
@media (max-width:900px){.lector{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.side-top{padding:12px;border-bottom:1px solid var(--border);background:var(--surface-2)}
.side-top input{width:100%;padding:9px 12px;border-radius:9px;border:1px solid var(--border);background:var(--surface);font:inherit;color:var(--text);outline:none}
.side-top input:focus{border-color:var(--navy)}
/* El módulo ocupa exactamente la pantalla: sin desplazar la página, cada panel se desplaza por dentro */
#viewModulo:not(.hidden),#viewUsuarios:not(.hidden),#viewApp:not(.hidden){display:flex;flex-direction:column;position:fixed;top:16px;right:24px;bottom:16px;left:24px}
#viewUsuarios>*{flex:none}
#viewApp:not(.hidden){display:flex;flex-direction:column;position:fixed;top:16px;right:24px;bottom:16px;left:24px}
#viewApp>*{flex:none}
#appFrame{flex:1;min-height:0;width:100%;border:1px solid var(--border);border-radius:14px;background:#fff;box-shadow:var(--shadow)}
#appFrame.hidden{display:none}
#viewUsuarios>#usrPanel:not(.hidden){flex:1;min-height:0;display:flex;flex-direction:column}
body.enModulo{overflow:hidden}
#viewModulo>*{flex:none}
#viewModulo>#moduloBody:not(.hidden){flex:1;min-height:0;display:flex;flex-direction:column}
#moduloBody>section:not(.hidden){flex:1;min-height:0}
.lector>.panel{display:flex;flex-direction:column;min-height:0}
.lector>.panel>*{flex:none}
.lector>.panel>.tree{flex:1;min-height:0;overflow-y:auto;padding:6px 0}
#viewer>.tbl-wrap{flex:1;min-height:0}
#viewer>.empty{flex:1}
@media (max-width:900px){#viewModulo:not(.hidden){position:static}body.enModulo{overflow:auto}.lector{height:auto}.lector>.panel>.tree{max-height:60vh}#viewer>.tbl-wrap{max-height:75vh}}
.y-row{display:flex;align-items:center;gap:8px;padding:9px 14px;font-weight:800;font-size:13.5px;color:var(--navy);cursor:pointer;user-select:none}
.y-row:hover{background:var(--surface-2)}
.chev{display:inline-block;width:12px;transition:transform .15s;color:var(--muted);font-size:10px}
.closed>.y-row .chev,.closed>.m-row .chev{transform:rotate(-90deg)}
.closed>.kids{display:none}
.m-row{display:flex;align-items:center;gap:8px;padding:7px 14px 7px 30px;font-weight:700;font-size:12.5px;color:var(--text-2);cursor:pointer;user-select:none;letter-spacing:.02em}
.m-row:hover{background:var(--surface-2)}
.m-row .pill{margin-left:auto;font-size:10.5px;padding:1px 8px}
.f-row{display:flex;align-items:flex-start;gap:9px;padding:8px 14px 8px 48px;cursor:pointer;border-left:3px solid transparent}
.f-row:hover{background:var(--surface-2)}
.f-row.sel{background:#eaf0f7;border-left-color:var(--navy)}
.f-ic{flex:none;width:22px;height:22px;border-radius:5px;background:#1d6f42;color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;margin-top:1px}
.f-ic.csv{background:#5a6b80}
.f-name{font-size:12.8px;line-height:1.35;color:var(--text);word-break:break-word}
.f-date{font-size:11px;color:var(--muted);margin-top:2px}
.empty{padding:40px 24px;text-align:center;color:var(--text-2)}
.empty b{display:block;font-size:15.5px;color:var(--text);margin-bottom:6px}
.empty .big{font-size:34px;margin-bottom:10px}

.viewer-hdr{padding:10px 14px 8px;border-bottom:1px solid var(--border)}
.crumbs{font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:.03em;text-transform:uppercase}
.crumbs b{color:var(--gold-d)}
.viewer-title{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:4px}
.viewer-title h2{margin:0;font-size:18px;font-weight:800;line-height:1.3;word-break:break-word}
.viewer-meta{font-size:12px;color:var(--muted);margin-top:4px}
.stabs{display:flex;gap:5px;flex-wrap:wrap;align-items:flex-end;padding:8px 14px 0;border-bottom:1px solid var(--border)}
.stab{padding:6px 12px;border-radius:8px 8px 0 0;border:1px solid var(--border);border-bottom:none;background:var(--surface-2);color:var(--text-2);font-size:12.5px;font-weight:600;cursor:pointer}
.stab[aria-selected="true"]{background:var(--surface);color:var(--navy);box-shadow:inset 0 3px 0 var(--gold)}
.sheet-info{margin-left:auto;align-self:center;padding:0 2px 6px;font-size:11.5px;color:var(--muted);white-space:nowrap}
.tbl-wrap{overflow:auto}
table.x{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
table.x th{position:sticky;top:0;z-index:2;background:var(--navy);color:#fff;font-weight:600;font-size:11.5px;text-align:left;padding:8px 10px;white-space:nowrap;border-right:1px solid rgba(255,255,255,.12)}
table.x th.n,table.x td.n{text-align:right}
table.x td{padding:4px 9px;font-size:12.5px;border-bottom:1px solid var(--grid);border-right:1px solid #e1e7ef;white-space:nowrap;max-width:340px;overflow:hidden;text-overflow:ellipsis}
table.x tbody tr:nth-child(even) td{background:var(--zebra)}
table.x tbody tr:hover td{background:#eef3fa}
table.x td.rn,table.x th.rn{position:sticky;left:0;z-index:1;width:44px;min-width:44px;text-align:right;color:var(--muted);font-size:11px;background:var(--surface-2)}
table.x th.rn{z-index:3;background:var(--navy-d);color:rgba(255,255,255,.6)}
table.x td.neg{color:var(--bad)}
table.x tr.totrow td{font-weight:700;background:#eef2f7!important;border-top:2px solid var(--navy)}
.more{padding:10px 18px;font-size:12px;color:var(--muted);border-top:1px solid var(--border)}

/* ---------- Pantera ---------- */
.pframe-wrap{position:relative;height:100%}
#panteraFrame{display:block;width:100%;height:100%;min-height:480px;border:1px solid var(--border);border-radius:14px;background:#fff;box-shadow:var(--shadow)}
.ploading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:rgba(243,245,249,.92);border-radius:14px;font-weight:600;color:var(--text-2)}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--surface-3);border-top-color:var(--navy);animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- Conectar ---------- */
.connect{max-width:560px;margin:40px auto;text-align:center;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:36px 30px;box-shadow:var(--shadow)}
.connect .big{font-size:42px;margin-bottom:10px}
.connect h2{margin:0 0 8px;font-size:19px;font-weight:800}
.connect p{margin:0 0 18px;color:var(--text-2);font-size:13.5px;line-height:1.55}
.connect code{display:inline-block;margin-bottom:18px;padding:6px 10px;border-radius:8px;background:var(--surface-2);font-size:12px;color:var(--text-2)}

/* ---------- Marca Pantera / Martina ---------- */
.home-hdr>*:not(.home-mark){position:relative;z-index:1}
.home-mark{position:absolute;right:40px;top:50%;transform:translateY(-50%);height:104px;opacity:.95;pointer-events:none;filter:drop-shadow(0 2px 10px rgba(0,0,0,.25))}
.home-hdr p{max-width:calc(100% - 260px)}
.home-bar{margin-right:250px}
@media (max-width:760px){.home-bar{margin-right:0}.home-hdr p{max-width:none}}
@media (max-width:760px){.home-mark{display:none}}
.mod-logo{height:92px;margin:2px auto 16px;display:flex;align-items:center;justify-content:center;border-radius:14px;
  background:linear-gradient(180deg,#fbf6ea,#f3e6c4);border:1px solid #ecdcb2;padding:12px}
.mod-logo img{max-height:68px;max-width:100%}
.mart{font-family:"Playfair Display",Georgia,serif;font-style:italic;font-weight:600;color:var(--gold-d);letter-spacing:.01em}
.mhdr .mart{color:var(--gold)}
.mbrand{display:flex;align-items:center;gap:16px;min-width:0}
.mlogo{height:56px;width:auto;flex:none;filter:drop-shadow(0 2px 6px rgba(0,0,0,.25))}
.msep{width:1px;align-self:stretch;margin:4px 0;background:linear-gradient(180deg,transparent,rgba(227,194,122,.7),transparent)}
.mhdr h1{font-size:21px}
@media (max-width:640px){.mlogo{height:40px}.msep{display:none}}

/* ---------- Barras de desplazamiento visibles (tabla y lista) ---------- */
.tbl-wrap,.tree{scrollbar-gutter:stable}
.tbl-wrap::-webkit-scrollbar,.tree::-webkit-scrollbar{width:14px;height:14px}
.tbl-wrap::-webkit-scrollbar-track,.tree::-webkit-scrollbar-track{background:#eef2f7}
.tbl-wrap::-webkit-scrollbar-thumb,.tree::-webkit-scrollbar-thumb{background:#9fb0c6;border-radius:999px;border:3px solid #eef2f7}
.tbl-wrap::-webkit-scrollbar-thumb:hover,.tree::-webkit-scrollbar-thumb:hover{background:var(--navy)}
.tbl-wrap::-webkit-scrollbar-corner{background:#eef2f7}

table.x td.wrap{white-space:normal;max-width:520px;min-width:220px;line-height:1.4;text-overflow:clip}
table.x td.span{max-width:none;color:var(--text-2);font-style:italic}
.banner .bx{background:none;border:none;cursor:pointer;color:inherit;opacity:.6;font-size:14px;padding:4px 6px;border-radius:6px}
.banner .bx:hover{opacity:1;background:rgba(0,0,0,.06)}
.banner .btn.sm{padding:4px 10px}

/* ---------- Compacto: más pantalla para los datos ---------- */
.mhdr{padding:7px 14px;border-radius:12px;margin-bottom:8px;gap:10px}
.mlogo{height:40px}
.mbrand{gap:12px}
.mhdr h1{font-size:17px;margin:0}
.mhdr .sub{font-size:11.5px;margin-top:1px}
.kback{font-size:10px}
.hbtn{padding:7px 12px;font-size:12.5px;border-radius:9px}
.mtab{padding:6px 12px;font-size:13px}
.mtabs{padding:3px}
.viewer-hdr{padding:8px 12px 6px}
.viewer-title{align-items:center;margin-top:0;flex-wrap:nowrap}
.vt-left{min-width:0;flex:1}
.viewer-title h2{font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.viewer-title h2 .crumbs{font-size:11px;margin-right:4px}
.viewer-meta{margin-top:1px;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vt-btns{display:flex;gap:6px;flex:none}
.stabs{padding:6px 12px 0}
@media (max-width:1100px){.viewer-title{flex-wrap:wrap}.vt-btns{flex-wrap:wrap}}

/* ---------- Inicio con aire alrededor ---------- */
#viewHome{max-width:1480px;margin:0 auto;padding:22px 28px 40px}
table.x th{border-right:1px solid rgba(255,255,255,.18)}
table.x td.rn{border-right:1px solid var(--border)}

.modoAuto #btnCambiar{display:none}

/* ---------- Sesión, roles, historial y usuarios ---------- */
#viewLogin:not(.hidden){flex:1;min-height:0;overflow:auto;display:flex;align-items:center;justify-content:center;padding:24px}
#viewLogin.hidden{display:none!important}
.login-card{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:0 18px 50px rgba(15,23,42,.12);overflow:hidden}
.login-top{padding:26px 28px 20px;color:#fff;text-align:center;background:radial-gradient(120% 160% at 12% 0%,#2b5a86 0%,#1b3a5c 40%,#0f2440 80%)}
.login-top img{height:62px;margin-bottom:10px}
.login-top .eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:700}
.login-top h1{margin:4px 0 0;font-size:19px;font-weight:800}
.login-body{padding:24px 28px 26px}
.login-body form{display:flex;flex-direction:column;gap:10px}
.inp{padding:10px 12px;border-radius:9px;border:1px solid var(--border);font:inherit;color:var(--text);background:var(--surface);outline:none}
.inp:focus{border-color:var(--navy)}
.inp.sm{padding:6px 9px;font-size:12.5px;border-radius:8px}
.login-note{margin:14px 0 0;font-size:11.5px;color:var(--muted);text-align:center;line-height:1.5}
.home-user{position:absolute;top:16px;right:20px;z-index:2;display:flex;align-items:center;gap:10px;font-size:12px;color:rgba(255,255,255,.85)}
.home-user .hbtn{padding:5px 11px;font-size:12px}
.rolchip{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:rgba(227,194,122,.2);color:var(--gold);border:1px solid rgba(227,194,122,.45)}
.rolchip.lt{background:#eef2f7;color:var(--navy);border-color:var(--border)}
.idle{position:fixed;right:22px;bottom:22px;z-index:90;max-width:360px;background:var(--surface);border:1px solid #f0dcaa;border-left:5px solid var(--gold-d);border-radius:12px;padding:14px 16px;box-shadow:0 18px 40px rgba(15,23,42,.22);font-size:13px;color:var(--text)}
.idle b{display:block;margin-bottom:4px;font-size:14px}
.idle .btn{margin-top:10px}
.dlg-bg{position:fixed;inset:0;z-index:95;background:rgba(15,28,46,.45);display:flex;align-items:center;justify-content:center;padding:20px}
.dlg{width:100%;max-width:440px;background:var(--surface);border-radius:14px;box-shadow:0 20px 60px rgba(15,23,42,.35);padding:20px 22px}
.dlg h3{margin:0 0 8px;font-size:16px;font-weight:800}
.dlg p{margin:0 0 14px;color:var(--text-2);line-height:1.5;font-size:13px}
.dlg .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.adm{display:flex;flex-direction:column;height:100%;min-height:0}
.adm>.panel{display:flex;flex-direction:column;flex:1;min-height:0}
.adm-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--border);background:var(--surface-2)}
.adm-top h2{margin:0;font-size:15.5px;font-weight:800;margin-right:auto}
.adm-top .lbl{font-size:12px;color:var(--text-2);font-weight:600}
.adm .tbl-wrap{flex:1;min-height:0}
.adm table.x td{white-space:normal;max-width:none;vertical-align:top}
.adm table.x td.nw{white-space:nowrap}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;border:1px solid var(--border);background:var(--surface-2);color:var(--text-2);white-space:nowrap}
.tag.carga{background:#e8f0fa;border-color:#c7d8ee;color:var(--navy)}
.tag.quitar_mes{background:#fbeceb;border-color:#efc4c0;color:var(--bad)}
.tag.reversion{background:#fdf6e6;border-color:#f0dcaa;color:#6b4d12}
.tag.ok{background:#e9f6ef;border-color:#bfe3cf;color:var(--good)}
.cnts{white-space:nowrap;font-variant-numeric:tabular-nums}
.cnts .a{color:var(--good)}.cnts .c{color:var(--navy)}.cnts .q{color:var(--bad)}
tr.det td{background:#f6f8fb!important;padding:8px 14px 12px}
.items{width:100%;border-collapse:collapse;font-size:12px}
.items td,.items th{padding:4px 8px;border-bottom:1px solid var(--grid);text-align:left;vertical-align:top}
.items th{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.newuser{display:grid;grid-template-columns:2fr 1.4fr 1.2fr 110px auto auto;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--border)}
@media (max-width:900px){.newuser{grid-template-columns:1fr 1fr}}

/* ---------- Tarjetas de módulos (inicio) ---------- */
.mod-card{padding:0;text-align:left;overflow:hidden;display:flex;flex-direction:column;border-radius:18px;border:1px solid #e1e7f0;background:var(--surface);
  box-shadow:0 1px 2px rgba(15,23,42,.04),0 8px 24px rgba(15,23,42,.06);transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
.mod-card:hover{transform:translateY(-4px);box-shadow:0 18px 40px rgba(15,36,64,.16);border-color:#c8d4e4}
.mod-card.sin:hover{transform:none;box-shadow:0 1px 2px rgba(15,23,42,.04),0 8px 24px rgba(15,23,42,.06);border-color:#e1e7f0}
.mod-ban{position:relative;height:124px;display:flex;align-items:center;justify-content:center;overflow:hidden;
  background:radial-gradient(130% 150% at 0% 0%,#2b5a86 0%,#1b3a5c 42%,#0f2440 100%)}
.mod-ban::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.035) 0 2px,transparent 2px 16px)}
.mod-ban::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--gold),rgba(227,194,122,.15))}
.ban-legal{background:radial-gradient(130% 150% at 0% 0%,#4a4178 0%,#2a2c56 45%,#0f2440 100%)}
.ban-gestion{background:radial-gradient(130% 150% at 0% 0%,#178079 0%,#0f5560 45%,#0f2440 100%)}
.mod-ban img{position:relative;z-index:1;height:74px;filter:drop-shadow(0 4px 12px rgba(0,0,0,.35));transition:transform .25s ease}
.mod-ico{position:relative;z-index:1;width:66px;height:66px;border-radius:18px;display:grid;place-items:center;
  background:linear-gradient(160deg,rgba(255,255,255,.14),rgba(255,255,255,.04));border:1px solid rgba(227,194,122,.5);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 10px 24px rgba(0,0,0,.25);transition:transform .25s ease}
.mod-ico svg{width:34px;height:34px;stroke:var(--gold);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.mod-card:hover .mod-ico,.mod-card:hover .mod-ban img{transform:scale(1.06)}
.mod-card.sin .mod-ban{filter:grayscale(.85) brightness(1.15);opacity:.75}
.mod-body{padding:16px 18px 16px;display:flex;flex-direction:column;flex:1}
.mod-k{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--gold-d);font-weight:800;margin-bottom:5px}
.mod-card h3{margin:0 0 6px;font-size:16.5px;font-weight:800;letter-spacing:-.01em;color:var(--navy-d)}
.mod-card p{flex:1;margin:0 0 14px;font-size:12.8px;color:var(--text-2);line-height:1.55}
.mod-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:12px;border-top:1px solid var(--grid)}
.mod-tag{display:inline-block;font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;color:var(--navy);background:#eef2f7;border:1px solid #dbe3ee}
.mod-card.sin .mod-tag{color:var(--muted);background:var(--surface-2)}
.mod-go{font-size:12.5px;font-weight:800;color:var(--navy);transition:color .15s,transform .15s}
.mod-card:hover .mod-go{color:var(--teal);transform:translateX(3px)}
</style>

html,body{height:100%}
body{display:flex;flex-direction:column;overflow:hidden}
.upage{flex:1;min-height:0;display:flex;flex-direction:column;padding:10px 12px 12px}
.utop{display:flex;align-items:center;gap:10px;margin-bottom:8px;color:var(--text-2);font-size:12.5px}
.upage>#usrPanel{flex:1;min-height:0}

<body>
<!-- ===== M&A Capital · acceso (cada página es independiente; mismo usuario y clave en todas) ===== -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* ===== Tema M&A (estilo "Demos IA MYA Capital"): mismos módulos, nueva piel ===== */
:root{
  --bg:#EDF1F0; --surface:#FFFFFF; --surface-2:#F3F6F5; --surface-3:#E2E8E7; --border:#CBD5D4; --grid:#E3E9E8; --zebra:#F7F9F9;
  --text:#14262B; --text-2:#3D5156; --muted:#56696D;
  --navy:#0B6E6E; --navy-d:#14262B; --teal:#0B6E6E; --gold:#4FC3BC; --gold-d:#B85C00;
  --good:#1F7A3D; --bad:#B3261E; --warn:#9A6400;
  --shadow:0 1px 2px rgba(20,38,43,.04);
  --ma-display:"Bricolage Grotesque","Trebuchet MS",sans-serif;
  --ma-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --ma-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  /* Agente Legal (mismas variables que su diseño original) */
  --ink:#14262B; --sunk:#E2E8E7; --line:#CBD5D4; --accent:#0B6E6E; --accent-ink:#FFFFFF; --bar:#14262B; --body:var(--ma-body);
}
body{font-family:var(--ma-body)!important;background:var(--bg);color:var(--text)}
h1,h2,h3{font-family:var(--ma-display);letter-spacing:-.005em}
button,input,select,textarea{font-family:inherit}

/* Cabecera común de cada página */
.ma-hdr{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:12px 14px 0;padding:8px 16px;border-radius:10px;color:var(--text);
  background:var(--surface);border:1px solid var(--border);box-shadow:none;font-family:var(--ma-body);line-height:1.3}
.ma-hdr .ma-b{display:flex;align-items:center;gap:14px;min-width:0}
.ma-hdr .ma-logo{height:34px;width:auto;flex:none}
.ma-hdr .ma-sep{width:1px;align-self:stretch;margin:4px 0;background:var(--border)}
.ma-hdr .ma-k{font-family:var(--ma-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;text-decoration:none}
.ma-hdr .ma-k:hover{color:var(--teal)}
.ma-hdr h1{margin:1px 0 0;font-family:var(--ma-display);font-size:19px;font-weight:700;color:var(--text)}
.ma-hdr .ma-sub{font-size:12px;color:var(--muted);margin-top:1px}
.ma-hdr .ma-der{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ma-chip{display:inline-block;font-family:var(--ma-mono);font-size:11px;font-weight:500;letter-spacing:.05em;text-transform:uppercase;padding:2px 9px;border-radius:99px;background:var(--surface-3);color:var(--muted);border:0}
.ma-hbtn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--teal);font:600 13px var(--ma-body);cursor:pointer;text-decoration:none}
.ma-hbtn:hover{background:var(--surface-3)}
.ma-oculto{display:none!important}
body.ma-fuera>*:not(.ma-hdr):not(.ma-login):not(script):not(style):not(link){display:none!important}

/* Ingreso */
.ma-login{flex:1;min-height:0;overflow:auto;display:flex;align-items:center;justify-content:center;padding:24px;font-family:var(--ma-body);background:var(--bg)}
.ma-card{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--border);border-radius:10px;box-shadow:0 12px 40px rgba(20,38,43,.08);overflow:hidden}
.ma-top{padding:26px 28px 18px;color:var(--text);text-align:left;background:var(--surface);border-bottom:1px solid var(--border)}
.ma-top img{height:46px;margin-bottom:14px;display:block}
.ma-top .ma-ey{font-family:var(--ma-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.ma-top h2{margin:4px 0 0;font-family:var(--ma-display);font-size:24px;font-weight:700;color:var(--text)}
.ma-body{padding:22px 28px 22px}
.ma-body form{display:flex;flex-direction:column;gap:10px}
.ma-inp{padding:9px 11px;border-radius:6px;border:1px solid var(--border);font:15px var(--ma-body);color:var(--text);background:var(--bg);outline:none}
.ma-inp:focus{outline:2px solid var(--teal);outline-offset:1px}
.ma-ok{padding:10px 22px;border-radius:6px;border:0;background:var(--teal);color:#fff;font:600 15px var(--ma-body);cursor:pointer}
.ma-ok:hover{filter:brightness(1.08)}
.ma-ok:disabled{opacity:.6;cursor:default}
.ma-err{color:var(--bad);min-height:16px;font-size:13px;text-align:center}
.ma-nota{margin:14px 0 0;font-size:12px;color:var(--muted);text-align:center;line-height:1.5}
.ma-nota a{color:var(--teal);font-weight:600}
.ma-idle{position:fixed;right:22px;bottom:22px;z-index:9999;max-width:360px;background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--gold-d);border-radius:10px;padding:14px 16px;box-shadow:0 18px 40px rgba(20,38,43,.18);font:14px var(--ma-body);color:var(--text)}
.ma-idle b{display:block;margin-bottom:4px;font-size:15px;font-family:var(--ma-display)}
.ma-idle button{margin-top:10px;padding:7px 13px;border-radius:6px;border:none;background:var(--teal);color:#fff;font:600 13px var(--ma-body);cursor:pointer}

/* ===== Piel común para lo que ya existe en cada módulo ===== */
.btn{border-radius:6px}
.btn.pri,.btn.gold{background:var(--teal);border-color:var(--teal);color:#fff}
.panel{border-radius:10px;box-shadow:none}
.pill,.tag{border-radius:99px}
table.x th{background:var(--surface-3);color:var(--muted);font-family:var(--ma-mono);font-weight:500;font-size:11px;letter-spacing:.05em;text-transform:uppercase;border-right:1px solid var(--border);border-bottom:1px solid var(--border)}
table.x th.rn{background:var(--surface-3);color:var(--muted)}
table.x tbody tr:hover td{background:#E6F0EF}
table.x tr.totrow td{background:var(--surface-3)!important;border-top:2px solid var(--teal)}
.f-row.sel{background:#E3F0EF;border-left-color:var(--teal)}
.y-row{color:var(--text);font-family:var(--ma-display);font-weight:700}
.crumbs,.mod-k{font-family:var(--ma-mono);font-weight:500}
.banner{border-radius:8px}
.tbl-wrap::-webkit-scrollbar-track,.tree::-webkit-scrollbar-track{background:var(--surface-2)}
.tbl-wrap::-webkit-scrollbar-thumb,.tree::-webkit-scrollbar-thumb{background:#A9B8B7;border-color:var(--surface-2)}
.tbl-wrap::-webkit-scrollbar-thumb:hover,.tree::-webkit-scrollbar-thumb:hover{background:var(--teal)}

/* Cabecera propia de Pantera (mismos botones, piel clara) */
.mhdr{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:10px;box-shadow:none}
.mhdr .k,.kback{font-family:var(--ma-mono);font-weight:500;letter-spacing:.08em;color:var(--muted)}
.kback:hover{color:var(--teal)}
.mhdr h1{color:var(--text);font-family:var(--ma-display);font-weight:700}
.mhdr .sub{color:var(--muted)}
.mhdr .mart{color:var(--gold-d)}
.mlogo{filter:none}
.msep{background:var(--border)}
.hbtn{border:1px solid var(--border);background:var(--surface);color:var(--teal);border-radius:6px}
.hbtn:hover{background:var(--surface-3)}
.hbtn.pri{background:var(--teal);border-color:var(--teal);color:#fff}
.mtabs{background:var(--surface-3);border:1px solid var(--border);border-radius:8px}
.mtab{color:var(--text-2);border-radius:6px}
.mtab:hover{background:rgba(20,38,43,.06)}
.mtab[aria-selected="true"]{background:var(--surface);color:var(--text);box-shadow:inset 0 -2px 0 var(--teal)}
.rolchip{font-family:var(--ma-mono);font-weight:500;background:var(--surface-3);color:var(--muted);border:0}
.stab[aria-selected="true"]{color:var(--text);box-shadow:inset 0 3px 0 var(--teal)}
.hbtns{align-items:center}
</style>

  const MODULOS=[
    {id:"martina",nombre:"Pantera Reportería — Martina",url:"pantera.html"},
    {id:"contabilidad",nombre:"Dashboard Contabilidad",url:"contabilidad.html"},
    {id:"agente_legal",nombre:"Agente Legal",url:"legal.html"},
    {id:"legal",nombre:"Dashboard de Legal",url:"dashboard-legal.html"},
    {id:"tareas",nombre:"Seguimiento de tareas",url:"tareas.html"}];
  const ROL_TXT={admin:"Administradora",editor:"Editor",lector:"Lector"};
  const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  // La sesión vive solo en esta pestaña (se borra al cerrarla) y se cierra tras 10 minutos sin actividad o con "Salir".
  const ss={getItem:k=>{try{return sessionStorage.getItem(k);}catch(e){return null;}},setItem:(k,v)=>{try{sessionStorage.setItem(k,v);}catch(e){}},removeItem:k=>{try{sessionStorage.removeItem(k);}catch(e){}}};
  const ON=/^https?:\/\//.test(URL_)&&ANON.length>20&&!!window.supabase;
  const sb=ON?window.supabase.createClient(URL_,ANON,{auth:{storage:ss,storageKey:"ma-sesion",persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}}):null;
  const IDLE=10*60*1000, AVISO=60*1000, KACT="ma-ult-act", KMSG="ma-msg";
  let ctx=null, O={}, listo; const listoP=new Promise(r=>listo=r);
  const $=id=>document.getElementById(id);

  function cabecera(){
    if(O.cabecera===false||$("maHdr")) return;
    const h=document.createElement("div"); h.className="ma-hdr"; h.id="maHdr";
    h.innerHTML=`<div class="ma-b"><img class="ma-logo" src="${LOGO}" alt="M&amp;A Capital Inc"><div class="ma-sep"></div><div>
      <a class="ma-k" href="index.html" title="Volver al inicio">← M&amp;A Capital · Inicio · ${esc(VERSION)}</a><h1>${esc(O.titulo||"")}</h1><div class="ma-sub" id="maSub">Inicia sesión para entrar</div></div></div>
      <div class="ma-der"><span id="maExtra"></span><span class="ma-chip ma-oculto" id="maChip"></span><button class="ma-hbtn ma-oculto" id="maSalir" title="Cerrar sesión">⎋ Salir</button></div>`;
    document.body.prepend(h); $("maSalir").onclick=()=>salir();
  }
  function pantallaLogin(msg,sinPermiso){
    document.body.classList.add("ma-fuera");
    let l=$("maLogin"); if(l) l.remove();
    l=document.createElement("div"); l.className="ma-login"; l.id="maLogin";
    const titulo=O.soloAdmin?"Usuarios y permisos":(O.titulo||"Dashboard Interno Ultimate");
    l.innerHTML=`<div class="ma-card"><div class="ma-top"><img src="${LOGO}" alt="M&amp;A Capital Inc"><div class="ma-ey">M&amp;A Capital · Uso interno</div><h2>${esc(titulo)}</h2></div>
      <div class="ma-body">${sinPermiso?`<div class="ma-err" style="margin-bottom:14px">${esc(msg)}</div>
        <button class="ma-ok" id="maOtro" style="width:100%">Entrar con otro usuario</button>`:`<form id="maForm">
        <input class="ma-inp" type="email" id="maEmail" placeholder="correo@empresa.com" autocomplete="username" required>
        <input class="ma-inp" type="password" id="maPass" placeholder="Contraseña" autocomplete="current-password" required>
        <button class="ma-ok" type="submit" id="maEntrar">Entrar</button>
        <div class="ma-err" id="maErr">${esc(msg||"")}</div></form>`}
        <p class="ma-nota">La sesión se cierra al pulsar “Salir”, al cerrar la pestaña o tras 10 minutos sin actividad.<br><a href="index.html">← Volver al inicio</a></p></div></div>`;
    const hdr=$("maHdr"); if(hdr) hdr.after(l); else document.body.prepend(l);
    if(sinPermiso){ $("maOtro").onclick=async()=>{ try{ await sb.auth.signOut(); }catch(e){} pantallaLogin(""); }; return; }
    $("maForm").onsubmit=async e=>{
      e.preventDefault(); $("maErr").textContent=""; $("maEntrar").disabled=true;
      const {error}=await sb.auth.signInWithPassword({email:$("maEmail").value.trim(),password:$("maPass").value});
      $("maEntrar").disabled=false; $("maPass").value="";
      if(error){ $("maErr").textContent=/invalid/i.test(error.message)?"Correo o contraseña incorrectos.":error.message; return; }
      ss.setItem(KACT,String(Date.now())); await validar();
    };
    setTimeout(()=>{ try{ $("maEmail").focus(); }catch(e){} },50);
  }
  // ¿quién es y qué puede ver? (ma_usuarios: rol, módulos, activo)
  async function leerUsuario(){
    if(!sb) return null;
    const {data:{session}}=await sb.auth.getSession(); if(!session) return null;
    const ult=+ss.getItem(KACT)||0;
    if(ult&&Date.now()-ult>IDLE){ try{ await sb.auth.signOut(); }catch(e){} ss.setItem(KMSG,"La sesión se cerró por 10 minutos sin actividad."); return null; }
    const email=session.user.email.toLowerCase();
    const {data:yo,error}=await sb.from("ma_usuarios").select("rol,modulos,activo").eq("email",email).maybeSingle();
    if(error) return {error:"No se pudo validar tu acceso: "+error.message};
    if(!yo||!yo.activo){ try{ await sb.auth.signOut(); }catch(e){} return {error:"Tu usuario no tiene acceso al dashboard o está desactivado. Pídele acceso a la administradora."}; }
    return {sb,email,rol:yo.rol,modulos:yo.modulos||[],token:session.access_token,user:session.user,url:URL_,anon:ANON};
  }
  const puede=(c,id)=>c&&(c.rol==="admin"||(c.modulos||[]).includes(id));
  function avisarPagina(){ if(!ctx) return; try{ window.postMessage({type:"MA_SESSION",url:URL_,anon:ANON,token:ctx.token,email:ctx.email,rol:ctx.rol,modulos:ctx.modulos},"*"); }catch(e){} }
  async function validar(){
    const c=await leerUsuario();
    if(!c){ const m=ss.getItem(KMSG)||""; ss.removeItem(KMSG); pantallaLogin(m); return; }
    if(c.error){ pantallaLogin(c.error); return; }
    if(O.soloAdmin? c.rol!=="admin" : (O.modulo&&!puede(c,O.modulo))){
      pantallaLogin(O.soloAdmin?"Solo la administradora puede manejar usuarios.":"Tu usuario ("+c.email+") no tiene acceso a "+(O.titulo||"este módulo")+". Pídele acceso a la administradora.",true); return; }
    ctx=c; const l=$("maLogin"); if(l) l.remove(); document.body.classList.remove("ma-fuera");
    if($("maSub")) $("maSub").textContent=c.email;
    if($("maChip")){ $("maChip").textContent=ROL_TXT[c.rol]||c.rol; $("maChip").classList.remove("ma-oculto"); }
    if($("maSalir")) $("maSalir").classList.remove("ma-oculto");
    actividad(); avisarPagina(); listo(c);
    try{ window.dispatchEvent(new CustomEvent("ma:sesion",{detail:c})); }catch(e){}
  }
  // ---- inactividad (cuenta en todas las páginas de la pestaña) ----
  let ultEsc=0;
  function actividad(){ const n=Date.now(); if(n-ultEsc>1000){ ultEsc=n; ss.setItem(KACT,String(n)); } const b=$("maIdle"); if(b) b.remove(); }
  ["mousemove","mousedown","keydown","wheel","touchstart","scroll"].forEach(ev=>addEventListener(ev,()=>{ if(ctx) actividad(); },{passive:true,capture:true}));
  setInterval(()=>{
    if(!ctx) return;
    const resta=IDLE-(Date.now()-(+ss.getItem(KACT)||Date.now()));
    if(resta<=0){ salir("La sesión se cerró por 10 minutos sin actividad."); return; }
    if(resta<=AVISO){ let b=$("maIdle");
      if(!b){ b=document.createElement("div"); b.id="maIdle"; b.className="ma-idle"; b.innerHTML=`<b>¿Sigues ahí?</b>La sesión se cerrará en <span id="maSeg"></span> s por inactividad.<br><button type="button">Seguir conectado</button>`; document.body.appendChild(b); b.querySelector("button").onclick=()=>{ ultEsc=0; actividad(); }; }
      $("maSeg").textContent=Math.ceil(resta/1000); }
  },1000);
  async function salir(msg){
    ctx=null; try{ await sb.auth.signOut(); }catch(e){}
    ss.removeItem(KACT); if(msg) ss.setItem(KMSG,msg); else ss.setItem(KMSG,"Sesión cerrada.");
    location.reload();   // la página vuelve a empezar limpia, sin datos en pantalla
  }
  if(sb) sb.auth.onAuthStateChange((ev,session)=>{
    if(ev==="TOKEN_REFRESHED"&&ctx&&session){ ctx.token=session.access_token; avisarPagina(); }
    if(ev==="SIGNED_OUT"&&ctx) salir("La sesión expiró. Vuelve a entrar.");
  });
  addEventListener("load",()=>{ if(ctx) avisarPagina(); });

  return {
    MODULOS, ROL_TXT, VERSION, sb, puede, esc, actividad:()=>{ if(ctx) actividad(); },
    listo:listoP, ctx:()=>ctx, salir,
    // Página que exige usuario: {modulo, titulo, soloAdmin, cabecera}
    iniciar(o){ O=o||{}; document.body.classList.add("ma-fuera"); cabecera();
      if(!ON){ pantallaLogin("Falta configurar Supabase en el dashboard."); return listoP; }
      validar(); return listoP; },
    // Inicio: no exige usuario; si ya entró en esta pestaña, devuelve quién es
    async opcional(){ if(!ON) return null; const c=await leerUsuario(); if(!c||c.error) return null; ctx=c; actividad(); return c; }
  };
})();
</script>
<script>
/* ===== Fuentes automáticas de carpetas (sin que Chrome pregunte) =====
   1) ACCESO DIRECTO: la página se abre desde la carpeta de OneDrive de la PC con el acceso directo
      "Dashboard M&A" (Chrome con --allow-file-access-from-files en un perfil aparte). Lee la carpeta
      que está al lado de la página (o la propia carpeta de la página). Solo lectura.
   2) MICROSOFT 365: lee la carpeta de OneDrive en la nube con la cuenta Microsoft de la persona
      (Microsoft Graph). Necesita una app registrada por el administrador de Microsoft 365 de M&A
      (clientId) y el enlace de la carpeta. Lee y guarda.
   Si ninguna está disponible, cada módulo usa lo de siempre (elegir carpeta en Chrome). */
(function(){
  const MS={clientId:"",tenant:""||"organizations",
    carpetas:{PruebaDashboard:"",Contabilidad:"",Legal:""}};
  const msOn=()=>/^[0-9a-f-]{36}$/i.test(MS.clientId);

  /* ---------- 1) acceso directo (file://) ---------- */
  const xhr=(url,tipo)=>new Promise((ok,no)=>{ const x=new XMLHttpRequest(); x.open("GET",url); if(tipo) x.responseType=tipo;
    x.onload=()=>(x.status===0||x.status===200)?ok(x.response):no(new Error("HTTP "+x.status)); x.onerror=()=>no(new Error("sin acceso")); x.send(); });
  async function listarLocal(url){
    const t=await xhr(url); const out=[]; const re=/addRow\((.*?)\);<\/script>/g; let m;
    if(!/addRow\(/.test(t)) throw new Error("no es una carpeta");
    while((m=re.exec(t))){ try{ const a=JSON.parse("["+m[1]+"]"); if(a[0]==="."||a[0]==="..") continue;
      let n=a[0]; try{ n=decodeURIComponent(String(a[1]).replace(/\/$/,""))||a[0]; }catch(e){}
      out.push({name:n,url:a[1],dir:!!a[2],size:a[3],mod:(a[5]||0)*1000}); }catch(e){} }
    return out;
  }
  function dirLocal(url,name){
    return {kind:"directory",name,auto:"local",
      async *entries(){ for(const e of await listarLocal(url)){
        if(e.dir){ let u=url+e.url; if(!u.endsWith("/")) u+="/"; yield [e.name,dirLocal(u,e.name)]; } else yield [e.name,fileLocal(url+e.url,e)]; } },
      async getDirectoryHandle(n){ const e=(await listarLocal(url)).find(x=>x.dir&&x.name===n); if(!e){ const er=new Error("no existe"); er.name="NotFoundError"; throw er; } let u=url+e.url; if(!u.endsWith("/")) u+="/"; return dirLocal(u,n); },
      async getFileHandle(n,o){ const e=(await listarLocal(url)).find(x=>!x.dir&&x.name===n); if(!e||(o&&o.create&&!e)){ const er=new Error(o&&o.create?"Con el acceso directo la carpeta es solo de lectura. Para guardar, abre el dashboard en línea.":"no existe"); er.name=o&&o.create?"NotAllowedError":"NotFoundError"; throw er; } const f=fileLocal(url+e.url,e); f.createWritable=async()=>{ throw new Error("Con el acceso directo la carpeta es solo de lectura. Para guardar, abre el dashboard en línea."); }; return f; },
      async queryPermission(o){ return o&&o.mode==="readwrite"?"denied":"granted"; }, async requestPermission(o){ return o&&o.mode==="readwrite"?"denied":"granted"; }};
  }
  const fileLocal=(u,e)=>({kind:"file",name:e.name,meta:{mod:e.mod,size:e.size},async getFile(){ return new File([await xhr(u,"arraybuffer")],e.name,{lastModified:e.mod}); }});
  async function fuenteLocal(nombre){
    if(location.protocol!=="file:") return null;
    const base=location.href.replace(/[?#].*$/,"").replace(/[^/]*$/,"");
    const actual=decodeURIComponent(base.split("/").filter(Boolean).pop()||"");
    const norm=s=>String(s).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
    try{
      if(norm(actual)===norm(nombre)){ await listarLocal(base); return dirLocal(base,actual); }     // la página está dentro de la carpeta del módulo
      const hijos=await listarLocal(base); const h=hijos.find(e=>e.dir&&norm(e.name)===norm(nombre));     // la carpeta está al lado de la página
      if(h){ let u=base+h.url; if(!u.endsWith("/")) u+="/"; return dirLocal(u,h.name); }
    }catch(e){}
    return null;
  }

  /* ---------- 2) Microsoft 365 (OneDrive en la nube) ---------- */
  const GRAPH="https://graph.microsoft.com/v1.0", ALCANCE=["Files.ReadWrite.All"];
  let msal=null, msalP=null;
  function cargarMsal(){ if(window.msal) return Promise.resolve(window.msal); if(msalP) return msalP;
    msalP=new Promise((ok,no)=>{ const s=document.createElement("script"); s.src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.27.0/lib/msal-browser.min.js"; s.onload=()=>ok(window.msal); s.onerror=()=>no(new Error("No se pudo cargar el inicio de sesión de Microsoft.")); document.head.appendChild(s); });
    return msalP; }
  async function token(gesto){
    const lib=await cargarMsal();
    if(!msal){ msal=new lib.PublicClientApplication({auth:{clientId:MS.clientId,authority:"https://login.microsoftonline.com/"+MS.tenant,redirectUri:location.href.replace(/[?#].*$/,"").replace(/[^/]*$/,"")},cache:{cacheLocation:"localStorage"}}); if(msal.initialize) await msal.initialize(); }
    const cuenta=msal.getAllAccounts()[0];
    const pista=(window.MA&&MA.ctx()&&MA.ctx().email)||undefined;
    if(cuenta){ try{ return (await msal.acquireTokenSilent({scopes:ALCANCE,account:cuenta})).accessToken; }catch(e){} }
    else if(pista){ try{ return (await msal.ssoSilent({scopes:ALCANCE,loginHint:pista})).accessToken; }catch(e){} }
    if(!gesto) return null;
    return (await msal.acquireTokenPopup({scopes:ALCANCE,loginHint:pista})).accessToken;
  }
  async function g(tok,ruta,op){ op=op||{}; const r=await fetch(ruta.startsWith("http")?ruta:GRAPH+ruta,{method:op.method||"GET",headers:{Authorization:"Bearer "+tok,...(op.tipo?{"Content-Type":op.tipo}:{})},body:op.body});
    if(r.status===404){ const e=new Error("no existe"); e.name="NotFoundError"; throw e; }
    if(!r.ok){ let m=r.statusText; try{ m=(await r.json()).error.message; }catch(e){} throw new Error("Microsoft 365: "+m); }
    return op.crudo?r:(r.status===204?null:r.json()); }
  const b64u=s=>"u!"+btoa(unescape(encodeURIComponent(s))).replace(/=+$/,"").replace(/\//g,"_").replace(/\+/g,"-");
  function dirMS(tok,drive,item){
    const hijos=async()=>{ let url=`/drives/${drive}/items/${item.id}/children?$top=999`, out=[]; while(url){ const j=await g(tok,url); out.push(...(j.value||[])); url=j["@odata.nextLink"]||null; } return out; };
    return {kind:"directory",name:item.name,auto:"ms365",
      async *entries(){ for(const c of await hijos()) yield [c.name,c.folder?dirMS(tok,drive,c):fileMS(tok,drive,c,item.id)]; },
      async getDirectoryHandle(n,o){ const c=(await hijos()).find(x=>x.folder&&x.name===n); if(c) return dirMS(tok,drive,c);
        if(!(o&&o.create)){ const e=new Error("no existe"); e.name="NotFoundError"; throw e; }
        return dirMS(tok,drive,await g(tok,`/drives/${drive}/items/${item.id}/children`,{method:"POST",tipo:"application/json",body:JSON.stringify({name:n,folder:{},"@microsoft.graph.conflictBehavior":"fail"})})); },
      async getFileHandle(n,o){ const c=(await hijos()).find(x=>x.file&&x.name===n); if(c) return fileMS(tok,drive,c,item.id);
        if(!(o&&o.create)){ const e=new Error("no existe"); e.name="NotFoundError"; throw e; }
        return fileMS(tok,drive,{name:n,size:0,lastModifiedDateTime:new Date().toISOString()},item.id); },
      async removeEntry(n){ const c=(await hijos()).find(x=>x.name===n); if(!c){ const e=new Error("no existe"); e.name="NotFoundError"; throw e; } await g(tok,`/drives/${drive}/items/${c.id}`,{method:"DELETE"}); },
      async queryPermission(){ return "granted"; }, async requestPermission(){ return "granted"; }};
  }
  function fileMS(tok,drive,c,padre){
    const mod=Date.parse(c.lastModifiedDateTime)||0;
    return {kind:"file",name:c.name,meta:{mod,size:c.size},
      async getFile(){ const u=c["@microsoft.graph.downloadUrl"]; const r=u?await fetch(u):await g(tok,`/drives/${drive}/items/${c.id}/content`,{crudo:true}); return new File([await r.arrayBuffer()],c.name,{lastModified:mod}); },
      async createWritable(){ const partes=[]; return {async write(d){ partes.push(d); }, async close(){ const blob=new Blob(partes);
        await g(tok,`/drives/${drive}/items/${padre}:/${encodeURIComponent(c.name)}:/content`,{method:"PUT",tipo:"application/octet-stream",body:blob}); }}; }};
  }
  async function fuenteMS(nombre,gesto){
    if(!msOn()) return null; const link=MS.carpetas[nombre]; if(!/^https?:\/\//.test(link||"")) return null;
    const tok=await token(gesto); if(!tok) return null;
    const it=await g(tok,`/shares/${b64u(link)}/driveItem`);
    return dirMS(tok,it.parentReference.driveId,it);
  }

  // abierto desde la PC pero sin el permiso del acceso directo (el navegador ya estaba abierto): avisarlo claro
  async function avisoLocal(){
    if(location.protocol!=="file:"||document.getElementById("maAvisoLocal")) return;
    try{ await listarLocal(location.href.replace(/[?#].*$/,"").replace(/[^/]*$/,"")); return; }catch(e){}
    const d=document.createElement("div"); d.id="maAvisoLocal";
    d.style.cssText="position:fixed;left:50%;transform:translateX(-50%);top:14px;z-index:9998;max-width:760px;width:calc(100% - 32px);background:#fdf6e6;border:1px solid #f0dcaa;border-left:5px solid #b98b2f;border-radius:12px;padding:14px 18px;box-shadow:0 18px 40px rgba(15,23,42,.22);font:13.5px Inter,system-ui,sans-serif;color:#6b4d12;line-height:1.5";
    d.innerHTML='<b style="display:block;font-size:15px;color:#0f1c2e;margin-bottom:4px">El navegador ya estaba abierto y no tomó el permiso del acceso directo</b>Cierra <b>todas</b> las ventanas de Chrome (y en la bandeja junto al reloj, clic derecho en Chrome → Salir) y vuelve a abrir el acceso directo. Así lee la carpeta solo, sin pedirla.<br><button type="button" style="margin-top:8px;padding:6px 12px;border-radius:8px;border:none;background:#1b3a5c;color:#fff;font:600 12.5px Inter,system-ui,sans-serif;cursor:pointer">Entendido</button>';
    d.querySelector("button").onclick=()=>d.remove(); document.body.appendChild(d);
  }
  window.MA.fuente=async(nombre,o)=>{ o=o||{};
    const l=await fuenteLocal(nombre); if(l) return l;
    avisoLocal();
    try{ return await fuenteMS(nombre,!!o.gesto); }catch(e){ if(o.gesto) throw e; return null; } };
  window.MA.ms365=()=>msOn()&&Object.values(MS.carpetas).some(x=>/^https?:\/\//.test(x||""));
})();
</script>
<script>
/* ===== Consolidado de Excel conservando el formato =====
   Copia cada hoja tal como está en el Excel original: anchos de columna, alto de filas, fuentes,
   colores, bordes, formato de números, celdas combinadas y paneles fijos. Las fórmulas se pasan
   con su valor (para que no queden apuntando a otros libros). Agrega una hoja "Índice" con enlaces.
   lista: [{nombre, carpeta, getFile:async()=>File}] */
(function(){
  let P=null;
  const cargar=()=>window.ExcelJS?Promise.resolve(window.ExcelJS):(P=P||new Promise((ok,no)=>{ const s=document.createElement("script"); s.src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"; s.onload=()=>ok(window.ExcelJS); s.onerror=()=>no(new Error("No se pudo cargar el armador de Excel (revisa internet).")); document.head.appendChild(s); }));
  const limpio=s=>String(s).replace(/[\\/?*[\]:]/g," ").replace(/\s+/g," ").trim();
  const valor=v=>{ if(v&&typeof v==="object"&&!(v instanceof Date)){ if("formula" in v||"sharedFormula" in v) return v.result===undefined?null:(v.result&&typeof v.result==="object"&&v.result.error?null:v.result); } return v; };
  const copia=o=>o?JSON.parse(JSON.stringify(o)):o;
  window.MA.consolidarExcel=async(lista,nombreSalida,titulo,progreso)=>{
    const ExcelJS=await cargar(); const out=new ExcelJS.Workbook(); out.creator="M&A Capital · Dashboard";
    const ind=out.addWorksheet("Índice",{views:[{showGridLines:false}]});
    const usados=new Set(["índice"]), filas=[], fallos=[]; let n=0;
    for(let k=0;k<lista.length;k++){ const it=lista[k]; progreso&&progreso(`Armando ${k+1} de ${lista.length}: ${it.nombre}`);
      try{
        let buf=await (await it.getFile()).arrayBuffer();
        const wbx=XLSX.read(buf,{type:"array"});   // valores guardados en el archivo (sirve para fórmulas cuyo resultado es 0)
        if(!/\.(xlsx|xlsm)$/i.test(it.nombre)) buf=XLSX.write(wbx,{bookType:"xlsx",type:"array"});   // .xls/.csv
        const src=new ExcelJS.Workbook(); await src.xlsx.load(buf);
        const hojas=src.worksheets.filter(w=>w.state!=="hidden"&&w.state!=="veryHidden"&&w.actualRowCount>0);
        const base=limpio(it.nombre.replace(/\.[^.]+$/,""));
        for(const ws of hojas){ n++;
          let nom=(String(n).padStart(2,"0")+" "+(hojas.length>1?base.slice(0,14).trim()+" · "+limpio(ws.name):base)).slice(0,31).trim(), i=2;
          while(usados.has(nom.toLowerCase())){ nom=nom.slice(0,28)+" "+(i++); } usados.add(nom.toLowerCase());
          const dst=out.addWorksheet(nom,{properties:copia(ws.properties),pageSetup:copia(ws.pageSetup),views:copia(ws.views)});
          if(ws.properties&&ws.properties.tabColor) dst.properties.tabColor=copia(ws.properties.tabColor);
          (ws.columns||[]).forEach((c,ci)=>{ const d=dst.getColumn(ci+1); if(c.width) d.width=c.width; if(c.hidden) d.hidden=true; if(c.style&&Object.keys(c.style).length) d.style=copia(c.style); });
          ws.eachRow({includeEmpty:true},(row,ri)=>{ const r=dst.getRow(ri); if(row.height) r.height=row.height; if(row.hidden) r.hidden=true;
            row.eachCell({includeEmpty:true},(cell,ci)=>{ const c=r.getCell(ci); let v=valor(cell.value);
              if((v===null||v===undefined)&&cell.value&&typeof cell.value==="object"&&("formula" in cell.value||"sharedFormula" in cell.value)){ const sx=wbx.Sheets[ws.name]&&wbx.Sheets[ws.name][cell.address]; if(sx&&sx.v!==undefined&&sx.t!=="e") v=sx.v; } if(v!==null&&v!==undefined) c.value=(v instanceof Date||typeof v!=="object")?v:copia(v); c.style=copia(cell.style)||{}; }); });
          ((ws.model&&ws.model.merges)||[]).forEach(m=>{ try{ dst.mergeCells(m); }catch(e){} });
          filas.push([it.carpeta||"",it.nombre,ws.name,nom]);
        }
      }catch(e){ fallos.push(it.nombre); }
    }
    // Índice
    ind.columns=[{width:6},{width:16},{width:58},{width:30},{width:34}];
    ind.mergeCells("A1:E1"); const t=ind.getCell("A1"); t.value=titulo||"Consolidado"; t.font={bold:true,size:16,color:{argb:"FF0F2440"}};
    ind.mergeCells("A2:E2"); ind.getCell("A2").value=`${filas.length} hoja(s) de ${lista.length-fallos.length} archivo(s) · generado ${new Date().toLocaleString("es-PA")}`; ind.getCell("A2").font={color:{argb:"FF8792A4"},size:10};
    const h=ind.getRow(4); ["#","Carpeta","Archivo original","Hoja original","Hoja en este libro"].forEach((x,i)=>{ const c=h.getCell(i+1); c.value=x; c.font={bold:true,color:{argb:"FFFFFFFF"}}; c.fill={type:"pattern",pattern:"solid",fgColor:{argb:"FF1B3A5C"}}; c.alignment={vertical:"middle"}; }); h.height=20;
    filas.forEach((f,i)=>{ const r=ind.getRow(5+i); r.getCell(1).value=i+1; r.getCell(2).value=f[0]; r.getCell(3).value=f[1]; r.getCell(4).value=f[2];
      r.getCell(5).value={text:f[3],hyperlink:"#'"+f[3].replace(/'/g,"''")+"'!A1"}; r.getCell(5).font={color:{argb:"FF1A3FBF"},underline:true};
      if(i%2) for(let c=1;c<=5;c++) r.getCell(c).fill={type:"pattern",pattern:"solid",fgColor:{argb:"FFF3F5F9"}}; });
    if(fallos.length){ const r=ind.getRow(6+filas.length); r.getCell(3).value="No se pudieron leer: "+fallos.join(", "); r.getCell(3).font={color:{argb:"FFB03A32"}}; }
    ind.views=[{state:"frozen",ySplit:4,showGridLines:false}];
    const blob=new Blob([await out.xlsx.writeBuffer()],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=nombreSalida; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),3000);
    return {hojas:filas.length,fallos};
  };
})();
</script>

<script>
/* ===== Instalar el dashboard como app (solo en línea, desde GitHub) =====
   Una app instalada guarda el permiso de las carpetas: después de darlo una vez, ya no vuelve a pedir "Abrir carpeta". */
(function(){
  if(!/^https:/.test(location.protocol)&&location.hostname!=="localhost") { window.MA.instalable=()=>false; window.MA.instalar=async()=>false; window.MA.esApp=()=>false; return; }
  const l=document.createElement("link"); l.rel="manifest"; l.href="manifest.webmanifest"; document.head.appendChild(l);
  try{ if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{}); }catch(e){}
  let ev=null; const avisar=()=>document.dispatchEvent(new CustomEvent("ma-instalable"));
  window.addEventListener("beforeinstallprompt",e=>{ e.preventDefault(); ev=e; avisar(); });
  window.addEventListener("appinstalled",()=>{ ev=null; avisar(); });
  window.MA.esApp=()=>{ try{ return matchMedia("(display-mode: standalone)").matches||matchMedia("(display-mode: window-controls-overlay)").matches; }catch(e){ return false; } };
  window.MA.instalable=()=>!!ev;
  window.MA.instalar=async()=>{ if(!ev) return false; ev.prompt(); const r=await ev.userChoice.catch(()=>({})); ev=null; avisar(); return r&&r.outcome==="accepted"; };
  // Botón en la cabecera común
  function boton(){ const der=document.getElementById("maExtra"); if(!der) return;
    let b=document.getElementById("maInstalar");
    if(!window.MA.instalable()){ if(b) b.remove(); return; }
    if(!b){ b=document.createElement("button"); b.id="maInstalar"; b.className="ma-hbtn"; b.title="Instalar el dashboard como app: así no vuelve a pedir la carpeta"; b.textContent="⬇ Instalar app"; b.onclick=()=>window.MA.instalar(); der.appendChild(b); } }
  document.addEventListener("ma-instalable",boton); setTimeout(boton,1500);
})();
</script>

<script>
/* Usuarios y permisos (solo administradora). Las cuentas se crean con la función pantera-usuarios;
   rol, módulos y estado se guardan con ma_usuario_guardar. */
const $=id=>document.getElementById(id);
const esc=MA.esc;
const fFecha=t=>t?new Date(t).toLocaleString("es-PA",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"}):"—";
const MODULOS=MA.MODULOS, ROL_TXT=MA.ROL_TXT;
let CTX=null;
const rpc=async(fn,args)=>{ const {data,error}=await MA.sb.rpc(fn,args); if(error) throw new Error(error.message); return data; };
function banner(html,tipo){ const box=$("bannerBox"); box.innerHTML=html?`<div class="banner ${tipo||""}">${html}<button class="bx" title="Cerrar aviso">✕</button></div>`:""; const b=box.querySelector(".bx"); if(b) b.onclick=()=>box.innerHTML=""; }
/* ---------- Diálogo simple (confirmar / pedir un dato) ---------- */
function cerrarDlg(){ const d=document.querySelector(".dlg-bg"); if(d) d.remove(); }
function dialogo({titulo,texto,ok="Aceptar",peligro=false,campo=null}){
  return new Promise(res=>{
    cerrarDlg();
    const bg=document.createElement("div"); bg.className="dlg-bg";
    bg.innerHTML=`<div class="dlg" role="dialog"><h3>${esc(titulo)}</h3><p>${texto}</p>
      ${campo?`<input class="inp" id="dlgCampo" type="${campo.tipo||"text"}" placeholder="${esc(campo.ph||"")}" style="width:100%" autocomplete="new-password">`:""}
      <div id="dlgErr" style="color:var(--bad);font-size:12px;min-height:14px;margin-top:6px"></div>
      <div class="acts"><button class="btn" id="dlgNo">Cancelar</button><button class="btn ${peligro?"danger":"pri"}" id="dlgSi">${esc(ok)}</button></div></div>`;
    document.body.appendChild(bg);
    const fin=v=>{ cerrarDlg(); res(v); };
    $("dlgNo").onclick=()=>fin(null);
    bg.onclick=e=>{ if(e.target===bg) fin(null); };
    $("dlgSi").onclick=()=>{
      if(!campo) return fin(true);
      const v=$("dlgCampo").value;
      if(campo.min&&v.length<campo.min){ $("dlgErr").textContent=`Mínimo ${campo.min} caracteres.`; return; }
      fin(v);
    };
    if(campo) setTimeout(()=>$("dlgCampo").focus(),30);
  });
}

/* ---------- Usuarios (solo administradora) ---------- */
let USRS=[], USR_FN_OK=true;
async function fnUsuarios(body){
  const {data,error}=await MA.sb.functions.invoke("pantera-usuarios",{body});
  if(error){
    let msg=error.message;
    try{ const j=await error.context.json(); if(j&&j.error) msg=j.error; }catch(e){}
    const noPublicada=/Failed to send|not found|404/i.test(msg);
    if(noPublicada) msg="La función pantera-usuarios no está publicada en Supabase (ver GUIA_SUPABASE.txt, paso 2).";
    const err=new Error(msg); err.noPublicada=noPublicada; throw err;
  }
  if(data&&data.error) throw new Error(data.error);
  return data;
}
async function cargarUsuarios(){
  
  const box=$("usrBox");
  if(!USRS.length) box.innerHTML=`<div class="empty"><div class="spin" style="margin:0 auto 12px"></div>Leyendo usuarios…</div>`;
  try{ USRS=(await fnUsuarios({accion:"listar"})).usuarios||[]; USR_FN_OK=true; }
  catch(e){
    // sin la Edge Function igual se pueden ver y cambiar roles (crear cuentas y claves necesita la función)
    USR_FN_OK=false;
    const {data,error}=await MA.sb.from("ma_usuarios").select("*").order("email");
    if(error){ box.innerHTML=`<div class="empty"><div class="big">⚠️</div><b>No se pudieron leer los usuarios</b>${esc(error.message)}</div>`; return; }
    USRS=(data||[]).map(u=>({...u,cuenta:null,ultimo_ingreso:null}));
    banner(esc(e.message)+(e.noPublicada?" Mientras tanto se pueden cambiar roles, pero no crear cuentas ni contraseñas.":""),"err");
  }
  pintarUsuarios();
}
const modsHTML=(sel,pref)=>MODULOS.map(m=>`<label class="lbl" style="white-space:nowrap"><input type="checkbox" data-mod="${m.id}"${(sel||[]).includes(m.id)?" checked":""}> ${esc(m.nombre)}</label>`).join(" ");
function pintarUsuarios(){
  const yo=CTX.email;
  $("nuMods").innerHTML=modsHTML(["martina"]);
  const filas=USRS.map((u,i)=>`<tr data-i="${i}">
    <td>${esc(u.email)}${u.email===yo?` <span class="tag">tú</span>`:""}${u.cuenta===false?` <span class="tag quitar_mes" title="Tiene permiso pero no cuenta para entrar">sin cuenta</span>`:""}</td>
    <td><input class="inp sm" data-f="nombre" value="${esc(u.nombre||"")}" style="width:100%;min-width:140px"></td>
    <td><select class="inp sm" data-f="rol">${["admin","lector"].concat(u.rol==="editor"?["editor"]:[]).map(r=>`<option value="${r}"${u.rol===r?" selected":""}>${ROL_TXT[r]}</option>`).join("")}${u.rol?"":`<option value="" selected>— sin permiso —</option>`}</select></td>
    <td>${u.rol==="admin"?`<span class="tag ok">Todos</span>`:modsHTML(u.modulos)}</td>
    <td class="nw"><label><input type="checkbox" data-f="activo"${u.activo?" checked":""}> Activo</label></td>
    <td class="nw">${u.ultimo_ingreso?fFecha(Date.parse(u.ultimo_ingreso)):"—"}</td>
    <td class="nw"><button class="btn sm pri" data-a="guardar">Guardar</button>
      ${USR_FN_OK?`<button class="btn sm" data-a="clave">🔑 Clave</button>${u.email!==yo?`<button class="btn sm danger" data-a="eliminar">Eliminar</button>`:""}`:""}</td></tr>`).join("");
  $("usrBox").innerHTML=USRS.length?`<table class="x"><thead><tr><th>Correo</th><th>Nombre</th><th>Rol</th><th>Módulos</th><th>Estado</th><th>Último ingreso</th><th></th></tr></thead><tbody>${filas}</tbody></table>`
    :`<div class="empty"><b>Sin usuarios</b>Crea el primero con el formulario de arriba.</div>`;
  $("formNuevo").querySelectorAll("input,select,button").forEach(x=>x.disabled=!USR_FN_OK);
  $("usrBox").querySelectorAll("button[data-a]").forEach(b=>b.onclick=()=>accionUsuario(b.dataset.a,b.closest("tr")));
}
async function accionUsuario(a,tr){
  const u=USRS[+tr.dataset.i]; const val=f=>tr.querySelector(`[data-f="${f}"]`);
  try{
    if(a==="guardar"){
      const rol=val("rol").value; if(!rol) throw new Error("Elige un rol.");
      const mods=[...tr.querySelectorAll("[data-mod]:checked")].map(x=>x.dataset.mod);
      if(rol!=="admin"&&!mods.length) throw new Error("Marca al menos un módulo.");
      await rpc("ma_usuario_guardar",{p_email:u.email,p_nombre:val("nombre").value.trim()||null,p_rol:rol,p_activo:val("activo").checked,p_modulos:rol==="admin"?MODULOS.map(m=>m.id):mods});
      banner(`✓ Permisos de <b>${esc(u.email)}</b> guardados.`,"ok");
    }else if(a==="clave"){
      const p=await dialogo({titulo:"Cambiar contraseña",texto:`Nueva contraseña para <b>${esc(u.email)}</b>.`,ok:"Cambiar",campo:{tipo:"password",ph:"Mínimo 8 caracteres",min:8}});
      if(p==null) return;
      await fnUsuarios({accion:"clave",email:u.email,password:p});
      banner(`✓ Contraseña de <b>${esc(u.email)}</b> cambiada.`,"ok"); return;
    }else if(a==="eliminar"){
      const ok=await dialogo({titulo:"Eliminar usuario",peligro:true,ok:"Eliminar",texto:`Se borra la cuenta de <b>${esc(u.email)}</b> y su permiso. Ya no podrá entrar.`});
      if(!ok) return;
      await fnUsuarios({accion:"eliminar",email:u.email});
      banner(`✓ Usuario <b>${esc(u.email)}</b> eliminado.`,"ok");
    }
  }catch(e){ banner("No se pudo completar: "+esc(e.message),"err"); return; }
  await cargarUsuarios();
}
$("formNuevo").onsubmit=async e=>{
  e.preventDefault(); 
  const email=$("nuEmail").value.trim().toLowerCase();
  $("btnCrear").disabled=true;
  try{
    const mods=[...$("nuMods").querySelectorAll("[data-mod]:checked")].map(x=>x.dataset.mod);
    if($("nuRol").value!=="admin"&&!mods.length) throw new Error("Marca al menos un módulo.");
    const r=await fnUsuarios({accion:"crear",email,nombre:$("nuNombre").value.trim(),password:$("nuPass").value,rol:$("nuRol").value,modulos:$("nuRol").value==="admin"?MODULOS.map(m=>m.id):mods});
    banner(r&&r.yaExistia?`La cuenta <b>${esc(email)}</b> ya existía: se le asignó el rol.`:`✓ Usuario <b>${esc(email)}</b> creado.`,"ok");
    $("formNuevo").reset();
  }catch(err){ banner("No se pudo crear el usuario: "+esc(err.message),"err"); }
  $("btnCrear").disabled=false;
  await cargarUsuarios();
};
$("btnUsrRef").onclick=cargarUsuarios;
MA.listo.then(c=>{ CTX=c; cargarUsuarios(); });
</script>
</body>
</html>
