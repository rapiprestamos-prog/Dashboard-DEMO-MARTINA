    if(f!=null){ const x=g("aAcu").querySelector(`[data-ai="${f}"]`); if(x) x.focus(); } };
  const pPen=f=>{ const asis=String(g("aAsi").value).split(",").map(x=>x.trim()).filter(Boolean);
    g("aPen").innerHTML=pen.map((x,i)=>`<div class="ckrow pen"><input type="checkbox" data-ph="${i}"${x.h?" checked":""}><input class="inp${x.h?" hecho":""}" data-pt="${i}" value="${esc(x.t)}" placeholder="Pendiente"><input class="inp" data-pr="${i}" list="lAsis" value="${esc(x.r||"")}" placeholder="Responsable" style="max-width:170px"><input class="inp" type="date" data-pf="${i}" value="${esc(x.f||"")}" style="max-width:150px">${x.bit?'<span title="Ya está en la Bitácora" style="font-size:12px">🗂</span>':""}<button type="button" class="ckx" data-pq="${i}">✕</button></div>`).join("")+`<datalist id="lAsis">${asis.map(x=>`<option value="${esc(x)}">`).join("")}</datalist>`;
    g("aPen").querySelectorAll("[data-ph]").forEach(c=>c.onchange=()=>{ pen[c.dataset.ph].h=c.checked; pPen(); });
    g("aPen").querySelectorAll("[data-pt]").forEach(inp=>{ inp.oninput=()=>pen[inp.dataset.pt].t=inp.value; inp.onkeydown=e=>{ const i=+inp.dataset.pt; if(e.key==="Enter"){ e.preventDefault(); pen.splice(i+1,0,{h:false,t:"",r:"",f:""}); pPen(i+1); } else if(e.key==="Backspace"&&!inp.value){ e.preventDefault(); pen.splice(i,1); pPen(); g("aPenN").focus(); } }; });
    g("aPen").querySelectorAll("[data-pr]").forEach(inp=>inp.oninput=()=>pen[inp.dataset.pr].r=inp.value);
    g("aPen").querySelectorAll("[data-pf]").forEach(inp=>inp.onchange=()=>pen[inp.dataset.pf].f=inp.value);
    g("aPen").querySelectorAll("[data-pq]").forEach(b=>b.onclick=()=>{ pen.splice(+b.dataset.pq,1); pPen(); });
    if(f!=null){ const x=g("aPen").querySelector(`[data-pt="${f}"]`); if(x) x.focus(); } };
  pAcu(); pPen();
  g("aAcuN").onkeydown=e=>{ if(e.key!=="Enter") return; e.preventDefault(); const v=g("aAcuN").value.trim(); if(!v) return; acu.push(v); g("aAcuN").value=""; pAcu(); g("aAcuN").focus(); };
  g("aPenN").onkeydown=e=>{ if(e.key!=="Enter") return; e.preventDefault(); const v=g("aPenN").value.trim(); if(!v) return; pen.push({h:false,t:v,r:"",f:""}); g("aPenN").value=""; pPen(); g("aPenN").focus(); };
  g("aAsi").onchange=()=>pPen();
  const datos=()=>{ const pa=g("aAcuN").value.trim(), pp=g("aPenN").value.trim(); if(pa){ acu.push(pa); g("aAcuN").value=""; pAcu(); } if(pp){ pen.push({h:false,t:pp,r:"",f:""}); g("aPenN").value=""; pPen(); }
    return {titulo:g("aTit").value.trim(),fecha:g("aFec").value,hora:g("aHor").value,lugar:g("aLug").value.trim(),asis:g("aAsi").value.trim(),temas:g("aTem").value,acu,pen,prox:g("aPro").value}; };
  const nota=()=>{ const d=datos(); return Object.assign({},n,{titulo:"Acta: "+(d.titulo||"Reunión")+(d.fecha?" · "+fISO(d.fecha):""),texto:actaTexto(d),tablero:g("aTab").value.trim()||"Actas",etiquetas:[...new Set(["acta"].concat(etqs(n)))].join(", "),recordar:d.prox?d.prox.slice(0,10):(n.recordar||"")}); };
  const asunto=d=>"Acta: "+(d.titulo||"Reunión")+(d.fecha?" · "+fISO(d.fecha):"");
  g("aOk").onclick=()=>{ const o=nota(); cerrar(); guardar(o); };
  if(g("aDel")) g("aDel").onclick=()=>{ if(confirm("¿Eliminar esta acta?")){ cerrar(); borrar(n.id); } };
  g("aOut").onclick=()=>{ const d=datos(); outlook(correos(d.asis),asunto(d),actaTexto(d).replace(/\[ \] /g,"☐ ").replace(/\[x\] /gi,"☑ ")); };
  const proxIni=d=>{ if(!d.prox){ toast("Pon la fecha y hora de la próxima reunión",true); g("aPro").focus(); return null; } const i=new Date(d.prox); return [i.toISOString(),new Date(i.getTime()+3600e3).toISOString()]; };
  g("aCal").onclick=()=>{ const d=datos(), r=proxIni(d); if(r) agendaOutlook(correos(d.asis),"Seguimiento: "+(d.titulo||"Reunión"),r[0],r[1],"Pendientes de la reunión del "+fISO(d.fecha)+":\n"+d.pen.filter(x=>!x.h).map(x=>"• "+x.t+(x.r?" — "+x.r:"")).join("\n")); };
  g("aTea").onclick=()=>{ const d=datos(), r=proxIni(d); if(r) agendaTeams(correos(d.asis),"Seguimiento: "+(d.titulo||"Reunión"),r[0],r[1],"Pendientes: "+d.pen.filter(x=>!x.h).map(x=>x.t).join("; ")); };
  g("aDoc").onclick=()=>{ const d=datos(), li=a=>a.length?`<ul>${a.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:"<p>—</p>";
    word(asunto(d),`<div class="k">M&amp;A CAPITAL · ACTA DE REUNIÓN</div><h1>${esc(d.titulo||"Reunión")}</h1>
      <table><tr><th style="width:25%">Fecha</th><td>${esc(fISO(d.fecha))}${d.hora?" · "+esc(d.hora):""}</td></tr><tr><th>Lugar</th><td>${esc(d.lugar)}</td></tr><tr><th>Asistentes</th><td>${esc(d.asis)}</td></tr></table>
      <h2>Temas tratados</h2>${li(String(d.temas).split("\n").filter(x=>x.trim()))}<h2>Acuerdos</h2>${li(d.acu.filter(x=>x.trim()))}
      <h2>Pendientes</h2>${d.pen.filter(x=>x.t.trim()).length?`<table><tr><th>Estado</th><th>Pendiente</th><th>Responsable</th><th>Fecha</th></tr>${d.pen.filter(x=>x.t.trim()).map(x=>`<tr><td>${x.h?"☑ Hecho":"☐"}</td><td>${esc(x.t)}</td><td>${esc(x.r||"")}</td><td>${esc(fISO(x.f||""))}</td></tr>`).join("")}</table>`:"<p>—</p>"}
      <h2>Próxima reunión</h2><p>${d.prox?esc(fISO(d.prox.slice(0,10))+" "+d.prox.slice(11,16)):"—"}</p>`); };
  g("aBit").onclick=async()=>{ const d=datos(), lista=d.pen.filter(x=>x.t.trim()&&!x.h&&!x.bit); if(!lista.length){ toast("No hay pendientes nuevos para pasar a la Bitácora",true); return; }
    const b=g("aBit"); b.disabled=true; let k=0;
    for(const x of lista){ b.textContent=`Creando ${++k} de ${lista.length}…`; const id=await crearTarea({titulo:x.t.trim(),responsable:x.r||"",limite:x.f||"",proyecto:d.titulo||"",descripcion:"De la reunión «"+(d.titulo||"Reunión")+"» del "+fISO(d.fecha)+(x.r?". Responsable: "+x.r:""),etiquetas:"acta"}); if(id) x.bit=true; }
    b.disabled=false; b.textContent="➜ Pendientes a la Bitácora"; pPen(); const o=nota(); guardar(o,true); n=o; toast(`✓ ${lista.filter(x=>x.bit).length} tarea(s) creadas en la Bitácora`); };
  g(n.id?"aTem":"aTit").focus();
}

/* ---------- guía ---------- */
const PROMPT=`Actúa como desarrollador senior de Google Apps Script y diseñador de producto.
Quiero un "Tablero de Notas" para el equipo de M&A Capital, conectado a la misma Hoja de cálculo de Google que la Bitácora Ejecutiva.

DATOS (pestaña Notas, fila 1 = encabezados):
id, titulo, texto, color (amarillo/rosa/verde/azul/lila/naranja), fijada, tarea_id, autor, creado, actualizado, tablero (columna), etiquetas, recordar (fecha), orden

SERVIDOR (Codigo.gs, aplicación web):
- doPost recibe JSON {accion, token, ...}: notas.listar (devuelve notas y las tareas abiertas para ligarlas), notas.guardar, notas.borrar.
- Verifica la sesión del usuario (token de Supabase) y que tenga el módulo "notas".
- avisoDiario (disparador 7 a. m.): además de las tareas, envía a cada autor sus notas con recordatorio de hoy.

PÁGINA (HTML + JS, estilo M&A: azul marino y dorado, notas tipo post-it):
- Nota rápida arriba: Enter guarda, la primera línea corta se usa como título, se elige columna y color.
- Vistas: Columnas (arrastrar notas entre columnas, crear columnas nuevas), Muro (todas como un corcho), Recordatorios (atrasados, hoy, próximos 7 días, más adelante).
- Casillas: líneas que empiezan con [ ] se vuelven casillas que se marcan con un clic y muestran barra de avance.
- Fijar, colores, etiquetas clicables, ligar a una tarea, convertir en tarea (notas.crearTarea), duplicar, búsqueda, filtros por color, "mías" y fijadas.
- Acta de reunión: formulario con fecha, hora, lugar/Teams, asistentes, temas, acuerdos y pendientes (responsable y fecha); se guarda como nota en la columna Actas. Botones Office 365: correo en Outlook (outlook.office.com/mail/deeplink/compose), próxima reunión en el calendario de Outlook o en Teams, descarga en Word y pendientes como tareas de la Bitácora.
- Lo nuevo lleva un id creado en la página: si Google reintenta el pedido, se actualiza la misma fila y nunca se duplica.
- Indicadores: total, fijadas, recordatorios de hoy, % de casillas hechas, ligadas a tareas. Exportar a Excel.
- Nunca inventar datos: si la hoja está vacía, mostrarlo vacío.`;
function vGuia(){
  $("vista").innerHTML=`<div class="g2">
    <div class="card pad guia">
      <h3>¿Para qué sirve?</h3>
      <p>Es el <b>corcho digital del equipo</b>: ideas, acuerdos de reuniones, pendientes rápidos y recordatorios, ordenados en columnas y con colores, como notas adhesivas. Todo queda guardado en la Hoja de Google, compartido con el equipo.</p>
      <ul><li><b>Nota rápida:</b> escribe y presiona Enter. Listo.</li>
        <li><b>Columnas:</b> Ideas, Por hacer, Acuerdos, Recordatorios… y las que crees. Arrastra las notas de una a otra.</li>
        <li><b>Casillas:</b> empieza una línea con <b>[ ]</b> y se vuelve una casilla; se marca con un clic y la nota muestra su avance.</li>
        <li><b>Recordatorios:</b> pon una fecha y la nota aparece en «Recordatorios»; con el correo de cada mañana activado, le llega al autor ese día.</li>
        <li><b>Ligada a tareas:</b> una nota puede ir pegada a una tarea de la Bitácora Ejecutiva, o convertirse en tarea con <b>➜ Crear tarea</b>.</li>
        <li><b>📋 Acta de reunión:</b> formulario listo (fecha, lugar o Teams, asistentes, temas, acuerdos y pendientes con responsable y fecha). Con Office 365: <b>✉ Enviar por Outlook</b> a los asistentes, <b>📅 Próxima en Outlook</b> o <b>👥 en Teams</b>, <b>⬇ Word</b> y <b>➜ Pendientes a la Bitácora</b>.</li>
        <li><b>Carga instantánea:</b> al volver a la página se ve al momento lo último y se actualiza solo por detrás.</li></ul>
      <h3>Cómo hacerlo funcionar</h3>
      <ol><li>Usa la misma Hoja de Google y el mismo Apps Script de la Bitácora Ejecutiva (ya incluye las notas).</li>
        <li>Si cambiaste el código, en Apps Script: Implementar › Gestionar implementaciones › editar › Versión nueva.</li>
        <li>Da a cada persona el módulo «Tablero de Notas» en Usuarios y permisos.</li>
        <li>Opcional: ejecutar <b>instalarAvisoDiario</b> para los correos de las 7 a. m.</li></ol>
    </div>
    <div class="card pad"><p class="ch-t">Prompt del proyecto</p><div class="ch-s">Sirve para pedirle a una IA que lo amplíe o lo vuelva a construir igual</div>
      <div class="prompt" id="prompt"></div><button class="btn" id="copiaP" style="margin-top:10px">📋 Copiar prompt</button></div></div>`;
  $("prompt").textContent=PROMPT;
  $("copiaP").onclick=async e=>{ try{ await navigator.clipboard.writeText(PROMPT); e.target.textContent="✓ Copiado"; }catch(x){} };
}
