<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tablero de Notas — M&amp;A Capital</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  color-scheme:light;
  --bg:#f3f5f9; --surface:#fff; --surface-2:#f0f3f8; --border:#dde3ec; --grid:#edf1f6;
  --text:#0f1c2e; --text-2:#44546a; --muted:#7d889a;
  --navy:#1b3a5c; --navy-d:#0f2440; --teal:#0f6f6e; --gold:#e3c27a; --gold-d:#b98b2f;
  --good:#1c7a46; --bad:#b03a32; --warn:#9a6b0f;
  --shadow:0 1px 2px rgba(15,23,42,.05),0 6px 18px rgba(15,23,42,.06);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,"Segoe UI",sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
.wrap{max-width:1420px;margin:0 auto;padding:18px 24px 50px}
.hero{position:relative;overflow:hidden;border-radius:18px;padding:22px 28px;color:#fff;background:linear-gradient(115deg,#0f2440 0%,#1b3a5c 55%,#0f5560 100%);box-shadow:0 10px 30px rgba(15,36,64,.22)}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,#e3c27a,#b98b2f 60%,transparent)}
.hero .k{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:700}
.hero h1{margin:4px 0 2px;font-family:"Playfair Display",Georgia,serif;font-weight:600;font-size:30px}
.hero h1 i{color:var(--gold)}
.hero .sub{color:#c9d5e4;font-size:13.5px}
.hero .acc{position:absolute;right:24px;top:22px;display:flex;gap:8px;flex-wrap:wrap}
.hbtn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:#fff;font-weight:600;font-size:13px;cursor:pointer}
.hbtn:hover{background:rgba(255,255,255,.16)}.hbtn.pri{background:var(--gold);border-color:var(--gold);color:var(--navy-d)}
@media (max-width:900px){.hero .acc{position:static;margin-top:12px}}
.ctrl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0}
.chips{display:flex;gap:4px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:4px}
.chip{border:0;background:none;padding:7px 13px;border-radius:9px;font-weight:600;font-size:13px;color:var(--text-2);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--navy);color:#fff}
.inp{padding:9px 12px;border-radius:10px;border:1px solid var(--border);background:var(--surface);outline:none;font-size:13px}
.inp:focus{border-color:var(--teal)}
.grow{flex:1;min-width:200px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 15px;border-radius:10px;border:1px solid var(--border);background:var(--surface);font-weight:700;font-size:13px;cursor:pointer}
.btn:hover{background:var(--surface-2)}.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn.bad{color:var(--bad)}
.filtro{display:inline-flex;align-items:center;gap:6px;background:#e8eef7;color:var(--navy);border-radius:999px;padding:5px 6px 5px 12px;font-size:12.5px;font-weight:700}
.filtro button{border:0;background:var(--navy);color:#fff;border-radius:999px;width:20px;height:20px;cursor:pointer;font-size:11px}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:14px}
@media (max-width:1000px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:12px 14px;box-shadow:var(--shadow);position:relative;overflow:hidden;cursor:pointer}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--gold-d)}
.kpi.bad::before{background:var(--bad)}.kpi.ok::before{background:var(--good)}
.kpi .l{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.kpi .v{font-size:24px;font-weight:800;margin-top:3px;font-variant-numeric:tabular-nums}
.kpi .d{font-size:11.5px;color:var(--text-2)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:14px;overflow-x:auto}
.tab{border:0;background:none;padding:10px 14px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--navy);border-bottom-color:var(--gold-d)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow)}
.pad{padding:16px 18px}
.ch-t{font-weight:800;font-size:14px;margin:0 0 2px}.ch-s{font-size:12px;color:var(--muted);margin-bottom:10px}
.vacio{padding:26px 16px;text-align:center;color:var(--muted);font-size:13px;line-height:1.55}
.vacio>b{display:block;color:var(--text);font-size:14.5px;margin-bottom:4px}
/* nota rápida */
.rapida{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:10px;box-shadow:var(--shadow);margin-bottom:14px}
.rapida textarea{flex:1;border:0;outline:none;resize:none;min-height:42px;font-size:14px;padding:8px}
.rapida .op{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pt{width:20px;height:20px;border-radius:50%;border:2px solid transparent;cursor:pointer}.pt[aria-pressed="true"]{border-color:var(--navy)}
/* colores de nota */
.n-amarillo{background:#fff6cc}.n-rosa{background:#fde4ea}.n-verde{background:#e1f5ea}.n-azul{background:#e2edfb}.n-lila{background:#ece6fb}.n-naranja{background:#ffe8d4}
/* columnas */
.cols{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(235px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px;align-items:start}
.colN{background:#e9eef5;border-radius:14px;padding:10px;min-height:260px;display:flex;flex-direction:column;gap:10px;transition:background .15s}
.colN.sobre{background:#dce6f3;outline:2px dashed #2a62a0}
.colN-h{display:flex;align-items:center;gap:8px;padding:2px 4px;font-weight:800;font-size:13px}
.colN-h .n{margin-left:auto;background:#fff;border-radius:999px;padding:1px 9px;font-size:12px;color:var(--text-2)}
/* muro */
.muro{columns:270px;column-gap:14px}
.muro .nt{break-inside:avoid;margin-bottom:14px}
/* nota */
.nt{border-radius:4px 14px 14px 14px;padding:14px 14px 10px;box-shadow:0 6px 16px rgba(15,23,42,.08);cursor:grab;position:relative;display:flex;flex-direction:column;transition:transform .12s, box-shadow .12s}
.nt:hover{transform:translateY(-2px) rotate(-.3deg);box-shadow:0 12px 24px rgba(15,23,42,.12)}
.nt.arr{opacity:.4}
.nt.pend{opacity:.7;pointer-events:none}.guardando{font-size:11px;font-weight:700;color:var(--navy);margin-bottom:4px;display:flex;align-items:center}.guardando .spin{width:12px;height:12px}
.nt h5{margin:0 22px 6px 0;font-size:14.5px;line-height:1.3}
.nt .tx{font-size:13px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.nt .ck{display:flex;gap:7px;align-items:flex-start;margin:2px 0;cursor:pointer}
.nt .ck input{margin-top:3px;cursor:pointer}.nt .ck.hecho span{text-decoration:line-through;opacity:.55}
.nt .pr{height:4px;background:rgba(15,28,46,.1);border-radius:3px;overflow:hidden;margin:8px 0 2px}.nt .pr i{display:block;height:100%;background:var(--good)}
.nt .pie{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:11px;color:rgba(15,28,46,.62);margin-top:9px}
.nt .pin{position:absolute;right:10px;top:8px;cursor:pointer;opacity:.25;border:0;background:none;font-size:15px;padding:0}
.nt .pin.on,.nt:hover .pin{opacity:1}
.etq{display:inline-block;background:rgba(27,58,92,.1);color:var(--navy);border-radius:999px;padding:1px 8px;font-size:10.5px;font-weight:700;cursor:pointer}
.rec{background:rgba(255,255,255,.65);border-radius:6px;padding:1px 6px;font-weight:700}.rec.hoy{background:#b98b2f;color:#fff}.rec.pas{background:var(--bad);color:#fff}
/* recordatorios */
.ag{list-style:none;margin:0;padding:0}.ag li{display:flex;gap:12px;align-items:flex-start;padding:10px 6px;border-bottom:1px solid var(--grid);cursor:pointer}
.ag li:hover{background:var(--surface-2)}.ag .fe{min-width:86px;font-weight:800;font-size:12.5px}.ag .fe small{display:block;font-weight:600;color:var(--muted)}
.ag .sw{width:12px;height:12px;border-radius:3px;flex:none;margin-top:4px;border:1px solid rgba(0,0,0,.08)}
/* guía */
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}@media (max-width:1000px){.g2{grid-template-columns:1fr}}
.guia{line-height:1.7;font-size:14px;color:var(--text-2)}.guia h3{color:var(--text);font-size:16px;margin:18px 0 6px}.guia h3:first-child{margin-top:0}
.guia b{color:var(--text)}.guia ul,.guia ol{padding-left:20px;margin:6px 0}
.prompt{background:#0f1c2e;color:#e6ecf5;border-radius:12px;padding:16px 18px;font-family:ui-monospace,Consolas,monospace;font-size:12.5px;line-height:1.6;white-space:pre-wrap;max-height:460px;overflow:auto}
/* diálogo */
.bg{position:fixed;inset:0;background:rgba(15,28,46,.45);display:flex;align-items:flex-start;justify-content:center;padding:30px 16px;z-index:60;overflow-y:auto}
.dlg{width:100%;max-width:640px;background:var(--surface);border-radius:16px;box-shadow:0 20px 60px rgba(15,23,42,.35)}
.dlg-h{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border)}.dlg-h h3{margin:0;font-size:16px}
.dlg-b{padding:14px 18px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dlg-f{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--border)}
.f{display:flex;flex-direction:column;gap:4px}.f.full{grid-column:1/-1}.f>span{font-size:11.5px;font-weight:700;color:var(--text-2)}
.f textarea{min-height:170px;resize:vertical;line-height:1.5}
.colores{display:flex;gap:8px}.colores button{width:28px;height:28px;border-radius:50%;border:2px solid transparent;cursor:pointer}.colores button[aria-pressed="true"]{border-color:var(--navy)}
.ayuda{font-size:11.5px;color:var(--muted)}
.tbn{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 4px}
.modo{display:inline-flex;gap:4px;background:var(--surface-2);border-radius:10px;padding:3px;margin-bottom:6px;align-self:flex-start}
.modo button{border:0;background:none;border-radius:8px;padding:6px 12px;font-weight:700;font-size:12.5px;color:var(--text-2);cursor:pointer}
.modo button[aria-pressed="true"]{background:var(--navy);color:#fff}
.ckrow{display:flex;align-items:center;gap:8px;margin-bottom:5px}.ckrow input[type=checkbox]{width:18px;height:18px;cursor:pointer;flex:none}
.ckrow .inp{flex:1;padding:7px 10px}.ckrow .inp.hecho{text-decoration:line-through;color:var(--muted)}
.ckx{border:0;background:none;color:var(--muted);cursor:pointer;font-size:13px;padding:4px 6px;border-radius:6px}.ckx:hover{background:#fbeceb;color:var(--bad)}
.ckrow.pen .inp{min-width:0}.o365{background:#f3f6fb;border:1px solid var(--border);border-radius:12px;padding:10px 12px}
.ckmas{width:18px;text-align:center;font-weight:800;color:var(--teal);flex:none}
.addck{display:flex;gap:6px;margin-top:6px}.addck input{flex:1;border:0;border-bottom:1px dashed rgba(15,28,46,.25);background:transparent;font-size:12.5px;padding:4px 2px;outline:none}
.toast{position:fixed;right:18px;bottom:18px;background:var(--navy-d);color:#fff;padding:10px 14px;border-radius:10px;font-size:13px;z-index:80}
.toast.bad{background:var(--bad)}
.spin{display:inline-block;width:16px;height:16px;border-radius:50%;border:2px solid #dbe3ee;border-top-color:var(--navy);animation:sp .8s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
@media print{.hero .acc,.ctrl,.tabs,#maHdr,.rapida{display:none!important}.nt{box-shadow:none;border:1px solid #ddd}}
</style>
</head>
<body>
<!-- ===== M&A Capital · acceso (cada página es independiente; mismo usuario y clave en todas) ===== -->
<style>
.ma-hdr{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:10px 12px 0;padding:7px 14px;border-radius:12px;color:#fff;
  background:linear-gradient(115deg,#0f2440,#1b3a5c 55%,#0f5560);box-shadow:0 1px 2px rgba(15,23,42,.05),0 4px 14px rgba(15,23,42,.05);font-family:Inter,system-ui,"Segoe UI",sans-serif;line-height:1.3}
.ma-hdr .ma-b{display:flex;align-items:center;gap:12px;min-width:0}
.ma-hdr .ma-logo{height:40px;width:auto;flex:none;filter:drop-shadow(0 2px 6px rgba(0,0,0,.25))}
.ma-hdr .ma-sep{width:1px;align-self:stretch;margin:4px 0;background:linear-gradient(180deg,transparent,rgba(227,194,122,.7),transparent)}
.ma-hdr .ma-k{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#e3c27a;font-weight:700;text-decoration:none}
.ma-hdr .ma-k:hover{color:#fff}
.ma-hdr h1{margin:0;font-size:17px;font-weight:800;color:#fff}
.ma-hdr .ma-sub{font-size:11.5px;color:rgba(255,255,255,.75);margin-top:1px}
.ma-hdr .ma-der{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ma-chip{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:rgba(227,194,122,.2);color:#e3c27a;border:1px solid rgba(227,194,122,.45)}
.ma-hbtn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:9px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;font:600 12.5px Inter,system-ui,sans-serif;cursor:pointer;text-decoration:none}
.ma-hbtn:hover{background:rgba(255,255,255,.16)}
.ma-oculto{display:none!important}
body.ma-fuera>*:not(.ma-hdr):not(.ma-login):not(script):not(style):not(link){display:none!important}
.ma-login{flex:1;min-height:0;overflow:auto;display:flex;align-items:center;justify-content:center;padding:24px;font-family:Inter,system-ui,"Segoe UI",sans-serif;background:#f3f5f9}
.ma-card{width:100%;max-width:420px;background:#fff;border:1px solid #dde3ec;border-radius:18px;box-shadow:0 18px 50px rgba(15,23,42,.12);overflow:hidden}
.ma-top{padding:26px 28px 20px;color:#fff;text-align:center;background:radial-gradient(120% 160% at 12% 0%,#2b5a86 0%,#1b3a5c 40%,#0f2440 80%)}
.ma-top img{height:62px;margin-bottom:10px}
.ma-top .ma-ey{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#e3c27a;font-weight:700}
.ma-top h2{margin:4px 0 0;font-size:19px;font-weight:800}
.ma-body{padding:24px 28px 22px}
.ma-body form{display:flex;flex-direction:column;gap:10px}
.ma-inp{padding:10px 12px;border-radius:9px;border:1px solid #dde3ec;font:14px Inter,system-ui,sans-serif;color:#0f1c2e;background:#fff;outline:none}
.ma-inp:focus{border-color:#1b3a5c}
.ma-ok{padding:11px 22px;border-radius:9px;border:1px solid #e3c27a;background:#e3c27a;color:#0f2440;font:700 14px Inter,system-ui,sans-serif;cursor:pointer}
.ma-ok:disabled{opacity:.6;cursor:default}
.ma-err{color:#b03a32;min-height:16px;font-size:12.5px;text-align:center}
.ma-nota{margin:14px 0 0;font-size:11.5px;color:#8792a4;text-align:center;line-height:1.5}
.ma-nota a{color:#1b3a5c;font-weight:600}
.ma-idle{position:fixed;right:22px;bottom:22px;z-index:9999;max-width:360px;background:#fff;border:1px solid #f0dcaa;border-left:5px solid #b98b2f;border-radius:12px;padding:14px 16px;box-shadow:0 18px 40px rgba(15,23,42,.22);font:13px Inter,system-ui,sans-serif;color:#0f1c2e}
.ma-idle b{display:block;margin-bottom:4px;font-size:14px}
.ma-idle button{margin-top:10px;padding:6px 12px;border-radius:8px;border:none;background:#1b3a5c;color:#fff;font:600 12.5px Inter,system-ui,sans-serif;cursor:pointer}
</style>

      <div class="ma-der"><span id="maExtra"></span><span class="ma-chip ma-oculto" id="maChip"></span><button class="ma-hbtn ma-oculto" id="maSalir" title="Cerrar sesión">⎋ Salir</button></div>`;
    document.body.prepend(h); $("maSalir").onclick=()=>salir();
  }
  function pantallaLogin(msg,sinPermiso){
    document.body.classList.add("ma-fuera");
    let l=$("maLogin"); if(l) l.remove();
    l=document.createElement("div"); l.className="ma-login"; l.id="maLogin";
    const titulo=O.soloAdmin?"Usuarios y permisos":(O.titulo||"Dashboard Interno Ultimate");
    l.innerHTML=`<div class="ma-card"><div class="ma-top"><img src="${LOGO}" alt="M&amp;A Capital Inc"><div class="ma-ey">M&amp;A Capital · Uso interno</div><h2>${esc(titulo)}</h2></div>
      <div class="ma-body">${sinPermiso?`<div class="ma-err" style="margin-bottom:14px">${esc(msg)}</div>
        <button class="ma-ok" id="maOtro" style="width:100%">Entrar con otro usuario</button>`:`<form id="maForm">
        <input class="ma-inp" type="email" id="maEmail" placeholder="correo@empresa.com" autocomplete="username" required>
        <input class="ma-inp" type="password" id="maPass" placeholder="Contraseña" autocomplete="current-password" required>
        <button class="ma-ok" type="submit" id="maEntrar">Entrar</button>
        <div class="ma-err" id="maErr">${esc(msg||"")}</div></form>`}
        <p class="ma-nota">La sesión se cierra al pulsar “Salir”, al cerrar la pestaña o tras 10 minutos sin actividad.<br><a href="index.html">← Volver al inicio</a></p></div></div>`;
    const hdr=$("maHdr"); if(hdr) hdr.after(l); else document.body.prepend(l);
    if(sinPermiso){ $("maOtro").onclick=async()=>{ try{ await sb.auth.signOut(); }catch(e){} pantallaLogin(""); }; return; }
    $("maForm").onsubmit=async e=>{
      e.preventDefault(); $("maErr").textContent=""; $("maEntrar").disabled=true;
      const {error}=await sb.auth.signInWithPassword({email:$("maEmail").value.trim(),password:$("maPass").value});
      $("maEntrar").disabled=false; $("maPass").value="";
      if(error){ $("maErr").textContent=/invalid/i.test(error.message)?"Correo o contraseña incorrectos.":error.message; return; }
      ss.setItem(KACT,String(Date.now())); await validar();
    };
    setTimeout(()=>{ try{ $("maEmail").focus(); }catch(e){} },50);
  }
  // ¿quién es y qué puede ver? (ma_usuarios: rol, módulos, activo)
  async function leerUsuario(){
    if(!sb) return null;
    const {data:{session}}=await sb.auth.getSession(); if(!session) return null;
    const ult=+ss.getItem(KACT)||0;
    if(ult&&Date.now()-ult>IDLE){ try{ await sb.auth.signOut(); }catch(e){} try{ Object.keys(sessionStorage).filter(k=>k.startsWith("gsc_")).forEach(k=>sessionStorage.removeItem(k)); }catch(e){} ss.setItem(KMSG,"La sesión se cerró por 10 minutos sin actividad."); return null; }
    const email=session.user.email.toLowerCase();
    const {data:yo,error}=await sb.from("ma_usuarios").select("rol,modulos,activo").eq("email",email).maybeSingle();
    if(error) return {error:"No se pudo validar tu acceso: "+error.message};
    if(!yo||!yo.activo){ try{ await sb.auth.signOut(); }catch(e){} return {error:"Tu usuario no tiene acceso al dashboard o está desactivado. Pídele acceso a la administradora."}; }
    return {sb,email,rol:yo.rol,modulos:yo.modulos||[],token:session.access_token,user:session.user,url:URL_,anon:ANON};
  }
  const puede=(c,id)=>c&&(c.rol==="admin"||(c.modulos||[]).includes(id));
  function avisarPagina(){ if(!ctx) return; try{ window.postMessage({type:"MA_SESSION",url:URL_,anon:ANON,token:ctx.token,email:ctx.email,rol:ctx.rol,modulos:ctx.modulos},"*"); }catch(e){} }
  async function validar(){
    const c=await leerUsuario();
    if(!c){ const m=ss.getItem(KMSG)||""; ss.removeItem(KMSG); pantallaLogin(m); return; }
    if(c.error){ pantallaLogin(c.error); return; }
    if(O.soloAdmin? c.rol!=="admin" : (O.modulo&&!puede(c,O.modulo))){
      pantallaLogin(O.soloAdmin?"Solo la administradora puede manejar usuarios.":"Tu usuario ("+c.email+") no tiene acceso a "+(O.titulo||"este módulo")+". Pídele acceso a la administradora.",true); return; }
    ctx=c; const l=$("maLogin"); if(l) l.remove(); document.body.classList.remove("ma-fuera");
    if($("maSub")) $("maSub").textContent=c.email;
    if($("maChip")){ $("maChip").textContent=ROL_TXT[c.rol]||c.rol; $("maChip").classList.remove("ma-oculto"); }
    if($("maSalir")) $("maSalir").classList.remove("ma-oculto");
    actividad(); avisarPagina(); listo(c);
    try{ window.dispatchEvent(new CustomEvent("ma:sesion",{detail:c})); }catch(e){}
  }
  // ---- inactividad (cuenta en todas las páginas de la pestaña) ----
  let ultEsc=0;
  function actividad(){ const n=Date.now(); if(n-ultEsc>1000){ ultEsc=n; ss.setItem(KACT,String(n)); } const b=$("maIdle"); if(b) b.remove(); }
  ["mousemove","mousedown","keydown","wheel","touchstart","scroll"].forEach(ev=>addEventListener(ev,()=>{ if(ctx) actividad(); },{passive:true,capture:true}));
  setInterval(()=>{
    if(!ctx) return;
    const resta=IDLE-(Date.now()-(+ss.getItem(KACT)||Date.now()));
    if(resta<=0){ salir("La sesión se cerró por 10 minutos sin actividad."); return; }
    if(resta<=AVISO){ let b=$("maIdle");
      if(!b){ b=document.createElement("div"); b.id="maIdle"; b.className="ma-idle"; b.innerHTML=`<b>¿Sigues ahí?</b>La sesión se cerrará en <span id="maSeg"></span> s por inactividad.<br><button type="button">Seguir conectado</button>`; document.body.appendChild(b); b.querySelector("button").onclick=()=>{ ultEsc=0; actividad(); }; }
      $("maSeg").textContent=Math.ceil(resta/1000); }
  },1000);
  async function salir(msg){
    ctx=null; try{ await sb.auth.signOut(); }catch(e){}
    try{ Object.keys(sessionStorage).filter(k=>k.startsWith("gsc_")).forEach(k=>sessionStorage.removeItem(k)); }catch(e){}   // datos de la Hoja de Google guardados para carga rápida
    ss.removeItem(KACT); if(msg) ss.setItem(KMSG,msg); else ss.setItem(KMSG,"Sesión cerrada.");
    location.reload();   // la página vuelve a empezar limpia, sin datos en pantalla
  }
  if(sb) sb.auth.onAuthStateChange((ev,session)=>{
    if(ev==="TOKEN_REFRESHED"&&ctx&&session){ ctx.token=session.access_token; avisarPagina(); }
    if(ev==="SIGNED_OUT"&&ctx) salir("La sesión expiró. Vuelve a entrar.");
  });
  addEventListener("load",()=>{ if(ctx) avisarPagina(); });

  return {
    MODULOS, ROL_TXT, VERSION, sb, puede, esc, actividad:()=>{ if(ctx) actividad(); },
    listo:listoP, ctx:()=>ctx, salir,
    // Página que exige usuario: {modulo, titulo, soloAdmin, cabecera}
    iniciar(o){ O=o||{}; document.body.classList.add("ma-fuera"); cabecera();
      if(!ON){ pantallaLogin("Falta configurar Supabase en el dashboard."); return listoP; }
      validar(); return listoP; },
    // Inicio: no exige usuario; si ya entró en esta pestaña, devuelve quién es
    async opcional(){ if(!ON) return null; const c=await leerUsuario(); if(!c||c.error) return null; ctx=c; actividad(); return c; }
  };
})();
</script>
<script>
/* ===== Fuentes automáticas de carpetas (sin que Chrome pregunte) =====
   1) ACCESO DIRECTO: la página se abre desde la carpeta de OneDrive de la PC con el acceso directo
      "Dashboard M&A" (Chrome con --allow-file-access-from-files en un perfil aparte). Lee la carpeta
      que está al lado de la página (o la propia carpeta de la página). Solo lectura.
   2) MICROSOFT 365: lee la carpeta de OneDrive en la nube con la cuenta Microsoft de la persona
      (Microsoft Graph). Necesita una app registrada por el administrador de Microsoft 365 de M&A
      (clientId) y el enlace de la carpeta. Lee y guarda.
   Si ninguna está disponible, cada módulo usa lo de siempre (elegir carpeta en Chrome). */
(function(){
  const MS={clientId:"",tenant:""||"organizations",
    carpetas:{PruebaDashboard:"",Contabilidad:"",Legal:""}};
  const msOn=()=>/^[0-9a-f-]{36}$/i.test(MS.clientId);

  /* ---------- 1) acceso directo (file://) ---------- */
  const xhr=(url,tipo)=>new Promise((ok,no)=>{ const x=new XMLHttpRequest(); x.open("GET",url); if(tipo) x.responseType=tipo;
    x.onload=()=>(x.status===0||x.status===200)?ok(x.response):no(new Error("HTTP "+x.status)); x.onerror=()=>no(new Error("sin acceso")); if(!tipo){ x.timeout=5000; x.ontimeout=()=>no(new Error("la carpeta tardó demasiado")); } x.send(); });
  async function listarLocal(url){
    const t=await xhr(url); const out=[]; const re=/addRow\((.*?)\);<\/script>/g; let m;
    if(!/addRow\(/.test(t)) throw new Error("no es una carpeta");
    while((m=re.exec(t))){ try{ const a=JSON.parse("["+m[1]+"]"); if(a[0]==="."||a[0]==="..") continue;
      let n=a[0]; try{ n=decodeURIComponent(String(a[1]).replace(/\/$/,""))||a[0]; }catch(e){}
      out.push({name:n,url:a[1],dir:!!a[2],size:a[3],mod:(a[5]||0)*1000}); }catch(e){} }
    return out;
  }
  function rutaLegible(url){   // file:///C:/Users/x/OneDrive%20-%20MA/Legal/ → C:\Users\x\OneDrive - MA\Legal
    try{ const p=decodeURIComponent(String(url).replace(/^file:\/\/\/?/,"")).replace(/\/+$/,""); return /^[a-z]:/i.test(p)?p.replace(/\//g,"\\"):"/"+p; }catch(e){ return url; } }
  function dirLocal(url,name){
    return {kind:"directory",name,auto:"local",ruta:rutaLegible(url),
      async *entries(){ for(const e of await listarLocal(url)){
        if(e.dir){ let u=url+e.url; if(!u.endsWith("/")) u+="/"; yield [e.name,dirLocal(u,e.name)]; } else yield [e.name,fileLocal(url+e.url,e)]; } },
      async getDirectoryHandle(n){ const e=(await listarLocal(url)).find(x=>x.dir&&x.name===n); if(!e){ const er=new Error("no existe"); er.name="NotFoundError"; throw er; } let u=url+e.url; if(!u.endsWith("/")) u+="/"; return dirLocal(u,n); },
      async getFileHandle(n,o){ const e=(await listarLocal(url)).find(x=>!x.dir&&x.name===n); if(!e||(o&&o.create&&!e)){ const er=new Error(o&&o.create?"Con el acceso directo la carpeta es solo de lectura. Para guardar, abre el dashboard en línea.":"no existe"); er.name=o&&o.create?"NotAllowedError":"NotFoundError"; throw er; } const f=fileLocal(url+e.url,e); f.createWritable=async()=>{ throw new Error("Con el acceso directo la carpeta es solo de lectura. Para guardar, abre el dashboard en línea."); }; return f; },
      async queryPermission(o){ return o&&o.mode==="readwrite"?"denied":"granted"; }, async requestPermission(o){ return o&&o.mode==="readwrite"?"denied":"granted"; }};
  }
  const fileLocal=(u,e)=>({kind:"file",name:e.name,meta:{mod:e.mod,size:e.size},async getFile(){ return new File([await xhr(u,"arraybuffer")],e.name,{lastModified:e.mod}); }});
  async function fuenteLocal(nombre,o){
    if(location.protocol!=="file:") return null;
    const base=location.href.replace(/[?#].*$/,"").replace(/[^/]*$/,"");
    const actual=decodeURIComponent(base.split("/").filter(Boolean).pop()||"");
    try{
      if(nombresDe(nombre).includes(norm(actual))){ await listarLocal(base); return dirLocal(base,actual); }     // la página está dentro de la carpeta del módulo
      const hijos=await listarLocal(base); const h=hijos.find(e=>e.dir&&nombresDe(nombre).includes(norm(e.name)));     // la carpeta está al lado de la página
      if(h){ let u=base+h.url; if(!u.endsWith("/")) u+="/"; return dirLocal(u,h.name); }
    }catch(e){ return null; }   // sin el permiso del acceso directo no se puede buscar nada
    // no está al lado: ¿está junto a la carpeta de otro módulo ya encontrada?
    const todas=cacheRutas();
    for(const k of Object.keys(todas)){ if(k===nombre||!todas[k].url) continue; try{ const pd=padreDe(todas[k].url);
      const e=(await listarLocal(pd)).find(x=>x.dir&&nombresDe(nombre).includes(norm(x.name))); if(!e) continue; const u=hijo(pd,e);
      if(!(await listarLocal(u)).some(x=>x.dir&&esAnioN(x.name))) continue;
      if(!todas[nombre]||todas[nombre].url!==u){ todas[nombre]={url:u,name:e.name,ruta:rutaLegible(u),t:Date.now()}; guardarRutas(todas); }
      return dirLocal(u,e.name); }catch(_){} }
    // si no, la ruta recordada o se busca sola en OneDrive (ver detector abajo)
    const c=todas[nombre];
    if(c&&c.url){ try{ await listarLocal(c.url); return dirLocal(c.url,c.name); }catch(e){}   // ruta recordada, sigue en su sitio
      const x=cacheRutas(); delete x[nombre]; guardarRutas(x); }                                          // se movió: se olvida y se busca otra vez
    const r=await Promise.race([detectarRutas(nombre,o&&o.gesto),new Promise(ok=>setTimeout(()=>ok({}),MAX_ESPERA))]); const f=r[nombre];
    return f?dirLocal(f.url,f.name):null;
  }

  /* ---------- 1b) detector automático de rutas (solo con el acceso directo) ----------
     Si la carpeta del módulo no está al lado de la página, la busca sola dentro de las carpetas de OneDrive
     de la PC: "OneDrive", "OneDrive - <empresa>" y las bibliotecas de SharePoint sincronizadas en la carpeta
     del usuario de Windows. No inicia sesión ni pide elegir carpeta. Recuerda la ruta encontrada y, si la
     carpeta se mueve dentro de OneDrive, la vuelve a encontrar sola en la siguiente apertura.
     Solo cuenta una carpeta con el nombre del módulo que tenga adentro carpetas de año (2026…); si hay varias,
     prefiere la que está junto a las otras carpetas del dashboard. */
  const MODULOS={PruebaDashboard:["PruebaDashboard","Pantera"],Contabilidad:["Contabilidad"],Legal:["Legal"]};
  const norm=s=>String(s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim().toLowerCase();
  const nombresDe=n=>(MODULOS[n]||[n]).map(norm);
  const RKEY="ma_rutas_detectadas_v1", NOHAY_MS=3*60*1000, MAX_LISTAS=2000, MAX_MS=12000, MAX_ESPERA=20000;
  const NO_ENTRAR=new Set(["appdata","application data","local settings","cookies","nethood","printhood","recent","sendto","start menu",
    "templates","menu inicio","plantillas","entorno de red","impresoras","reciente","saved games","searches","contacts","links","favorites",
    "3d objects","music","videos","pictures","musica","imagenes","juegos guardados","busquedas","contactos","vinculos","favoritos",
    "objetos 3d","node_modules","windows","program files","program files (x86)","programdata","system volume information","snap"]);
  const noEntrar=n=>{ const k=norm(n); return !k||/^[.$~]/.test(k)||NO_ENTRAR.has(k); };
  const esAnioN=n=>/^(19|20)\d\d$/.test(String(n).trim());
  const cacheRutas=()=>{ try{ return JSON.parse(localStorage.getItem(RKEY)||"{}")||{}; }catch(e){ return {}; } };
  const guardarRutas=x=>{ try{ localStorage.setItem(RKEY,JSON.stringify(x)); }catch(e){} };
  const hijo=(u,e)=>{ let s=u+e.url; if(!s.endsWith("/")) s+="/"; return s; };
  const padreDe=u=>u.replace(/[^/]+\/$/,"");
  const DETECCION={};
  function detectarRutas(objetivo,gesto){
    const c=cacheRutas()[objetivo];
    if(!gesto&&c&&c.nohay&&Date.now()-c.nohay<NOHAY_MS) return Promise.resolve({});   // se buscó hace poco y no existe
    return DETECCION[objetivo]||(DETECCION[objetivo]=buscarRutas(objetivo).catch(()=>({})).finally(()=>{ setTimeout(()=>{ delete DETECCION[objetivo]; },2000); }));
  }
  function avisoBusqueda(t){ try{ const el=document.getElementById("hdrSub")||document.getElementById("fname"); if(el) el.textContent=t; }catch(e){} }
  async function buscarRutas(objetivo){
    const t0=Date.now(); let listas=0; const memo=new Map(), prof=new Map(), cand=[];
    const listar=u=>{ if(memo.has(u)) return memo.get(u); if(listas>=MAX_LISTAS||Date.now()-t0>MAX_MS) return Promise.resolve(null);
      listas++; if(listas%20===1) avisoBusqueda("Buscando la carpeta "+objetivo+" en OneDrive… ("+listas+" carpetas revisadas)");
      const r=listarLocal(u).catch(()=>null); memo.set(u,r); return r; };
    // dónde buscar: la carpeta del usuario de Windows (C:\Users\<usuario>) a partir de la ruta del acceso directo
    const base=location.href.replace(/[?#].*$/,"").replace(/[^/]*$/,"");
    const m=base.match(/^(file:\/\/\/(?:[A-Za-z]:\/)?)(.*)$/)||["","file:///",""]; const pre=m[1], segs=m[2].split("/").filter(Boolean);
    const iu=segs.findIndex(s=>/^(users|home|usuarios)$/i.test(decodeURIComponent(s)));
    let casas=[];
    if(iu>=0&&segs.length>iu+1) casas=[pre+segs.slice(0,iu+2).join("/")+"/"];
    else for(const d of ["Users/","home/"]){ const l=await listar(pre+d); if(l) for(const e of l) if(e.dir&&!/^(public|default|default user|all users|defaultapppool)$/i.test(e.name)) casas.push(hijo(pre+d,e)); }
    // 1) alrededor del acceso directo  2) carpetas OneDrive  3) el resto de la carpeta del usuario (SharePoint sincronizado, Escritorio, Documentos)
    const fases=[[],[],[]];
    const dentroDeCasa=u=>casas.some(h=>u.startsWith(h)&&u!==h);
    let a=padreDe(base);
    if(casas.some(h=>base.startsWith(h))) for(let i=0;i<3&&dentroDeCasa(a);i++){ fases[0].push({u:a,p:2}); a=padreDe(a); }
    else { fases[0].push({u:base,p:4}); for(let i=0;i<3&&a.length>pre.length;i++){ fases[0].push({u:a,p:4}); a=padreDe(a); } }   // OneDrive en otro disco (D:\OneDrive…)
    for(const h of casas){ const l=await listar(h); if(!l) continue;
      for(const e of l) if(e.dir&&!noEntrar(e.name)) fases[/^onedrive/i.test(e.name)?1:2].push({u:hijo(h,e),p:/^onedrive/i.test(e.name)?6:4,n:e.name}); }
    // se deja de buscar cuando aparecen las tres carpetas juntas (en la misma carpeta)
    const listo=()=>cand.some(x=>x.mod===objetivo)||cand.some(x=>Object.keys(MODULOS).every(n=>cand.some(y=>y.mod===n&&y.padre===x.padre)));
    for(const fase of fases){
      let nivel=fase.slice();
      while(nivel.length){ const sig=[];
        for(let i=0;i<nivel.length;i+=8){
          await Promise.all(nivel.slice(i,i+8).map(async q=>{ if((prof.has(q.u)?prof.get(q.u):-1)>=q.p) return; prof.set(q.u,q.p);
            const l=await listar(q.u); if(!l) return;
            for(const e of l){ if(!e.dir||noEntrar(e.name)) continue; const u=hijo(q.u,e);
              const mod=Object.keys(MODULOS).find(n=>nombresDe(n).includes(norm(e.name)));
              if(mod){ if(!cand.some(x=>x.url===u)){ const dentro=await listar(u); if(dentro&&dentro.some(x=>x.dir&&esAnioN(x.name))&&!cand.some(x=>x.url===u)) cand.push({mod,url:u,name:e.name,padre:q.u,anios:dentro.some(x=>x.dir&&esAnioN(x.name)),orden:cand.length}); } continue; }
              if(q.p>1&&!esAnioN(e.name)) sig.push({u,p:q.p-1}); } })); }
        nivel=sig; if(listo()) break; }
      if(listo()) break;
    }
    // elegir: con carpetas de año > junto a otras carpetas del dashboard > la que se encontró primero
    const res={}, c=cacheRutas();
    for(const n of Object.keys(MODULOS)){
      const lista=cand.filter(x=>x.mod===n).map(x=>({...x,junto:new Set(cand.filter(y=>y.padre===x.padre&&y.mod!==n&&y.anios).map(y=>y.mod)).size}));
      lista.sort((p,q)=>(q.anios-p.anios)||(q.junto-p.junto)||(p.orden-q.orden));
      if(lista[0]){ res[n]={url:lista[0].url,name:lista[0].name}; c[n]={url:lista[0].url,name:lista[0].name,ruta:rutaLegible(lista[0].url),t:Date.now()}; }
      else if(n===objetivo&&!(c[n]&&c[n].url)) c[n]={nohay:Date.now()};
    }
    guardarRutas(c);
    try{ console.info("[Dashboard M&A] rutas detectadas en "+(Date.now()-t0)+" ms ("+listas+" carpetas revisadas):",Object.fromEntries(Object.entries(res).map(([k,v])=>[k,rutaLegible(v.url)]))); }catch(e){}
    return res;
  }

  /* ---------- 1c) programa local "Dashboard M&A" (http://localhost:8765) ----------
     Cuando el dashboard se abre desde el programa instalado en la PC, el programa entrega las carpetas
     de OneDrive (las encuentra solo) para leer y guardar, sin que Chrome pida permisos. */
  const SRV=location.protocol==="http:"&&/^(localhost|127\.0\.0\.1)$/.test(location.hostname);
  const qs=(m,p)=>"m="+encodeURIComponent(m)+"&p="+encodeURIComponent(p||"");
  async function srv(ruta,op){ const r=await fetch("/__ma/"+ruta,Object.assign({cache:"no-store"},op||{}));
    if(r.status===404){ const e=new Error("no existe"); e.name="NotFoundError"; throw e; }
    if(!r.ok){ let m=r.statusText; try{ m=(await r.json()).error||m; }catch(_){} throw new Error(m); }
    return r; }
  function dirSrv(mod,rel,name,ruta){
    const hijo=n=>rel?rel+"/"+n:n;
    const lista=async()=>(await (await srv("listar?"+qs(mod,rel))).json());
    const h={kind:"directory",name,auto:"servidor",ruta,
      async *entries(){ for(const e of await lista()){ if(e.n.startsWith("~$")||e.n.endsWith(".ma-guardando")) continue;
        yield [e.n, e.d?dirSrv(mod,hijo(e.n),e.n,ruta+"\\"+e.n):fileSrv(mod,hijo(e.n),e)]; } },
      async *keys(){ for await (const [k] of h.entries()) yield k; },
      async *values(){ for await (const [,v] of h.entries()) yield v; },
      async getDirectoryHandle(n,o){ const e=(await lista()).find(x=>x.d&&x.n===n);

<script>
/* ===== Consolidado de Excel conservando el formato =====
   Copia cada hoja tal como está en el Excel original: anchos de columna, alto de filas, fuentes,
   colores, bordes, formato de números, celdas combinadas y paneles fijos. Las fórmulas se pasan
   con su valor (para que no queden apuntando a otros libros). Agrega una hoja "Índice" con enlaces.
   lista: [{nombre, carpeta, getFile:async()=>File}] */
(function(){
  let P=null;
  const cargar=()=>window.ExcelJS?Promise.resolve(window.ExcelJS):(P=P||new Promise((ok,no)=>{ const s=document.createElement("script"); s.src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"; s.onload=()=>ok(window.ExcelJS); s.onerror=()=>no(new Error("No se pudo cargar el armador de Excel (revisa internet).")); document.head.appendChild(s); }));
  const limpio=s=>String(s).replace(/[\\/?*[\]:]/g," ").replace(/\s+/g," ").trim();
  const valor=v=>{ if(v&&typeof v==="object"&&!(v instanceof Date)){ if("formula" in v||"sharedFormula" in v) return v.result===undefined?null:(v.result&&typeof v.result==="object"&&v.result.error?null:v.result); } return v; };
  const copia=o=>o?JSON.parse(JSON.stringify(o)):o;
  window.MA.consolidarExcel=async(lista,nombreSalida,titulo,progreso)=>{
    const ExcelJS=await cargar(); const out=new ExcelJS.Workbook(); out.creator="M&A Capital · Dashboard";
    const ind=out.addWorksheet("Índice",{views:[{showGridLines:false}]});
    const usados=new Set(["índice"]), filas=[], fallos=[]; let n=0;
    for(let k=0;k<lista.length;k++){ const it=lista[k]; progreso&&progreso(`Armando ${k+1} de ${lista.length}: ${it.nombre}`);
      try{
        let buf=await (await it.getFile()).arrayBuffer();
        const wbx=XLSX.read(buf,{type:"array"});   // valores guardados en el archivo (sirve para fórmulas cuyo resultado es 0)
        if(!/\.(xlsx|xlsm)$/i.test(it.nombre)) buf=XLSX.write(wbx,{bookType:"xlsx",type:"array"});   // .xls/.csv
        const src=new ExcelJS.Workbook(); await src.xlsx.load(buf);
        const hojas=src.worksheets.filter(w=>w.state!=="hidden"&&w.state!=="veryHidden"&&w.actualRowCount>0);
        const base=limpio(it.nombre.replace(/\.[^.]+$/,""));
        for(const ws of hojas){ n++;
          let nom=(String(n).padStart(2,"0")+" "+(hojas.length>1?base.slice(0,14).trim()+" · "+limpio(ws.name):base)).slice(0,31).trim(), i=2;
          while(usados.has(nom.toLowerCase())){ nom=nom.slice(0,28)+" "+(i++); } usados.add(nom.toLowerCase());
          const dst=out.addWorksheet(nom,{properties:copia(ws.properties),pageSetup:copia(ws.pageSetup),views:copia(ws.views)});
          if(ws.properties&&ws.properties.tabColor) dst.properties.tabColor=copia(ws.properties.tabColor);
          (ws.columns||[]).forEach((c,ci)=>{ const d=dst.getColumn(ci+1); if(c.width) d.width=c.width; if(c.hidden) d.hidden=true; if(c.style&&Object.keys(c.style).length) d.style=copia(c.style); });
          ws.eachRow({includeEmpty:true},(row,ri)=>{ const r=dst.getRow(ri); if(row.height) r.height=row.height; if(row.hidden) r.hidden=true;
            row.eachCell({includeEmpty:true},(cell,ci)=>{ const c=r.getCell(ci); let v=valor(cell.value);
              if((v===null||v===undefined)&&cell.value&&typeof cell.value==="object"&&("formula" in cell.value||"sharedFormula" in cell.value)){ const sx=wbx.Sheets[ws.name]&&wbx.Sheets[ws.name][cell.address]; if(sx&&sx.v!==undefined&&sx.t!=="e") v=sx.v; } if(v!==null&&v!==undefined) c.value=(v instanceof Date||typeof v!=="object")?v:copia(v); c.style=copia(cell.style)||{}; }); });
          ((ws.model&&ws.model.merges)||[]).forEach(m=>{ try{ dst.mergeCells(m); }catch(e){} });
          filas.push([it.carpeta||"",it.nombre,ws.name,nom]);
        }
      }catch(e){ fallos.push(it.nombre); }
    }
    // Índice
    ind.columns=[{width:6},{width:16},{width:58},{width:30},{width:34}];
    ind.mergeCells("A1:E1"); const t=ind.getCell("A1"); t.value=titulo||"Consolidado"; t.font={bold:true,size:16,color:{argb:"FF0F2440"}};
    ind.mergeCells("A2:E2"); ind.getCell("A2").value=`${filas.length} hoja(s) de ${lista.length-fallos.length} archivo(s) · generado ${new Date().toLocaleString("es-PA")}`; ind.getCell("A2").font={color:{argb:"FF8792A4"},size:10};
    const h=ind.getRow(4); ["#","Carpeta","Archivo original","Hoja original","Hoja en este libro"].forEach((x,i)=>{ const c=h.getCell(i+1); c.value=x; c.font={bold:true,color:{argb:"FFFFFFFF"}}; c.fill={type:"pattern",pattern:"solid",fgColor:{argb:"FF1B3A5C"}}; c.alignment={vertical:"middle"}; }); h.height=20;
    filas.forEach((f,i)=>{ const r=ind.getRow(5+i); r.getCell(1).value=i+1; r.getCell(2).value=f[0]; r.getCell(3).value=f[1]; r.getCell(4).value=f[2];
      r.getCell(5).value={text:f[3],hyperlink:"#'"+f[3].replace(/'/g,"''")+"'!A1"}; r.getCell(5).font={color:{argb:"FF1A3FBF"},underline:true};
      if(i%2) for(let c=1;c<=5;c++) r.getCell(c).fill={type:"pattern",pattern:"solid",fgColor:{argb:"FFF3F5F9"}}; });
    if(fallos.length){ const r=ind.getRow(6+filas.length); r.getCell(3).value="No se pudieron leer: "+fallos.join(", "); r.getCell(3).font={color:{argb:"FFB03A32"}}; }
    ind.views=[{state:"frozen",ySplit:4,showGridLines:false}];
    const blob=new Blob([await out.xlsx.writeBuffer()],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=nombreSalida; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),3000);
    return {hojas:filas.length,fallos};
  };
})();
</script>
<script>
/* ===== Instalar el dashboard como app (solo en línea, desde GitHub) =====
   Una app instalada guarda el permiso de las carpetas: después de darlo una vez, ya no vuelve a pedir "Abrir carpeta". */
(function(){
  if(!/^https:/.test(location.protocol)&&location.hostname!=="localhost") { window.MA.instalable=()=>false; window.MA.instalar=async()=>false; window.MA.esApp=()=>false; return; }
  const l=document.createElement("link"); l.rel="manifest"; l.href="manifest.webmanifest"; document.head.appendChild(l);
  try{ if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{}); }catch(e){}
  let ev=null; const avisar=()=>document.dispatchEvent(new CustomEvent("ma-instalable"));
  window.addEventListener("beforeinstallprompt",e=>{ e.preventDefault(); ev=e; avisar(); });
  window.addEventListener("appinstalled",()=>{ ev=null; avisar(); });
  window.MA.esApp=()=>{ try{ return matchMedia("(display-mode: standalone)").matches||matchMedia("(display-mode: window-controls-overlay)").matches; }catch(e){ return false; } };
  window.MA.instalable=()=>!!ev;
  window.MA.instalar=async()=>{ if(!ev) return false; ev.prompt(); const r=await ev.userChoice.catch(()=>({})); ev=null; avisar(); return r&&r.outcome==="accepted"; };
  // Botón en la cabecera común
  function boton(){ const der=document.getElementById("maExtra"); if(!der) return;
    let b=document.getElementById("maInstalar");
    if(!window.MA.instalable()){ if(b) b.remove(); return; }
    if(!b){ b=document.createElement("button"); b.id="maInstalar"; b.className="ma-hbtn"; b.title="Instalar el dashboard como app: así no vuelve a pedir la carpeta"; b.textContent="⬇ Instalar app"; b.onclick=()=>window.MA.instalar(); der.appendChild(b); } }
  document.addEventListener("ma-instalable",boton); setTimeout(boton,1500);
})();
</script>

st cache = CacheService.getScriptCache(), k = 'u_' + Utilities.base64Encode(Utilities.computeDigest(Utilities.DigestAlgorithm.SHA_256, token));\n  const c = cache.get(k); if (c) return JSON.parse(c);\n  const res = UrlFetchApp.fetch(SB_URL + '/auth/v1/user', { headers: { apikey: SB_ANON, Authorization: 'Bearer ' + token }, muteHttpExceptions: true });\n  if (res.getResponseCode() !== 200) throw new Error('La sesión venció: vuelve a entrar al dashboard.');\n  const u = { email: String(JSON.parse(res.getContentText()).email || '').toLowerCase() };\n  cache.put(k, JSON.stringify(u), 300);\n  return u;\n}\nfunction exigir_(yo, token, modulo) {\n  const cache = CacheService.getScriptCache(), k = 'm_' + modulo + '_' + yo.email;\n  if (cache.get(k) === '1') return;\n  const res = UrlFetchApp.fetch(SB_URL + '/rest/v1/rpc/ma_tiene_modulo', { method: 'post', contentType: 'application/json',\n    payload: JSON.stringify({ p_modulo: modulo }), headers: { apikey: SB_ANON, Authorization: 'Bearer ' + token }, muteHttpExceptions: true });\n  if (res.getResponseCode() !== 200 || res.getContentText().trim() !== 'true') throw new Error('Tu usuario no tiene acceso a este módulo.');\n  cache.put(k, '1', 300);\n}\n\n/* ---------------- hoja ---------------- */\nfunction prepararHoja_() {\n  const ss = SpreadsheetApp.getActive();\n  Object.keys(TABLAS).forEach(n => {\n    let h = ss.getSheetByName(n);\n    if (!h) { h = ss.insertSheet(n); h.getRange(1, 1, 1, TABLAS[n].length).setValues([TABLAS[n]]).setFontWeight('bold').setBackground('#1b3a5c').setFontColor('#ffffff'); h.setFrozenRows(1); return; }\n    const cab = h.getLastColumn() ? h.getRange(1, 1, 1, h.getLastColumn()).getValues()[0].map(String) : [];\n    const faltan = TABLAS[n].filter(c => cab.indexOf(c) < 0);\n    if (faltan.length) h.getRange(1, cab.length + 1, 1, faltan.length).setValues([faltan]).setFontWeight('bold').setBackground('#1b3a5c').setFontColor('#ffffff');\n  });\n  const hoja1 = ss.getSheetByName('Hoja 1') || ss.get urn true;\n  } finally { lock.releaseLock(); }\n}\nconst ahora_ = () => Utilities.formatDate(new Date(), zona_(), \"yyyy-MM-dd'T'HH:mm:ss\");\nfunction anotar_(yo, t, cambio) {\n  SpreadsheetApp.getActive().getSheetByName('Historial').appendRow([ahora_(), yo.email, t.id, t.titulo, cambio]);\n}\nfunction mover_(fecha, rec) {\n  if (!fecha) return '';\n  const d = new Date(String(fecha).slice(0, 10) + 'T12:00:00');\n  if (rec === 'Semanal') d.setDate(d.getDate() + 7);\n  else if (rec === 'Quincenal') d.setDate(d.getDate() + 14);\n  else if (rec === 'Mensual') d.setMonth(d.getMonth() + 1);\n  else if (rec === 'Trimestral') d.setMonth(d.getMonth() + 3);\n  else return fecha;\n  return Utilities.formatDate(d, zona_(), 'yyyy-MM-dd');\n}\n\n/* ---------------- Bitácora Ejecutiva ---------------- */\nfunction bitacora_(accion, b, yo) {\n  if (accion === 'listar') return { tareas: leer_('Tareas'), notas: leer_('Notas'), comentarios: leer_('Comentarios'), historial: leer_('Historial').slice(-400), hoja: SpreadsheetApp.getActive().getUrl() };\n  if (accion === 'guardarTarea') {\n    const t = Object.assign({}, b.tarea || {});\n    if (!t.titulo) throw new Error('La tarea necesita un título.');\n    const antes = t.id ? leer_('Tareas').filter(x => String(x.id) === String(t.id))[0] : null;\n    // la página manda su propio id: si Google reintenta el pedido, se actualiza la misma fila (nunca duplica)\n    if (!t.id) t.id = Utilities.getUuid();\n    if (antes) { if (!t.creado) t.creado = antes.creado; if (!t.creado_por) t.creado_por = antes.creado_por; }\n    else if (!t.creado) { t.creado = ahora_(); t.creado_por = yo.email; }\n    t.actualizado = ahora_(); t.actualizado_por = yo.email;\n    if (t.estado === 'Hecha' && !t.cerrado) t.cerrado = ahora_().slice(0, 10);\n    if (t.estado !== 'Hecha') t.cerrado = '';\n    guardar_('Tareas', t);\n    if (!antes) anotar_(yo, t, 'Creó la tarea');\n    else {\n      if (antes.estado !== t.estado) anotar_(yo, t, 'Estado: ' + (antes.estado || '—') + ' → ' + t.estado + (t.estado === 'Bloqueada' && t.obstaculo ? ' (' + t.obstaculo + ')' : ''));\n      if (String(antes.responsable || '') !== String(t.responsable || '')) anotar_(yo, t, 'Responsable: ' + (t.responsable || '—'));\n      if (String(antes.aprobacion || '') !== String(t.aprobacion || '') && t.aprobacion) anotar_(yo, t, 'Aprobación: ' + t.aprobacion);\n    }\n    // tarea recurrente: al cerrarla se crea la siguiente\n    let siguiente = null;\n    if (t.estado === 'Hecha' && (!antes || antes.estado !== 'Hecha') && t.recurrencia && t.recurrencia !== 'No') {\n      siguiente = Object.assign({}, t, { id: Utilities.getUuid(), estado: 'Pendiente', avance: 0, cerrado: '', obstaculo: '', impacto: '', aprobacion: t.aprobador ? 'Pendiente' : '',\n        inicio: mover_(t.inicio, t.recurrencia), limite: mover_(t.limite, t.recurrencia), creado: ahora_(), creado_por: yo.email });\n      guardar_('Tareas', siguiente); anotar_(yo, siguiente, 'Creada automáticamente (' + t.recurrencia.toLowerCase() + ')');\n    }\n    return siguiente ? Object.assign({}, t, { _siguiente: siguiente }) : t;\n  }\n  if (accion === 'comentar') {\n    if (!b.tarea_id || !String(b.texto || '').trim()) throw new Error('Escribe el comentario.');\n    return guardar_('Comentarios', { id: b.id || Utilities.getUuid(), tarea_id: b.tarea_id, texto: String(b.texto).trim(), autor: yo.email, creado: ahora_() });\n  }\n  if (accion === 'borrarComentario') return borrar_('Comentarios', b.id);\n  if (accion === 'borrarTarea') return borrar_('Tareas', b.id);\n  if (accion === 'guardarNota') {\n    const n = Object.assign({}, b.nota || {});\n    if (!n.id) n.id = Utilities.getUuid();\n    const ya = leer_('Notas').filter(x => String(x.id) === String(n.id))[0];\n    if (ya) { if (!n.creado) n.creado = ya.creado; if (!n.autor) n.autor = ya.autor; }\n    if (!n.creado) n.creado = ahora_();\n    if (!n.autor) n.autor = yo.email;\n    n.actualizado = ahora_();\n    return guardar_('Notas', n);\n  }\n  if (accion === 'borrarNota') return borrar_('Notas', b.id);\n  throw new Error('Acción desconocida');\n}\n\n/* ---------------- Tablero de Notas ---------------- */\nfunction notas_(accion, b, yo) {\n  if (accion === 'listar') return { notas: leer_('Notas'), tareas: leer_('Tareas').filter(t => t.estado !== 'Hecha').map(t => ({ id: t.id, titulo: t.titulo })), hoja: SpreadsheetApp.getActive().getUrl() };\n  if (accion === 'guardar') return bitacora_('guardarNota', b, yo);\n  if (accion === 'crearTarea') return bitacora_('guardarTarea', { tarea: b.tarea }, yo);   // «convertir en tarea» y pendientes del acta\n  if (accion === 'borrar') return borrar_('Notas', b.id);\n  throw new Error('Acción desconocida');\n}\n\n/* ---------------- Pulso Comercial ---------------- */\nfunction ventas_(accion, b, yo) {\n  if (accion === 'datos') return { ventas: leer_('Ventas'), gastos: leer_('Gastos'), stock: leer_('Stock'), hoja: SpreadsheetApp.getActive().getUrl() };\n  throw new Error('Acción desconocida');\n}\n\n/* ---------------- correo de cada mañana (opcional) ---------------- */\nfunction instalarAvisoDiario() {\n  ScriptApp.getProjectTriggers().filter(t => t.getHandlerFunction() === 'avisoDiario').forEach(t => ScriptApp.deleteTrigger(t));\n  ScriptApp.newTrigger('avisoDiario').timeBased().everyDays(1).atHour(7).create();\n}\nfunction avisoDiario() {\n  prepararHoja_();\n  const hoy = Utilities.formatDate(new Date(), zona_(), 'yyyy-MM-dd');\n  const abiertas = leer_('Tareas').filter(t => t.estado !== 'Hecha' && String(t.responsable || '').indexOf('@') > 0);\n  const porPersona = {}, aprobar = {}, recordar = {};\n  abiertas.forEach(t => { const l = String(t.limite || ''); if ((l && l <= hoy) || t.estado === 'Bloqueada') (porPersona[t.responsable] = porPersona[t.responsable] || []).push(t); });\n  leer_('Tareas').forEach(t => { if (t.aprobacion === 'Pendiente' && String(t.aprobador || '').indexOf('@') > 0) (aprobar[t.aprobador] = aprobar[t.aprobador] || []).push(t); });\n  leer_('Notas').forEach(n => { if (String(n.recordar || '').slice(0, 10) === hoy && String(n.autor || '').indexOf('@') > 0) (recordar[n.autor] = recordar[n.autor] || []).push(n); });\n  Object.keys(aprobar).concat(Object.keys(recordar)).forEach(e => { porPersona[e] = porPersona[e] || []; });\n  Object.keys(porPersona).forEach(email => {\n    const ts = porPersona[email].sort((a, b) => String(a.limite).localeCompare(String(b.limite)));\n    const extra = (aprobar[email] || []).map(t => `<li>Por aprobar: <b>${t.titulo}<\/b>${t.responsable ? ' (' + t.responsable + ')' : ''}<\/li>`).join('') +\n      (recordar[email] || []).map(n => `<li>Recordatorio: <b>${n.titulo || ''}<\/b> ${n.texto || ''}<\/li>`).join('');\n    const filas = ts.map(t => `<tr><td style=\"padding:6px 10px;border-bottom:1px solid #eee\"><b>${t.titulo}<\/b>${t.proyecto ? '<br><span style=\"color:#888\">' + t.proyecto + '<\/span>' : ''}<\/td>\n      <td style=\"padding:6px 10px;border-bottom:1px solid #eee\">${t.limite || '—'}<\/td><td style=\"padding:6px 10px;border-bottom:1px solid #eee\">${t.estado === 'Bloqueada' ? 'Bloqueada: ' + (t.obstaculo || '') : (t.limite < hoy ? 'Vencida' : 'Vence hoy')}<\/td><\/tr>`).join('');\n    MailApp.sendEmail({ to: email, subject: `Bitácora Ejecutiva · pendientes de hoy`,\n      htmlBody: `<div style=\"font-family:Arial,sans-serif;color:#0f1c2e\"><h2 style=\"color:#1b3a5c;margin:0 0 8px\">Buenos días<\/h2>${ts.length ? '<p>Estas tareas están vencidas, vencen hoy o están bloqueadas:<\/p>' : ''}\n        <table style=\"border-collapse:collapse;font-size:14px\">${filas}<\/table>${extra ? '<ul style=\"font-size:14px\">' + extra + '<\/ul>' : ''}<p style=\"color:#888;font-size:12px\">M&amp;A Capital · Bitácora Ejecutiva<\/p><\/div>` });\n  });\n}\n\n/* ---------------- datos de ejemplo (opcional) ----------------\n * cargarEjemplo: llena Ventas, Gastos y Stock (últimos 22 meses, para comparar año contra año), Tareas, Notas, Comentarios e\n * Historial con datos INVENTADOS para   function avisoDemo(el,salir){ const d=document.createElement("div"); d.className="gs-demo"; d.innerHTML=`<span>👁 <b>Datos de ejemplo</b> (inventados, solo para mostrar cómo funciona). Los cambios no se guardan.</span><button class="gs-b alt" type="button">Conectar la Hoja de Google</button>`; d.querySelector("button").onclick=salir; el.prepend(d); }
  // id propio para lo nuevo: si Google reintenta, se actualiza la misma fila y nunca se duplica
  const id=()=>{ try{ return crypto.randomUUID(); }catch(e){ return "id-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,10); } };
  // aviso flotante «Actualizando…»
  let nAct=0; function actualizando(si){ nAct=Math.max(0,nAct+(si?1:-1)); let d=document.getElementById("gsAct");
    if(!d){ d=document.createElement("div"); d.id="gsAct"; d.style.cssText="position:fixed;left:18px;bottom:18px;z-index:85;background:#0f2440;color:#fff;border-radius:999px;padding:7px 14px;font:600 12.5px Inter,system-ui,sans-serif;box-shadow:0 6px 18px rgba(15,23,42,.25);display:none"; d.textContent="↻ Actualizando con la Hoja de Google…"; document.body.appendChild(d); }
    d.style.display=nAct?"block":"none"; }
  // carga instantánea: muestra lo último que se vio en esta pestaña y lo actualiza por detrás
  async function conCache(accion,alLlegar){
    const c=await MA.listo, k="gsc_"+String(c.email||"").toLowerCase()+"_"+accion; let tenia=false;
    try{ const v=sessionStorage.getItem(k); if(v){ tenia=true; alLlegar(JSON.parse(v),true); } }catch(e){}
    actualizando(true);
    try{ const d=await llamar(accion); try{ sessionStorage.setItem(k,JSON.stringify(d)); }catch(e){} alLlegar(d,false); return d; }
    catch(e){ e.tenia=tenia; throw e; }
    finally{ actualizando(false); }
  }
  function olvidar(){ try{ Object.keys(sessionStorage).filter(k=>k.startsWith("gsc_")).forEach(k=>sessionStorage.removeItem(k)); }catch(e){} }
  return {url,llamar,pantalla,avisoDemo,fija:!!FIJA,desconectar:()=>ls.set(K,""),id,conCache,actualizando,olvidar};
})();
</script>

<script>MA.iniciar({modulo:"notas",titulo:"Tablero de Notas"});</script>
<div class="wrap">
  <header class="hero">
    <div class="k">M&amp;A Capital · Gestión</div>
    <h1>Tablero de <i>Notas</i></h1>
    <div class="sub" id="heroSub">Ideas, acuerdos, pendientes y recordatorios del equipo</div>
    <div class="acc hidden" id="acc"><button class="hbtn" id="btnHoja">📗 Abrir la hoja</button><button class="hbtn" id="btnXls">⬇ Excel</button><button class="hbtn" id="btnRec" title="Volver a leer la hoja">↻</button><button class="hbtn" id="btnActa">📋 Acta de reunión</button><button class="hbtn pri" id="btnNueva">＋ Nueva nota</button></div>
  </header>
  <div id="app"><div class="vacio"><span class="spin"></span> Conectando…</div></div>
</div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const COLORES=["amarillo","rosa","verde","azul","lila","naranja"];
const BASE=["Ideas","Por hacer","Acuerdos","Recordatorios"];
const hoy=()=>{ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const dias=iso=>Math.round((Date.parse(String(iso).slice(0,10))-Date.parse(hoy()))/864e5);
const fCorta=iso=>iso?new Date(String(iso).slice(0,10)+"T12:00:00").toLocaleDateString("es-PA",{day:"numeric",month:"short"}):"";
const fLarga=iso=>iso?new Date(String(iso).slice(0,10)+"T12:00:00").toLocaleDateString("es-PA",{weekday:"long",day:"numeric",month:"long"}):"";
const nombre=s=>String(s||"").replace(/@.*/,"");
const etqs=n=>String(n.etiquetas||"").split(/[,;]+/).map(x=>x.trim()).filter(Boolean);
const fij=n=>String(n.fijada)==="true";
function toast(t,mal){ const d=document.createElement("div"); d.className="toast"+(mal?" bad":""); d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),mal?6000:2400); }
let RAPIDO="", N=[], TK=[], HOJA="", DEMO=false, YO="", VISTA="columnas", Q="", F={}, COLOR_R="amarillo";

/* ============================ datos ============================ */
async function cargar(){
  if(DEMO){ pintar(); return; }
  try{ await GS.conCache("notas.listar",r=>{ const pend=N.filter(x=>x._pend&&!(r.notas||[]).some(y=>y.id===x.id)); N=(r.notas||[]).concat(pend); TK=r.tareas||[]; HOJA=r.hoja||""; pintar(); }); }
  catch(e){ if(e.tenia){ toast("No se pudo actualizar: "+e.message+" (se muestra lo último que se vio)",true); return; } $("app").innerHTML=`<div class="card vacio"><b>No se pudo leer la Hoja de Google</b>${esc(e.message)}<br><br><button class="btn" id="reint">Reintentar</button> ${(await MA.listo).rol==="admin"&&!GS.fija?'<button class="btn" id="recon">Cambiar la URL</button>':""}</div>`;
    $("reint").onclick=cargar; if($("recon")) $("recon").onclick=()=>{ GS.desconectar(); arrancar(); }; }
}
async function guardar(n,silencio){
  n=Object.assign({},n); if(!n.tablero) n.tablero=BASE[0];
  if(DEMO){ if(!n.id){ n.id="n"+Date.now(); n.creado=new Date().toISOString(); n.autor="ejemplo"; } n.actualizado=new Date().toISOString(); const i=N.findIndex(x=>x.id===n.id); i>=0?N[i]=n:N.push(n); pintar(); return true; }
  const prev=N.slice();
  if(!n.id){ n.id=GS.id(); N.push(Object.assign({},n,{_pend:true,autor:YO,creado:new Date().toISOString()})); pintar(); }   // id propio: se ve al instante y nunca se duplica
  else { const i=N.findIndex(x=>x.id===n.id); if(i>=0){ N[i]=n; pintar(); } }
  try{ const r=await GS.llamar("notas.guardar",{nota:Object.assign({},n,{_pend:undefined})}); const j=N.findIndex(x=>x.id===r.id); j>=0?N[j]=r:N.push(r); pintar(); if(!silencio) toast("Nota guardada"); return r; }
  catch(e){ N=prev; pintar(); toast("No se guardó la nota: "+e.message,true); return false; }
}
async function borrar(id){
  if(DEMO){ N=N.filter(x=>x.id!==id); pintar(); return; }
  try{ await GS.llamar("notas.borrar",{id}); N=N.filter(x=>x.id!==id); pintar(); }catch(e){ toast(e.message,true); }
}

/* ============================ filtros ============================ */
function visibles(){ const q=Q.trim().toLowerCase();
  return N.filter(n=>(!q||[n.titulo,n.texto,n.etiquetas,n.autor,n.tablero].join(" ").toLowerCase().includes(q))
    &&(!F.color||n.color===F.color)&&(!F.etq||etqs(n).includes(F.etq))&&(!F.mias||String(n.autor||"").toLowerCase()===YO)
    &&(!F.fijadas||fij(n))&&(!F.tk||n.tarea_id)&&(!F.rec||(n.recordar&&dias(n.recordar)<=0))); }
const ordenar=ns=>ns.slice().sort((a,b)=>fij(b)-fij(a)||(+a.orden||0)-(+b.orden||0)||String(b.actualizado||b.creado||"").localeCompare(String(a.actualizado||a.creado||"")));
const tableros=()=>[...new Set(BASE.concat(N.map(n=>n.tablero).filter(Boolean)))];

/* ============================ pantalla ============================ */
function pintar(){
  { const rt=$("rTxt"); if(rt&&rt.value.trim()) RAPIDO=rt.value; }
  $("acc").classList.remove("hidden"); $("btnHoja").classList.toggle("hidden",DEMO||!HOJA);
  const vs=visibles(), recHoy=N.filter(n=>n.recordar&&dias(n.recordar)<=0).length, prox=N.filter(n=>n.recordar&&dias(n.recordar)>0&&dias(n.recordar)<=7).length;
  const ck=N.reduce((a,n)=>{ const m=String(n.texto||"").match(/^\s*\[( |x|X)\]/gm)||[]; a.t+=m.length; a.h+=m.filter(x=>/x/i.test(x)).length; return a; },{t:0,h:0});
  const filtros=[F.color&&["color","Color: "+F.color],F.etq&&["etq","#"+F.etq],F.mias&&["mias","Solo mías"],F.fijadas&&["fijadas","Fijadas"],F.rec&&["rec","Recordatorios de hoy o atrasados"],F.tk&&["tk","Ligadas a tareas"]].filter(Boolean);
  $("app").innerHTML=`
    <div class="ctrl">
      <input class="inp grow" id="q" placeholder="Buscar en notas, etiquetas, autor…" value="${esc(Q)}">
      <div class="chips">${COLORES.map(c=>`<button class="chip" data-col="${c}" aria-pressed="${F.color===c}" title="Solo ${c}"><span class="pt n-${c}" style="display:inline-block;width:14px;height:14px;vertical-align:middle;border:1px solid rgba(0,0,0,.1)"></span></button>`).join("")}</div>
      <div class="chips"><button class="chip" data-tg="mias" aria-pressed="${!!F.mias}">Mías</button><button class="chip" data-tg="fijadas" aria-pressed="${!!F.fijadas}">📌 Fijadas</button></div>
      ${filtros.map(([k,l])=>`<span class="filtro">${esc(l)}<button data-qf="${k}" title="Quitar filtro">✕</button></span>`).join("")}
    </div>
    <div class="kpis">
      <div class="kpi" data-k="todo"><div class="l">Notas</div><div class="v">${N.length}</div><div class="d">${vs.length} en la vista</div></div>
      <div class="kpi" data-k="fijadas"><div class="l">Fijadas</div><div class="v">${N.filter(fij).length}</div><div class="d">siempre arriba</div></div>
      <div class="kpi ${recHoy?"bad":""}" data-k="rec"><div class="l">Recordatorios hoy</div><div class="v">${recHoy}</div><div class="d">de hoy o atrasados · ${prox} en 7 días</div></div>
      <div class="kpi ok" data-k="ck"><div class="l">Casillas hechas</div><div class="v">${ck.t?Math.round(100*ck.h/ck.t)+"%":"—"}</div><div class="d">${ck.h} de ${ck.t} pendientes marcados</div></div>
      <div class="kpi" data-k="tk"><div class="l">Ligadas a tareas</div><div class="v">${N.filter(n=>n.tarea_id).length}</div><div class="d">de la Bitácora Ejecutiva</div></div>
    </div>
    <div class="rapida"><textarea id="rTxt" placeholder="✍ Nota rápida… (Enter para guardar · Shift+Enter nueva línea · empieza una línea con [ ] para hacer una casilla)"></textarea>
      <div class="op"><select class="inp" id="rTab" style="padding:7px 9px">${tableros().map(t=>`<option>${esc(t)}</option>`).join("")}</select>
        ${COLORES.map(c=>`<button class="pt n-${c}" data-rc="${c}" aria-pressed="${COLOR_R===c}" title="${c}"></button>`).join("")}<button class="btn pri sm" id="rOk">Agregar</button><button class="btn sm" id="rLista" title="Nueva nota con casillas">☑ Lista</button><button class="btn sm" id="rActa" title="Acta de reunión lista para llenar">📋 Acta</button></div></div>
    <div class="tabs">${[["columnas","🗂 Columnas"],["muro","🧱 Muro"],["agenda","⏰ Recordatorios"],["guia","💡 Guía y prompt"]].map(([k,l])=>`<button class="tab" data-v="${k}" aria-selected="${VISTA===k}">${l}</button>`).join("")}</div>
    <div id="vista"></div>`;
  if(DEMO) GS.avisoDemo($("app"),()=>{ DEMO=false; arrancar(); });
  { const nEj=N.filter(n=>/^ej-/.test(n.id)).length; if(!DEMO&&nEj){ const w=document.createElement("div"); w.className="gs-demo"; w.innerHTML=`<span>👁 La hoja tiene <b>${nEj} registro(s) de ejemplo</b> (los que dicen «(ejemplo)»): son inventados para ver cómo funciona. Para quitarlos, la administradora ejecuta <b>borrarEjemplos</b> en Apps Script (borra solo los ejemplos).</span>`; $("app").prepend(w); } }
  const A=$("app");
  A.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{ VISTA=b.dataset.v; pintar(); });
  A.querySelectorAll("[data-col]").forEach(b=>b.onclick=()=>{ F.color=F.color===b.dataset.col?"":b.dataset.col; if(!F.color) delete F.color; pintar(); });
  A.querySelectorAll("[data-tg]").forEach(b=>b.onclick=()=>{ F[b.dataset.tg]=!F[b.dataset.tg]; if(!F[b.dataset.tg]) delete F[b.dataset.tg]; pintar(); });
  A.querySelectorAll("[data-qf]").forEach(b=>b.onclick=()=>{ delete F[b.dataset.qf]; pintar(); });
  A.querySelectorAll("[data-k]").forEach(k=>k.onclick=()=>{ const v=k.dataset.k; if(v==="todo") F={}; else if(v==="fijadas") F.fijadas=true; else if(v==="rec"){ F.rec=true; } else if(v==="tk"){ F.tk=true; } pintar(); });
  A.querySelectorAll("[data-rc]").forEach(b=>b.onclick=()=>{ COLOR_R=b.dataset.rc; A.querySelectorAll("[data-rc]").forEach(x=>x.setAttribute("aria-pressed",x===b)); });
  $("q").oninput=e=>{ Q=e.target.value; clearTimeout(pintar.t); pintar.t=setTimeout(()=>{ pintar(); const i=$("q"); i.focus(); i.setSelectionRange(i.value.length,i.value.length); },250); };
  if(RAPIDO){ $("rTxt").value=RAPIDO; }
  const rapida=async()=>{ const t=$("rTxt").value.trim(); if(!t){ $("rTxt").focus(); $("rTxt").placeholder="✍ Primero escribe la nota aquí y luego pulsa Agregar"; toast("Escribe la nota primero",true); return; }
    const l=t.split("\n"); const tit=l.length>1&&l[0].length<=70?l.shift():""; RAPIDO=""; $("rTxt").value="";
    const ok=await guardar({titulo:tit,texto:l.join("\n"),color:COLOR_R,tablero:$("rTab").value,fijada:"false"}); if(ok===false){ RAPIDO=t; pintar(); } };
  $("rOk").onclick=rapida; $("rActa").onclick=()=>acta(); $("rLista").onclick=()=>editor({tablero:$("rTab").value,color:COLOR_R,titulo:$("rTxt").value.trim().split("\n")[0]},{lista:true}); $("rTxt").onkeydown=e=>{ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); rapida(); } };
  ({columnas:vColumnas,muro:vMuro,agenda:vAgenda,guia:vGuia})[VISTA](vs);
  $("heroSub").textContent=`${N.length} notas · ${tableros().length} columnas${recHoy?` · ${recHoy} recordatorio(s) para hoy`:""}${DEMO?" · datos de ejemplo":""}`;
}

/* ---------- una nota ---------- */
function cuerpo(n){
  const lineas=String(n.texto||"").split("\n"); let html="", hay=false;
  lineas.forEach((l,i)=>{ const m=l.match(/^\s*\[( |x|X)\]\s?(.*)$/); if(m){ hay=true; const h=/x/i.test(m[1]); html+=`<label class="ck${h?" hecho":""}" data-i="${i}"><input type="checkbox"${h?" checked":""}><span>${esc(m[2])}</span></label>`; } else html+=esc(l)+"\n"; });
  const m=String(n.texto||"").match(/^\s*\[( |x|X)\]/gm)||[], h=m.filter(x=>/x/i.test(x)).length;
  return `<div class="tx">${html.replace(/\n+$/,"")}</div>${hay?`<div class="pr" title="${h} de ${m.length}"><i style="width:${100*h/m.length}%"></i></div>${esActa(n)?"":`<div class="addck"><input placeholder="＋ agregar casilla (Enter)" data-addck></div>`}`:""}`;
}
function nota(n){
  const tk=n.tarea_id&&TK.find(t=>t.id===n.tarea_id), r=n.recordar?dias(n.recordar):null;
  return `<div class="nt n-${esc(COLORES.includes(n.color)?n.color:"amarillo")}${n._pend?" pend":""}" draggable="${n._pend?"false":"true"}" data-id="${esc(n.id)}">${n._pend?'<span class="guardando"><span class="spin"></span>Guardando…</span>':""}
    <button class="pin${fij(n)?" on":""}" data-pin title="${fij(n)?"Desfijar":"Fijar arriba"}">📌</button>
    ${n.titulo?`<h5>${esc(n.titulo)}</h5>`:""}${cuerpo(n)}
    <div class="pie">${n.recordar?`<span class="rec${r<0?" pas":r===0?" hoy":""}">⏰ ${r===0?"Hoy":fCorta(n.recordar)}</span>`:""}${tk?`<span title="Ligada a la tarea">🔗 ${esc(tk.titulo)}</span>`:""}
      ${etqs(n).map(x=>`<span class="etq" data-etq="${esc(x)}">#${esc(x)}</span>`).join("")}
      <span style="margin-left:auto">${esc(nombre(n.autor))}${n.actualizado||n.creado?" · "+fCorta(n.actualizado||n.creado):""}</span></div></div>`;
}
function enganchar(V){
  V.querySelectorAll(".nt").forEach(el=>{ const n=N.find(x=>x.id===el.dataset.id);
    const ad=el.querySelector("[data-addck]"); if(ad){ ad.onkeydown=e=>{ if(e.key!=="Enter") return; e.preventDefault(); const v=ad.value.trim(); if(!v) return;
        guardar(Object.assign({},n,{texto:String(n.texto||"").replace(/\s+$/,"")+"\n[ ] "+v}),true); };
      ad.onmousedown=e=>e.stopPropagation(); }
    el.onclick=e=>{ if(e.target.closest("[data-addck]")) return; const et=e.target.closest("[data-etq]"); if(et){ F.etq=et.dataset.etq; pintar(); return; }
      if(e.target.closest("[data-pin]")){ guardar(Object.assign({},n,{fijada:fij(n)?"false":"true"}),true); return; }
      const ck=e.target.closest(".ck"); if(ck){ e.preventDefault(); const ls=String(n.texto||"").split("\n"), i=+ck.dataset.i; ls[i]=ls[i].replace(/\[( |x|X)\]/,m=>/x/i.test(m)?"[ ]":"[x]"); guardar(Object.assign({},n,{texto:ls.join("\n")}),true); return; }
      editor(n); };
    el.ondragstart=e=>{ e.dataTransfer.setData("text/plain",n.id); el.classList.add("arr"); }; el.ondragend=()=>el.classList.remove("arr"); });
}

/* ---------- vistas ---------- */
function vColumnas(vs){
  const tbs=tableros();
  $("vista").innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap"><span class="ch-s" style="margin:0">Arrastra las notas de una columna a otra · clic en una nota para editarla · 📌 para fijarla arriba</span><button class="btn sm" id="nCol2">＋ Nueva columna</button></div><div class="cols">${tbs.map(t=>{ const ns=ordenar(vs.filter(n=>(n.tablero||BASE[0])===t));
    return `<div class="colN" data-t="${esc(t)}"><div class="colN-h">${esc(t)}<span class="n">${ns.length}</span></div>${ns.map(nota).join("")||`<div class="vacio" style="padding:14px">Arrastra notas aquí</div>`}
      <button class="btn sm" data-add="${esc(t)}" style="justify-content:center;border-style:dashed">＋ Nota en ${esc(t)}</button></div>`; }).join("")}
    <div class="colN" style="background:none;border:1px dashed #b9c7da;min-height:120px;justify-content:center"><button class="btn" id="nCol">＋ Nueva columna</button></div></div>`;
  const V=$("vista"); enganchar(V);
  V.querySelectorAll(".colN[data-t]").forEach(c=>{ c.ondragover=e=>{ e.preventDefault(); c.classList.add("sobre"); }; c.ondragleave=()=>c.classList.remove("sobre");
    c.ondrop=e=>{ e.preventDefault(); c.classList.remove("sobre"); const n=N.find(x=>x.id===e.dataTransfer.getData("text/plain")); if(n&&(n.tablero||BASE[0])!==c.dataset.t) guardar(Object.assign({},n,{tablero:c.dataset.t}),true); }; });
  V.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>editor({tablero:b.dataset.add}));
  $("nCol").onclick=$("nCol2").onclick=()=>{ const t=(prompt("Nombre de la nueva columna:")||"").trim(); if(t) editor({tablero:t}); };
}
function vMuro(vs){
  $("vista").innerHTML=vs.length?`<div class="muro">${ordenar(vs).map(nota).join("")}</div>`:`<div class="card vacio"><b>${N.length?"Ninguna nota coincide con el filtro":"Todavía no hay notas"}</b>${N.length?"Quita filtros o cambia la búsqueda.":"Escribe la primera en «Nota rápida»."}</div>`;
  enganchar($("vista"));
}
function vAgenda(vs){
  const con=vs.filter(n=>n.recordar).sort((a,b)=>String(a.recordar).localeCompare(String(b.recordar)));
  const grupos=[["Atrasados",n=>dias(n.recordar)<0],["Hoy",n=>dias(n.recordar)===0],["Próximos 7 días",n=>dias(n.recordar)>0&&dias(n.recordar)<=7],["Más adelante",n=>dias(n.recordar)>7]];
  $("vista").innerHTML=`<div class="card pad"><p class="ch-t">Recordatorios</p><div class="ch-s">Las notas con fecha de recordatorio. Si está activo el correo de cada mañana, al autor le llega el aviso ese día.</div>
    ${con.length?grupos.map(([g,f])=>{ const l=con.filter(f); return l.length?`<p class="ch-t" style="margin-top:14px;${g==="Atrasados"?"color:var(--bad)":""}">${g} (${l.length})</p><ul class="ag">${l.map(n=>`<li data-id="${esc(n.id)}"><span class="sw n-${esc(n.color||"amarillo")}"></span><span class="fe">${fCorta(n.recordar)}<small>${esc(fLarga(n.recordar).split(",")[0])}</small></span><span style="flex:1"><b>${esc(n.titulo||String(n.texto||"").split("\n")[0].slice(0,80))}</b><br><span style="font-size:12.5px;color:var(--text-2)">${esc(String(n.texto||"").slice(0,160))}</span></span><span style="font-size:11.5px;color:var(--muted)">${esc(n.tablero||"")}</span></li>`).join("")}</ul>`:""; }).join("")
      :`<div class="vacio"><b>Sin recordatorios</b>Abre una nota y ponle una fecha en «Recordarme el».</div>`}</div>`;
  $("vista").querySelectorAll("li[data-id]").forEach(l=>l.onclick=()=>editor(N.find(n=>n.id===l.dataset.id)));
}

/* ---------- editor ---------- */
function editor(n,op){
  if(n&&esActa(n)) return acta(n);
  n=Object.assign({color:COLOR_R,tablero:BASE[0],fijada:"false"},n||{});
  const bg=document.createElement("div"); bg.className="bg";
  bg.innerHTML=`<div class="dlg"><div class="dlg-h"><h3>${n.id?"Editar nota":"Nueva nota"}</h3><button class="btn sm" data-x>Cerrar</button></div>
    <div class="dlg-b">
      <label class="f full"><span>Título</span><input class="inp" id="nTit" value="${esc(n.titulo||"")}" placeholder="Opcional"></label>
      <div class="f full"><span>Nota</span>
        <div class="modo"><button type="button" data-modo="texto">📝 Texto</button><button type="button" data-modo="lista">☑ Lista con casillas</button></div>

    const v=ta.value, p=ta.selectionStart, a=v.lastIndexOf("\n",p-1)+1, linea=v.slice(a,p), m=linea.match(PRE); if(!m) return;

    ta.value=v.slice(0,p)+"\n"+pre+v.slice(ta.selectionEnd); ta.setSelectionRange(p+1+pre.length,p+1+pre.length); });

}

/* ---------- Office 365: Outlook, Teams y Word ---------- */
const correos=s=>String(s||"").split(/[,;\s]+/).map(x=>x.trim()).filter(x=>/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(x));
function copiar(t){ try{ navigator.clipboard.writeText(t); }catch(e){} }
function outlook(para,asunto,cuerpo){
  // Outlook de Office 365 en el navegador; el texto completo también queda copiado por si es muy largo
  copiar(cuerpo); const max=1600, b=cuerpo.length>max?cuerpo.slice(0,max)+"\n…(texto completo copiado: pégalo con Ctrl+V)":cuerpo;
  window.open("https://outlook.office.com/mail/deeplink/compose?to="+encodeURIComponent(para.join(";"))+"&subject="+encodeURIComponent(asunto)+"&body="+encodeURIComponent(b),"_blank");
  toast("Se abrió Outlook · el texto también quedó copiado");
}
function agendaOutlook(para,asunto,ini,fin,cuerpo){
  window.open("https://outlook.office.com/calendar/deeplink/compose?subject="+encodeURIComponent(asunto)+"&startdt="+encodeURIComponent(ini)+"&enddt="+encodeURIComponent(fin)+"&to="+encodeURIComponent(para.join(";"))+"&body="+encodeURIComponent(cuerpo.slice(0,1500)),"_blank"); }

function word(nombre,html){
  const doc=`<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><style>body{font-family:Calibri,Arial,sans-serif;font-size:11pt;color:#0f1c2e}h1{font-family:Georgia,serif;color:#1b3a5c;font-size:20pt;margin:0 0 4pt}h2{color:#1b3a5c;font-size:12.5pt;border-bottom:1pt solid #e3c27a;padding-bottom:2pt;margin:14pt 0 6pt}td,th{border:1pt solid #cfd8e3;padding:4pt 6pt;font-size:10.5pt}th{background:#1b3a5c;color:#fff;text-align:left}table{border-collapse:collapse;width:100%}.k{color:#b98b2f;font-weight:bold;letter-spacing:1pt;font-size:9pt}</style></head><body>${html}</body></html>`;
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob(["\ufeff"+doc],{type:"application/msword"})); a.download=nombre.replace(/\//g,"-").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^\w .-]+/g," - ").replace(/\s+/g," ").trim()+".doc"; document.body.appendChild(a); a.click(); a.remove();
  toast("Se descargó el Word · ábrelo y guárdalo en OneDrive o SharePoint si quieres"); }

async function crearTarea(o){
  const t=Object.assign({id:GS.id(),estado:"Pendiente",prioridad:"Media",avance:0,responsable:"",proyecto:"",inicio:new Date().toISOString().slice(0,10)},o);

/* ---------- Acta de reunión ---------- */
const ACTA={fecha:"📅 Fecha:",lugar:"📍 Lugar:",asis:"👥 Asistentes:",temas:"🗒 Temas:",acu:"✅ Acuerdos:",pen:"☐ Pendientes:",prox:"➡ Próxima reunión:"};
const esActa=n=>etqs(n).includes("acta")&&String(n.texto||"").includes(ACTA.asis);
const fISO=d=>d?d.split("-").reverse().join("/"):"";
const aISO=t=>{ const m=String(t||"").match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/); return m?`${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`:""; };
function actaTexto(a){
  const L=[`${ACTA.fecha} ${fISO(a.fecha)}${a.hora?" · "+a.hora:""}`,`${ACTA.lugar} ${a.lugar||""}`,`${ACTA.asis} ${a.asis||""}`,ACTA.temas];
  String(a.temas||"").split("\n").filter(x=>x.trim()).forEach(x=>L.push("• "+x.replace(/^•\s?/,"").trim()));
  L.push(ACTA.acu); a.acu.filter(x=>x.trim()).forEach(x=>L.push("• "+x.trim()));
  L.push(ACTA.pen); a.pen.filter(x=>x.t.trim()).forEach(x=>L.push(`${x.h?"[x]":"[ ]"} ${x.t.trim()}${x.r?" — "+x.r.trim():""}${x.f?" — "+fISO(x.f):""}${x.bit?" (en Bitácora)":""}`));
  L.push(`${ACTA.prox} ${a.prox?fISO(a.prox.slice(0,10))+(a.prox.length>10?" "+a.prox.slice(11,16):""):""}`);
  return L.join("\n");
}
function actaLeer(n){
  const a={titulo:String(n.titulo||"").replace(/^Acta:\s*/,"").replace(/\s·\s\d{1,2}\/\d{1,2}\/\d{4}$/,""),fecha:"",hora:"",lugar:"",asis:"",temas:"",acu:[],pen:[],prox:""};
  let sec=""; String(n.texto||"").split("\n").forEach(l=>{
    if(l.startsWith(ACTA.fecha)){ const v=l.slice(ACTA.fecha.length).trim(); a.fecha=aISO(v); const h=v.match(/(\d{1,2}:\d{2})/); a.hora=h?h[1].padStart(5,"0"):""; sec=""; }
    else if(l.startsWith(ACTA.lugar)){ a.lugar=l.slice(ACTA.lugar.length).trim(); sec=""; }
    else if(l.startsWith(ACTA.asis)){ a.asis=l.slice(ACTA.asis.length).trim(); sec=""; }
    else if(l.startsWith(ACTA.temas)) sec="temas"; else if(l.startsWith(ACTA.acu)) sec="acu"; else if(l.startsWith(ACTA.pen)) sec="pen";
    else if(l.startsWith(ACTA.prox)){ const v=l.slice(ACTA.prox.length).trim(), d=aISO(v), h=v.match(/(\d{1,2}:\d{2})/); a.prox=d?d+(h?"T"+h[1].padStart(5,"0"):"T09:00"):""; sec=""; }
    else if(sec==="temas"&&l.trim()) a.temas+=(a.temas?"\n":"")+l.replace(/^•\s?/,"").trim();
    else if(sec==="acu"&&l.trim()) a.acu.push(l.replace(/^•\s?/,"").trim());
    else if(sec==="pen"&&l.trim()){ const m=l.match(/^\s*\[( |x|X)\]\s?(.*)$/); let t=(m?m[2]:l).trim(); const bit=/\(en Bitácora\)\s*$/.test(t); t=t.replace(/\s*\(en Bitácora\)\s*$/,"");
      const p=t.split(" — "); const f=p.length>2?aISO(p[2]):(p.length===2&&aISO(p[1])?aISO(p[1]):""); a.pen.push({h:!!(m&&/x/i.test(m[1])),t:p[0],r:p.length>1&&!(p.length===2&&f)?p[1]:"",f,bit}); } });
  return a;
}
