<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITULO__</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js"></script>
<style>
:root{
  color-scheme:light;
  --bg:#f3f5f9; --surface:#ffffff; --surface-2:#f0f3f8; --surface-3:#e7ecf3; --border:#dde3ec;
  --text:#0f1c2e; --text-2:#44546a; --muted:#8792a4;
  --navy:#1b3a5c; --navy-d:#0f2440; --teal:#0f6f6e; --gold:#e3c27a; --gold-d:#b98b2f;
  --good:#1c7a46; --bad:#b03a32; --grid:#edf1f6; --zebra:#f8fafc;
  --shadow:0 1px 2px rgba(15,23,42,.05),0 4px 14px rgba(15,23,42,.05);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
.wrap{max-width:none;margin:0;padding:12px 14px}
.hidden{display:none!important}

/* ---------- Home ---------- */
.home-hdr{position:relative;overflow:hidden;border-radius:18px;padding:28px 30px;margin-bottom:20px;color:#fff;
  background:radial-gradient(120% 160% at 12% 0%,#2b5a86 0%,#1b3a5c 40%,#0f2440 80%);box-shadow:var(--shadow)}
.home-hdr .eyebrow{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:700;margin:0 0 6px}
.home-hdr h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.015em}
.home-hdr p{margin:6px 0 0;font-size:13.5px;opacity:.8;max-width:640px;line-height:1.55}
.home-bar{height:4px;border-radius:999px;margin-top:20px;background:linear-gradient(90deg,var(--gold),#7dd3fc 45%,rgba(255,255,255,.15))}
.search-card{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:12px 16px;margin-bottom:24px;box-shadow:var(--shadow)}
.search-count{font-weight:700;font-size:13.5px;color:var(--text-2);white-space:nowrap}
.search-box{flex:1;display:flex;align-items:center;gap:9px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:9px 12px}
.search-box input{flex:1;border:none;background:transparent;font:inherit;color:var(--text);outline:none}
.cat-hdr{display:flex;align-items:center;gap:11px;margin-bottom:14px}
.cat-ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:#e8eef6;border:1px solid #d6e0ec}
.cat-title{font-size:17px;font-weight:800;margin:0}
.pill{font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--surface-2);color:var(--text-2);border:1px solid var(--border)}
.cat-line{flex:1;height:2px;border-radius:999px;background:var(--grid)}
.mod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:22px}
.cat{margin-bottom:30px}
.cat-ic svg{width:19px;height:19px;stroke:var(--navy);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mod-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 20px;text-align:center;cursor:pointer;box-shadow:var(--shadow);
  transition:transform .14s ease,box-shadow .14s ease,border-color .14s ease}
.mod-card:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(15,23,42,.12);border-color:#c9d4e3}
.mod-ic{width:60px;height:60px;border-radius:18px;margin:0 auto 14px;display:grid;place-items:center;font-size:28px;background:linear-gradient(135deg,#f8e7b9,var(--gold))}
.mod-card h3{margin:0 0 6px;font-size:15.5px;font-weight:800}
.mod-card p{margin:0 0 14px;font-size:12.5px;color:var(--muted);line-height:1.5}
.mod-card.sin{cursor:default}.mod-card.sin .mod-tag{background:var(--muted)}
.mod-card.sin h3{margin-bottom:14px}
.mod-tag{display:inline-block;font-size:11px;font-weight:700;padding:5px 12px;border-radius:999px;color:#fff;background:var(--navy)}

/* ---------- Módulo ---------- */
.back{display:inline-flex;align-items:center;gap:6px;color:var(--text-2);font-size:12.5px;font-weight:600;cursor:pointer;margin-bottom:8px;background:none;border:none;padding:0}
.back:hover{color:var(--navy)}
.mhdr{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;border-radius:14px;padding:12px 18px;margin-bottom:10px;color:#fff;
  background:linear-gradient(115deg,var(--navy-d),var(--navy) 55%,#0f5560);box-shadow:var(--shadow)}
.mhdr .k{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:700}
.mhdr h1{margin:1px 0 0;font-size:19px;font-weight:800}
.mhdr .sub{margin-top:3px;font-size:12.5px;color:rgba(255,255,255,.75)}
.hbtns{display:flex;gap:8px;flex-wrap:wrap}
.hbtn{display:inline-flex;align-items:center;gap:7px;padding:9px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;font-size:13px;font-weight:600;cursor:pointer}
.hbtn:hover{background:rgba(255,255,255,.16)}
.hbtn.pri{background:var(--gold);border-color:var(--gold);color:var(--navy-d)}
.hbtn:disabled{opacity:.5;cursor:not-allowed}

.mtabs{display:flex;gap:4px;padding:4px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:11px;max-width:100%;overflow-x:auto}
.kback{background:none;border:none;padding:0;cursor:pointer;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:700}
.kback:hover{color:#fff}
.mtab{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:8px;border:none;background:transparent;color:rgba(255,255,255,.8);font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.mtab:hover{background:rgba(255,255,255,.1)}
.mtab[aria-selected="true"]{background:var(--gold);color:var(--navy-d)}
.mtab .cnt{font-size:11px;padding:1px 7px;border-radius:999px;background:rgba(0,0,0,.08)}
.mtab[aria-selected="true"] .cnt{background:rgba(255,255,255,.2)}

.banner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:6px 8px 6px 14px;border-radius:10px;margin-bottom:10px;font-size:12.5px;background:#fdf6e6;border:1px solid #f0dcaa;color:#6b4d12}
.banner.err{background:#fbeceb;border-color:#efc4c0;color:#7c2620}
.banner.ok{background:#e9f6ef;border-color:#bfe3cf;color:#155a35}
.banner .grow{flex:1;min-width:220px}
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:9px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:13px;font-weight:600;cursor:pointer}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.pri:hover{filter:brightness(1.12)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--navy-d)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}

/* ---------- Lector ---------- */
.lector{display:grid;grid-template-columns:270px minmax(0,1fr);gap:12px;align-items:stretch;height:100%}
.sideoff .lector{grid-template-columns:1fr}
.sideoff .lector>.panel:first-child{display:none}
#viewer{min-width:0}
#viewer.full{position:fixed;inset:10px;height:auto;z-index:60;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(15,23,42,.35)}
#viewer.full .tbl-wrap{flex:1;max-height:none}
.fullbg{position:fixed;inset:0;background:rgba(15,28,46,.45);z-index:55}
@media (max-width:900px){.lector{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.side-top{padding:12px;border-bottom:1px solid var(--border);background:var(--surface-2)}
.side-top input{width:100%;padding:9px 12px;border-radius:9px;border:1px solid var(--border);background:var(--surface);font:inherit;color:var(--text);outline:none}
.side-top input:focus{border-color:var(--navy)}
/* El módulo ocupa exactamente la pantalla: sin desplazar la página, cada panel se desplaza por dentro */
#viewModulo:not(.hidden),#viewUsuarios:not(.hidden),#viewApp:not(.hidden){display:flex;flex-direction:column;position:fixed;top:16px;right:24px;bottom:16px;left:24px}
#viewUsuarios>*{flex:none}
#viewApp:not(.hidden){display:flex;flex-direction:column;position:fixed;top:16px;right:24px;bottom:16px;left:24px}
#viewApp>*{flex:none}
#appFrame{flex:1;min-height:0;width:100%;border:1px solid var(--border);border-radius:14px;background:#fff;box-shadow:var(--shadow)}
#appFrame.hidden{display:none}
#viewUsuarios>#usrPanel:not(.hidden){flex:1;min-height:0;display:flex;flex-direction:column}
body.enModulo{overflow:hidden}
#viewModulo>*{flex:none}
#viewModulo>#moduloBody:not(.hidden){flex:1;min-height:0;display:flex;flex-direction:column}
#moduloBody>section:not(.hidden){flex:1;min-height:0}
.lector>.panel{display:flex;flex-direction:column;min-height:0}
.lector>.panel>*{flex:none}
.lector>.panel>.tree{flex:1;min-height:0;overflow-y:auto;padding:6px 0}
#viewer>.tbl-wrap{flex:1;min-height:0}
#viewer>.empty{flex:1}
@media (max-width:900px){#viewModulo:not(.hidden){position:static}body.enModulo{overflow:auto}.lector{height:auto}.lector>.panel>.tree{max-height:60vh}#viewer>.tbl-wrap{max-height:75vh}}
.y-row{display:flex;align-items:center;gap:8px;padding:9px 14px;font-weight:800;font-size:13.5px;color:var(--navy);cursor:pointer;user-select:none}
.y-row:hover{background:var(--surface-2)}
.chev{display:inline-block;width:12px;transition:transform .15s;color:var(--muted);font-size:10px}
.closed>.y-row .chev,.closed>.m-row .chev{transform:rotate(-90deg)}
.closed>.kids{display:none}
.m-row{display:flex;align-items:center;gap:8px;padding:7px 14px 7px 30px;font-weight:700;font-size:12.5px;color:var(--text-2);cursor:pointer;user-select:none;letter-spacing:.02em}
.m-row:hover{background:var(--surface-2)}
.m-row .pill{margin-left:auto;font-size:10.5px;padding:1px 8px}
.f-row{display:flex;align-items:flex-start;gap:9px;padding:8px 14px 8px 48px;cursor:pointer;border-left:3px solid transparent}
.f-row:hover{background:var(--surface-2)}
.f-row.sel{background:#eaf0f7;border-left-color:var(--navy)}
.f-ic{flex:none;width:22px;height:22px;border-radius:5px;background:#1d6f42;color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;margin-top:1px}
.f-ic.csv{background:#5a6b80}
.f-name{font-size:12.8px;line-height:1.35;color:var(--text);word-break:break-word}
.f-date{font-size:11px;color:var(--muted);margin-top:2px}
.empty{padding:40px 24px;text-align:center;color:var(--text-2)}
.empty b{display:block;font-size:15.5px;color:var(--text);margin-bottom:6px}
.empty .big{font-size:34px;margin-bottom:10px}

.viewer-hdr{padding:10px 14px 8px;border-bottom:1px solid var(--border)}
.crumbs{font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:.03em;text-transform:uppercase}
.crumbs b{color:var(--gold-d)}
.viewer-title{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:4px}
.viewer-title h2{margin:0;font-size:18px;font-weight:800;line-height:1.3;word-break:break-word}
.viewer-meta{font-size:12px;color:var(--muted);margin-top:4px}
.stabs{display:flex;gap:5px;flex-wrap:wrap;align-items:flex-end;padding:8px 14px 0;border-bottom:1px solid var(--border)}
.stab{padding:6px 12px;border-radius:8px 8px 0 0;border:1px solid var(--border);border-bottom:none;background:var(--surface-2);color:var(--text-2);font-size:12.5px;font-weight:600;cursor:pointer}
.stab[aria-selected="true"]{background:var(--surface);color:var(--navy);box-shadow:inset 0 3px 0 var(--gold)}
.sheet-info{margin-left:auto;align-self:center;padding:0 2px 6px;font-size:11.5px;color:var(--muted);white-space:nowrap}
.tbl-wrap{overflow:auto}
table.x{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
table.x th{position:sticky;top:0;z-index:2;background:var(--navy);color:#fff;font-weight:600;font-size:11.5px;text-align:left;padding:8px 10px;white-space:nowrap;border-right:1px solid rgba(255,255,255,.12)}
table.x th.n,table.x td.n{text-align:right}
table.x td{padding:4px 9px;font-size:12.5px;border-bottom:1px solid var(--grid);border-right:1px solid #e1e7ef;white-space:nowrap;max-width:340px;overflow:hidden;text-overflow:ellipsis}
table.x tbody tr:nth-child(even) td{background:var(--zebra)}
table.x tbody tr:hover td{background:#eef3fa}
table.x td.rn,table.x th.rn{position:sticky;left:0;z-index:1;width:44px;min-width:44px;text-align:right;color:var(--muted);font-size:11px;background:var(--surface-2)}
table.x th.rn{z-index:3;background:var(--navy-d);color:rgba(255,255,255,.6)}
table.x td.neg{color:var(--bad)}
table.x tr.totrow td{font-weight:700;background:#eef2f7!important;border-top:2px solid var(--navy)}
.more{padding:10px 18px;font-size:12px;color:var(--muted);border-top:1px solid var(--border)}

/* ---------- Pantera ---------- */
.pframe-wrap{position:relative;height:100%}
#panteraFrame{display:block;width:100%;height:100%;min-height:480px;border:1px solid var(--border);border-radius:14px;background:#fff;box-shadow:var(--shadow)}
.ploading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:rgba(243,245,249,.92);border-radius:14px;font-weight:600;color:var(--text-2)}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--surface-3);border-top-color:var(--navy);animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- Conectar ---------- */
.connect{max-width:560px;margin:40px auto;text-align:center;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:36px 30px;box-shadow:var(--shadow)}
.connect .big{font-size:42px;margin-bottom:10px}
.connect h2{margin:0 0 8px;font-size:19px;font-weight:800}
.connect p{margin:0 0 18px;color:var(--text-2);font-size:13.5px;line-height:1.55}
.connect code{display:inline-block;margin-bottom:18px;padding:6px 10px;border-radius:8px;background:var(--surface-2);font-size:12px;color:var(--text-2)}

/* ---------- Marca Pantera / Martina ---------- */
.home-hdr>*:not(.home-mark){position:relative;z-index:1}
.home-mark{position:absolute;right:40px;top:50%;transform:translateY(-50%);height:104px;opacity:.95;pointer-events:none;filter:drop-shadow(0 2px 10px rgba(0,0,0,.25))}
.home-hdr p{max-width:calc(100% - 260px)}
.home-bar{margin-right:250px}
@media (max-width:760px){.home-bar{margin-right:0}.home-hdr p{max-width:none}}
@media (max-width:760px){.home-mark{display:none}}
.mod-logo{height:92px;margin:2px auto 16px;display:flex;align-items:center;justify-content:center;border-radius:14px;
  background:linear-gradient(180deg,#fbf6ea,#f3e6c4);border:1px solid #ecdcb2;padding:12px}
.mod-logo img{max-height:68px;max-width:100%}
.mart{font-family:"Playfair Display",Georgia,serif;font-style:italic;font-weight:600;color:var(--gold-d);letter-spacing:.01em}
.mhdr .mart{color:var(--gold)}
.mbrand{display:flex;align-items:center;gap:16px;min-width:0}
.mlogo{height:56px;width:auto;flex:none;filter:drop-shadow(0 2px 6px rgba(0,0,0,.25))}
.msep{width:1px;align-self:stretch;margin:4px 0;background:linear-gradient(180deg,transparent,rgba(227,194,122,.7),transparent)}
.mhdr h1{font-size:21px}
@media (max-width:640px){.mlogo{height:40px}.msep{display:none}}

/* ---------- Barras de desplazamiento visibles (tabla y lista) ---------- */
.tbl-wrap,.tree{scrollbar-gutter:stable}
.tbl-wrap::-webkit-scrollbar,.tree::-webkit-scrollbar{width:14px;height:14px}
.tbl-wrap::-webkit-scrollbar-track,.tree::-webkit-scrollbar-track{background:#eef2f7}
.tbl-wrap::-webkit-scrollbar-thumb,.tree::-webkit-scrollbar-thumb{background:#9fb0c6;border-radius:999px;border:3px solid #eef2f7}
.tbl-wrap::-webkit-scrollbar-thumb:hover,.tree::-webkit-scrollbar-thumb:hover{background:var(--navy)}
.tbl-wrap::-webkit-scrollbar-corner{background:#eef2f7}

table.x td.wrap{white-space:normal;max-width:520px;min-width:220px;line-height:1.4;text-overflow:clip}
table.x td.span{max-width:none;color:var(--text-2);font-style:italic}
.banner .bx{background:none;border:none;cursor:pointer;color:inherit;opacity:.6;font-size:14px;padding:4px 6px;border-radius:6px}
.banner .bx:hover{opacity:1;background:rgba(0,0,0,.06)}
.banner .btn.sm{padding:4px 10px}

/* ---------- Compacto: más pantalla para los datos ---------- */
.mhdr{padding:7px 14px;border-radius:12px;margin-bottom:8px;gap:10px}
.mlogo{height:40px}
.mbrand{gap:12px}
.mhdr h1{font-size:17px;margin:0}
.mhdr .sub{font-size:11.5px;margin-top:1px}
.kback{font-size:10px}
.hbtn{padding:7px 12px;font-size:12.5px;border-radius:9px}
.mtab{padding:6px 12px;font-size:13px}
.mtabs{padding:3px}
.viewer-hdr{padding:8px 12px 6px}
.viewer-title{align-items:center;margin-top:0;flex-wrap:nowrap}
.vt-left{min-width:0;flex:1}
.viewer-title h2{font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.viewer-title h2 .crumbs{font-size:11px;margin-right:4px}
.viewer-meta{margin-top:1px;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vt-btns{display:flex;gap:6px;flex:none}
.stabs{padding:6px 12px 0}
@media (max-width:1100px){.viewer-title{flex-wrap:wrap}.vt-btns{flex-wrap:wrap}}

/* ---------- Inicio con aire alrededor ---------- */
#viewHome{max-width:1480px;margin:0 auto;padding:22px 28px 40px}
table.x th{border-right:1px solid rgba(255,255,255,.18)}
table.x td.rn{border-right:1px solid var(--border)}

.modoAuto #btnCambiar{display:none}

/* ---------- Sesión, roles, historial y usuarios ---------- */
#viewLogin:not(.hidden){flex:1;min-height:0;overflow:auto;display:flex;align-items:center;justify-content:center;padding:24px}
#viewLogin.hidden{display:none!important}
.login-card{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:0 18px 50px rgba(15,23,42,.12);overflow:hidden}
.login-top{padding:26px 28px 20px;color:#fff;text-align:center;background:radial-gradient(120% 160% at 12% 0%,#2b5a86 0%,#1b3a5c 40%,#0f2440 80%)}
.login-top img{height:62px;margin-bottom:10px}
.login-top .eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:700}
.login-top h1{margin:4px 0 0;font-size:19px;font-weight:800}
.login-body{padding:24px 28px 26px}
.login-body form{display:flex;flex-direction:column;gap:10px}
.inp{padding:10px 12px;border-radius:9px;border:1px solid var(--border);font:inherit;color:var(--text);background:var(--surface);outline:none}
.inp:focus{border-color:var(--navy)}
.inp.sm{padding:6px 9px;font-size:12.5px;border-radius:8px}
.login-note{margin:14px 0 0;font-size:11.5px;color:var(--muted);text-align:center;line-height:1.5}
.home-user{position:absolute;top:16px;right:20px;z-index:2;display:flex;align-items:center;gap:10px;font-size:12px;color:rgba(255,255,255,.85)}
.home-user .hbtn{padding:5px 11px;font-size:12px}
.rolchip{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:rgba(227,194,122,.2);color:var(--gold);border:1px solid rgba(227,194,122,.45)}
.rolchip.lt{background:#eef2f7;color:var(--navy);border-color:var(--border)}
.idle{position:fixed;right:22px;bottom:22px;z-index:90;max-width:360px;background:var(--surface);border:1px solid #f0dcaa;border-left:5px solid var(--gold-d);border-radius:12px;padding:14px 16px;box-shadow:0 18px 40px rgba(15,23,42,.22);font-size:13px;color:var(--text)}
.idle b{display:block;margin-bottom:4px;font-size:14px}
.idle .btn{margin-top:10px}
.dlg-bg{position:fixed;inset:0;z-index:95;background:rgba(15,28,46,.45);display:flex;align-items:center;justify-content:center;padding:20px}

<script>
/* ============================ __TITULO__ ============================
   Lee la carpeta de OneDrive de esta PC (año › mes), igual que el Lector de Pantera.
   Solo lectura: nada se sube a ningún lado. */
const MODULO="__MODULO__", LS="ma_"+MODULO+"_";
/* ============================ utilidades ============================ */
const $ = id => document.getElementById(id);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const MESES = ["ENERO","FEBRERO","MARZO","ABRIL","MAYO","JUNIO","JULIO","AGOSTO","SEPTIEMBRE","OCTUBRE","NOVIEMBRE","DICIEMBRE"];
const norm = s => String(s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase();
function mesIndex(nombre){
  const n = norm(nombre).replace("SETIEMBRE","SEPTIEMBRE");
  for(let i=0;i<12;i++) if(n.includes(MESES[i])) return i;
  const m = n.match(/(?:^|[^0-9])(0?[1-9]|1[0-2])(?:[^0-9]|$)/);
  return m ? (+m[1]-1) : 99;
}
const esAnio = s => /^(19|20)\d{2}$/.test(s);
// nombre de carpeta que ES un mes (AGOSTO, 08, 08-AGOSTO, AGOSTO 2026…), no solo que lo contenga
const esMesNombre = s => { const n=norm(s).replace("SETIEMBRE","SEPTIEMBRE").trim();
  return /^(0?[1-9]|1[0-2])$/.test(n) || new RegExp("^(\\d{1,2}[\\s._-]*)?("+MESES.join("|")+")([\\s._-]*\\d{2,4})?$").test(n); };
// Solo cuentan los archivos que están dentro de AÑO › MES (p. ej. 2026/AGOSTO/...).
// Lo que está fuera de esa estructura (una carpeta de mes movida a la raíz, archivos sueltos) no se muestra ni se usa.
function enFecha(ruta, raiz){
  let c=String(ruta).split("/").slice(0,-1);
  if(raiz&&esAnio(raiz)) c=[raiz,...c];
  const i=c.findIndex(esAnio);
  return i>=0 && !!c[i+1] && esMesNombre(c[i+1]);
}
const fFecha = t => t ? new Date(t).toLocaleString("es-PA",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"}) : "—";
const fTam = b => b==null ? "" : b<1024 ? b+" B" : b<1048576 ? (b/1024).toFixed(0)+" KB" : (b/1048576).toFixed(1)+" MB";


const lsGet=k=>{try{return localStorage.getItem(k);}catch(e){return null;}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v);}catch(e){}};
let DIR_HANDLE=null, ARCHIVOS=[], ARBOL={}, SEL=null;
const esExcel=n=>/\.(xlsx|xlsm|xls|csv)$/i.test(n);
const extDe=n=>((n.match(/\.([^.]+)$/)||[])[1]||"").toLowerCase();
function tipo(n){ const e=extDe(n);
  if(["xlsx","xlsm","xls","csv"].includes(e)) return "Excel";
  if(e==="pdf") return "PDF";
  if(["doc","docx"].includes(e)) return "Word";
  if(["png","jpg","jpeg","gif","webp"].includes(e)) return "Imagen";
  return "Otro"; }
function icono(n){
  const e=(n.match(/\.([^.]+)$/)||[])[1]?.toLowerCase()||"";
  if(e==="csv") return '<span class="f-ic csv">CSV</span>';
  if(["xlsx","xlsm","xls"].includes(e)) return '<span class="f-ic">X</span>';
  if(e==="pdf") return '<span class="f-ic pdf">PDF</span>';
  if(["doc","docx"].includes(e)) return '<span class="f-ic doc">W</span>';
  if(["png","jpg","jpeg","gif","webp"].includes(e)) return '<span class="f-ic img">IMG</span>';
  return '<span class="f-ic otro">'+esc(e.slice(0,3).toUpperCase()||"?")+'</span>';
}
/* ---------- sesión del inicio (actividad para el cierre por inactividad) ---------- */
if(false){
  let ult=0; ["mousemove","mousedown","keydown","wheel","touchstart"].forEach(e=>addEventListener(e,()=>{ if(Date.now()-ult>10000){ ult=Date.now(); try{ window.parent.postMessage({type:"MA_ACTIVITY"},"*"); }catch(_){} } },{passive:true,capture:true}));
}
/* ---------- carpeta ---------- */
const IDB="ma_lector_"+MODULO;
function idb(){ return new Promise((res,rej)=>{ const r=indexedDB.open(IDB,1); r.onupgradeneeded=()=>r.result.createObjectStore("h"); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function guardarHandle(h){ try{ const db=await idb(); await new Promise(r=>{ const tx=db.transaction("h","readwrite"); tx.objectStore("h").put(h,"carpeta"); tx.oncomplete=r; tx.onerror=r; }); }catch(e){} }
async function leerHandle(){ try{ const db=await idb(); return await new Promise(r=>{ const g=db.transaction("h").objectStore("h").get("carpeta"); g.onsuccess=()=>r(g.result||null); g.onerror=()=>r(null); }); }catch(e){ return null; } }
async function* recorrer(dir, ruta){
  for await (const [nombre, h] of dir.entries()){
    if(nombre.startsWith(".")||nombre.startsWith("~$")) continue;
    if(h.kind==="directory") yield* recorrer(h, ruta+nombre+"/");
    else yield {nombre, ruta:ruta+nombre, handle:h};
  }
}
function pantalla(conectado){ $("connectBox").classList.toggle("hidden",conectado); $("lectorBox").classList.toggle("hidden",!conectado); $("btnActualizar").disabled=!conectado; }
async function conectar(gesto){
  // acceso directo o Microsoft 365: lee solo, sin que Chrome pregunte
  try{ const f=await MA.fuente("__CARPETA__",{gesto:gesto&&MA.ms365()}); if(f){ $("btnCambiar").classList.add("hidden"); await usar(f); return; } }catch(e){ alertaTxt("Microsoft 365: "+e.message); }
  if(!window.showDirectoryPicker){ $("connectTitle").textContent="Este navegador no puede leer carpetas"; $("connectText").textContent="Abre el dashboard con Google Chrome o Microsoft Edge."; pantalla(false); return; }
  let h=await leerHandle();
  if(h){ try{ let p=await h.queryPermission({mode:"read"}); if(p!=="granted"&&gesto) p=await h.requestPermission({mode:"read"}); if(p==="granted"){ await usar(h); return; } }catch(e){} }
  if(gesto){ await elegir(); return; }
  if(h){ $("connectTitle").textContent="Abrir la carpeta "+h.name; $("btnConectar").textContent="🔓 Abrir carpeta";
    document.addEventListener("pointerdown",e=>{ if(!DIR_HANDLE&&!e.target.closest("#btnConectar,#btnCambiar,#maSalir,a")) conectar(true); },{once:true,capture:true}); }
  $("hdrSub").textContent="Sin carpeta conectada"; pantalla(false);
}
async function elegir(){
  try{ const h=await window.showDirectoryPicker({mode:"read",id:"ma_"+MODULO});
    if(esMesNombre(h.name)||esAnio(h.name)){ $("connectTitle").textContent="Elegiste “"+h.name+"”, que es un "+(esAnio(h.name)?"año":"mes"); $("connectText").innerHTML="Elige la carpeta de arriba, la que tiene los años adentro."; pantalla(false); return; }
    await guardarHandle(h); await usar(h);
  }catch(e){ if(e&&e.name!=="AbortError") alertaTxt("No se pudo abrir la carpeta: "+e.message); }
}
function alertaTxt(t){ $("hdrSub").textContent=t; }
async function usar(h){ DIR_HANDLE=h; pantalla(true); await escanear(); }
async function leerLista(){
  const l=[]; for await (const f of recorrer(DIR_HANDLE,"")) if(enFecha(f.ruta,DIR_HANDLE.name)) l.push(f);
  for(const f of l){ try{ const x=await f.handle.getFile(); f.mod=x.lastModified; f.size=x.size; }catch(e){} }
  return l;
}
const firma=l=>l.map(a=>a.ruta+"|"+(a.mod||0)+"|"+(a.size||0)).sort().join(";");
async function escanear(){
  if(!DIR_HANDLE) return;
  $("hdrSub").textContent="Leyendo la carpeta "+DIR_HANDLE.name+"…";
  try{ ARCHIVOS=await leerLista(); }
  catch(e){ DIR_HANDLE=null; $("connectTitle").textContent="No se pudo leer la carpeta"; $("connectText").textContent=e.message+" · Vuelve a conectarla."; pantalla(false); return; }
  construirArbol();
  $("hdrSub").textContent=`Carpeta: ${DIR_HANDLE.name}${DIR_HANDLE.auto==="ms365"?" (Microsoft 365)":DIR_HANDLE.auto==="local"?" (acceso directo)":""} · ${ARCHIVOS.length} archivo(s) · actualizado ${new Date().toLocaleTimeString("es-PA",{hour:"2-digit",minute:"2-digit"})}`;
  renderTree();
  if(window.repRefrescar) repRefrescar();
  if(!ARCHIVOS.length){ $("viewer").innerHTML=`<div class="empty"><div class="big">📂</div><b>No hay archivos dentro de año › mes</b>La carpeta ${esc(DIR_HANDLE.name)} debe tener carpetas de año (2026) y adentro los meses (AGOSTO…).</div>`; return; }
  if(SEL && !existeSel(SEL)) SEL=null;
  if(!SEL){ const a=aniosOrden()[0]; if(a) abrirVista("y:"+a); } else abrirArchivo(SEL);
}
async function verOtro(f){
  const v=$("viewer"); const file=await f.handle.getFile(); const url=URL.createObjectURL(file);
  const ext=(f.nombre.match(/\.([^.]+)$/)||[])[1]?.toLowerCase()||"";
  const cab=`<div class="viewer-hdr"><div class="viewer-title"><div class="vt-left"><h2><span class="crumbs"><b>${esc(f.anio)}</b> › ${esc(f.mes)} ›</span> ${esc(f.nombre)}</h2>
    <div class="viewer-meta">${fFecha(f.mod)} · ${fTam(f.size)}</div></div><div class="vt-btns"><a class="btn sm" href="${url}" download="${esc(f.nombre)}">⬇ Archivo</a></div></div></div>`;
  if(ext==="pdf") v.innerHTML=cab+`<iframe class="prev" src="${url}"></iframe>`;
  else if(ext==="docx"){
    try{
      if(!window.mammoth) throw new Error("no se pudo cargar el lector de Word (revisa la conexión a internet)");
      const r=await mammoth.convertToHtml({arrayBuffer:await file.arrayBuffer()});
      const html=r.value.trim();
      v.innerHTML=cab+(html?`<div class="docwrap"><div class="docpage">${html}</div></div>`:`<div class="empty"><div class="big">📄</div><b>Documento sin texto</b>Descarga el archivo para abrirlo.</div>`);
    }catch(e){ v.innerHTML=cab+`<div class="empty"><div class="big">⚠️</div><b>No se pudo leer el Word</b>${esc(e.message)}</div>`; }
  }
  else if(ext==="doc") v.innerHTML=cab+`<div class="empty"><div class="big">📄</div><b>Word 97-2003 (.doc)</b>El navegador no puede mostrar este formato antiguo. Descarga el archivo para abrirlo, o guárdalo como .docx en la carpeta y aquí se verá.</div>`;
  else if(["png","jpg","jpeg","gif","webp"].includes(ext)) v.innerHTML=cab+`<div class="tbl-wrap" style="flex:1;text-align:center;padding:14px"><img src="${url}" style="max-width:100%"></div>`;
  else v.innerHTML=cab+`<div class="empty"><div class="big">📄</div><b>Vista previa no disponible</b>Descarga el archivo para abrirlo.</div>`;
}
/* ============================ árbol año / mes ============================ */
function construirArbol(){
  const arbol={}; const raiz=DIR_HANDLE.name;
  ARCHIVOS.forEach(f=>{
    const partes=f.ruta.split("/"); const carpetas=partes.slice(0,-1);
    let anio=carpetas.find(esAnio), mes;
    if(anio){ mes=carpetas[carpetas.indexOf(anio)+1] || "General"; }
    else if(esAnio(raiz)){ anio=raiz; mes=carpetas[0]||"General"; }
    else { anio=esMesNombre(raiz) ? "Carpeta "+raiz : "Otros"; mes=carpetas[0]||(esMesNombre(raiz)?raiz:"General"); }
    f.anio=anio; f.mes=mes;
    ((arbol[anio]=arbol[anio]||{})[mes]=arbol[anio][mes]||[]).push(f);
  });
  ARBOL=arbol;
}
const aniosOrden = () => Object.keys(ARBOL).sort((a,b)=>(esAnio(b)?+b:0)-(esAnio(a)?+a:0)||a.localeCompare(b));
const mesesOrden = a => Object.keys(ARBOL[a]).sort((x,y)=>mesIndex(y)-mesIndex(x)||x.localeCompare(y));
function ultimoArchivo(){ const a=aniosOrden()[0]; if(!a) return null; const m=mesesOrden(a)[0]; return ARBOL[a][m].slice().sort((x,y)=>x.nombre.localeCompare(y.nombre,"es"))[0]; }

const ABIERTOS=new Set();
function renderTree(){
  const q=norm($("buscador").value.trim());
  const tree=$("tree"); let html="";
  const anios=aniosOrden();
  if(!ABIERTOS.size && anios.length){ ABIERTOS.add("y:"+anios[0]); ABIERTOS.add("m:"+anios[0]+"/"+mesesOrden(anios[0])[0]); }
  anios.forEach(a=>{
    let yHtml="", yCount=0;
    mesesOrden(a).forEach(m=>{
      const fs=ARBOL[a][m].filter(f=>!q||norm(f.ruta).includes(q)).sort((x,y)=>x.nombre.localeCompare(y.nombre,"es"));
      if(!fs.length) return; yCount+=fs.length;
      const mOpen = q || ABIERTOS.has("m:"+a+"/"+m);
      yHtml+=`<div class="${mOpen?"":"closed"}"><div class="m-row${SEL==="m:"+a+"/"+m?" sel":""}" data-k="m:${esc(a+"/"+m)}" title="Ver el mes completo"><span class="chev">▼</span><span class="mn">${esc(m)}</span><span class="pill">${fs.length}</span></div><div class="kids">`+
        fs.map(f=>`<div class="f-row${SEL===f.ruta?" sel":""}" data-r="${esc(f.ruta)}">${icono(f.nombre)}<div><div class="f-name">${esc(f.nombre.replace(/\.(xlsx|xlsm|xls|csv)$/i,""))}</div><div class="f-date">${fFecha(f.mod)} · ${fTam(f.size)}</div></div></div>`).join("")+
        `</div></div>`;
    });
    if(!yCount) return;
    const yOpen = q || ABIERTOS.has("y:"+a);
    html+=`<div class="${yOpen?"":"closed"}"><div class="y-row${SEL==="y:"+a?" sel":""}" data-k="y:${esc(a)}" title="Ver el año completo"><span class="chev">▼</span><span class="yn">📅 ${esc(a)}</span><span class="pill">${yCount}</span></div><div class="kids">${yHtml}</div></div>`;
  });
  tree.innerHTML = html || `<div class="empty" style="padding:24px"><b>Sin resultados</b>Prueba con otro nombre.</div>`;
  tree.querySelectorAll(".y-row,.m-row").forEach(r=>r.onclick=e=>{
    const k=r.dataset.k, abierto=!r.parentElement.classList.contains("closed");
    // la flecha solo abre/cierra; el nombre abre la vista del año o del mes
    if(e.target.classList.contains("chev") || (abierto && SEL===k)){ abierto?ABIERTOS.delete(k):ABIERTOS.add(k); r.parentElement.classList.toggle("closed",abierto); return; }
    ABIERTOS.add(k); r.parentElement.classList.remove("closed"); abrirVista(k); });
  tree.querySelectorAll(".f-row").forEach(r=>r.onclick=()=>abrirArchivo(r.dataset.r));
}
$("buscador").oninput=renderTree;

/* ============================ visor de archivo ============================ */
const vacioViewer=()=>`<div class="empty"><div class="big">📊</div><b>Elige un archivo</b>Selecciona un Excel del panel izquierdo para verlo aquí, organizado por hojas.</div>`;
let LIBRO=null;
function marcarSel(){
  document.querySelectorAll(".f-row").forEach(r=>r.classList.toggle("sel",r.dataset.r===SEL));
  document.querySelectorAll(".y-row,.m-row").forEach(r=>r.classList.toggle("sel",r.dataset.k===SEL));
}
async function abrirArchivo(ruta){
  if(/^[ym]:/.test(ruta)) return abrirVista(ruta);
  const f=ARCHIVOS.find(a=>a.ruta===ruta); if(!f) return;
  SEL=ruta; marcarSel();
  const v=$("viewer");
  v.innerHTML=`<div class="empty"><div class="spin" style="margin:0 auto 12px"></div>Leyendo ${esc(f.nombre)}…</div>`;
  if(!esExcel(f.nombre)){ await verOtro(f); return; }
  try{
    if(!window.XLSX) throw new Error("no se pudo cargar el lector de Excel (revisa la conexión a internet)");
    const buf=await (await f.handle.getFile()).arrayBuffer();
    const wb=XLSX.read(buf,{type:"array",cellDates:true});
    LIBRO={f,wb};
    pintarLibro(wb.SheetNames[0]);
  }catch(e){ v.innerHTML=`<div class="empty"><div class="big">⚠️</div><b>No se pudo leer el archivo</b>${esc(e.message)}</div>`; }
}
function filasLimpias(ws){
  // valores reales (para sumar y ordenar) + el texto tal como lo muestra Excel (%, fechas, años, monedas)
  const crudo=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:"",blankrows:true});
  const vista=XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:"",blankrows:true});
  let filas=crudo.map((r,i)=>{r.w=vista[i]||[];return r;}).filter(r=>r.some(c=>String(c).trim()!==""));
  if(!filas.length) return {titulo:[],cab:[],cuerpo:[]};
  const ncol=Math.max(...filas.map(r=>r.length));
  const usadas=[]; for(let c=0;c<ncol;c++) if(filas.some(r=>String(r[c]??"").trim()!=="")) usadas.push(c);
  filas=filas.map(r=>{const x=usadas.map(c=>r[c]??"");x.w=usadas.map(c=>r.w[c]??"");return x;});
  // encabezado = primera fila con al menos la mitad de celdas con texto
  let hi=filas.findIndex(r=>r.filter(c=>typeof c==="string"&&c.trim()).length>=Math.max(2,Math.ceil(usadas.length/2)));
  // si la fila candidata trae números, no es un encabezado real: se usan letras de columna (A, B, C…) como en Excel
  if(hi<0 || filas[hi].some(c=>typeof c==="number")){
    const letra=i=>{let s="";i++;while(i>0){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26);}return s;};
    return {titulo:[], cab:usadas.map((_,i)=>letra(usadas[i])), cuerpo:filas};
  }
  const titulo=filas.slice(0,hi).map(r=>r.filter(c=>String(c).trim()).join(" · ")).filter(Boolean);
  return {titulo, cab:filas[hi], cuerpo:filas.slice(hi+1)};
}
function celda(v,w){
  w=String(w==null?"":w).trim();
  if(v instanceof Date) return {t:w||v.toLocaleDateString("es-PA"),n:false};
  if(typeof v==="number"){
    let t;
    if(w && /[%$€£,]|\d[\/-]\d|[a-z]/i.test(w)) t=w;                       // formato de Excel: 7.00%, $1,200, 30/06/2026
    else if(Number.isInteger(v) && v>=1900 && v<=2100) t=String(v);          // años: 2032, no 2,032
    else t=v.toLocaleString("en-US",{maximumFractionDigits:Math.abs(v)<1?4:2,minimumFractionDigits:Number.isInteger(v)?0:2});
    return {t,n:true,neg:v<0};
  }
  return {t:String(v),n:false};
}
function pintarLibro(hoja){
  const {f,wb}=LIBRO; const v=$("viewer");
  const ws=wb.Sheets[hoja]; const {titulo=[],cab=[],cuerpo=[]}=ws?filasLimpias(ws):{};
  const MAX=500;
  const cols=cab.length;
  const esNum=cab.map((_,i)=>{const vals=cuerpo.map(r=>r[i]).filter(x=>x!==""&&x!=null);return vals.length&&vals.filter(x=>typeof x==="number").length/vals.length>.6;});
  const esFilaTot=r=>r.slice(0,3).some(c=>/^\s*(total|totales|gran total|suma)\b/i.test(String(c??"")));
  // columnas de numeración (#, No., 1,2,3…) no se suman
  const esConteo=i=>/^\s*(#|n[o°º]\.?|num|item|línea|linea)\s*$/i.test(String(cab[i]??""))||(()=>{const v=cuerpo.map(r=>r[i]).filter(x=>typeof x==="number");return v.length>2&&v.every((x,k)=>k===0||x===v[k-1]+1);})();
  // columnas de años (2032, 2039…) o tasas/porcentajes no se suman
  const noSumar=i=>{const v=cuerpo.filter(r=>!esFilaTot(r)).map(r=>r[i]).filter(x=>typeof x==="number");
    return v.length>0&&(v.every(x=>Number.isInteger(x)&&x>=1900&&x<=2100)||/%|rate|tasa|año|year|maturity|vencimiento|plazo/i.test(String(cab[i]??"")));};
  const sumas=cab.map((_,i)=>esNum[i]&&!esConteo(i)&&!noSumar(i)?cuerpo.filter(r=>!esFilaTot(r)).reduce((t,r)=>t+(typeof r[i]==="number"?r[i]:0),0):null);
  const conRn=!esConteo(0);   // si la hoja ya trae su propia numeración, no se repite
  const vacia=x=>x===""||x==null;
  const filasHTML=cuerpo.slice(0,MAX).map((r,ri)=>{
    const esTot=esFilaTot(r);
    let tds="";
    for(let i=0;i<cols;i++){
      const c=celda(r[i]??"", r.w&&r.w[i]);
      let span=1;
      if(!c.n && c.t.length>28){ while(i+span<cols && vacia(r[i+span])) span++; }
      const largo=!c.n && c.t.length>40;
      tds+=`<td class="${c.n?"n":""}${c.neg?" neg":""}${largo?" wrap":""}${span>1?" span":""}"${span>1?` colspan="${span}"`:""}>${esc(c.t)}</td>`;
      i+=span-1;
    }
    return `<tr${esTot?' class="totrow"':""}>${conRn?`<td class="rn">${ri+1}</td>`:""}${tds}</tr>`;
  }).join("");
  const hayTot=sumas.some(x=>x!=null)&&cuerpo.length>1&&!cuerpo.some(esFilaTot);
  v.innerHTML=`
    <div class="viewer-hdr">
      <div class="viewer-title">
        <div class="vt-left">
          <h2><span class="crumbs"><b>${esc(f.anio)}</b> › ${esc(f.mes)} ›</span> ${esc(f.nombre)}</h2>
          <div class="viewer-meta" title="${esc(titulo.join(" — "))}">${fFecha(f.mod)} · ${fTam(f.size)} · ${wb.SheetNames.length} hoja(s)${titulo.length?` · <span style="color:var(--text-2)">${esc(titulo.join(" — "))}</span>`:""}</div>
        </div>
        <div class="vt-btns">
          <button class="btn sm" id="btnLista" title="Ocultar o mostrar la lista de archivos">${document.body.classList.contains("sideoff")?"☰ Lista":"⇤ Lista"}</button>
          <button class="btn sm" id="btnFull" title="Ver la tabla en pantalla completa (Esc para salir)">${$("viewer").classList.contains("full")?"✕ Cerrar":"⛶ Ampliar"}</button>
          <button class="btn sm" id="btnBajarArchivo" title="Descargar este archivo">⬇ Archivo</button>
          <button class="btn sm pri" id="btnBajarMes" title="Descargar en un solo Excel todos los archivos de ${esc(f.mes)}">⬇ Todo ${esc(f.mes)}</button>
        </div>
      </div>
    </div>
    <div class="stabs">${wb.SheetNames.map(h=>`<button class="stab" data-h="${esc(h)}" aria-selected="${h===hoja}">${esc(h)}</button>`).join("")}<span class="sheet-info"><b>${cuerpo.length.toLocaleString("es-PA")}</b> filas · <b>${cols}</b> columnas${cuerpo.length>MAX?` · primeras ${MAX}`:""}</span></div>
    ${cols?`<div class="tbl-wrap"><table class="x"><thead><tr>${conRn?`<th class="rn">#</th>`:""}${cab.map((c,i)=>`<th class="${esNum[i]?"n":""}">${esc(c===""?"Columna "+(i+1):celda(c).t)}</th>`).join("")}</tr></thead>
      <tbody>${filasHTML}${hayTot?`<tr class="totrow">${conRn?`<td class="rn">Σ</td>`:""}${cab.map((_,i)=>i===0&&!esNum[0]?`<td>Total</td>`:`<td class="${esNum[i]?"n":""}">${sumas[i]!=null?esc(celda(sumas[i]).t):""}</td>`).join("")}</tr>`:""}</tbody></table></div>`
      :`<div class="empty"><b>Hoja vacía</b>Esta hoja no tiene datos.</div>`}`;
  v.querySelectorAll(".stab").forEach(b=>b.onclick=()=>pintarLibro(b.dataset.h));
  $("btnLista").onclick=()=>{ const off=!document.body.classList.contains("sideoff"); document.body.classList.toggle("sideoff",off); lsSet(LS+"sideoff",off?"1":""); $("btnLista").textContent=off?"☰ Lista":"⇤ Lista"; };
  $("btnFull").onclick=()=>pantallaCompleta(!$("viewer").classList.contains("full"));
  $("btnBajarArchivo").onclick=async()=>{ const file=await f.handle.getFile(); const a=document.createElement("a"); a.href=URL.createObjectURL(file); a.download=f.nombre; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1500); };
  $("btnBajarMes").onclick=()=>descargarMes(f.anio,f.mes);
}
function existeSel(k){
  if(k.startsWith("y:")) return !!ARBOL[k.slice(2)];
  if(k.startsWith("m:")){ const i=k.indexOf("/"); const a=k.slice(2,i), m=k.slice(i+1); return !!(ARBOL[a]&&ARBOL[a][m]); }
  return ARCHIVOS.some(a=>a.ruta===k);
}
const TIPOS=["Excel","PDF","Word","Imagen","Otro"];
function conteo(fs){ const c={}; fs.forEach(f=>{ const t=tipo(f.nombre); c[t]=(c[t]||0)+1; }); return c; }
function tablaArchivos(fs,conMes){
  const ord=fs.slice().sort((x,y)=>(conMes?mesIndex(x.mes)-mesIndex(y.mes)||x.mes.localeCompare(y.mes):0)||x.nombre.localeCompare(y.nombre,"es"));
  return `<table class="fl"><thead><tr>${conMes?"<th>Mes</th>":""}<th>Archivo</th><th>Tipo</th><th>Modificado</th><th class="r">Tamaño</th></tr></thead><tbody>`+
    ord.map(f=>`<tr class="cl" data-r="${esc(f.ruta)}">${conMes?`<td style="white-space:nowrap;font-weight:600;color:var(--text-2)">${esc(f.mes)}</td>`:""}<td><div class="fn">${icono(f.nombre)}<span>${esc(f.nombre)}</span></div></td><td>${tipo(f.nombre)}</td><td style="white-space:nowrap">${fFecha(f.mod)}</td><td class="r">${fTam(f.size)}</td></tr>`).join("")+`</tbody></table>`;
}
function kpisHTML(fs,extra){
  const c=conteo(fs);
  return `<div class="kpis"><div class="kpi"><div class="l">Archivos</div><div class="v">${fs.length}</div></div>${extra||""}`+
    TIPOS.filter(t=>c[t]).map(t=>`<div class="kpi"><div class="l">${t}</div><div class="v">${c[t]}</div></div>`).join("")+`</div>`;
}
function abrirVista(k){
  if(!existeSel(k)) return;
  SEL=k; marcarSel(); pantallaCompleta(false);
  const v=$("viewer"); const esA=k.startsWith("y:");
  let a, m, fs, cuerpo, titulo, bajar;
  if(esA){
    a=k.slice(2); const meses=mesesOrden(a); fs=meses.flatMap(x=>ARBOL[a][x]);
    const porIdx={}; meses.forEach(x=>{ const i=mesIndex(x); if(i<12&&!porIdx[i]) porIdx[i]=x; });
    const extras=meses.filter(x=>mesIndex(x)>=12||porIdx[mesIndex(x)]!==x);
    const tarjeta=x=>{ const l=ARBOL[a][x], c=conteo(l); return `<button class="mcard" data-k="m:${esc(a+"/"+x)}"><b>${esc(x)}</b><div class="n">${l.length} archivo(s)</div><div class="ty">${TIPOS.filter(t=>c[t]).map(t=>`<span>${t} ${c[t]}</span>`).join("")}</div></button>`; };
    const grid=MESES.map((nm,i)=>porIdx[i]?tarjeta(porIdx[i]):`<div class="mcard vacio"><b>${nm}</b><div class="n">Sin carpeta</div></div>`).join("")+extras.map(tarjeta).join("");
    titulo=`<span class="crumbs"><b>${esc(a)}</b> ›</span> Año ${esc(a)}`;
    cuerpo=kpisHTML(fs,`<div class="kpi"><div class="l">Meses</div><div class="v">${meses.length}</div></div>`)+`<div class="vsec">Meses</div><div class="mgrid">${grid}</div><div class="vsec">Archivos del año</div>`+tablaArchivos(fs,true);
    bajar=`⬇ Todo ${esc(a)}`;
  } else {
    const i=k.indexOf("/"); a=k.slice(2,i); m=k.slice(i+1); fs=ARBOL[a][m];
    titulo=`<span class="crumbs"><b>${esc(a)}</b> › ${esc(m)} ›</span> ${esc(m)} ${esc(a)}`;
    cuerpo=kpisHTML(fs)+`<div class="vsec">Archivos del mes</div>`+tablaArchivos(fs,false);
    bajar=`⬇ Todo ${esc(m)}`;
  }
  const nx=fs.filter(f=>esExcel(f.nombre)).length;
  v.innerHTML=`<div class="viewer-hdr"><div class="viewer-title"><div class="vt-left"><h2>${titulo}</h2>
      <div class="viewer-meta">${fs.length} archivo(s) · haz clic en un archivo para abrirlo</div></div>
      <div class="vt-btns"><button class="btn sm" id="btnLista">${document.body.classList.contains("sideoff")?"☰ Lista":"⇤ Lista"}</button>
      ${nx?`<button class="btn sm pri" id="btnBajarTodo" title="Descargar en un solo Excel los ${nx} Excel de ${esA?"este año":"este mes"}">${bajar}</button>`:""}</div></div></div>
    <div class="vbody">${cuerpo}</div>`;
  v.querySelectorAll("tr.cl").forEach(r=>r.onclick=()=>abrirArchivo(r.dataset.r));
  v.querySelectorAll(".mcard[data-k]").forEach(b=>b.onclick=()=>{ ABIERTOS.add("y:"+a); ABIERTOS.add(b.dataset.k); renderTree(); abrirVista(b.dataset.k); });
  $("btnLista").onclick=()=>{ const off=!document.body.classList.contains("sideoff"); document.body.classList.toggle("sideoff",off); lsSet(LS+"sideoff",off?"1":""); $("btnLista").textContent=off?"☰ Lista":"⇤ Lista"; };
  if(nx) $("btnBajarTodo").onclick=()=>esA?descargarAnio(a):descargarMes(a,m);
}
async function descargarAnio(anio){
  const fs=mesesOrden(anio).reverse().flatMap(m=>ARBOL[anio][m]);
  await consolidar(fs, `Consolidado_${anio}.xlsx`, true);
}
async function descargarMes(anio,mes){
  const fs=(ARBOL[anio]||{})[mes]||[]; if(!fs.length) return;
  await consolidar(fs, `Consolidado_${mes}_${esAnio(anio)?anio:""}.xlsx`.replace(/\s+/g,"_").replace("_.","."), false);
}
async function consolidar(fs, nombre, conMes){
  fs=fs.filter(f=>esExcel(f.nombre)); if(!fs.length) return;
  const b=document.activeElement&&document.activeElement.tagName==="BUTTON"?document.activeElement:null, t0=b?b.textContent:""; if(b) b.disabled=true;
  try{ await MA.consolidarExcel(fs.map(f=>({nombre:f.nombre,carpeta:`${f.anio} › ${f.mes}`,getFile:()=>f.handle.getFile()})), nombre,
      "Consolidado "+nombre.replace(/^Consolidado_|\.xlsx$/g,"").replace(/_/g," ")+" · __TITULO__", t=>{ if(b) b.textContent=t.slice(0,40)+"…"; }); }
  catch(e){ alertaTxt("No se pudo armar el Excel: "+e.message); }
  if(b){ b.disabled=false; b.textContent=t0; }
}

function pantallaCompleta(on){
  $("viewer").classList.toggle("full",on);
  let bg=document.querySelector(".fullbg");
  if(on&&!bg){ bg=document.createElement("div"); bg.className="fullbg"; bg.onclick=()=>pantallaCompleta(false); document.body.appendChild(bg); }
  if(!on&&bg) bg.remove();
  const b=$("btnFull"); if(b) b.textContent=on?"✕ Cerrar":"⛶ Ampliar";
}
document.addEventListener("keydown",e=>{ if(e.key==="Escape") pantallaCompleta(false); });
if(lsGet(LS+"sideoff")==="1") document.body.classList.add("sideoff");

{ let u=0; const v=()=>{ if(document.hidden||Date.now()-u<5000) return; u=Date.now(); revisar(); }; addEventListener("focus",v); document.addEventListener("visibilitychange",v); }
MA.listo.then(()=>conectar(false));
