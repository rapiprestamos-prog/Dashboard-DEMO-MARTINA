<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tablero de Notas — M&amp;A Capital</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  color-scheme:light;
  --bg:#f3f5f9; --surface:#fff; --surface-2:#f0f3f8; --border:#dde3ec; --grid:#edf1f6;
  --text:#0f1c2e; --text-2:#44546a; --muted:#7d889a;
  --navy:#1b3a5c; --navy-d:#0f2440; --teal:#0f6f6e; --gold:#e3c27a; --gold-d:#b98b2f;
  --good:#1c7a46; --bad:#b03a32; --warn:#9a6b0f;
  --shadow:0 1px 2px rgba(15,23,42,.05),0 6px 18px rgba(15,23,42,.06);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,"Segoe UI",sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
.wrap{max-width:1420px;margin:0 auto;padding:18px 24px 50px}
.hero{position:relative;overflow:hidden;border-radius:18px;padding:22px 28px;color:#fff;background:linear-gradient(115deg,#0f2440 0%,#1b3a5c 55%,#0f5560 100%);box-shadow:0 10px 30px rgba(15,36,64,.22)}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,#e3c27a,#b98b2f 60%,transparent)}
.hero .k{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:700}
.hero h1{margin:4px 0 2px;font-family:"Playfair Display",Georgia,serif;font-weight:600;font-size:30px}
.hero h1 i{color:var(--gold)}
.hero .sub{color:#c9d5e4;font-size:13.5px}
.hero .acc{position:absolute;right:24px;top:22px;display:flex;gap:8px;flex-wrap:wrap}
.hbtn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:#fff;font-weight:600;font-size:13px;cursor:pointer}
.hbtn:hover{background:rgba(255,255,255,.16)}.hbtn.pri{background:var(--gold);border-color:var(--gold);color:var(--navy-d)}
@media (max-width:900px){.hero .acc{position:static;margin-top:12px}}
.ctrl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0}
.chips{display:flex;gap:4px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:4px}
.chip{border:0;background:none;padding:7px 13px;border-radius:9px;font-weight:600;font-size:13px;color:var(--text-2);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--navy);color:#fff}
.inp{padding:9px 12px;border-radius:10px;border:1px solid var(--border);background:var(--surface);outline:none;font-size:13px}
.inp:focus{border-color:var(--teal)}
.grow{flex:1;min-width:200px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 15px;border-radius:10px;border:1px solid var(--border);background:var(--surface);font-weight:700;font-size:13px;cursor:pointer}
.btn:hover{background:var(--surface-2)}.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn.bad{color:var(--bad)}
.filtro{display:inline-flex;align-items:center;gap:6px;background:#e8eef7;color:var(--navy);border-radius:999px;padding:5px 6px 5px 12px;font-size:12.5px;font-weight:700}
.filtro button{border:0;background:var(--navy);color:#fff;border-radius:999px;width:20px;height:20px;cursor:pointer;font-size:11px}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:14px}
@media (max-width:1000px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:12px 14px;box-shadow:var(--shadow);position:relative;overflow:hidden;cursor:pointer}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--gold-d)}
.kpi.bad::before{background:var(--bad)}.kpi.ok::before{background:var(--good)}
.kpi .l{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.kpi .v{font-size:24px;font-weight:800;margin-top:3px;font-variant-numeric:tabular-nums}
.kpi .d{font-size:11.5px;color:var(--text-2)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:14px;overflow-x:auto}
.tab{border:0;background:none;padding:10px 14px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--navy);border-bottom-color:var(--gold-d)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow)}
.pad{padding:16px 18px}
.ch-t{font-weight:800;font-size:14px;margin:0 0 2px}.ch-s{font-size:12px;color:var(--muted);margin-bottom:10px}
.vacio{padding:26px 16px;text-align:center;color:var(--muted);font-size:13px;line-height:1.55}
.vacio b{display:block;color:var(--text);font-size:14.5px;margin-bottom:4px}
/* nota rápida */
.rapida{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:10px;box-shadow:var(--shadow);margin-bottom:14px}
.rapida textarea{flex:1;border:0;outline:none;resize:none;min-height:42px;font-size:14px;padding:8px}
.rapida .op{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pt{width:20px;height:20px;border-radius:50%;border:2px solid transparent;cursor:pointer}.pt[aria-pressed="true"]{border-color:var(--navy)}
/* colores de nota */
.n-amarillo{background:#fff6cc}.n-rosa{background:#fde4ea}.n-verde{background:#e1f5ea}.n-azul{background:#e2edfb}.n-lila{background:#ece6fb}.n-naranja{background:#ffe8d4}
/* columnas */
.cols{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(270px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px;align-items:start}
.colN{background:#e9eef5;border-radius:14px;padding:10px;min-height:260px;display:flex;flex-direction:column;gap:10px;transition:background .15s}
.colN.sobre{background:#dce6f3;outline:2px dashed #2a62a0}
.colN-h{display:flex;align-items:center;gap:8px;padding:2px 4px;font-weight:800;font-size:13px}
.colN-h .n{margin-left:auto;background:#fff;border-radius:999px;padding:1px 9px;font-size:12px;color:var(--text-2)}
/* muro */
.muro{columns:270px;column-gap:14px}
.muro .nt{break-inside:avoid;margin-bottom:14px}
/* nota */
.nt{border-radius:4px 14px 14px 14px;padding:14px 14px 10px;box-shadow:0 6px 16px rgba(15,23,42,.08);cursor:grab;position:relative;display:flex;flex-direction:column;transition:transform .12s, box-shadow .12s}
.nt:hover{transform:translateY(-2px) rotate(-.3deg);box-shadow:0 12px 24px rgba(15,23,42,.12)}
.nt.arr{opacity:.4}
.nt h5{margin:0 22px 6px 0;font-size:14.5px;line-height:1.3}
.nt .tx{font-size:13px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.nt .ck{display:flex;gap:7px;align-items:flex-start;margin:2px 0;cursor:pointer}
.nt .ck input{margin-top:3px;cursor:pointer}.nt .ck.hecho span{text-decoration:line-through;opacity:.55}
.nt .pr{height:4px;background:rgba(15,28,46,.1);border-radius:3px;overflow:hidden;margin:8px 0 2px}.nt .pr i{display:block;height:100%;background:var(--good)}
.nt .pie{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:11px;color:rgba(15,28,46,.62);margin-top:9px}
.nt .pin{position:absolute;right:10px;top:8px;cursor:pointer;opacity:.25;border:0;background:none;font-size:15px;padding:0}
.nt .pin.on,.nt:hover .pin{opacity:1}
.etq{display:inline-block;background:rgba(27,58,92,.1);color:var(--navy);border-radius:999px;padding:1px 8px;font-size:10.5px;font-weight:700;cursor:pointer}
.rec{background:rgba(255,255,255,.65);border-radius:6px;padding:1px 6px;font-weight:700}.rec.hoy{background:#b98b2f;color:#fff}.rec.pas{background:var(--bad);color:#fff}
/* recordatorios */
.ag{list-style:none;margin:0;padding:0}.ag li{display:flex;gap:12px;align-items:flex-start;padding:10px 6px;border-bottom:1px solid var(--grid);cursor:pointer}
.ag li:hover{background:var(--surface-2)}.ag .fe{min-width:86px;font-weight:800;font-size:12.5px}.ag .fe small{display:block;font-weight:600;color:var(--muted)}
.ag .sw{width:12px;height:12px;border-radius:3px;flex:none;margin-top:4px;border:1px solid rgba(0,0,0,.08)}
/* guía */
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}@media (max-width:1000px){.g2{grid-template-columns:1fr}}
.guia{line-height:1.7;font-size:14px;color:var(--text-2)}.guia h3{color:var(--text);font-size:16px;margin:18px 0 6px}.guia h3:first-child{margin-top:0}
.guia b{color:var(--text)}.guia ul,.guia ol{padding-left:20px;margin:6px 0}
.prompt{background:#0f1c2e;color:#e6ecf5;border-radius:12px;padding:16px 18px;font-family:ui-monospace,Consolas,monospace;font-size:12.5px;line-height:1.6;white-space:pre-wrap;max-height:460px;overflow:auto}
/* diálogo */
.bg{position:fixed;inset:0;background:rgba(15,28,46,.45);display:flex;align-items:flex-start;justify-content:center;padding:30px 16px;z-index:60;overflow-y:auto}
.dlg{width:100%;max-width:640px;background:var(--surface);border-radius:16px;box-shadow:0 20px 60px rgba(15,23,42,.35)}
.dlg-h{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border)}.dlg-h h3{margin:0;font-size:16px}
.dlg-b{padding:14px 18px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dlg-f{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--border)}
.f{display:flex;flex-direction:column;gap:4px}.f.full{grid-column:1/-1}.f>span{font-size:11.5px;font-weight:700;color:var(--text-2)}
.f textarea{min-height:170px;resize:vertical;line-height:1.5}
.colores{display:flex;gap:8px}.colores button{width:28px;height:28px;border-radius:50%;border:2px solid transparent;cursor:pointer}.colores button[aria-pressed="true"]{border-color:var(--navy)}
.ayuda{font-size:11.5px;color:var(--muted)}
.toast{position:fixed;right:18px;bottom:18px;background:var(--navy-d);color:#fff;padding:10px 14px;border-radius:10px;font-size:13px;z-index:80}
.toast.bad{background:var(--bad)}
.spin{display:inline-block;width:16px;height:16px;border-radius:50%;border:2px solid #dbe3ee;border-top-color:var(--navy);animation:sp .8s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
@media print{.hero .acc,.ctrl,.tabs,#maHdr,.rapida{display:none!important}.nt{box-shadow:none;border:1px solid #ddd}}
</style>
</head>
<body>
<!--MA_AUTH-->
<!--GS_CONEXION-->
<script>MA.iniciar({modulo:"notas",titulo:"Tablero de Notas"});</script>
<div class="wrap">
  <header class="hero">
    <div class="k">M&amp;A Capital · Gestión</div>
    <h1>Tablero de <i>Notas</i></h1>
    <div class="sub" id="heroSub">Ideas, acuerdos, pendientes y recordatorios del equipo</div>
    <div class="acc hidden" id="acc"><button class="hbtn" id="btnHoja">📗 Abrir la hoja</button><button class="hbtn" id="btnXls">⬇ Excel</button><button class="hbtn" id="btnRec" title="Volver a leer la hoja">↻</button><button class="hbtn pri" id="btnNueva">＋ Nueva nota</button></div>
  </header>
  <div id="app"><div class="vacio"><span class="spin"></span> Conectando…</div></div>
</div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const COLORES=["amarillo","rosa","verde","azul","lila","naranja"];
const BASE=["Ideas","Por hacer","Acuerdos","Recordatorios"];
const hoy=()=>{ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); };
const dias=iso=>Math.round((Date.parse(String(iso).slice(0,10))-Date.parse(hoy()))/864e5);
const fCorta=iso=>iso?new Date(String(iso).slice(0,10)+"T12:00:00").toLocaleDateString("es-PA",{day:"numeric",month:"short"}):"";
const fLarga=iso=>iso?new Date(String(iso).slice(0,10)+"T12:00:00").toLocaleDateString("es-PA",{weekday:"long",day:"numeric",month:"long"}):"";
const nombre=s=>String(s||"").replace(/@.*/,"");
const etqs=n=>String(n.etiquetas||"").split(/[,;]+/).map(x=>x.trim()).filter(Boolean);
const fij=n=>String(n.fijada)==="true";
function toast(t,mal){ const d=document.createElement("div"); d.className="toast"+(mal?" bad":""); d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),mal?6000:2400); }
let N=[], TK=[], HOJA="", DEMO=false, YO="", VISTA="columnas", Q="", F={}, COLOR_R="amarillo";

/* ============================ datos ============================ */
async function cargar(){
  if(DEMO){ pintar(); return; }
  try{ const r=await GS.llamar("notas.listar"); N=r.notas||[]; TK=r.tareas||[]; HOJA=r.hoja||""; pintar(); }
  catch(e){ $("app").innerHTML=`<div class="card vacio"><b>No se pudo leer la Hoja de Google</b>${esc(e.message)}<br><br><button class="btn" id="reint">Reintentar</button> ${(await MA.listo).rol==="admin"&&!GS.fija?'<button class="btn" id="recon">Cambiar la URL</button>':""}</div>`;
    $("reint").onclick=cargar; if($("recon")) $("recon").onclick=()=>{ GS.desconectar(); arrancar(); }; }
}
async function guardar(n,silencio){
  n=Object.assign({},n); if(!n.tablero) n.tablero=BASE[0];
  if(DEMO){ if(!n.id){ n.id="n"+Date.now(); n.creado=new Date().toISOString(); n.autor="ejemplo"; } n.actualizado=new Date().toISOString(); const i=N.findIndex(x=>x.id===n.id); i>=0?N[i]=n:N.push(n); pintar(); return; }
  const prev=N.slice(), i=N.findIndex(x=>x.id===n.id); if(i>=0){ N[i]=n; pintar(); }
  try{ const r=await GS.llamar("notas.guardar",{nota:n}); const j=N.findIndex(x=>x.id===r.id); j>=0?N[j]=r:N.push(r); pintar(); if(!silencio) toast("Nota guardada"); }
  catch(e){ N=prev; pintar(); toast("No se guardó la nota: "+e.message,true); }
}
async function borrar(id){
  if(DEMO){ N=N.filter(x=>x.id!==id); pintar(); return; }
  try{ await GS.llamar("notas.borrar",{id}); N=N.filter(x=>x.id!==id); pintar(); }catch(e){ toast(e.message,true); }
}

/* ============================ filtros ============================ */
function visibles(){ const q=Q.trim().toLowerCase();
  return N.filter(n=>(!q||[n.titulo,n.texto,n.etiquetas,n.autor,n.tablero].join(" ").toLowerCase().includes(q))
    &&(!F.color||n.color===F.color)&&(!F.etq||etqs(n).includes(F.etq))&&(!F.mias||String(n.autor||"").toLowerCase()===YO)
    &&(!F.fijadas||fij(n))&&(!F.tk||n.tarea_id)&&(!F.rec||(n.recordar&&dias(n.recordar)<=0))); }
const ordenar=ns=>ns.slice().sort((a,b)=>fij(b)-fij(a)||(+a.orden||0)-(+b.orden||0)||String(b.actualizado||b.creado||"").localeCompare(String(a.actualizado||a.creado||"")));
const tableros=()=>[...new Set(BASE.concat(N.map(n=>n.tablero).filter(Boolean)))];

/* ============================ pantalla ============================ */
function pintar(){
  $("acc").classList.remove("hidden"); $("btnHoja").classList.toggle("hidden",DEMO||!HOJA);
  const vs=visibles(), recHoy=N.filter(n=>n.recordar&&dias(n.recordar)<=0).length, prox=N.filter(n=>n.recordar&&dias(n.recordar)>0&&dias(n.recordar)<=7).length;
  const ck=N.reduce((a,n)=>{ const m=String(n.texto||"").match(/^\s*\[( |x|X)\]/gm)||[]; a.t+=m.length; a.h+=m.filter(x=>/x/i.test(x)).length; return a; },{t:0,h:0});
  const filtros=[F.color&&["color","Color: "+F.color],F.etq&&["etq","#"+F.etq],F.mias&&["mias","Solo mías"],F.fijadas&&["fijadas","Fijadas"],F.rec&&["rec","Recordatorios de hoy o atrasados"],F.tk&&["tk","Ligadas a tareas"]].filter(Boolean);
  $("app").innerHTML=`
    <div class="ctrl">
      <input class="inp grow" id="q" placeholder="Buscar en notas, etiquetas, autor…" value="${esc(Q)}">
      <div class="chips">${COLORES.map(c=>`<button class="chip" data-col="${c}" aria-pressed="${F.color===c}" title="Solo ${c}"><span class="pt n-${c}" style="display:inline-block;width:14px;height:14px;vertical-align:middle;border:1px solid rgba(0,0,0,.1)"></span></button>`).join("")}</div>
      <div class="chips"><button class="chip" data-tg="mias" aria-pressed="${!!F.mias}">Mías</button><button class="chip" data-tg="fijadas" aria-pressed="${!!F.fijadas}">📌 Fijadas</button></div>
      ${filtros.map(([k,l])=>`<span class="filtro">${esc(l)}<button data-qf="${k}" title="Quitar filtro">✕</button></span>`).join("")}
    </div>
    <div class="kpis">
      <div class="kpi" data-k="todo"><div class="l">Notas</div><div class="v">${N.length}</div><div class="d">${vs.length} en la vista</div></div>
      <div class="kpi" data-k="fijadas"><div class="l">Fijadas</div><div class="v">${N.filter(fij).length}</div><div class="d">siempre arriba</div></div>
      <div class="kpi ${recHoy?"bad":""}" data-k="rec"><div class="l">Recordatorios hoy</div><div class="v">${recHoy}</div><div class="d">de hoy o atrasados · ${prox} en 7 días</div></div>
      <div class="kpi ok" data-k="ck"><div class="l">Casillas hechas</div><div class="v">${ck.t?Math.round(100*ck.h/ck.t)+"%":"—"}</div><div class="d">${ck.h} de ${ck.t} pendientes marcados</div></div>
      <div class="kpi" data-k="tk"><div class="l">Ligadas a tareas</div><div class="v">${N.filter(n=>n.tarea_id).length}</div><div class="d">de la Bitácora Ejecutiva</div></div>
    </div>
    <div class="rapida"><textarea id="rTxt" placeholder="✍ Nota rápida… (Enter para guardar · Shift+Enter nueva línea · empieza una línea con [ ] para hacer una casilla)"></textarea>
      <div class="op"><select class="inp" id="rTab" style="padding:7px 9px">${tableros().map(t=>`<option>${esc(t)}</option>`).join("")}</select>
        ${COLORES.map(c=>`<button class="pt n-${c}" data-rc="${c}" aria-pressed="${COLOR_R===c}" title="${c}"></button>`).join("")}<button class="btn pri sm" id="rOk">Agregar</button></div></div>
    <div class="tabs">${[["columnas","🗂 Columnas"],["muro","🧱 Muro"],["agenda","⏰ Recordatorios"],["guia","💡 Guía y prompt"]].map(([k,l])=>`<button class="tab" data-v="${k}" aria-selected="${VISTA===k}">${l}</button>`).join("")}</div>
    <div id="vista"></div>`;
  if(DEMO) GS.avisoDemo($("app"),()=>{ DEMO=false; arrancar(); });
  const A=$("app");
  A.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{ VISTA=b.dataset.v; pintar(); });
  A.querySelectorAll("[data-col]").forEach(b=>b.onclick=()=>{ F.color=F.color===b.dataset.col?"":b.dataset.col; if(!F.color) delete F.color; pintar(); });
  A.querySelectorAll("[data-tg]").forEach(b=>b.onclick=()=>{ F[b.dataset.tg]=!F[b.dataset.tg]; if(!F[b.dataset.tg]) delete F[b.dataset.tg]; pintar(); });
  A.querySelectorAll("[data-qf]").forEach(b=>b.onclick=()=>{ delete F[b.dataset.qf]; pintar(); });
  A.querySelectorAll("[data-k]").forEach(k=>k.onclick=()=>{ const v=k.dataset.k; if(v==="todo") F={}; else if(v==="fijadas") F.fijadas=true; else if(v==="rec"){ F.rec=true; } else if(v==="tk"){ F.tk=true; } pintar(); });
  A.querySelectorAll("[data-rc]").forEach(b=>b.onclick=()=>{ COLOR_R=b.dataset.rc; A.querySelectorAll("[data-rc]").forEach(x=>x.setAttribute("aria-pressed",x===b)); });
  $("q").oninput=e=>{ Q=e.target.value; clearTimeout(pintar.t); pintar.t=setTimeout(()=>{ pintar(); const i=$("q"); i.focus(); i.setSelectionRange(i.value.length,i.value.length); },250); };
  const rapida=()=>{ const t=$("rTxt").value.trim(); if(!t) return; const l=t.split("\n"); const tit=l.length>1&&l[0].length<=70?l.shift():""; guardar({titulo:tit,texto:l.join("\n"),color:COLOR_R,tablero:$("rTab").value,fijada:"false"}); };
  $("rOk").onclick=rapida; $("rTxt").onkeydown=e=>{ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); rapida(); } };
  ({columnas:vColumnas,muro:vMuro,agenda:vAgenda,guia:vGuia})[VISTA](vs);
  $("heroSub").textContent=`${N.length} notas · ${tableros().length} columnas${recHoy?` · ${recHoy} recordatorio(s) para hoy`:""}${DEMO?" · datos de ejemplo":""}`;
}

/* ---------- una nota ---------- */
function cuerpo(n){
  const lineas=String(n.texto||"").split("\n"); let html="", hay=false;
  lineas.forEach((l,i)=>{ const m=l.match(/^\s*\[( |x|X)\]\s?(.*)$/); if(m){ hay=true; const h=/x/i.test(m[1]); html+=`<label class="ck${h?" hecho":""}" data-i="${i}"><input type="checkbox"${h?" checked":""}><span>${esc(m[2])}</span></label>`; } else html+=esc(l)+"\n"; });
  const m=String(n.texto||"").match(/^\s*\[( |x|X)\]/gm)||[], h=m.filter(x=>/x/i.test(x)).length;
  return `<div class="tx">${html.replace(/\n+$/,"")}</div>${hay?`<div class="pr" title="${h} de ${m.length}"><i style="width:${100*h/m.length}%"></i></div>`:""}`;
}
function nota(n){
  const tk=n.tarea_id&&TK.find(t=>t.id===n.tarea_id), r=n.recordar?dias(n.recordar):null;
  return `<div class="nt n-${esc(COLORES.includes(n.color)?n.color:"amarillo")}" draggable="true" data-id="${esc(n.id)}">
    <button class="pin${fij(n)?" on":""}" data-pin title="${fij(n)?"Desfijar":"Fijar arriba"}">📌</button>
    ${n.titulo?`<h5>${esc(n.titulo)}</h5>`:""}${cuerpo(n)}
    <div class="pie">${n.recordar?`<span class="rec${r<0?" pas":r===0?" hoy":""}">⏰ ${r===0?"Hoy":fCorta(n.recordar)}</span>`:""}${tk?`<span title="Ligada a la tarea">🔗 ${esc(tk.titulo)}</span>`:""}
      ${etqs(n).map(x=>`<span class="etq" data-etq="${esc(x)}">#${esc(x)}</span>`).join("")}
      <span style="margin-left:auto">${esc(nombre(n.autor))}${n.actualizado||n.creado?" · "+fCorta(n.actualizado||n.creado):""}</span></div></div>`;
}
function enganchar(V){
  V.querySelectorAll(".nt").forEach(el=>{ const n=N.find(x=>x.id===el.dataset.id);
    el.onclick=e=>{ const et=e.target.closest("[data-etq]"); if(et){ F.etq=et.dataset.etq; pintar(); return; }
      if(e.target.closest("[data-pin]")){ guardar(Object.assign({},n,{fijada:fij(n)?"false":"true"}),true); return; }
      const ck=e.target.closest(".ck"); if(ck){ e.preventDefault(); const ls=String(n.texto||"").split("\n"), i=+ck.dataset.i; ls[i]=ls[i].replace(/\[( |x|X)\]/,m=>/x/i.test(m)?"[ ]":"[x]"); guardar(Object.assign({},n,{texto:ls.join("\n")}),true); return; }
      editor(n); };
    el.ondragstart=e=>{ e.dataTransfer.setData("text/plain",n.id); el.classList.add("arr"); }; el.ondragend=()=>el.classList.remove("arr"); });
}

/* ---------- vistas ---------- */
function vColumnas(vs){
  const tbs=tableros();
  $("vista").innerHTML=`<div class="cols">${tbs.map(t=>{ const ns=ordenar(vs.filter(n=>(n.tablero||BASE[0])===t));
    return `<div class="colN" data-t="${esc(t)}"><div class="colN-h">${esc(t)}<span class="n">${ns.length}</span></div>${ns.map(nota).join("")||`<div class="vacio" style="padding:14px">Arrastra notas aquí</div>`}
      <button class="btn sm" data-add="${esc(t)}" style="justify-content:center;border-style:dashed">＋ Nota en ${esc(t)}</button></div>`; }).join("")}
    <div class="colN" style="background:none;border:1px dashed #b9c7da;min-height:120px;justify-content:center"><button class="btn" id="nCol">＋ Nueva columna</button></div></div>`;
  const V=$("vista"); enganchar(V);
  V.querySelectorAll(".colN[data-t]").forEach(c=>{ c.ondragover=e=>{ e.preventDefault(); c.classList.add("sobre"); }; c.ondragleave=()=>c.classList.remove("sobre");
    c.ondrop=e=>{ e.preventDefault(); c.classList.remove("sobre"); const n=N.find(x=>x.id===e.dataTransfer.getData("text/plain")); if(n&&(n.tablero||BASE[0])!==c.dataset.t) guardar(Object.assign({},n,{tablero:c.dataset.t}),true); }; });
  V.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>editor({tablero:b.dataset.add}));
  $("nCol").onclick=()=>{ const t=(prompt("Nombre de la nueva columna:")||"").trim(); if(t) editor({tablero:t}); };
}
function vMuro(vs){
  $("vista").innerHTML=vs.length?`<div class="muro">${ordenar(vs).map(nota).join("")}</div>`:`<div class="card vacio"><b>${N.length?"Ninguna nota coincide con el filtro":"Todavía no hay notas"}</b>${N.length?"Quita filtros o cambia la búsqueda.":"Escribe la primera en «Nota rápida»."}</div>`;
  enganchar($("vista"));
}
function vAgenda(vs){
  const con=vs.filter(n=>n.recordar).sort((a,b)=>String(a.recordar).localeCompare(String(b.recordar)));
  const grupos=[["Atrasados",n=>dias(n.recordar)<0],["Hoy",n=>dias(n.recordar)===0],["Próximos 7 días",n=>dias(n.recordar)>0&&dias(n.recordar)<=7],["Más adelante",n=>dias(n.recordar)>7]];
  $("vista").innerHTML=`<div class="card pad"><p class="ch-t">Recordatorios</p><div class="ch-s">Las notas con fecha de recordatorio. Si está activo el correo de cada mañana, al autor le llega el aviso ese día.</div>
    ${con.length?grupos.map(([g,f])=>{ const l=con.filter(f); return l.length?`<p class="ch-t" style="margin-top:14px;${g==="Atrasados"?"color:var(--bad)":""}">${g} (${l.length})</p><ul class="ag">${l.map(n=>`<li data-id="${esc(n.id)}"><span class="sw n-${esc(n.color||"amarillo")}"></span><span class="fe">${fCorta(n.recordar)}<small>${esc(fLarga(n.recordar).split(",")[0])}</small></span><span style="flex:1"><b>${esc(n.titulo||String(n.texto||"").split("\n")[0].slice(0,80))}</b><br><span style="font-size:12.5px;color:var(--text-2)">${esc(String(n.texto||"").slice(0,160))}</span></span><span style="font-size:11.5px;color:var(--muted)">${esc(n.tablero||"")}</span></li>`).join("")}</ul>`:""; }).join("")
      :`<div class="vacio"><b>Sin recordatorios</b>Abre una nota y ponle una fecha en «Recordarme el».</div>`}</div>`;
  $("vista").querySelectorAll("li[data-id]").forEach(l=>l.onclick=()=>editor(N.find(n=>n.id===l.dataset.id)));
}

/* ---------- editor ---------- */
function editor(n){
  n=Object.assign({color:COLOR_R,tablero:BASE[0],fijada:"false"},n||{});
  const bg=document.createElement("div"); bg.className="bg";
  bg.innerHTML=`<div class="dlg"><div class="dlg-h"><h3>${n.id?"Editar nota":"Nueva nota"}</h3><button class="btn sm" data-x>Cerrar</button></div>
    <div class="dlg-b">
      <label class="f full"><span>Título</span><input class="inp" id="nTit" value="${esc(n.titulo||"")}" placeholder="Opcional"></label>
      <label class="f full"><span>Nota</span><textarea class="inp" id="nTxt" placeholder="Escribe aquí… Para una lista de pendientes empieza cada línea con [ ]">${esc(n.texto||"")}</textarea>
        <span class="ayuda">Truco: <b>[ ]</b> al inicio de una línea crea una casilla que se marca con un clic en el tablero.</span></label>
      <div class="f"><span>Color</span><div class="colores">${COLORES.map(c=>`<button type="button" class="n-${c}" data-c="${c}" aria-pressed="${n.color===c}" title="${c}"></button>`).join("")}</div></div>
      <label class="f"><span>Columna</span><input class="inp" id="nTab" list="lTab" value="${esc(n.tablero||BASE[0])}"><datalist id="lTab">${tableros().map(t=>`<option value="${esc(t)}">`).join("")}</datalist></label>
      <label class="f"><span>Etiquetas (separadas por coma)</span><input class="inp" id="nEtq" list="lEtq" value="${esc(n.etiquetas||"")}"><datalist id="lEtq">${[...new Set(N.flatMap(etqs))].map(x=>`<option value="${esc(x)}">`).join("")}</datalist></label>
      <label class="f"><span>⏰ Recordarme el</span><input class="inp" type="date" id="nRec" value="${esc(String(n.recordar||"").slice(0,10))}"></label>
      <label class="f full"><span>🔗 Ligada a una tarea de la Bitácora</span><select class="inp" id="nTar"><option value="">— Ninguna —</option>${TK.map(t=>`<option value="${esc(t.id)}"${t.id===n.tarea_id?" selected":""}>${esc(t.titulo)}</option>`).join("")}</select></label>
      <label class="f full" style="flex-direction:row;align-items:center;gap:8px"><input type="checkbox" id="nPin"${fij(n)?" checked":""}> <span>📌 Fijar arriba</span></label>
      ${n.autor?`<div class="f full ayuda">Creada por ${esc(n.autor)}${n.creado?" el "+esc(fLarga(n.creado)):""}${n.actualizado?" · última edición "+esc(fCorta(n.actualizado)):""}</div>`:""}
    </div>
    <div class="dlg-f">${n.id?`<button class="btn bad" id="nDel" style="margin-right:auto">Eliminar</button><button class="btn" id="nDup">⧉ Duplicar</button>`:""}<button class="btn" data-x>Cancelar</button><button class="btn pri" id="nOk">Guardar</button></div></div>`;
  document.body.appendChild(bg); const g=id=>bg.querySelector("#"+id), cerrar=()=>bg.remove();
  bg.querySelectorAll("[data-x]").forEach(b=>b.onclick=cerrar); bg.onclick=e=>{ if(e.target===bg) cerrar(); };
  let color=n.color; bg.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{ color=b.dataset.c; bg.querySelectorAll("[data-c]").forEach(x=>x.setAttribute("aria-pressed",x===b)); });
  const leer=()=>Object.assign({},n,{titulo:g("nTit").value.trim(),texto:g("nTxt").value,color,tablero:g("nTab").value.trim()||BASE[0],etiquetas:etqs({etiquetas:g("nEtq").value}).join(", "),recordar:g("nRec").value,tarea_id:g("nTar").value,fijada:g("nPin").checked?"true":"false"});
  g("nOk").onclick=()=>{ const o=leer(); if(!o.titulo&&!o.texto.trim()){ g("nTxt").focus(); return; } cerrar(); guardar(o); };
  if(g("nDel")) g("nDel").onclick=()=>{ if(confirm("¿Eliminar esta nota?")){ cerrar(); borrar(n.id); } };
  if(g("nDup")) g("nDup").onclick=()=>{ const o=leer(); ["id","creado","autor","actualizado"].forEach(k=>delete o[k]); o.titulo=(o.titulo||"Nota")+" (copia)"; cerrar(); guardar(o); };
  (n.id?g("nTxt"):g("nTit")).focus();
}

/* ---------- guía ---------- */
const PROMPT=`Actúa como desarrollador senior de Google Apps Script y diseñador de producto.
Quiero un "Tablero de Notas" para el equipo de M&A Capital, conectado a la misma Hoja de cálculo de Google que la Bitácora Ejecutiva.

DATOS (pestaña Notas, fila 1 = encabezados):
id, titulo, texto, color (amarillo/rosa/verde/azul/lila/naranja), fijada, tarea_id, autor, creado, actualizado, tablero (columna), etiquetas, recordar (fecha), orden

SERVIDOR (Codigo.gs, aplicación web):
- doPost recibe JSON {accion, token, ...}: notas.listar (devuelve notas y las tareas abiertas para ligarlas), notas.guardar, notas.borrar.
- Verifica la sesión del usuario (token de Supabase) y que tenga el módulo "notas".
- avisoDiario (disparador 7 a. m.): además de las tareas, envía a cada autor sus notas con recordatorio de hoy.

PÁGINA (HTML + JS, estilo M&A: azul marino y dorado, notas tipo post-it):
- Nota rápida arriba: Enter guarda, la primera línea corta se usa como título, se elige columna y color.
- Vistas: Columnas (arrastrar notas entre columnas, crear columnas nuevas), Muro (todas como un corcho), Recordatorios (atrasados, hoy, próximos 7 días, más adelante).
- Casillas: líneas que empiezan con [ ] se vuelven casillas que se marcan con un clic y muestran barra de avance.
- Fijar, colores, etiquetas clicables, ligar a una tarea, duplicar, búsqueda, filtros por color, "mías" y fijadas.
- Indicadores: total, fijadas, recordatorios de hoy, % de casillas hechas, ligadas a tareas. Exportar a Excel.
- Nunca inventar datos: si la hoja está vacía, mostrarlo vacío.`;
function vGuia(){
  $("vista").innerHTML=`<div class="g2">
    <div class="card pad guia">
      <h3>¿Para qué sirve?</h3>
      <p>Es el <b>corcho digital del equipo</b>: ideas, acuerdos de reuniones, pendientes rápidos y recordatorios, ordenados en columnas y con colores, como notas adhesivas. Todo queda guardado en la Hoja de Google, compartido con el equipo.</p>
      <ul><li><b>Nota rápida:</b> escribe y presiona Enter. Listo.</li>
        <li><b>Columnas:</b> Ideas, Por hacer, Acuerdos, Recordatorios… y las que crees. Arrastra las notas de una a otra.</li>
        <li><b>Casillas:</b> empieza una línea con <b>[ ]</b> y se vuelve una casilla; se marca con un clic y la nota muestra su avance.</li>
        <li><b>Recordatorios:</b> pon una fecha y la nota aparece en «Recordatorios»; con el correo de cada mañana activado, le llega al autor ese día.</li>
        <li><b>Ligada a tareas:</b> una nota puede ir pegada a una tarea de la Bitácora Ejecutiva.</li></ul>
      <h3>Cómo hacerlo funcionar</h3>
      <ol><li>Usa la misma Hoja de Google y el mismo Apps Script de la Bitácora Ejecutiva (ya incluye las notas).</li>
        <li>Si cambiaste el código, en Apps Script: Implementar › Gestionar implementaciones › editar › Versión nueva.</li>
        <li>Da a cada persona el módulo «Tablero de Notas» en Usuarios y permisos.</li>
        <li>Opcional: ejecutar <b>instalarAvisoDiario</b> para los correos de las 7 a. m.</li></ol>
    </div>
    <div class="card pad"><p class="ch-t">Prompt del proyecto</p><div class="ch-s">Sirve para pedirle a una IA que lo amplíe o lo vuelva a construir igual</div>
      <div class="prompt" id="prompt"></div><button class="btn" id="copiaP" style="margin-top:10px">📋 Copiar prompt</button></div></div>`;
  $("prompt").textContent=PROMPT;
  $("copiaP").onclick=async e=>{ try{ await navigator.clipboard.writeText(PROMPT); e.target.textContent="✓ Copiado"; }catch(x){} };
}

/* ============================ arranque ============================ */
$("btnNueva").onclick=()=>editor({});
$("btnRec").onclick=()=>cargar();
$("btnHoja").onclick=()=>{ if(HOJA) window.open(HOJA,"_blank"); };
$("btnXls").onclick=()=>{ const ws=XLSX.utils.json_to_sheet(ordenar(visibles()).map(n=>({Columna:n.tablero||"",Título:n.titulo||"",Nota:n.texto||"",Color:n.color||"",Etiquetas:n.etiquetas||"",Recordar:n.recordar||"",Fijada:fij(n)?"Sí":"",Tarea:(TK.find(t=>t.id===n.tarea_id)||{}).titulo||"",Autor:n.autor||"",Creada:String(n.creado||"").slice(0,10)})));
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,"Notas"); XLSX.writeFile(wb,"Tablero de Notas - "+hoy()+".xlsx"); };
function arrancar(){
  $("acc").classList.add("hidden");
  F={}; Q=""; N=[]; TK=[]; HOJA=""; VISTA="columnas";
  MA.listo.then(c=>YO=(c.email||"").toLowerCase());
  if(DEMO){ ejemplo(); pintar(); return; }
  if(!GS.url()){ GS.pantalla($("app"),{titulo:"Conectar el Tablero de Notas",descripcion:"Notas del equipo tipo post-it, en columnas, con casillas y recordatorios.",demo:()=>{ DEMO=true; arrancar(); },listo:arrancar}); return; }
  $("app").innerHTML=`<div class="card vacio"><span class="spin"></span> Leyendo la Hoja de Google…</div>`; cargar();
}
MA.listo.then(arrancar);
</script>
