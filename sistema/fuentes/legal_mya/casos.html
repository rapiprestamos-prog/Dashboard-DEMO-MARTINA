<template id="tpl-casos"><style>

:host{

  --shadow:0 1px 2px rgba(15,23,42,.05),0 4px 14px rgba(15,23,42,.05);
}

button,input,select,textarea{font:inherit}

/* barra superior del agente */

.estado{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text-2)}
.estado .pt{width:8px;height:8px;border-radius:50%;background:var(--good);display:inline-block;margin-right:4px}
.main{flex:1;overflow-y:auto;padding:20px 24px 40px}
.wrap{max-width:1240px;margin:0 auto}
h1.t{font-family:"Playfair Display",Georgia,serif;font-weight:600;font-size:26px;margin:0}
.sub{color:var(--muted);font-size:13px;margin:4px 0 16px}
.k{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow)}
.pad{padding:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}

@media (max-width:900px){.grid3,.grid4{grid-template-columns:1fr 1fr}}

.herr{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:9px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-weight:600;font-size:13px;cursor:pointer}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.teal{background:var(--teal);border-color:var(--teal);color:#fff}

.inp{padding:8px 10px;border-radius:9px;border:1px solid var(--border);background:var(--surface);color:var(--text);outline:none;width:100%}
.inp:focus{border-color:var(--teal)}
textarea.inp{min-height:90px;resize:vertical}
.f{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.f>span{font-size:11.5px;font-weight:700;color:var(--text-2)}
.row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
.row>.f{flex:1;min-width:200px}
.checks{display:flex;gap:14px;flex-wrap:wrap;align-items:center}

table.t{width:100%;border-collapse:separate;border-spacing:0}
table.t th{text-align:left;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:9px 10px;border-bottom:1px solid var(--border);background:var(--surface-2)}
table.t td{padding:9px 10px;border-bottom:1px solid var(--grid);vertical-align:top;font-size:13px}
table.t tr.cl{cursor:pointer} table.t tr.cl:hover td{background:#f6f9fc}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:12px}
.kpi{padding:14px}
.kpi .v{font-size:28px;font-weight:800;margin-top:2px}
.kpi.ok .v{color:var(--good)} .kpi.rev .v{color:var(--warn)} .kpi.bad .v{color:var(--bad)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;border:1px solid var(--border);background:var(--surface-2);white-space:nowrap}
.tag.ok{background:#e9f6ef;border-color:#bfe3cf;color:var(--good)}

.aviso{padding:10px 14px;border-radius:10px;background:#fdf6e6;border:1px solid #f0dcaa;color:#6b4d12;font-size:13px;margin-bottom:12px}
.aviso.bad{background:#fbeceb;border-color:#efc4c0;color:#7c2620}
.spin{display:inline-block;width:16px;height:16px;border-radius:50%;border:2px solid #dbe3ee;border-top-color:var(--navy);animation:sp .8s linear infinite;vertical-align:middle}
@keyframes sp{to{transform:rotate(360deg)}}
.pasos{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.paso{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:600;font-size:12.5px;color:var(--text-2);cursor:pointer}
.paso.on{background:var(--navy);border-color:var(--navy);color:#fff}
.doc{max-width:820px;margin:0 auto;background:#fff;padding:40px 56px;font-family:"Times New Roman",Georgia,serif;font-size:15px;line-height:1.6;color:#111;box-shadow:0 2px 14px rgba(15,23,42,.12)}
.doc p{margin:0 0 10px}
mark.ok{background:#fff3b0;padding:0 2px}
mark.falta{background:#fbd5d1;padding:0 2px}
.doc p.cambio{background:#e7f6ee;outline:2px solid #bfe3cf}
.barra{height:8px;border-radius:999px;background:var(--grid);overflow:hidden;display:flex}
.barra i{display:block;height:100%}
.chat{display:flex;flex-direction:column;gap:10px;max-height:56vh;overflow-y:auto;padding:4px}

.msg.ia{align-self:flex-start;background:var(--surface-2)}
.semaf{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:middle}
.semaf.verde{background:#22a35a}.semaf.amarillo{background:#e0a400}.semaf.rojo{background:#d0453b}
.tabs2{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:14px}
.tab2{border:none;background:none;padding:9px 12px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}
.tab2.on{color:var(--teal);border-bottom-color:var(--teal)}
.bg{position:fixed;inset:0;background:rgba(15,28,46,.45);display:flex;align-items:flex-start;justify-content:center;padding:30px 16px;z-index:50;overflow-y:auto}
.dlg{width:100%;max-width:640px;background:var(--surface);border-radius:14px;box-shadow:0 20px 60px rgba(15,23,42,.35)}
.dlg-h{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border)}
.dlg-h h3{margin:0;font-size:16px}
.dlg-b{padding:14px 18px}
.dlg-f{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--border)}
.x{border:none;background:none;color:var(--muted);cursor:pointer}

.toast.bad{background:var(--bad)}
.cargando{padding:60px 20px;text-align:center;color:var(--muted)}
.connect{max-width:560px;margin:50px auto;text-align:center;padding:36px 30px}
.connect .big{font-size:42px}
.lista-items .it{display:flex;gap:8px;margin-bottom:6px}

.bar .navb{display:none}

</style><div class="casos">
  <nav class="bar" id="bar">
    <div class="estado"><span id="estadoTxt"></span>
      <button class="btn sm teal" id="btnRelee">↻ Actualizar carpeta Legal</button>
      <button class="btn sm" id="btnCambiar" title="Elegir otra carpeta Legal">📁</button></div>
  </nav>
  <main class="main"><div class="wrap" id="main"></div></main>
</div></template>
<script>
/* ===== Inicio · Due diligence · Redacción · Cierre (versión del video de Martina) =====
   Usa la misma carpeta Legal de la barra de arriba y la misma sesión de la página.
   Los datos de cada caso, los checklists y los últimos resultados se guardan en Supabase (tablas lg_*). */
function mountCasos(ROOT){
const $=id=>ROOT.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let SB=MA.sb, YO=(MA.ctx()||{}).email, ROL=(MA.ctx()||{}).rol;
if(window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

/* ============================ utilidades ============================ */
function toast(t,mal){ const d=document.createElement("div"); d.className="toast"+(mal?" bad":""); d.textContent=t; ROOT.appendChild(d); setTimeout(()=>d.remove(),mal?6000:2600); }
const fHora=t=>t?new Date(t).toLocaleString("es-PA",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"}):"";
const fFecha=t=>t?new Date(t).toLocaleDateString("es-PA",{day:"numeric",month:"short",year:"numeric"}):"—";
async function q(p){ const {data,error}=await p; if(error) throw new Error(error.message); return data; }
function abrirDlg(html){ cerrarDlg(); const bg=document.createElement("div"); bg.className="bg"; bg.innerHTML=`<div class="dlg">${html}</div>`; ROOT.appendChild(bg); bg.onclick=e=>{ if(e.target===bg) cerrarDlg(); }; bg.querySelectorAll("[data-x]").forEach(b=>b.onclick=cerrarDlg); return bg; }
function cerrarDlg(){ ROOT.querySelectorAll(".bg").forEach(b=>b.remove()); }
function descargar(blob,nombre){ const u=URL.createObjectURL(blob); const a=document.createElement("a"); a.href=u; a.download=nombre; a.click(); setTimeout(()=>URL.revokeObjectURL(u),2000); }
const limpiaNombre=s=>String(s).replace(/[\\/:*?"<>|]+/g,"-").trim();

/* ============================ carpeta Legal (OneDrive local) ============================ */
const IDB="agente_legal_db";
function idb(){ return new Promise((res,rej)=>{ const r=indexedDB.open(IDB,1); r.onupgradeneeded=()=>r.result.createObjectStore("h"); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function guardarHandle(h){ try{ const db=await idb(); await new Promise(r=>{ const tx=db.transaction("h","readwrite"); tx.objectStore("h").put(h,"legal"); tx.oncomplete=r; tx.onerror=r; }); }catch(e){} }
async function leerHandle(){ try{ const db=await idb(); return await new Promise(r=>{ const g=db.transaction("h").objectStore("h").get("legal"); g.onsuccess=()=>r(g.result||null); g.onerror=()=>r(null); }); }catch(e){ return null; } }
let RAIZ=null, CASOS=[], PLANTILLAS=[], LEIDA=null, META={};
async function* recorrer(dir,ruta){
  for await (const [n,h] of dir.entries()){
    if(n.startsWith(".")||n.startsWith("~$")) continue;
    if(h.kind==="directory") yield* recorrer(h,ruta+n+"/");
    else yield {nombre:n,ruta:ruta+n,handle:h};
  }
}
async function leerCarpeta(){
  const casos=[], plant=[];
  for await (const [n,h] of RAIZ.entries()){
    if(h.kind!=="directory"||n.startsWith(".")||n.startsWith("_")) continue;
    const arch=[]; for await (const f of recorrer(h,"")) arch.push(f);
    for(const a of arch){ try{ const file=await a.handle.getFile(); a.mod=file.lastModified; a.size=file.size; }catch(e){ a.mod=0; } }
    if(/^documentos$/i.test(n)||/^(19|20)\d{2}$/.test(n)) continue;   // Documentos y las carpetas de año (Dashboard de Legal) no son casos
    if(/^plantillas?$/i.test(n)) plant.push(...arch.filter(a=>/\.docx$/i.test(a.nombre)));
    else casos.push({nombre:n,handle:h,archivos:arch,mod:arch.reduce((m,a)=>Math.max(m,a.mod||0),0)});
  }
  CASOS=casos.sort((a,b)=>b.mod-a.mod); PLANTILLAS=plant.sort((a,b)=>a.nombre.localeCompare(b.nombre,"es")); LEIDA=Date.now();
  try{ (await q(SB.from("lg_casos").select("*"))).forEach(m=>META[m.caso]=m); }catch(e){}
  pintarEstado();
}
function pintarEstado(){ $("estadoTxt").innerHTML=RAIZ?`<span class="pt"></span><b>${esc(RAIZ.name)}</b> · ${CASOS.length} casos · leída ${new Date(LEIDA).toLocaleTimeString("es-PA",{hour:"2-digit",minute:"2-digit"})}`:""; }
async function conectar(){ RAIZ=window.LEGAL_DIR?window.LEGAL_DIR():null; if(!RAIZ) return false; await leerCarpeta(); return true; }
function pantallaConectar(){
  pintarEstado();
  $("main").innerHTML=`<div class="card connect"><div class="big">📂</div><h2>Elige la carpeta Legal</h2>
    <p class="nota" style="font-size:13.5px;line-height:1.6">Pulsa <b>Elegir carpeta</b> (arriba a la derecha) y elige la carpeta <b>Legal</b> de OneDrive. Cada subcarpeta es un caso; la subcarpeta <b>Plantillas</b> guarda los modelos de Word.</p>
    <button class="btn pri" id="btnCon" style="font-size:14px;padding:11px 22px">📂 Elegir carpeta Legal</button></div>`;
  $("btnCon").onclick=()=>SH.chooseFolder();
}

/* ============================ lectura de documentos ============================ */
const TXT=new Map();
const MAX_DOC=60000, MAX_TOTAL=320000;
async function textoPDF(buf){
  if(!window.pdfjsLib) throw new Error("no se pudo cargar el lector de PDF");
  const pdf=await pdfjsLib.getDocument({data:buf}).promise; let out=[];
  for(let i=1;i<=pdf.numPages;i++){ const pg=await pdf.getPage(i); const c=await pg.getTextContent(); out.push(c.items.map(x=>x.str+(x.hasEOL?"\n":" ")).join("")); }
  return out.join("\n\n");
}
const W="http://schemas.openxmlformats.org/wordprocessingml/2006/main";
async function parrafosDocx(buf){
  const zip=await JSZip.loadAsync(buf); const f=zip.file("word/document.xml"); if(!f) throw new Error("no es un Word válido");
  const doc=new DOMParser().parseFromString(await f.async("string"),"application/xml");
  return {zip,doc,ps:[...doc.getElementsByTagNameNS(W,"p")]};
}
const textoParrafo=p=>{ let s=""; p.querySelectorAll("*").forEach(n=>{ if(n.namespaceURI!==W) return; if(n.localName==="t") s+=n.textContent; else if(n.localName==="tab") s+="\t"; else if(n.localName==="br") s+="\n"; }); return s; };
async function textoDOCX(buf){ const {ps}=await parrafosDocx(buf); return ps.map(textoParrafo).join("\n"); }
async function textoDe(a){
  const k=a.ruta+"|"+a.mod; if(TXT.has(k)) return TXT.get(k);
  let t=null; const ext=(a.nombre.match(/\.([^.]+)$/)||[])[1]?.toLowerCase()||"";
  try{
    const file=await a.handle.getFile();
    if(ext==="pdf") t=await textoPDF(await file.arrayBuffer());
    else if(ext==="docx") t=await textoDOCX(await file.arrayBuffer());
    else if(["xlsx","xlsm","xls","csv"].includes(ext)){ const wb=XLSX.read(await file.arrayBuffer(),{type:"array"}); t=wb.SheetNames.map(n=>"## "+n+"\n"+XLSX.utils.sheet_to_csv(wb.Sheets[n])).join("\n\n"); }
    else if(["txt","md"].includes(ext)) t=await file.text();
  }catch(e){ t=null; }
  if(t&&!t.trim()) t=null;
  TXT.set(k,t); return t;
}
// Documentos de un caso listos para la IA (con límite de tamaño)
async function docsDe(lista,progreso){
  const docs=[], omitidos=[]; let i=0;
  for(const a of lista){ i++; if(progreso) progreso(`Leyendo ${i} de ${lista.length}: ${a.nombre}`);
    const t=await textoDe(a); if(t) docs.push({nombre:a.ruta,texto:t.slice(0,MAX_DOC)}); else omitidos.push(a.ruta); }
  let total=docs.reduce((s,d)=>s+d.texto.length,0);
  if(total>MAX_TOTAL){ const f=MAX_TOTAL/total; docs.forEach(d=>d.texto=d.texto.slice(0,Math.floor(d.texto.length*f))); }
  return {docs,omitidos};
}

/* ============================ IA (Edge Function agente-legal) ============================ */
const IA_SISTEMA=`Eres el asistente legal interno de M&A Capital (Panamá). Trabajas SOLO con los documentos y datos que se te entregan.
Reglas:
- No inventes datos. Si algo no aparece en los documentos, dilo claramente o deja el valor vacío.
- Indica el nombre del archivo de donde sale cada dato.
- Escribe en español salvo que se pida otro idioma.
- Responde ÚNICAMENTE con un objeto JSON válido, sin texto antes ni después, con la forma indicada.`;
const IA_DOCS=(docs=[])=>docs.map(d=>`<<<DOCUMENTO: ${d.nombre}>>>\n${d.texto}\n<<<FIN: ${d.nombre}>>>`).join("\n\n");
const IA_TAREAS={
  caso_meta:b=>`Caso (subcarpeta): ${b.caso}
Con los documentos, identifica la sociedad del grupo que participa y el tipo de proceso (por ejemplo, compraventa de inmueble, contrato de servicios, confidencialidad).
Devuelve: {"sociedad":"","tipo_proceso":""} (vacío si no se puede saber).

${IA_DOCS(b.documentos)}`,
  due_diligence:b=>`Caso: ${b.caso}
Datos a revisar: ${(b.datos||[]).join(", ")}.
Extrae de TODOS los documentos esos datos (por ejemplo: partes con nombres, cédulas o RUC; fincas con número y ubicación; fechas de firma, vencimientos y vigencias; precios, montos y abonos; hipotecas, gravámenes o limitaciones) y compara el mismo dato entre documentos.
Devuelve: {"datos":[{"dato":"nombre del dato","valor":"valor principal","valores":[{"documento":"archivo","valor":"como aparece"}],"documentos":["archivos donde aparece"],"estado":"coincide|revisar|diferencia","nota":"explicación breve si no es coincide"}]}
"diferencia" = dos documentos dicen cosas distintas; "revisar" = incompleto, vencido o dudoso; "coincide" = todos concuerdan.

${IA_DOCS(b.documentos)}`,
  redaccion_campos:b=>`Caso: ${b.caso}${b.sociedad?`\nSociedad del caso: ${b.sociedad}`:""}
Idioma de los valores: ${b.idioma||"Español"}.
La plantilla tiene estos campos entre corchetes: ${(b.campos||[]).map(c=>`[${c}]`).join(", ")}.
Busca el valor de cada campo en los documentos del caso. Si un campo no aparece, deja "valor" vacío. Escribe los valores tal como deben ir en el documento (montos en letras si el campo lo pide).
Devuelve: {"campos":{"NOMBRE DEL CAMPO":{"valor":"","fuente":"archivo"}}} usando los nombres de campo exactamente como están (sin corchetes).

TEXTO DE LA PLANTILLA:
${b.plantilla||""}

DOCUMENTOS DEL CASO:
${IA_DOCS(b.documentos)}`,
  redaccion_cambio:b=>`Pedido de cambio: "${b.pedido}"
Idioma: ${b.idioma||"Español"}.
Estos son los párrafos del documento (índice y texto). Propón el cambio mínimo necesario: modifica solo los párrafos que hagan falta y conserva los campos entre corchetes que no se deban tocar.
Devuelve: {"cambios":[{"parrafo":índice,"propuesto":"texto completo nuevo del párrafo","explicacion":"qué cambiaste"}]}

${(b.parrafos||[]).map(p=>`[${p.i}] ${p.texto}`).join("\n")}`,
  redaccion_validar:b=>`Revisa la consistencia de este documento ya llenado: montos en letras contra números, nombres y cédulas contra los documentos del caso, fechas y plazos coherentes, campos vacíos o entre corchetes que quedaron sin llenar.
Devuelve: {"validaciones":[{"estado":"OK|PENDIENTE|ERROR","texto":"qué revisaste y qué encontraste"}]}

DOCUMENTO:
${b.texto||""}

DOCUMENTOS DEL CASO:
${IA_DOCS(b.documentos)}`,
  cierre:b=>`Caso: ${b.caso}
Checklist del proceso "${b.checklist}":
${(b.items||[]).map((x,i)=>`${i+1}. ${x.documento}${x.detalle?` (${x.detalle})`:""}`).join("\n")}
Archivos de la carpeta del caso: ${(b.archivos||[]).map(a=>`${a.nombre} (modificado ${a.modificado})`).join("; ")}
Para cada documento del checklist, busca el archivo que le corresponde y decide su estado: "Final" (firmado/completo y vigente), "Por modificar" (borrador, falta firma, vencido o con algo que corregir) o "Falta" (no hay archivo).
Devuelve: {"items":[{"documento":"del checklist","archivo":"archivo encontrado o vacío","estado":"Final|Por modificar|Falta","motivo":"breve"}],"que_falta":["pasos concretos para cerrar"],"alertas":["vencimientos u otros riesgos con fecha, si los hay"]}

${IA_DOCS(b.documentos)}`,
  correo_seguimiento:b=>`Redacta un correo de seguimiento profesional y breve para cerrar el caso "${b.caso}" (checklist "${b.checklist}").
Pendientes: ${JSON.stringify(b.que_falta||[])}
Estado de documentos: ${JSON.stringify(b.items||[])}
Alertas: ${JSON.stringify(b.alertas||[])}
No inventes destinatarios ni nombres que no estén en los datos; usa "[Nombre]" donde haga falta.
Devuelve: {"asunto":"","cuerpo":""}`,
  comparar:b=>`Compara estos dos documentos y lista las diferencias relevantes (partes, montos, fechas, plazos, cláusulas añadidas o quitadas, obligaciones).

// La IA pasa por la función agente-legal de Supabase (la clave de Anthropic vive allá, nunca en esta página)
async function ia(tarea,payload){
  const s=await window.claude.use("sample"); if(!s) throw new Error("La IA no está disponible: entra al Agente Legal desde el inicio del dashboard.");
  try{
    if(tarea==="chat"){
      const msgs=[{role:"user",content:IA_SISTEMA+`\n\nDocumentos del caso "${payload.caso}":\n\n${IA_DOCS(payload.documentos)}\n\nVoy a hacerte preguntas sobre estos documentos. Responde solo con lo que digan. Devuelve siempre {"respuesta":"..."}.`},
        {role:"assistant",content:'{"respuesta":"Entendido. ¿Qué necesitas saber?"}'},...(payload.mensajes||[]).map(m=>({role:m.role==="assistant"?"assistant":"user",content:m.content}))];
      const r=await s(msgs); const t=r.text, i=t.indexOf("{"), j=t.lastIndexOf("}");
      try{ return JSON.parse(t.slice(i,j+1)); }catch(e){ return {respuesta:t}; }
    }
    const armar=IA_TAREAS[tarea]; if(!armar) throw new Error("Tarea desconocida: "+tarea);
    return await s.json(IA_SISTEMA+"\n\n"+armar(payload));
  }catch(e){ throw new Error(e&&e.message||"No se pudo completar con la IA."); }
}

const xe=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const runXml=(t,b)=>String(t).split("\n").map((l,i)=>`${i?"<w:r><w:br/></w:r>":""}<w:r>${b?"<w:rPr><w:b/></w:rPr>":""}<w:t xml:space="preserve">${xe(l)}</w:t></w:r>`).join("");
async function docxSimple(titulo,lineas,tabla){
  const z=new JSZip();
  z.file("[Content_Types].xml",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>`);
  z.file("_rels/.rels",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`);
  const tbl=tabla?`<w:tbl><w:tblPr><w:tblW w:w="5000" w:type="pct"/><w:tblBorders>${["top","left","bottom","right","insideH","insideV"].map(b=>`<w:${b} w:val="single" w:sz="4" w:color="BFC8D6"/>`).join("")}</w:tblBorders></w:tblPr>${
    tabla.map((f,i)=>`<w:tr>${f.map(c=>`<w:tc><w:p>${runXml(c,i===0)}</w:p></w:tc>`).join("")}</w:tr>`).join("")}</w:tbl>`:"";
  z.file("word/document.xml",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="${W}"><w:body>
    <w:p><w:pPr><w:spacing w:after="200"/></w:pPr><w:r><w:rPr><w:b/><w:sz w:val="32"/></w:rPr><w:t>${xe(titulo)}</w:t></w:r></w:p>
    ${lineas.map(l=>`<w:p>${runXml(l)}</w:p>`).join("")}<w:p/>${tbl}<w:p/></w:body></w:document>`);
  return z.generateAsync({type:"blob",mimeType:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"});
}

// Llena la plantilla Word conservando su formato: los campos se reemplazan dentro de su mismo texto
async function llenarDocx(buf){
  const {zip,doc,ps}=await parrafosDocx(buf);
  ps.forEach((p,i)=>{
    const ts=[...p.getElementsByTagNameNS(W,"t")]; if(!ts.length) return;
    const cambio=RED.cambios.find(c=>c.parrafo===i&&c.aceptado);
    const llenar=s=>s.replace(RX_CAMPO,(m,k)=>RED.campos[k.trim()]||m);
    if(cambio){ ts[0].textContent=llenar(cambio.propuesto); ts[0].setAttribute("xml:space","preserve"); ts.slice(1).forEach(t=>t.textContent=""); return; }
    ts.forEach(t=>{ const n=llenar(t.textContent); if(n!==t.textContent){ t.textContent=n; t.setAttribute("xml:space","preserve"); } });
    // campo partido en varios tramos de texto: se une en el primer tramo
    const full=ts.map(t=>t.textContent).join(""), lleno=llenar(full);
    if(lleno!==full){ ts[0].textContent=lleno; ts[0].setAttribute("xml:space","preserve"); ts.slice(1).forEach(t=>t.textContent=""); }
  });
  zip.file("word/document.xml",new XMLSerializer().serializeToString(doc));
  return zip.generateAsync({type:"blob",mimeType:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"});
}

    try{ const [ta,tb]=[await textoDe(a),await textoDe(b)]; if(!ta||!tb) throw new Error("No se pudo leer el texto de uno de los documentos.");

      $("cRes").innerHTML=`<div class="card pad" style="margin-bottom:12px">${esc(r.resumen||"")}</div><div class="card"><table class="t"><thead><tr><th>Tema</th><th>${esc(a.nombre)}</th><th>${esc(b.nombre)}</th><th>Importancia</th></tr></thead><tbody>${
        (r.diferencias||[]).map(d=>`<tr><td><b>${esc(d.tema)}</b></td><td>${esc(d.a)}</td><td>${esc(d.b)}</td><td><span class="tag ${/alta/i.test(d.importancia)?"bad":/media/i.test(d.importancia)?"rev":""}">${esc(d.importancia||"")}</span></td></tr>`).join("")||`<tr><td colspan="4" class="nota">Sin diferencias relevantes.</td></tr>`}</tbody></table></div>`; }
    catch(e){ $("cRes").innerHTML=`<div class="aviso bad">${esc(e.message)}</div>`; } $("cRun").disabled=false; };
}
function mConsultar(){
  $("masB").innerHTML=`<div class="card pad" style="margin-bottom:12px"><label class="f"><span>Documento</span><select class="inp" id="qD">${opcArchivos()}</select></label>
    <div class="row"><label class="f" style="flex:5"><span>Pregunta</span><input class="inp" id="qP" placeholder="Ej.: ¿Cuál es el plazo de vigencia y cómo se renueva?"></label><button class="btn pri" id="qRun" style="margin-bottom:10px">Consultar</button></div></div><div id="qRes"></div>`;
  const run=async()=>{ const a=archivoPor($("qD").value), p=$("qP").value.trim(); if(!a||!p) return; $("qRun").disabled=true; trabajando($("qRes"),"Leyendo el documento…");
    try{ const t=await textoDe(a); if(!t) throw new Error("No se pudo leer el texto de este documento (puede ser un PDF escaneado).");
      const r=await ia("consultar",{documento:{nombre:a.ruta,texto:t.slice(0,MAX_DOC*3)},pregunta:p});
      $("qRes").innerHTML=`<div class="card pad"><div style="white-space:pre-wrap;line-height:1.6">${esc(r.respuesta||"")}</div>${(r.citas||[]).map(c=>`<div class="aviso" style="margin-top:10px">“${esc(c.texto)}”${c.ubicacion?` <span class="nota">· ${esc(c.ubicacion)}</span>`:""}</div>`).join("")}</div>`; }
    catch(e){ $("qRes").innerHTML=`<div class="aviso bad">${esc(e.message)}</div>`; } $("qRun").disabled=false; };
  $("qRun").onclick=run; $("qP").onkeydown=e=>{ if(e.key==="Enter") run(); };
}
async function mSemaforo(){
  $("masB").innerHTML=`<div class="card"><div class="pad nota">Evalúa el riesgo de cada caso con sus documentos. Se guarda la última evaluación.</div><div id="sT"><div class="pad"><span class="spin"></span></div></div></div><div id="sDet" style="margin-top:12px"></div>`;
  let ult={}; try{ (await q(SB.from("lg_resultados").select("*").eq("herramienta","semaforo").order("creado",{ascending:false}))).forEach(r=>{ if(!ult[r.caso]) ult[r.caso]=r; }); }catch(e){}
  const nivel=r=>String((r&&r.resultado&&r.resultado.nivel)||"").toLowerCase();
  $("sT").innerHTML=CASOS.length?`<table class="t"><thead><tr><th></th><th>Caso</th><th>Resumen</th><th>Evaluado</th><th></th></tr></thead><tbody>${CASOS.map(c=>{ const r=ult[c.nombre]; const nv=nivel(r);
    return `<tr class="${r?"cl":""}" data-v="${esc(c.nombre)}"><td>${r?`<span class="semaf ${esc(nv)}"></span>`:""}</td><td><b>${esc(c.nombre)}</b></td><td class="nota">${esc(r?r.resultado.resumen||"":"Sin evaluar")}</td><td class="nota">${r?fHora(r.creado):""}</td><td><button class="btn sm" data-ev="${esc(c.nombre)}">Evaluar</button></td></tr>`; }).join("")}</tbody></table>`:`<div class="vacio">No hay casos.</div>`;
  const det=r=>{ $("sDet").innerHTML=`<div class="card"><div class="pad"><span class="semaf ${esc(nivel(r))}"></span> <b>${esc(r.caso)}</b> · ${esc(r.resultado.resumen||"")}</div><table class="t"><thead><tr><th>Riesgo</th><th>Gravedad</th><th>Documento</th></tr></thead><tbody>${(r.resultado.riesgos||[]).map(x=>`<tr><td>${esc(x.riesgo)}</td><td><span class="tag ${/alta/i.test(x.gravedad)?"bad":/media/i.test(x.gravedad)?"rev":"ok"}">${esc(x.gravedad)}</span></td><td class="nota">${esc(x.documento||"")}</td></tr>`).join("")||`<tr><td colspan="3" class="nota">Sin riesgos señalados.</td></tr>`}</tbody></table></div>`; };
  $("sT").querySelectorAll("tr[data-v]").forEach(tr=>tr.onclick=e=>{ if(e.target.closest("button")) return; const r=ult[tr.dataset.v]; if(r) det(r); });
  $("sT").querySelectorAll("[data-ev]").forEach(b=>b.onclick=async()=>{ const c=casoPor(b.dataset.ev); b.disabled=true; b.innerHTML='<span class="spin"></span>';
    try{ const {docs}=await docsDe(c.archivos); if(!docs.length) throw new Error("No se pudo leer ningún documento de "+c.nombre);
      const r=await ia("semaforo",{caso:c.nombre,documentos:docs}); await guardarResultado(c.nombre,"semaforo",r);
      await mSemaforo(); det({caso:c.nombre,resultado:r}); }
    catch(e){ toast(e.message,true); b.disabled=false; b.textContent="Evaluar"; } });
}

return {ir:v=>{ if(!RAIZ){ VISTA=v; pantallaConectar(); } else ir(v); }, iniciar, alCambiarCarpeta};
}
(function(){
  const views=document.getElementById("views");
  const v=document.createElement("div"); v.id="v-casos"; v.hidden=true; v.innerHTML='<div class="vhost" id="h-casos"></div>'; views.prepend(v);
  const host=document.getElementById("h-casos"); const root=host.attachShadow({mode:"open"}); root.append(document.getElementById("tpl-casos").content.cloneNode(true));
  const nav=document.getElementById("tabs");
  [["inicio","Inicio"],["dd","Due diligence"],["red","Redacción"],["cierre","Cierre"]].reverse().forEach(([k,t])=>{ const b=document.createElement("button"); b.type="button"; b.dataset.v=k; b.setAttribute("aria-selected","false"); b.textContent=t; nav.prepend(b); });
  const CAS=["inicio","dd","red","cierre"];
  let app=null, arrancado=false;
  SH.go=function(v){ this.view=v; const enCasos=CAS.includes(v);
    $s("#v-chat").hidden=v!=="chat"; $s("#v-ag").hidden=v!=="ag"; const d=$s("#v-doc"); if(d) d.hidden=v!=="doc"; $s("#v-casos").hidden=!enCasos;
    $s("#tabs").querySelectorAll("button").forEach(b=>b.setAttribute("aria-selected",b.dataset.v===v));
    if(enCasos&&app){ if(!arrancado){ arrancado=true; app.iniciar().then(()=>app.ir(v)); } else app.ir(v); }
    if(v==="doc"&&window.DOC_CARGAR) window.DOC_CARGAR(); };
  MA.listo.then(()=>{ app=mountCasos(root); SH.onFolder(()=>{ if(arrancado) app.alCambiarCarpeta(); }); SH.go("inicio"); });
})();
