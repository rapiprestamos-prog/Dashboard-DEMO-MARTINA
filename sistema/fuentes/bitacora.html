<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bitácora Ejecutiva — M&amp;A Capital</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  color-scheme:light;
  --bg:#f3f5f9; --surface:#fff; --surface-2:#f0f3f8; --border:#dde3ec; --grid:#edf1f6;
  --text:#0f1c2e; --text-2:#44546a; --muted:#7d889a;
  --navy:#1b3a5c; --navy-d:#0f2440; --teal:#0f6f6e; --gold:#e3c27a; --gold-d:#b98b2f;
  --good:#1c7a46; --bad:#b03a32; --warn:#9a6b0f;
  --c1:#2a62a0; --c2:#0d9488; --c3:#b7821c;
  --e-pend:#7d889a; --e-curso:#2a62a0; --e-bloq:#b03a32; --e-hecha:#1c7a46;
  --shadow:0 1px 2px rgba(15,23,42,.05),0 6px 18px rgba(15,23,42,.06);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,"Segoe UI",sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
.wrap{max-width:1380px;margin:0 auto;padding:18px 24px 50px}
.hero{position:relative;overflow:hidden;border-radius:18px;padding:22px 28px;color:#fff;background:linear-gradient(115deg,#0f2440 0%,#1b3a5c 55%,#0f5560 100%);box-shadow:0 10px 30px rgba(15,36,64,.22)}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,#e3c27a,#b98b2f 60%,transparent)}
.hero .k{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:700}
.hero h1{margin:4px 0 2px;font-family:"Playfair Display",Georgia,serif;font-weight:600;font-size:30px}
.hero h1 i{color:var(--gold)}
.hero .sub{color:#c9d5e4;font-size:13.5px}
.hero .acc{position:absolute;right:24px;top:22px;display:flex;gap:8px;flex-wrap:wrap}
.hbtn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);color:#fff;font-weight:600;font-size:13px;cursor:pointer}
.hbtn:hover{background:rgba(255,255,255,.16)}.hbtn.pri{background:var(--gold);border-color:var(--gold);color:var(--navy-d)}
@media (max-width:900px){.hero .acc{position:static;margin-top:12px}}
/* barra de control */
.ctrl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0}
.chips{display:flex;gap:4px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:4px}
.chip{border:0;background:none;padding:7px 13px;border-radius:9px;font-weight:600;font-size:13px;color:var(--text-2);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--navy);color:#fff}
.inp{padding:9px 12px;border-radius:10px;border:1px solid var(--border);background:var(--surface);outline:none;font-size:13px}
.inp:focus{border-color:var(--teal)}
.grow{flex:1;min-width:200px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 15px;border-radius:10px;border:1px solid var(--border);background:var(--surface);font-weight:700;font-size:13px;cursor:pointer}
.btn:hover{background:var(--surface-2)}.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn.bad{color:var(--bad)}
.filtro{display:inline-flex;align-items:center;gap:6px;background:#e8eef7;color:var(--navy);border-radius:999px;padding:5px 6px 5px 12px;font-size:12.5px;font-weight:700}
.filtro button{border:0;background:var(--navy);color:#fff;border-radius:999px;width:20px;height:20px;cursor:pointer;font-size:11px}
/* kpis */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:14px}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:12px 14px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--gold-d)}
.kpi.bad::before{background:var(--bad)}.kpi.ok::before{background:var(--good)}
.kpi .l{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.kpi .v{font-size:24px;font-weight:800;margin-top:3px;font-variant-numeric:tabular-nums}
.kpi .d{font-size:11.5px;color:var(--text-2)}
/* pestañas */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:14px;overflow-x:auto}
.tab{border:0;background:none;padding:10px 14px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--navy);border-bottom-color:var(--gold-d)}
/* tablero */
.board{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:#e9eef5;border-radius:14px;padding:10px;min-height:200px;display:flex;flex-direction:column;gap:8px;transition:background .15s}
.col.sobre{background:#dce6f3;outline:2px dashed var(--c1)}
.col-h{display:flex;align-items:center;gap:8px;padding:2px 4px 4px;font-weight:800;font-size:13px}
.col-h .pt{width:9px;height:9px;border-radius:50%}
.col-h .n{margin-left:auto;background:#fff;border-radius:999px;padding:1px 9px;font-size:12px;color:var(--text-2)}
.tc{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 11px;box-shadow:0 1px 2px rgba(15,23,42,.05);cursor:grab;position:relative}
.tc:hover{border-color:#b9c7da;box-shadow:0 6px 16px rgba(15,23,42,.08)}
.tc.arr{opacity:.45}
.tc .top{display:flex;gap:6px;align-items:center;margin-bottom:5px;flex-wrap:wrap}
.pr{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:999px;letter-spacing:.02em}
.pr.Crítica{background:#fbeceb;color:var(--bad)}.pr.Alta{background:#fdf2e3;color:#a35a00}.pr.Media{background:#e8eef7;color:var(--c1)}.pr.Baja{background:#eef1f4;color:var(--muted)}
.pj{font-size:11px;color:var(--teal);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px}
.tc h4{margin:0 0 6px;font-size:13.5px;line-height:1.35}
.tc .meta{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--text-2)}
.av{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:800;color:#fff;background:var(--navy);flex:none}
.fl.venc{color:var(--bad);font-weight:700}.fl.hoy{color:#a35a00;font-weight:700}
.prog{height:5px;background:var(--grid);border-radius:3px;overflow:hidden;margin-top:7px}.prog i{display:block;height:100%;background:var(--c2);border-radius:3px}
.obs{margin-top:7px;background:#fbeceb;border-radius:8px;padding:6px 8px;font-size:11.5px;color:#7c2620;line-height:1.4}
.mv{position:absolute;right:6px;top:6px;display:none;gap:3px}.tc:hover .mv{display:flex}
.mv button{border:1px solid var(--border);background:#fff;border-radius:6px;width:22px;height:22px;cursor:pointer;font-size:11px;color:var(--text-2)}
.addc{border:1px dashed #b9c7da;background:none;border-radius:10px;padding:8px;color:var(--text-2);font-weight:600;cursor:pointer}
.vacio{padding:26px 16px;text-align:center;color:var(--muted);font-size:13px;line-height:1.55}
.vacio b{display:block;color:var(--text);font-size:14.5px;margin-bottom:4px}
/* notas */
.notas{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.nt{border-radius:4px 14px 14px 14px;padding:14px 14px 12px;min-height:150px;box-shadow:0 6px 16px rgba(15,23,42,.08);cursor:pointer;position:relative;display:flex;flex-direction:column}
.nt h5{margin:0 0 6px;font-size:14px}.nt p{margin:0;font-size:13px;line-height:1.5;white-space:pre-wrap;flex:1;overflow:hidden;display:-webkit-box;-webkit-line-clamp:7;-webkit-box-orient:vertical}
.nt .pie{font-size:11px;opacity:.7;margin-top:8px}.nt .pin{position:absolute;right:10px;top:8px}
.n-amarillo{background:#fff6cc}.n-rosa{background:#fde4ea}.n-verde{background:#e1f5ea}.n-azul{background:#e2edfb}.n-lila{background:#ece6fb}
/* pulso */
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:1000px){.g2,.g3{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow)}
.pad{padding:16px 18px}
.ch-t{font-weight:800;font-size:14px;margin:0 0 2px}.ch-s{font-size:12px;color:var(--muted);margin-bottom:10px}
.fila{display:grid;grid-template-columns:150px 1fr 54px;gap:10px;align-items:center;padding:6px 4px;border-radius:8px;cursor:pointer;font-size:12.5px}
.fila:hover{background:var(--surface-2)}.fila .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.stk{display:flex;height:14px;border-radius:4px;overflow:hidden;background:var(--grid);gap:2px}.stk i{display:block;height:100%}
.fila .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.ley{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--text-2);margin-bottom:8px}.ley span{display:inline-flex;align-items:center;gap:5px}.ley i{width:10px;height:10px;border-radius:3px}
.salud{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px}
.salud.ok{background:#e9f6ef;color:var(--good)}.salud.rev{background:#fdf6e6;color:var(--warn)}.salud.bad{background:#fbeceb;color:var(--bad)}
.mat{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cu{border-radius:12px;padding:12px;cursor:pointer;border:1px solid var(--border);min-height:120px}
.cu:hover{box-shadow:var(--shadow)}.cu b{font-size:22px;display:block}.cu span{font-size:12px;font-weight:700}.cu small{display:block;font-size:11.5px;color:var(--text-2);margin-top:4px;line-height:1.4}
.cu.q1{background:#fbeceb}.cu.q2{background:#e8eef7}.cu.q3{background:#fdf6e6}.cu.q4{background:#f3f5f9}
.ol{list-style:none;margin:0;padding:0}.ol li{display:flex;gap:10px;align-items:flex-start;padding:9px 4px;border-bottom:1px solid var(--grid);font-size:13px;cursor:pointer}
.ol li:hover{background:var(--surface-2)}.ol li:last-child{border-bottom:0}
.imp{font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:999px;flex:none}
.imp.Alto{background:#fbeceb;color:var(--bad)}.imp.Medio{background:#fdf6e6;color:var(--warn)}.imp.Bajo{background:#eef1f4;color:var(--muted)}
.sem{display:flex;align-items:flex-end;gap:6px;height:140px;padding-top:8px}
.sem div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.sem i{display:block;width:70%;background:var(--c2);border-radius:4px 4px 0 0;min-height:2px}
.sem span{font-size:10.5px;color:var(--muted)}.sem b{font-size:11.5px}
/* lista */
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:9px 10px;border-bottom:1px solid var(--border);background:var(--surface-2);cursor:pointer;white-space:nowrap}
table.t td{padding:9px 10px;border-bottom:1px solid var(--grid);vertical-align:top}
table.t tr.cl{cursor:pointer}table.t tr.cl:hover td{background:#f6f9fc}
/* guía */
.guia{line-height:1.7;font-size:14px;color:var(--text-2)}.guia h3{color:var(--text);font-size:16px;margin:18px 0 6px}.guia h3:first-child{margin-top:0}
.guia b{color:var(--text)}.guia ul,.guia ol{padding-left:20px;margin:6px 0}
.prompt{background:#0f1c2e;color:#e6ecf5;border-radius:12px;padding:16px 18px;font-family:ui-monospace,Consolas,monospace;font-size:12.5px;line-height:1.6;white-space:pre-wrap;max-height:460px;overflow:auto}
/* diálogo */
.bg{position:fixed;inset:0;background:rgba(15,28,46,.45);display:flex;align-items:flex-start;justify-content:center;padding:30px 16px;z-index:60;overflow-y:auto}
.dlg{width:100%;max-width:660px;background:var(--surface);border-radius:16px;box-shadow:0 20px 60px rgba(15,23,42,.35)}
.dlg-h{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border)}.dlg-h h3{margin:0;font-size:16px}
.dlg-b{padding:14px 18px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dlg-f{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--border)}
.f{display:flex;flex-direction:column;gap:4px}.f.full{grid-column:1/-1}.f>span{font-size:11.5px;font-weight:700;color:var(--text-2)}
.f textarea{min-height:80px;resize:vertical}
.colores{display:flex;gap:8px}.colores button{width:28px;height:28px;border-radius:50%;border:2px solid transparent;cursor:pointer}.colores button[aria-pressed="true"]{border-color:var(--navy)}
.rango{display:flex;align-items:center;gap:10px}.rango input{flex:1}
.toast{position:fixed;right:18px;bottom:18px;background:var(--navy-d);color:#fff;padding:10px 14px;border-radius:10px;font-size:13px;z-index:80}
.toast.bad{background:var(--bad)}
.spin{display:inline-block;width:16px;height:16px;border-radius:50%;border:2px solid #dbe3ee;border-top-color:var(--navy);animation:sp .8s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
@media print{.hero .acc,.ctrl,.tabs,#maHdr,.mv,.addc{display:none!important}.card,.kpi,.tc{box-shadow:none}}
</style>
</head>
<body>
<!--MA_AUTH-->
<!--GS_CONEXION-->
<script>MA.iniciar({modulo:"bitacora",titulo:"Bitácora Ejecutiva"});</script>
<div class="wrap">
  <header class="hero">
    <div class="k">M&amp;A Capital · Gestión</div>
    <h1>Bitácora <i>Ejecutiva</i></h1>
    <div class="sub" id="heroSub">Tareas, asignaciones, notas y obstáculos del equipo</div>
    <div class="acc hidden" id="acc"><button class="hbtn" id="btnHoja">📗 Abrir la hoja</button><button class="hbtn" id="btnXls">⬇ Excel</button><button class="hbtn" id="btnRec">↻</button><button class="hbtn pri" id="btnNueva">＋ Nueva tarea</button></div>
  </header>
  <div id="app"><div class="vacio"><span class="spin"></span> Conectando…</div></div>
</div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ESTADOS=[["Pendiente","--e-pend"],["En curso","--e-curso"],["Bloqueada","--e-bloq"],["Hecha","--e-hecha"]];
const PRIOS=["Crítica","Alta","Media","Baja"], PESO={"Crítica":0,"Alta":1,"Media":2,"Baja":3};
const COLORES=["amarillo","rosa","verde","azul","lila"];
const hoy=()=>{ const d=new Date(); return new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())).toISOString().slice(0,10); };
const dias=iso=>Math.round((Date.parse(String(iso).slice(0,10))-Date.parse(hoy()))/864e5);
const fCorta=iso=>iso?new Date(String(iso).slice(0,10)+"T12:00:00").toLocaleDateString("es-PA",{day:"numeric",month:"short"}):"";
const ini=s=>{ const t=String(s||"?").replace(/@.*/,"").split(/[\s._-]+/).filter(Boolean); return ((t[0]||"?")[0]+((t[1]||"")[0]||"")).toUpperCase(); };
const nombre=s=>String(s||"Sin asignar").replace(/@.*/,"");
function toast(t,mal){ const d=document.createElement("div"); d.className="toast"+(mal?" bad":""); d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),mal?6000:2400); }
let T=[], N=[], HOJA="", DEMO=false, VISTA="tablero", PER="todo", Q="", F={}, ORD={k:"limite",d:1};

/* ============================ datos ============================ */
async function cargar(){
  if(DEMO){ pintar(); return; }
  try{ const r=await GS.llamar("bitacora.listar"); T=(r.tareas||[]).map(norm); N=r.notas||[]; HOJA=r.hoja||""; pintar(); }
  catch(e){ $("app").innerHTML=`<div class="card vacio"><b>No se pudo leer la Hoja de Google</b>${esc(e.message)}<br><br><button class="btn" id="reint">Reintentar</button> ${(await MA.listo).rol==="admin"&&!GS.fija?'<button class="btn" id="recon">Cambiar la URL</button>':""}</div>`;
    $("reint").onclick=cargar; if($("recon")) $("recon").onclick=()=>{ GS.desconectar(); arrancar(); }; }
}
function norm(t){ t.avance=+t.avance||0; t.prioridad=PRIOS.includes(t.prioridad)?t.prioridad:"Media"; t.estado=ESTADOS.some(e=>e[0]===t.estado)?t.estado:"Pendiente"; ["inicio","limite","cerrado"].forEach(k=>t[k]=t[k]?String(t[k]).slice(0,10):""); return t; }
async function guardarT(t){
  t=norm(Object.assign({},t)); if(t.estado==="Hecha") t.avance=100;
  if(DEMO){ if(!t.id){ t.id="d"+Date.now(); t.creado=new Date().toISOString(); t.creado_por="ejemplo"; } t.actualizado=new Date().toISOString(); if(t.estado==="Hecha"&&!t.cerrado) t.cerrado=hoy(); if(t.estado!=="Hecha") t.cerrado="";
    const i=T.findIndex(x=>x.id===t.id); i>=0?T[i]=t:T.push(t); pintar(); return; }
  const prev=T.slice(); const i=T.findIndex(x=>x.id===t.id); if(i>=0){ T[i]=t; pintar(); }
  try{ const r=norm(await GS.llamar("bitacora.guardarTarea",{tarea:t})); const j=T.findIndex(x=>x.id===r.id); j>=0?T[j]=r:T.push(r); pintar(); }
  catch(e){ T=prev; pintar(); toast("No se guardó: "+e.message,true); }
}
async function borrarT(id){ if(DEMO){ T=T.filter(x=>x.id!==id); pintar(); return; }
  try{ await GS.llamar("bitacora.borrarTarea",{id}); T=T.filter(x=>x.id!==id); pintar(); }catch(e){ toast(e.message,true); } }
async function guardarN(n){
  if(DEMO){ if(!n.id){ n.id="n"+Date.now(); n.creado=new Date().toISOString(); n.autor="ejemplo"; } const i=N.findIndex(x=>x.id===n.id); i>=0?N[i]=n:N.push(n); pintar(); return; }
  try{ const r=await GS.llamar("bitacora.guardarNota",{nota:n}); const i=N.findIndex(x=>x.id===r.id); i>=0?N[i]=r:N.push(r); pintar(); }catch(e){ toast("No se guardó la nota: "+e.message,true); }
}
async function borrarN(id){ if(DEMO){ N=N.filter(x=>x.id!==id); pintar(); return; }
  try{ await GS.llamar("bitacora.borrarNota",{id}); N=N.filter(x=>x.id!==id); pintar(); }catch(e){ toast(e.message,true); } }

/* ============================ filtros ============================ */
function enPeriodo(t){
  if(PER==="todo") return true; if(!t.limite) return PER!=="hoy"&&t.estado!=="Hecha";
  const d=dias(t.limite), abierta=t.estado!=="Hecha";
  if(PER==="hoy") return d<=0&&(abierta||t.cerrado===hoy());
  if(PER==="semana") return d<=7&&(abierta||dias(t.cerrado||t.limite)>=-7);
  if(PER==="mes") return d<=31&&(abierta||dias(t.cerrado||t.limite)>=-31);
  return true;
}
function visibles(){ const q=Q.trim().toLowerCase();
  return T.filter(t=>enPeriodo(t)&&(!F.responsable||nombre(t.responsable)===F.responsable)&&(!F.proyecto||(t.proyecto||"Sin proyecto")===F.proyecto)&&(!F.ids||F.ids.includes(t.id))
    &&(!q||[t.titulo,t.descripcion,t.responsable,t.proyecto,t.obstaculo].join(" ").toLowerCase().includes(q))); }
const ordenar=ts=>ts.slice().sort((a,b)=>(a.limite||"9999").localeCompare(b.limite||"9999")||PESO[a.prioridad]-PESO[b.prioridad]);

/* ============================ pantalla ============================ */
function pintar(){
  $("acc").classList.remove("hidden"); $("btnHoja").classList.toggle("hidden",DEMO||!HOJA);
  const vs=visibles(), act=vs.filter(t=>t.estado!=="Hecha");
  const hechas=vs.filter(t=>t.estado==="Hecha").length, venc=act.filter(t=>t.limite&&dias(t.limite)<0).length;
  const prom=act.length?Math.round(act.reduce((s,t)=>s+(+t.avance||0),0)/act.length):0;

    <h4>${esc(t.titulo)}</h4>
    <div class="meta"><span class="av" title="${esc(t.responsable||"Sin asignar")}">${esc(ini(t.responsable))}</span><span>${esc(nombre(t.responsable))}</span>
      ${t.limite?`<span class="fl ${abierta&&d<0?"venc":abierta&&d===0?"hoy":""}" style="margin-left:auto">📅 ${fCorta(t.limite)}${abierta&&d<0?` · ${-d} d tarde`:""}</span>`:""}</div>
    ${t.estado!=="Pendiente"?`<div class="prog" title="Avance ${t.avance}%"><i style="width:${t.avance}%"></i></div>`:""}
    ${t.estado==="Bloqueada"&&t.obstaculo?`<div class="obs">⛔ ${esc(t.obstaculo)}${t.impacto?` · impacto ${esc(t.impacto.toLowerCase())}`:""}</div>`:""}
  </div>`;
}
function vTablero(vs){
  $("vista").innerHTML=`<div class="board">${ESTADOS.map(([e,c])=>{ const ts=ordenar(vs.filter(t=>t.estado===e));
    return `<div class="col" data-e="${e}"><div class="col-h"><span class="pt" style="background:var(${c})"></span>${e}<span class="n">${ts.length}</span></div>
      ${ts.map(tarjeta).join("")||`<div class="vacio" style="padding:14px">Sin tareas</div>`}
      ${e!=="Hecha"?`<button class="addc" data-add="${e}">＋ Agregar</button>`:""}</div>`; }).join("")}</div>`;
  const V=$("vista");
  V.querySelectorAll(".tc").forEach(c=>{ const t=T.find(x=>x.id===c.dataset.id);
    c.onclick=e=>{ if(e.target.closest(".mv")) return; editor(t); };
    c.ondragstart=e=>{ e.dataTransfer.setData("text/plain",t.id); c.classList.add("arr"); };
    c.ondragend=()=>c.classList.remove("arr");
    c.querySelectorAll("[data-mv]").forEach(b=>b.onclick=()=>{ const i=ESTADOS.findIndex(x=>x[0]===t.estado)+(+b.dataset.mv); if(i>=0&&i<ESTADOS.length) mover(t,ESTADOS[i][0]); }); });
  V.querySelectorAll(".col").forEach(col=>{
    col.ondragover=e=>{ e.preventDefault(); col.classList.add("sobre"); }; col.ondragleave=()=>col.classList.remove("sobre");
    col.ondrop=e=>{ e.preventDefault(); col.classList.remove("sobre"); const t=T.find(x=>x.id===e.dataTransfer.getData("text/plain")); if(t&&t.estado!==col.dataset.e) mover(t,col.dataset.e); }; });
  V.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>editor({estado:b.dataset.add}));
}
function mover(t,e){
  if(e==="Bloqueada"&&!t.obstaculo){ editor(Object.assign({},t,{estado:"Bloqueada"}),"Describe el obstáculo que la bloquea"); return; }
  const n=Object.assign({},t,{estado:e}); if(e==="En curso"&&!n.avance) n.avance=10; if(e!=="Bloqueada"&&t.estado==="Bloqueada"&&e!=="Hecha"){} guardarT(n);
}

/* ---------- Pulso del equipo (interactivo) ---------- */
function apilado(ts){ const tot=ts.length||1; return ESTADOS.map(([e,c])=>{ const n=ts.filter(t=>t.estado===e).length; return n?`<i style="width:${100*n/tot}%;background:var(${c})" title="${e}: ${n}"></i>`:""; }).join(""); }
function salud(ts){ const act=ts.filter(t=>t.estado!=="Hecha"); if(!act.length) return ["ok","Al día"];
  const v=act.filter(t=>t.limite&&dias(t.limite)<0).length, b=act.filter(t=>t.estado==="Bloqueada").length;
  return v/act.length>.25||b/act.length>.25?["bad","En riesgo"]:v||b?["rev","Atención"]:["ok","Al día"]; }
function vPulso(vs){
  const act=vs.filter(t=>t.estado!=="Hecha");
  const grupo=k=>{ const m={}; vs.forEach(t=>{ const g=k==="responsable"?nombre(t.responsable):(t.proyecto||"Sin proyecto"); (m[g]=m[g]||[]).push(t); }); return Object.entries(m).sort((a,b)=>b[1].length-a[1].length); };
  const proy=grupo("proyecto"), pers=grupo("responsable");
  const urg=t=>t.limite&&dias(t.limite)<=3, imp=t=>PESO[t.prioridad]<=1;
  const Q4=[["q1","Hacer ya","Importantes y urgentes",act.filter(t=>imp(t)&&urg(t))],["q2","Planificar","Importantes, no urgentes",act.filter(t=>imp(t)&&!urg(t))],["q3","Delegar o resolver rápido","Urgentes, menos importantes",act.filter(t=>!imp(t)&&urg(t))],["q4","Después","Ni urgentes ni importantes",act.filter(t=>!imp(t)&&!urg(t))]];
  const bloq=act.filter(t=>t.estado==="Bloqueada").sort((a,b)=>({Alto:0,Medio:1,Bajo:2}[a.impacto]??3)-({Alto:0,Medio:1,Bajo:2}[b.impacto]??3));
  // completadas por semana (últimas 8)
  const sems=[]; for(let i=7;i>=0;i--){ const fin=new Date(Date.parse(hoy())-i*7*864e5), ini_=new Date(fin.getTime()-6*864e5); sems.push({ini:ini_.toISOString().slice(0,10),fin:fin.toISOString().slice(0,10)}); }
  sems.forEach(s=>s.n=T.filter(t=>t.estado==="Hecha"&&t.cerrado&&t.cerrado>=s.ini&&t.cerrado<=s.fin).length); const smx=Math.max(1,...sems.map(s=>s.n));
  const aTiempo=T.filter(t=>t.estado==="Hecha"&&t.cerrado&&t.limite), ok=aTiempo.filter(t=>t.cerrado<=t.limite).length;
  const ley=`<div class="ley">${ESTADOS.map(([e,c])=>`<span><i style="background:var(${c})"></i>${e}</span>`).join("")}</div>`;
  $("vista").innerHTML=`
    <div class="g2">
      <div class="card pad"><p class="ch-t">Nivel de avance por proyecto</p><div class="ch-s">Toca un proyecto para ver solo sus tareas en el tablero</div>${ley}
        ${proy.map(([p,ts])=>{ const a=ts.filter(t=>t.estado!=="Hecha"), av=Math.round(ts.reduce((s,t)=>s+(t.estado==="Hecha"?100:+t.avance||0),0)/ts.length), [k,l]=salud(ts);
          return `<div class="fila" data-pj="${esc(p)}"><span class="nm" title="${esc(p)}">${esc(p)}</span><span><span class="stk">${apilado(ts)}</span><span style="font-size:11px;color:var(--muted)">${av}% de avance · ${a.length} activas · <span class="salud ${k}">${l}</span></span></span><span class="v">${ts.length}</span></div>`; }).join("")||`<div class="vacio">Sin tareas en la vista.</div>`}</div>
      <div class="card pad"><p class="ch-t">Carga por persona</p><div class="ch-s">Toca una persona para filtrar el tablero</div>${ley}
        ${pers.map(([p,ts])=>{ const v=ts.filter(t=>t.estado!=="Hecha"&&t.limite&&dias(t.limite)<0).length;
          return `<div class="fila" data-rs="${esc(p)}"><span class="nm" title="${esc(p)}"><span class="av" style="display:inline-grid;margin-right:6px;vertical-align:middle">${esc(ini(p))}</span>${esc(p)}</span><span><span class="stk">${apilado(ts)}</span>${v?`<span style="font-size:11px;color:var(--bad);font-weight:700">${v} vencida(s)</span>`:""}</span><span class="v">${ts.filter(t=>t.estado!=="Hecha").length}</span></div>`; }).join("")||`<div class="vacio">Sin tareas en la vista.</div>`}</div>
    </div>
    <div class="g3" style="margin-top:12px">
      <div class="card pad"><p class="ch-t">Matriz de prioridades</p><div class="ch-s">Importante = crítica o alta · Urgente = vence en 3 días o menos</div>
        <div class="mat">${Q4.map(([c,t1,t2,ts])=>`<div class="cu ${c}" data-q="${c}"><b>${ts.length}</b><span>${t1}</span><small>${t2}${ts.length?"<br>"+ts.slice(0,2).map(t=>"· "+esc(t.titulo)).join("<br>"):""}</small></div>`).join("")}</div></div>
      <div class="card pad"><p class="ch-t">Obstáculos activos</p><div class="ch-s">Tareas bloqueadas, de mayor a menor impacto</div>
        ${bloq.length?`<ul class="ol">${bloq.map(t=>`<li data-id="${esc(t.id)}"><span class="imp ${esc(t.impacto||"")}">${esc(t.impacto||"Sin impacto")}</span><span><b>${esc(t.titulo)}</b><br><span style="color:var(--text-2)">⛔ ${esc(t.obstaculo||"")}</span><br><span style="font-size:11.5px;color:var(--muted)">${esc(nombre(t.responsable))}${t.actualizado?` · bloqueada desde hace ${Math.max(0,-dias(String(t.actualizado).slice(0,10)))} día(s)`:""}</span></span></li>`).join("")}</ul>`:`<div class="vacio" style="padding:16px">No hay tareas bloqueadas. 👏</div>`}</div>
      <div class="card pad"><p class="ch-t">Ritmo del equipo</p><div class="ch-s">Tareas completadas por semana · cumplidas a tiempo: <b style="color:var(--text)">${aTiempo.length?Math.round(100*ok/aTiempo.length)+"%":"—"}</b></div>
        <div class="sem">${sems.map(s=>`<div title="${fCorta(s.ini)} – ${fCorta(s.fin)}: ${s.n}"><b>${s.n||""}</b><i style="height:${Math.round(100*s.n/smx)}%"></i><span>${fCorta(s.fin)}</span></div>`).join("")}</div></div>
    </div>`;
  const V=$("vista");
  V.querySelectorAll("[data-pj]").forEach(e=>e.onclick=()=>{ F.proyecto=e.dataset.pj; VISTA="tablero"; pintar(); });
  V.querySelectorAll("[data-rs]").forEach(e=>e.onclick=()=>{ F.responsable=e.dataset.rs; VISTA="tablero"; pintar(); });
  V.querySelectorAll("[data-q]").forEach(e=>e.onclick=()=>{ const q=Q4.find(x=>x[0]===e.dataset.q); F.ids=q[3].map(t=>t.id); F.etiqueta=q[1]; VISTA="tablero"; pintar(); });
  V.querySelectorAll(".ol li").forEach(e=>e.onclick=()=>editor(T.find(t=>t.id===e.dataset.id)));
}

/* ---------- Lista ---------- */
function vLista(vs){
  const cols=[["titulo","Tarea"],["responsable","Responsable"],["proyecto","Proyecto"],["prioridad","Prioridad"],["estado","Estado"],["avance","Avance"],["limite","Límite"]];
  const s=vs.slice().sort((a,b)=>{ const k=ORD.k; const x=k==="prioridad"?PESO[a[k]]:a[k]??"", y=k==="prioridad"?PESO[b[k]]:b[k]??""; return (x>y?1:x<y?-1:0)*ORD.d; });
  $("vista").innerHTML=`<div class="card" style="overflow-x:auto"><table class="t"><thead><tr>${cols.map(([k,l])=>`<th data-k="${k}">${l}${ORD.k===k?(ORD.d>0?" ▲":" ▼"):""}</th>`).join("")}</tr></thead><tbody>${
    s.map(t=>{ const d=t.limite?dias(t.limite):null; return `<tr class="cl" data-id="${esc(t.id)}"><td><b>${esc(t.titulo)}</b>${t.estado==="Bloqueada"&&t.obstaculo?`<div style="font-size:11.5px;color:var(--bad)">⛔ ${esc(t.obstaculo)}</div>`:""}</td><td>${esc(nombre(t.responsable))}</td><td>${esc(t.proyecto||"")}</td><td><span class="pr ${t.prioridad}">${t.prioridad}</span></td><td>${t.estado}</td><td>${t.avance}%</td><td class="fl ${t.estado!=="Hecha"&&d!=null&&d<0?"venc":""}">${t.limite?fCorta(t.limite):"—"}</td></tr>`; }).join("")||`<tr><td colspan="7" class="vacio">Sin tareas en la vista.</td></tr>`}</tbody></table></div>`;
  $("vista").querySelectorAll("th").forEach(h=>h.onclick=()=>{ ORD=ORD.k===h.dataset.k?{k:ORD.k,d:-ORD.d}:{k:h.dataset.k,d:1}; vLista(vs); });
  $("vista").querySelectorAll("tr.cl").forEach(r=>r.onclick=()=>editor(T.find(t=>t.id===r.dataset.id)));
}
