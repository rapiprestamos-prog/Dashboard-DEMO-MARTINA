/* ============================ Due diligence ============================ */
const DATOS_DD=[["partes","Partes"],["fincas","Fincas"],["fechas","Fechas y vigencias"],["montos","Montos"],["gravamenes","Gravámenes"]];
async function vDD(){
  $("main").innerHTML=`
    <div class="k">Agente legal</div><h1 class="t">Due diligence</h1><div class="sub">Extrae los datos clave de todos los documentos del caso y marca lo que no coincide.</div>
    <div class="card pad" style="margin-bottom:14px"><div class="row">
      <label class="f"><span>Caso</span><select class="inp" id="ddCaso">${opcCasos(CASO_SEL)}</select></label>
      <div class="f" style="flex:2"><span>Qué datos buscar</span><div class="checks">${DATOS_DD.map(([k,l])=>`<label><input type="checkbox" value="${k}" checked> ${l}</label>`).join("")}</div></div>
      <button class="btn pri" id="ddRun" style="margin-bottom:10px">Correr</button></div>
      <div class="nota" id="ddInfo"></div></div>
    <div id="ddRes"></div>`;
  if(!CASOS.length){ $("ddRes").innerHTML=`<div class="card vacio"><b>No hay casos</b>Agrega subcarpetas a la carpeta Legal.</div>`; return; }
  const info=async()=>{ const c=selCaso("ddCaso"); $("ddInfo").innerHTML=`Usará ${c.archivos.length} documento(s) de <b>${esc(RAIZ.name)} / ${esc(c.nombre)}</b>. Solo se lee esta subcarpeta.`;
    const u=await ultimoResultado(c.nombre,"due_diligence"); if(u) pintarDD(u.resultado,`Último análisis: ${fHora(u.creado)} · ${u.usuario}`); else $("ddRes").innerHTML=""; };
  $("ddCaso").onchange=info; info();
  $("ddRun").onclick=async()=>{
    const c=selCaso("ddCaso"); const datos=[...$("main").querySelectorAll(".checks input:checked")].map(x=>DATOS_DD.find(d=>d[0]===x.value)[1]);
    if(!datos.length){ toast("Marca al menos un dato",true); return; }
    $("ddRun").disabled=true; const el=$("ddRes");
    try{ const {docs,omitidos}=await docsDe(c.archivos,t=>trabajando(el,t));
      if(!docs.length) throw new Error("No se pudo leer ningún documento del caso (PDF con texto, Word, Excel o texto).");
      trabajando(el,`Analizando ${docs.length} documento(s) con IA…`);
      const r=await ia("due_diligence",{caso:c.nombre,datos,documentos:docs}); r.omitidos=omitidos; r.documentos_leidos=docs.length;
      await guardarResultado(c.nombre,"due_diligence",r); pintarDD(r,`Análisis de ahora · ${YO}`);
    }catch(e){ el.innerHTML=`<div class="aviso bad">${esc(e.message)}</div>`; }
    $("ddRun").disabled=false;
  };
}
const ESTADO_DD=e=>{ e=String(e||"").toLowerCase(); return e.startsWith("coinc")?["ok","Coincide"]:e.startsWith("dif")?["bad","Diferencia"]:["rev","Revisar"]; };
function pintarDD(r,pie){
  const ds=r.datos||[]; const n=k=>ds.filter(d=>ESTADO_DD(d.estado)[0]===k).length;
  $("ddRes").innerHTML=`
    <div class="grid4" style="margin-bottom:12px">
      <div class="card kpi"><div class="k">Documentos leídos</div><div class="v">${r.documentos_leidos??"—"}</div></div>
      <div class="card kpi ok"><div class="k">Coinciden</div><div class="v">${n("ok")}</div></div>
      <div class="card kpi rev"><div class="k">Para revisar</div><div class="v">${n("rev")}</div></div>
      <div class="card kpi bad"><div class="k">Diferencias</div><div class="v">${n("bad")}</div></div></div>
    <div class="card"><div class="pad" style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><b>Datos encontrados</b><span class="nota">${esc(pie||"")}</span><button class="btn sm" id="ddWord">⬇ Descargar informe (Word)</button></div>
    ${ds.length?`<table class="t"><thead><tr><th>Dato</th><th>Valor encontrado</th><th>Dónde aparece</th><th>Estado</th></tr></thead><tbody>${ds.map(d=>{ const [k,l]=ESTADO_DD(d.estado);
      return `<tr><td><b>${esc(d.dato)}</b></td><td>${esc(d.valor||"")}${(d.valores||[]).length>1?`<div class="nota">${d.valores.map(v=>esc(v.valor)+" ("+esc(v.documento)+")").join("<br>")}</div>`:""}${d.nota?`<div class="nota">${esc(d.nota)}</div>`:""}</td><td class="nota">${esc((d.documentos||[]).join(", "))}</td><td><span class="tag ${k}">${l}</span></td></tr>`; }).join("")}</tbody></table>`
      :`<div class="vacio">Sin datos.</div>`}
    ${(r.omitidos||[]).length?`<div class="pad nota">No se pudieron leer: ${r.omitidos.map(esc).join(", ")} (por ejemplo, PDF escaneados sin texto).</div>`:""}</div>`;
  $("ddWord").onclick=async()=>{
    const filas=[["Dato","Valor encontrado","Dónde aparece","Estado"],...ds.map(d=>[d.dato,(d.valor||"")+((d.valores||[]).length>1?"\n"+d.valores.map(v=>v.valor+" ("+v.documento+")").join("\n"):"")+(d.nota?"\n"+d.nota:""),(d.documentos||[]).join(", "),ESTADO_DD(d.estado)[1]])];
    descargar(await docxSimple("Informe de due diligence",[`Caso: ${CASO_SEL}`,`Fecha: ${new Date().toLocaleDateString("es-PA")}`,`Documentos leídos: ${r.documentos_leidos??""} · Coinciden: ${n("ok")} · Para revisar: ${n("rev")} · Diferencias: ${n("bad")}`],filas),`Due diligence - ${limpiaNombre(CASO_SEL)}.docx`);
  };
}

/* ============================ Word simple (informes) ============================ */
const xe=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const runXml=(t,b)=>String(t).split("\n").map((l,i)=>`${i?"<w:r><w:br/></w:r>":""}<w:r>${b?"<w:rPr><w:b/></w:rPr>":""}<w:t xml:space="preserve">${xe(l)}</w:t></w:r>`).join("");
async function docxSimple(titulo,lineas,tabla){
  const z=new JSZip();
  z.file("[Content_Types].xml",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>`);
  z.file("_rels/.rels",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`);
  const tbl=tabla?`<w:tbl><w:tblPr><w:tblW w:w="5000" w:type="pct"/><w:tblBorders>${["top","left","bottom","right","insideH","insideV"].map(b=>`<w:${b} w:val="single" w:sz="4" w:color="BFC8D6"/>`).join("")}</w:tblBorders></w:tblPr>${
    tabla.map((f,i)=>`<w:tr>${f.map(c=>`<w:tc><w:p>${runXml(c,i===0)}</w:p></w:tc>`).join("")}</w:tr>`).join("")}</w:tbl>`:"";
  z.file("word/document.xml",`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="${W}"><w:body>
    <w:p><w:pPr><w:spacing w:after="200"/></w:pPr><w:r><w:rPr><w:b/><w:sz w:val="32"/></w:rPr><w:t>${xe(titulo)}</w:t></w:r></w:p>
    ${lineas.map(l=>`<w:p>${runXml(l)}</w:p>`).join("")}<w:p/>${tbl}<w:p/></w:body></w:document>`);
  return z.generateAsync({type:"blob",mimeType:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"});
}

/* ============================ Redacción asistida ============================ */
const RX_CAMPO=/\[([^\[\]\n]{1,80})\]/g;
let RED={paso:1,caso:null,plantilla:null,idioma:"Español",parrafos:[],campos:{},fuentes:{},cambios:[],validaciones:null};
async function cargarPlantilla(nombre){
  const a=PLANTILLAS.find(p=>p.ruta===nombre); if(!a) return;
  const {ps}=await parrafosDocx(await (await a.handle.getFile()).arrayBuffer());
  RED.plantilla=nombre; RED.parrafos=ps.map(textoParrafo); RED.cambios=[]; RED.validaciones=null;
  const nuevos={}; camposDe().forEach(k=>nuevos[k]=RED.campos[k]||""); RED.campos=nuevos;
}
function camposDe(){ const s=new Set(); RED.parrafos.forEach(t=>{ for(const m of t.matchAll(RX_CAMPO)) s.add(m[1].trim()); }); return [...s]; }
const textoFinal=i=>{ const c=RED.cambios.find(x=>x.parrafo===i&&x.aceptado); return (c?c.propuesto:RED.parrafos[i]); };
function vRed(){
  if(!RED.caso&&CASOS.length) RED.caso=CASO_SEL||CASOS[0].nombre;
  const P=[[1,"1 Datos"],[2,"2 Vista previa"],[3,"3 Cambios"],[4,"4 Validar y descargar"]];
  $("main").innerHTML=`<div class="k">Agente legal</div><h1 class="t">Redacción asistida</h1><div class="sub">El texto de la plantilla no se toca: solo se llenan los campos resaltados.</div>
    <div class="pasos">${P.map(([n,l])=>`<button class="paso${RED.paso===n?" on":""}" data-p="${n}">${l}</button>`).join("")}</div><div id="redBody"></div>`;
  $("main").querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{ if(+b.dataset.p>1&&!RED.plantilla){ toast("Primero elige una plantilla",true); return; } RED.paso=+b.dataset.p; vRed(); });
  ({1:redDatos,2:redPrevia,3:redCambios,4:redValidar})[RED.paso]();
}
function redDatos(){
  const campos=camposDe();
  $("redBody").innerHTML=`
    <div class="card pad" style="margin-bottom:12px"><b>Caso y documento</b>
      <div class="row" style="margin-top:8px">
        <label class="f"><span>Caso</span><select class="inp" id="rCaso">${opcCasos(RED.caso)}</select></label>
        <label class="f"><span>Plantilla (carpeta Plantillas)</span><select class="inp" id="rPl"><option value="">— Elegir —</option>${PLANTILLAS.map(p=>`<option value="${esc(p.ruta)}"${p.ruta===RED.plantilla?" selected":""}>${esc(p.nombre.replace(/\.docx$/i,""))}</option>`).join("")}</select></label>
        <label class="f"><span>Idioma de los campos</span><select class="inp" id="rId">${["Español","English","Bilingüe"].map(i=>`<option${i===RED.idioma?" selected":""}>${i}</option>`).join("")}</select></label></div>
      ${PLANTILLAS.length?"":`<div class="aviso">No hay plantillas. Crea la subcarpeta <b>Plantillas</b> dentro de la carpeta Legal y pon ahí los Word con los campos entre corchetes, por ejemplo <span class="mono">[NOMBRE DEL FIRMANTE]</span>.</div>`}</div>
    ${RED.plantilla?`<div class="card pad"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px">
        <b>Campos de la plantilla (${campos.length})</b><button class="btn teal" id="rLlenar">✨ Llenar con IA desde el caso</button></div>
      <div class="err" id="rErr"></div>
      ${campos.length?`<div class="grid3" style="grid-template-columns:repeat(2,minmax(0,1fr))">${campos.map(k=>`<label class="f"><span>[${esc(k)}]</span><input class="inp" data-campo="${esc(k)}" value="${esc(RED.campos[k]||"")}">${RED.fuentes[k]?`<span class="nota">Fuente: ${esc(RED.fuentes[k])}</span>`:""}</label>`).join("")}</div>`
        :`<div class="nota">Esta plantilla no tiene campos entre corchetes.</div>`}
      <div style="text-align:right;margin-top:8px"><button class="btn pri" id="rSig">Ver vista previa →</button></div></div>`:""}`;
  $("rCaso").onchange=e=>{ RED.caso=e.target.value; CASO_SEL=RED.caso; };
  $("rId").onchange=e=>RED.idioma=e.target.value;
  $("rPl").onchange=async e=>{ if(!e.target.value){ RED.plantilla=null; RED.parrafos=[]; } else{ try{ await cargarPlantilla(e.target.value); }catch(err){ toast("No se pudo leer la plantilla: "+err.message,true); } } redDatos(); };
  $("redBody").querySelectorAll("[data-campo]").forEach(i=>i.oninput=()=>RED.campos[i.dataset.campo]=i.value);
  if($("rSig")) $("rSig").onclick=()=>{ RED.paso=2; vRed(); };
  if($("rLlenar")) $("rLlenar").onclick=async()=>{
    const c=casoPor(RED.caso); if(!c){ toast("Elige un caso",true); return; }
    $("rLlenar").disabled=true;
    try{ const {docs}=await docsDe(c.archivos,t=>$("rErr").innerHTML=`<span class="spin"></span> ${esc(t)}`);
      $("rErr").innerHTML=`<span class="spin"></span> Buscando los datos en ${docs.length} documento(s)…`;
      const r=await ia("redaccion_campos",{caso:c.nombre,idioma:RED.idioma,campos:camposDe(),plantilla:RED.parrafos.join("\n"),documentos:docs,sociedad:(META[c.nombre]||{}).sociedad||null});
      Object.entries(r.campos||{}).forEach(([k,v])=>{ if(v&&v.valor){ RED.campos[k]=v.valor; RED.fuentes[k]=v.fuente||""; } });
      const vacios=camposDe().filter(k=>!RED.campos[k]).length;
      redDatos(); toast(vacios?`Listo. ${vacios} campo(s) no aparecen en el caso: llénalos a mano.`:"Campos llenados");
    }catch(e){ $("rErr").textContent=e.message; $("rLlenar").disabled=false; }
  };
}
function htmlParrafo(t){ return esc(t).replace(/\[([^\[\]\n]{1,80})\]/g,(m,k)=>{ const v=RED.campos[k.trim()]; return v?`<mark class="ok" title="[${esc(k)}]">${esc(v)}</mark>`:`<mark class="falta">${m}</mark>`; }); }
function redPrevia(){
  $("redBody").innerHTML=`<div class="nota" style="margin-bottom:8px"><mark class="ok">Campo llenado</mark> · <mark class="falta">[Campo sin llenar]</mark> · <span style="background:#e7f6ee;padding:0 4px">Cambio aceptado</span></div>
    <div class="doc">${RED.parrafos.map((t,i)=>`<p class="${RED.cambios.some(c=>c.parrafo===i&&c.aceptado)?"cambio":""}">${htmlParrafo(textoFinal(i))||"&nbsp;"}</p>`).join("")}</div>`;
}
function redCambios(){
  $("redBody").innerHTML=`<div class="card pad" style="margin-bottom:12px"><b>Cambios específicos</b>
      ${RED.cambios.length?RED.cambios.map((c,j)=>`<div class="card pad" style="margin-top:10px"><div class="nota">Párrafo ${c.parrafo+1} · Pedido: “${esc(c.pedido)}”</div>
        <div style="margin:6px 0"><s class="nota">${esc(RED.parrafos[c.parrafo]).slice(0,600)}</s></div><div>${esc(c.propuesto)}</div>${c.explicacion?`<div class="nota" style="margin-top:4px">${esc(c.explicacion)}</div>`:""}
        <div style="margin-top:8px">${c.aceptado?`<span class="tag ok">Aceptado</span> <button class="btn sm" data-r="${j}">Deshacer</button>`:`<button class="btn sm teal" data-a="${j}">Aceptar</button> <button class="btn sm" data-r="${j}">Rechazar</button>`}</div></div>`).join("")
        :`<div class="nota" style="margin-top:6px">Todavía no hay cambios pedidos.</div>`}

// Llena la plantilla Word conservando su formato: los campos se reemplazan dentro de su mismo texto
async function llenarDocx(buf){
  const {zip,doc,ps}=await parrafosDocx(buf);
  ps.forEach((p,i)=>{
    const ts=[...p.getElementsByTagNameNS(W,"t")]; if(!ts.length) return;
    const cambio=RED.cambios.find(c=>c.parrafo===i&&c.aceptado);
    const llenar=s=>s.replace(RX_CAMPO,(m,k)=>RED.campos[k.trim()]||m);
    if(cambio){ ts[0].textContent=llenar(cambio.propuesto); ts[0].setAttribute("xml:space","preserve"); ts.slice(1).forEach(t=>t.textContent=""); return; }
    ts.forEach(t=>{ const n=llenar(t.textContent); if(n!==t.textContent){ t.textContent=n; t.setAttribute("xml:space","preserve"); } });
    // campo partido en varios tramos de texto: se une en el primer tramo
    const full=ts.map(t=>t.textContent).join(""), lleno=llenar(full);
    if(lleno!==full){ ts[0].textContent=lleno; ts[0].setAttribute("xml:space","preserve"); ts.slice(1).forEach(t=>t.textContent=""); }
  });
  zip.file("word/document.xml",new XMLSerializer().serializeToString(doc));
  return zip.generateAsync({type:"blob",mimeType:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"});
}

  $("qRun").onclick=run; $("qP").onkeydown=e=>{ if(e.key==="Enter") run(); };
}
async function mSemaforo(){
  $("masB").innerHTML=`<div class="card"><div class="pad nota">Evalúa el riesgo de cada caso con sus documentos. Se guarda la última evaluación.</div><div id="sT"><div class="pad"><span class="spin"></span></div></div></div><div id="sDet" style="margin-top:12px"></div>`;
  let ult={}; try{ (await q(SB.from("lg_resultados").select("*").eq("herramienta","semaforo").order("creado",{ascending:false}))).forEach(r=>{ if(!ult[r.caso]) ult[r.caso]=r; }); }catch(e){}
  const nivel=r=>String((r&&r.resultado&&r.resultado.nivel)||"").toLowerCase();
  $("sT").innerHTML=CASOS.length?`<table class="t"><thead><tr><th></th><th>Caso</th><th>Resumen</th><th>Evaluado</th><th></th></tr></thead><tbody>${CASOS.map(c=>{ const r=ult[c.nombre]; const nv=nivel(r);
    return `<tr class="${r?"cl":""}" data-v="${esc(c.nombre)}"><td>${r?`<span class="semaf ${esc(nv)}"></span>`:""}</td><td><b>${esc(c.nombre)}</b></td><td class="nota">${esc(r?r.resultado.resumen||"":"Sin evaluar")}</td><td class="nota">${r?fHora(r.creado):""}</td><td><button class="btn sm" data-ev="${esc(c.nombre)}">Evaluar</button></td></tr>`; }).join("")}</tbody></table>`:`<div class="vacio">No hay casos.</div>`;
  const det=r=>{ $("sDet").innerHTML=`<div class="card"><div class="pad"><span class="semaf ${esc(nivel(r))}"></span> <b>${esc(r.caso)}</b> · ${esc(r.resultado.resumen||"")}</div><table class="t"><thead><tr><th>Riesgo</th><th>Gravedad</th><th>Documento</th></tr></thead><tbody>${(r.resultado.riesgos||[]).map(x=>`<tr><td>${esc(x.riesgo)}</td><td><span class="tag ${/alta/i.test(x.gravedad)?"bad":/media/i.test(x.gravedad)?"rev":"ok"}">${esc(x.gravedad)}</span></td><td class="nota">${esc(x.documento||"")}</td></tr>`).join("")||`<tr><td colspan="3" class="nota">Sin riesgos señalados.</td></tr>`}</tbody></table></div>`; };
  $("sT").querySelectorAll("tr[data-v]").forEach(tr=>tr.onclick=e=>{ if(e.target.closest("button")) return; const r=ult[tr.dataset.v]; if(r) det(r); });
  $("sT").querySelectorAll("[data-ev]").forEach(b=>b.onclick=async()=>{ const c=casoPor(b.dataset.ev); b.disabled=true; b.innerHTML='<span class="spin"></span>';
    try{ const {docs}=await docsDe(c.archivos); if(!docs.length) throw new Error("No se pudo leer ningún documento de "+c.nombre);
      const r=await ia("semaforo",{caso:c.nombre,documentos:docs}); await guardarResultado(c.nombre,"semaforo",r);
      await mSemaforo(); det({caso:c.nombre,resultado:r}); }
    catch(e){ toast(e.message,true); b.disabled=false; b.textContent="Evaluar"; } });
}

return {ir:v=>{ if(!RAIZ){ VISTA=v; pantallaConectar(); } else ir(v); }, iniciar, alCambiarCarpeta};
}
(function(){

  const host=document.getElementById("h-casos"); const root=host.attachShadow({mode:"open"}); root.append(document.getElementById("tpl-casos").content.cloneNode(true));
  const nav=document.getElementById("tabs");
  [["inicio","Inicio"],["dd","Due diligence"],["red","Redacción"],["cierre","Cierre"]].reverse().forEach(([k,t])=>{ const b=document.createElement("button"); b.type="button"; b.dataset.v=k; b.setAttribute("aria-selected","false"); b.textContent=t; nav.prepend(b); });
  const CAS=["inicio","dd","red","cierre"];
  let app=null, arrancado=false;
  SH.go=function(v){ this.view=v; const enCasos=CAS.includes(v);
    $s("#v-chat").hidden=v!=="chat"; $s("#v-ag").hidden=v!=="ag"; const d=$s("#v-doc"); if(d) d.hidden=v!=="doc"; $s("#v-casos").hidden=!enCasos;
    $s("#tabs").querySelectorAll("button").forEach(b=>b.setAttribute("aria-selected",b.dataset.v===v));
    if(enCasos&&app){ if(!arrancado){ arrancado=true; app.iniciar().then(()=>app.ir(v)); } else app.ir(v); }
    if(v==="doc"&&window.DOC_CARGAR) window.DOC_CARGAR(); };
  MA.listo.then(()=>{ app=mountCasos(root); SH.onFolder(()=>{ if(arrancado) app.alCambiarCarpeta(); }); SH.go("inicio"); });
})();
