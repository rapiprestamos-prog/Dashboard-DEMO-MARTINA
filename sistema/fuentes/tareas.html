<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seguimiento de tareas</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  color-scheme:light;
  --bg:#f3f5f9; --surface:#fff; --surface-2:#f0f3f8; --border:#dde3ec; --grid:#edf1f6;
  --text:#0f1c2e; --text-2:#44546a; --muted:#8792a4;
  --navy:#1b3a5c; --navy-d:#0f2440; --teal:#0f6f6e; --gold:#e3c27a; --gold-d:#b98b2f;
  --good:#1c7a46; --bad:#b03a32; --warn:#9a6b0f;
  --shadow:0 1px 2px rgba(15,23,42,.05),0 4px 14px rgba(15,23,42,.05);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:Inter,system-ui,"Segoe UI",sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit}
.hidden{display:none!important}
body{display:flex;flex-direction:column}
.app{display:grid;grid-template-columns:250px minmax(0,1fr);flex:1;min-height:0}
@media (max-width:820px){.app{grid-template-columns:1fr}.side{display:none}}

/* barra lateral */
.side{background:var(--surface);border-right:1px solid var(--border);overflow-y:auto;padding:14px 10px 20px}
.sec{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:14px 8px 6px}
.nav{display:flex;align-items:center;gap:8px;width:100%;padding:7px 10px;border:none;background:none;border-radius:8px;color:var(--text-2);font-weight:600;font-size:13px;cursor:pointer;text-align:left}
.nav:hover{background:var(--surface-2)}
.nav.on{background:#e8eef6;color:var(--navy)}
.nav .n{margin-left:auto;font-size:11px;color:var(--muted);font-weight:700}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--muted)}
.fold{position:relative}
.fold .acts{position:absolute;right:6px;top:5px;display:none;gap:2px}
.fold:hover .acts{display:flex}
.fold .acts button{border:none;background:var(--surface);border-radius:6px;padding:2px 5px;cursor:pointer;color:var(--muted);font-size:12px}
.fold .acts button:hover{color:var(--navy);background:#e8eef6}
.kids{padding-left:14px}
.linkbtn{display:flex;align-items:center;gap:8px;width:100%;padding:6px 10px;border:none;background:none;color:var(--teal);font-weight:600;font-size:12.5px;cursor:pointer;border-radius:8px;text-align:left}
.linkbtn:hover{background:var(--surface-2)}

/* contenido */
.main{overflow-y:auto;padding:20px 24px 40px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.top .k{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.top h1{font-family:"Playfair Display",Georgia,serif;font-weight:600;font-size:26px;margin:2px 0 0;display:flex;align-items:center;gap:10px}
.top h1 .tipo{font-family:Inter,sans-serif;font-size:12px;color:var(--muted);font-weight:600}
.top .sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:9px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-weight:600;font-size:13px;cursor:pointer}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.teal{background:var(--teal);border-color:var(--teal);color:#fff}
.btn.danger{color:var(--bad);border-color:#efc4c0}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.chip{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:600;font-size:12.5px;cursor:pointer;color:var(--text-2)}
.chip .c{display:inline-block;min-width:18px;margin-left:4px;padding:0 6px;border-radius:999px;background:var(--surface-2);font-size:11px;text-align:center}
.chip.on{background:var(--teal);border-color:var(--teal);color:#fff}
.chip.on .c{background:rgba(255,255,255,.2)}
.nota{font-size:11.5px;color:var(--muted);margin:2px 0 14px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow)}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:14px}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}}
.kpi{padding:12px 14px}
.kpi .l{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.kpi .v{font-size:24px;font-weight:800;margin-top:2px}
.kpi .s{font-size:11.5px;color:var(--muted)}
.kpi.bad .v{color:var(--bad)} .kpi.good .v{color:var(--good)}
.filtros{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.inp{padding:8px 10px;border-radius:9px;border:1px solid var(--border);background:var(--surface);color:var(--text);outline:none}
.inp:focus{border-color:var(--teal)}
.inp.grow{flex:1;min-width:200px}
label.ck{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;color:var(--text-2)}
table.t{width:100%;border-collapse:separate;border-spacing:0}
table.t th{text-align:left;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:9px 10px;border-bottom:1px solid var(--border);background:var(--surface-2)}
table.t td{padding:9px 10px;border-bottom:1px solid var(--grid);vertical-align:middle}
table.t tr.row{cursor:pointer}
table.t tr.row:hover td{background:#f6f9fc}
table.t tr.done td{color:var(--muted)}
table.t tr.done .tt{text-decoration:line-through}
.grp td{background:#fbfcfe!important;font-weight:700;color:var(--navy);font-size:12.5px;cursor:default}
.prio{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;border:1px solid}
.prio.Crítica{background:#fbeceb;color:var(--bad);border-color:#efc4c0}
.prio.Alta{background:#fdf2e3;color:#a35a0b;border-color:#f2d4ad}
.prio.Media{background:#eef2f7;color:var(--navy);border-color:var(--border)}
.prio.Baja{background:#f2f6f2;color:#4d6b52;border-color:#d6e4d8}
.est{font-size:12px;padding:4px 8px;border-radius:8px;border:1px solid var(--border);background:var(--surface)}
.tt{font-weight:600}
.meta{font-size:11.5px;color:var(--muted);margin-top:2px}
.venc{color:var(--bad);font-weight:700}
.vacio{padding:34px 20px;text-align:center;color:var(--muted)}
.vacio b{display:block;color:var(--text);font-size:15px;margin-bottom:4px}
.tick{width:18px;height:18px;border-radius:50%;border:2px solid var(--border);background:var(--surface);cursor:pointer;flex:none;display:grid;place-items:center;font-size:11px;color:#fff}
.tick:hover{border-color:var(--good)}
.tick.on{background:var(--good);border-color:var(--good)}
.plan-row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--grid);cursor:pointer}
.plan-row:hover{background:#f6f9fc}
.plan-day{padding:9px 14px;font-size:12px;font-weight:700;color:var(--navy);background:var(--surface-2);border-bottom:1px solid var(--border)}
.plan-day.bad{color:var(--bad)}

/* diálogos */
.bg{position:fixed;inset:0;background:rgba(15,28,46,.45);display:flex;align-items:flex-start;justify-content:center;padding:30px 16px;z-index:50;overflow-y:auto}
.dlg{width:100%;max-width:760px;background:var(--surface);border-radius:14px;box-shadow:0 20px 60px rgba(15,23,42,.35)}
.dlg.sm{max-width:460px}
.dlg-h{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border)}
.dlg-h h3{margin:0;font-size:16px}
.dlg-b{padding:14px 18px}
.dlg-f{display:flex;align-items:center;gap:8px;padding:12px 18px;border-top:1px solid var(--border)}
.dlg-f .sp{flex:1}
.x{border:none;background:none;font-size:13px;color:var(--muted);cursor:pointer}
.info{font-size:12px;color:var(--text-2);background:var(--surface-2);border-radius:9px;padding:8px 10px;margin-bottom:12px}
.f{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.f>span{font-size:11.5px;font-weight:700;color:var(--text-2)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media (max-width:640px){.g2,.g3{grid-template-columns:1fr}}
textarea.inp{min-height:84px;resize:vertical}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin:6px 0 10px}
.tab{border:none;background:none;padding:8px 12px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}
.tab.on{color:var(--teal);border-bottom-color:var(--teal)}
.item{padding:8px 0;border-bottom:1px solid var(--grid);font-size:13px}
.item .who{font-size:11.5px;color:var(--muted)}
.colores{display:flex;gap:8px;flex-wrap:wrap}
.color{width:26px;height:26px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.color.on{border-color:var(--text)}
.err{color:var(--bad);font-size:12.5px;min-height:16px}
.toast{position:fixed;right:18px;bottom:18px;background:var(--navy-d);color:#fff;padding:10px 14px;border-radius:10px;font-size:13px;z-index:80;box-shadow:var(--shadow)}
.toast.bad{background:var(--bad)}

/* organigrama */
.org{padding:14px}
.org ul{list-style:none;margin:0;padding-left:22px;border-left:2px solid var(--grid)}
.org>ul{border-left:none;padding-left:0}
.org li{margin:6px 0}
.persona{display:inline-flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface);cursor:pointer}
.persona:hover,.persona.on{border-color:var(--teal);background:#eef7f6}
.av{width:30px;height:30px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px}
.org-layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px}
@media (max-width:980px){.org-layout{grid-template-columns:1fr}}
.cargando{padding:60px 20px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<!--MA_AUTH-->
<script>MA.iniciar({modulo:"tareas",titulo:"Seguimiento de tareas"});</script>
<div id="sinSesion" class="cargando">Conectando con el dashboard…</div>

<div class="app hidden" id="app">
  <aside class="side">
    <div class="sec">Mis tareas</div>
    <button class="nav" data-v="plan">🗓 Plan de trabajo <span class="n" id="nPlan"></span></button>
    <button class="nav" data-v="todas">📋 Todas por proyecto</button>
    <div class="sec">Mis carpetas</div>
    <div id="arbol"></div>
    <button class="linkbtn" id="btnNuevaCarpeta">＋ Nueva carpeta</button>
    <button class="linkbtn" id="btnImportar">⇪ Importar desde Excel</button>
    <div id="secAdmin" class="hidden">
      <div class="sec">Administración</div>
      <button class="nav" data-v="usuarios">👥 Usuarios y jerarquía</button>
    </div>
  </aside>
  <main class="main" id="main"></main>
</div>

<script>
/* ============================ sesión que pasa el inicio ============================ */
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let SB=null, YO=null, ROL=null, LISTO=false;
window.addEventListener("message",ev=>{
  if(ev.source!==window.parent) return;
  const d=ev.data||{};
  if(d.type!=="MA_SESSION") return;
  SB=window.supabase.createClient(d.url,d.anon,{global:{headers:{Authorization:"Bearer "+d.token}},auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
  YO=d.email; ROL=d.rol;
  if(!LISTO){ LISTO=true; iniciar(); }
});
if(window.parent!==window) window.parent.postMessage({type:"MA_APP_READY"},"*");
let ultAct=0;
["mousemove","mousedown","keydown","wheel","touchstart"].forEach(e=>addEventListener(e,()=>{
  if(Date.now()-ultAct>10000){ ultAct=Date.now(); try{ window.parent.postMessage({type:"MA_ACTIVITY"},"*"); }catch(_){} }
},{passive:true,capture:true}));

/* ============================ utilidades ============================ */
const PRIOS=["Crítica","Alta","Media","Baja"], PRIO_N={"Crítica":0,"Alta":1,"Media":2,"Baja":3};
const ESTADOS=["Pendiente","En progreso","Esperando respuesta","Completada"];
const TIPOS=["Proyecto","Empresa","Área"];
const COLORES=["#1b3a5c","#0f6f6e","#2f7d4f","#b98b2f","#c2410c","#b03a32","#7c3aed","#64748b"];
const hoyISO=()=>{ const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10); };
const sumarDias=(iso,n)=>{ const d=new Date(iso+"T12:00:00"); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); };
const fCorta=iso=>iso?new Date(iso+"T12:00:00").toLocaleDateString("es-PA",{day:"2-digit",month:"short",year:"numeric"}):"—";
const fDia=iso=>new Date(iso+"T12:00:00").toLocaleDateString("es-PA",{weekday:"long",day:"numeric",month:"long"});
const fHora=t=>t?new Date(t).toLocaleString("es-PA",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"}):"";
const diasEntre=(a,b)=>Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/86400000);
function toast(t,mal){ const d=document.createElement("div"); d.className="toast"+(mal?" bad":""); d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),mal?5000:2600); }
async function q(p){ const {data,error}=await p; if(error) throw new Error(error.message); return data; }

/* ============================ datos ============================ */
let CARPETAS=[], TAREAS=[], GENTE=[], VISTA={v:"plan"}, FILTRO_PLAN="hoy";
async function cargar(){
  const [c,t,g]=await Promise.all([
    q(SB.from("ta_carpetas").select("*").order("nombre")),
    q(SB.from("ta_tareas").select("*").order("fecha_tentativa",{ascending:true,nullsFirst:false})),
    q(SB.rpc("ma_directorio"))
  ]);
  CARPETAS=c||[]; TAREAS=t||[]; GENTE=g||[];
}
const nombreDe=e=>{ if(!e) return "—"; const p=GENTE.find(x=>x.email===String(e).toLowerCase()); return p?(p.nombre||p.email):e; };
const carpeta=id=>CARPETAS.find(c=>c.id===id);
function rutaCarpeta(id){ const r=[]; let c=carpeta(id), n=0; while(c&&n++<20){ r.unshift(c.nombre); c=carpeta(c.padre_id); } return r.join(" › "); }
function descendientes(id){ const out=[id]; CARPETAS.filter(c=>c.padre_id===id).forEach(h=>out.push(...descendientes(h.id))); return out; }
const abierta=t=>t.estado!=="Completada";
const vencida=t=>abierta(t)&&t.fecha_tentativa&&t.fecha_tentativa<hoyISO();
const ordenar=(a,b)=>{ // fecha tentativa; mismo día → mayor prioridad; sin fecha al final; completadas al final
  if(abierta(a)!==abierta(b)) return abierta(a)?-1:1;
  const fa=a.fecha_tentativa||"9999", fb=b.fecha_tentativa||"9999";
  return fa.localeCompare(fb)||(PRIO_N[a.prioridad]-PRIO_N[b.prioridad])||a.titulo.localeCompare(b.titulo,"es");
};

/* ============================ arranque ============================ */
async function iniciar(){
  try{ await cargar(); }
  catch(e){ $("sinSesion").innerHTML=`<b>No se pudo abrir Seguimiento de tareas</b>${esc(e.message)}<br><br>Si dice que no existe la tabla, falta correr <b>modulos_tareas_legal.sql</b> en Supabase.`; return; }
  $("sinSesion").classList.add("hidden"); $("app").classList.remove("hidden");
  $("secAdmin").classList.toggle("hidden",ROL!=="admin");
  document.querySelectorAll(".nav[data-v]").forEach(b=>b.onclick=()=>ir({v:b.dataset.v}));
  $("btnNuevaCarpeta").onclick=()=>dlgCarpeta();
  $("btnImportar").onclick=dlgImportar;
  pintar();
  setInterval(async()=>{ if(document.hidden||document.querySelector(".bg")) return; try{ await cargar(); pintar(); }catch(e){} },60000);
}
function ir(v){ VISTA=v; pintar(); $("main").scrollTop=0; }
function pintar(){
  pintarArbol();
  document.querySelectorAll(".nav[data-v]").forEach(b=>b.classList.toggle("on",VISTA.v===b.dataset.v));
  $("nPlan").textContent=TAREAS.filter(abierta).length||"";
  if(VISTA.v==="plan") vistaPlan();
  else if(VISTA.v==="todas") vistaTodas();
  else if(VISTA.v==="carpeta") vistaCarpeta(VISTA.id);
  else if(VISTA.v==="usuarios") vistaUsuarios();
}

/* ============================ árbol de carpetas ============================ */
function pintarArbol(){
  const rama=padre=>CARPETAS.filter(c=>(c.padre_id||null)===padre).map(c=>{
    const n=TAREAS.filter(t=>abierta(t)&&descendientes(c.id).includes(t.carpeta_id)).length;
    const hijos=rama(c.id);
    return `<div class="fold"><button class="nav${VISTA.v==="carpeta"&&VISTA.id===c.id?" on":""}" data-c="${c.id}"><span class="dot" style="background:${esc(c.color||"#64748b")}"></span>${esc(c.nombre)}<span class="n">${n||""}</span></button>
      <span class="acts"><button title="Nueva subcarpeta" data-sub="${c.id}">＋</button><button title="Editar" data-ed="${c.id}">✎</button></span></div>
      ${hijos?`<div class="kids">${hijos}</div>`:""}`;
  }).join("");
  $("arbol").innerHTML=rama(null)||`<div class="nota" style="margin:4px 10px">Todavía no hay carpetas.</div>`;
  $("arbol").querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>ir({v:"carpeta",id:+b.dataset.c}));
  $("arbol").querySelectorAll("[data-sub]").forEach(b=>b.onclick=e=>{ e.stopPropagation(); dlgCarpeta(null,+b.dataset.sub); });
  $("arbol").querySelectorAll("[data-ed]").forEach(b=>b.onclick=e=>{ e.stopPropagation(); dlgCarpeta(carpeta(+b.dataset.ed)); });
}

/* ============================ Plan de trabajo ============================ */
function finDe(periodo){
  const h=hoyISO(), d=new Date(h+"T12:00:00");
  if(periodo==="hoy") return h;
  if(periodo==="semana"){ const dow=(d.getDay()+6)%7; return sumarDias(h,6-dow); }
  if(periodo==="mes") return new Date(d.getFullYear(),d.getMonth()+1,0,12).toISOString().slice(0,10);
  if(periodo==="semestre") return d.getMonth()<6?`${d.getFullYear()}-06-30`:`${d.getFullYear()}-12-31`;
  return null;
}
function delPeriodo(p){ const fin=finDe(p); return TAREAS.filter(t=>abierta(t)&&(p==="todo"||(t.fecha_tentativa&&t.fecha_tentativa<=fin))).sort(ordenar); }
function vistaPlan(){
  const P=[["hoy","Hoy"],["semana","Esta semana"],["mes","Este mes"],["semestre","Este semestre"],["todo","Todo lo pendiente"]];
  const lista=delPeriodo(FILTRO_PLAN), h=hoyISO();
  const grupos=[]; let ult=null;
  lista.forEach(t=>{ const k=!t.fecha_tentativa?"sin":t.fecha_tentativa<h?"venc":t.fecha_tentativa;
    if(k!==ult){ grupos.push({k,items:[]}); ult=k; } grupos[grupos.length-1].items.push(t); });
  const titulo=k=>k==="venc"?"Vencidas":k==="sin"?"Sin fecha":k===h?"Hoy · "+fDia(k):fDia(k);
  $("main").innerHTML=`
    <div class="top"><div><div class="k">Mi agenda</div><h1>Plan de trabajo</h1><div class="sub">Todas las carpetas</div></div>
      <button class="btn pri" id="btnNueva">＋ Nueva tarea</button></div>
    <div class="chips">${P.map(([k,l])=>`<button class="chip${FILTRO_PLAN===k?" on":""}" data-p="${k}">${l}<span class="c">${delPeriodo(k).length}</span></button>`).join("")}</div>
    <div class="nota">Ordenado por fecha tentativa; si dos tareas vencen el mismo día, va primero la de mayor prioridad (Crítica → Alta → Media → Baja). Las vencidas aparecen primero.</div>
    <div class="card">${grupos.length?grupos.map(g=>`<div class="plan-day${g.k==="venc"?" bad":""}">${esc(titulo(g.k))} · ${g.items.length}</div>${g.items.map(filaPlan).join("")}`).join("")
      :`<div class="vacio"><b>Nada pendiente en este periodo</b>Las tareas con fecha tentativa aparecen aquí.</div>`}</div>`;
  $("main").querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{ FILTRO_PLAN=b.dataset.p; vistaPlan(); });
  $("btnNueva").onclick=()=>dlgTarea(null);
  conectarFilas();
}
function filaPlan(t){
  return `<div class="plan-row" data-t="${t.id}"><span class="tick" data-done="${t.id}" title="Marcar como completada"></span>
    <span class="prio ${t.prioridad}">${t.prioridad}</span>
    <div style="flex:1;min-width:0"><div class="tt">${esc(t.titulo)}</div><div class="meta">${esc(rutaCarpeta(t.carpeta_id)||"Sin carpeta")} · ${esc(nombreDe(t.responsable))}${t.estado!=="Pendiente"?" · "+esc(t.estado):""}</div></div>
    <span class="meta${vencida(t)?" venc":""}">${fCorta(t.fecha_tentativa)}</span></div>`;
}
function conectarFilas(){
  $("main").querySelectorAll("[data-t]").forEach(r=>r.onclick=()=>dlgTarea(TAREAS.find(t=>t.id===+r.dataset.t)));
  $("main").querySelectorAll("[data-done]").forEach(b=>b.onclick=async e=>{ e.stopPropagation(); await completar(+b.dataset.done); });
  $("main").querySelectorAll("select[data-est]").forEach(s=>{ s.onclick=e=>e.stopPropagation(); s.onchange=async()=>{
    try{ const cambio={estado:s.value}; const t=TAREAS.find(x=>x.id===+s.dataset.est);
      if(s.value==="Completada"&&!t.fecha_real) cambio.fecha_real=hoyISO();
      await q(SB.from("ta_tareas").update(cambio).eq("id",+s.dataset.est)); await cargar(); pintar(); toast("Estado actualizado"); }
    catch(err){ toast("No se pudo: "+err.message,true); } }; });
}
async function completar(id){
  try{ await q(SB.from("ta_tareas").update({estado:"Completada",fecha_real:hoyISO()}).eq("id",id)); await cargar(); pintar(); toast("✓ Tarea completada"); }
  catch(e){ toast("No se pudo: "+e.message,true); }
}

/* ============================ tablas de tareas ============================ */
function tablaTareas(lista,conCarpeta){
  if(!lista.length) return `<div class="vacio"><b>Sin tareas aquí todavía</b>Usa “Nueva tarea” para agregar la primera.</div>`;
  return `<table class="t"><thead><tr><th style="width:90px">Prioridad</th><th>Tarea</th><th>Responsable</th><th>Fecha tentativa</th><th style="width:170px">Estado</th></tr></thead><tbody>${
    lista.map(t=>`<tr class="row${abierta(t)?"":" done"}" data-t="${t.id}"><td><span class="prio ${t.prioridad}">${t.prioridad}</span></td>
      <td><div class="tt">${esc(t.titulo)}</div>${conCarpeta?`<div class="meta">${esc(rutaCarpeta(t.carpeta_id)||"Sin carpeta")}</div>`:""}</td>
      <td>${esc(nombreDe(t.responsable))}</td>
      <td class="${vencida(t)?"venc":""}">${fCorta(t.fecha_tentativa)}</td>
      <td><select class="est" data-est="${t.id}">${ESTADOS.map(e=>`<option${e===t.estado?" selected":""}>${e}</option>`).join("")}</select></td></tr>`).join("")}</tbody></table>`;
}
function vistaTodas(){
  const grupos=[...CARPETAS.map(c=>({c,items:TAREAS.filter(t=>t.carpeta_id===c.id)})),{c:null,items:TAREAS.filter(t=>!t.carpeta_id||!carpeta(t.carpeta_id))}].filter(g=>g.items.length);
  $("main").innerHTML=`
    <div class="top"><div><div class="k">Mis tareas</div><h1>Todas por proyecto</h1><div class="sub">${TAREAS.filter(abierta).length} abiertas · ${TAREAS.length} en total</div></div>
      <button class="btn pri" id="btnNueva">＋ Nueva tarea</button></div>
    ${grupos.length?grupos.map(g=>`<div class="card" style="margin-bottom:12px"><div class="plan-day"><span class="dot" style="display:inline-block;margin-right:6px;background:${esc(g.c?g.c.color||"#64748b":"#94a3b8")}"></span>${esc(g.c?rutaCarpeta(g.c.id):"Sin carpeta")} · ${g.items.filter(abierta).length} abiertas</div>${tablaTareas(g.items.sort(ordenar),false)}</div>`).join("")
      :`<div class="card"><div class="vacio"><b>Todavía no hay tareas</b>Crea una carpeta y agrega tareas, o impórtalas desde Excel.</div></div>`}`;
  $("btnNueva").onclick=()=>dlgTarea(null);
  conectarFilas();
}

/* ============================ carpeta ============================ */
let FC={q:"",estado:"todas",prio:"",orden:"fecha",subs:true};
function vistaCarpeta(id){
  const c=carpeta(id); if(!c){ ir({v:"plan"}); return; }
  const ids=FC.subs?descendientes(id):[id];
  const todas=TAREAS.filter(t=>ids.includes(t.carpeta_id));
  const h=hoyISO(), hace7=sumarDias(h,-7), hace30=sumarDias(h,-30);
  const compl=todas.filter(t=>!abierta(t));
  const conFechas=compl.filter(t=>t.fecha_tentativa&&t.fecha_real);
  const aTiempo=conFechas.filter(t=>t.fecha_real<=t.fecha_tentativa).length;
  const tarde=conFechas.filter(t=>t.fecha_real>t.fecha_tentativa);
  const atraso=tarde.length?Math.round(tarde.reduce((s,t)=>s+diasEntre(t.fecha_tentativa,t.fecha_real),0)/tarde.length):null;
  let lista=todas.filter(t=>(!FC.q||(t.titulo+" "+(t.descripcion||"")).toLowerCase().includes(FC.q.toLowerCase()))
    &&(FC.estado==="todas"||t.estado===FC.estado)&&(!FC.prio||t.prioridad===FC.prio));
  lista.sort(FC.orden==="prioridad"?((a,b)=>(abierta(a)!==abierta(b)?(abierta(a)?-1:1):0)||(PRIO_N[a.prioridad]-PRIO_N[b.prioridad])||ordenar(a,b))
    :FC.orden==="creacion"?((a,b)=>String(b.creado).localeCompare(String(a.creado))):ordenar);
  $("main").innerHTML=`
    <div class="top"><div><div class="k">Carpeta</div><h1><span class="dot" style="width:12px;height:12px;background:${esc(c.color||"#64748b")}"></span>${esc(c.nombre)} <span class="tipo">${esc(c.tipo)}</span></h1>
      <div class="sub">${esc(rutaCarpeta(c.id))}</div></div>
      <div style="display:flex;gap:8px"><button class="btn" id="btnEdC">✎ Editar carpeta</button><button class="btn pri" id="btnNueva">＋ Nueva tarea</button></div></div>
    <div class="kpis">
      <div class="card kpi"><div class="l">Abiertas</div><div class="v">${todas.filter(abierta).length}</div><div class="s">${todas.filter(t=>t.creado&&t.creado.slice(0,10)>=hace7).length} creadas en 7 días</div></div>
      <div class="card kpi bad"><div class="l">Vencidas</div><div class="v">${todas.filter(vencida).length}</div><div class="s">fecha tentativa ya pasó</div></div>
      <div class="card kpi good"><div class="l">Completadas</div><div class="v">${compl.length}</div><div class="s">${compl.filter(t=>t.fecha_real&&t.fecha_real>=hace30).length} en los últimos 30 días</div></div>
      <div class="card kpi"><div class="l">A tiempo</div><div class="v">${conFechas.length?Math.round(aTiempo*100/conFechas.length)+"%":"—"}</div><div class="s">de las completadas con fecha</div></div>
      <div class="card kpi"><div class="l">Atraso prom.</div><div class="v">${atraso==null?"—":atraso+" d"}</div><div class="s">en las completadas tarde</div></div>
    </div>
    <div class="filtros">
      <input class="inp grow" id="fq" placeholder="Buscar tarea…" value="${esc(FC.q)}">
      <select class="inp" id="fe"><option value="todas">Todas (completadas al final)</option>${ESTADOS.map(e=>`<option${FC.estado===e?" selected":""}>${e}</option>`).join("")}</select>
      <select class="inp" id="fp"><option value="">Toda prioridad</option>${PRIOS.map(p=>`<option${FC.prio===p?" selected":""}>${p}</option>`).join("")}</select>
      <select class="inp" id="fo"><option value="fecha"${FC.orden==="fecha"?" selected":""}>Ordenar: fecha + prioridad</option><option value="prioridad"${FC.orden==="prioridad"?" selected":""}>Ordenar: prioridad</option><option value="creacion"${FC.orden==="creacion"?" selected":""}>Ordenar: más recientes</option></select>
      <label class="ck"><input type="checkbox" id="fs"${FC.subs?" checked":""}> Incluir subcarpetas</label>
    </div>
    <div class="card">${tablaTareas(lista,FC.subs)}</div>`;
  $("fq").oninput=e=>{ FC.q=e.target.value; const pos=e.target.selectionStart; vistaCarpeta(id); $("fq").focus(); $("fq").setSelectionRange(pos,pos); };
  $("fe").onchange=e=>{ FC.estado=e.target.value; vistaCarpeta(id); };
  $("fp").onchange=e=>{ FC.prio=e.target.value; vistaCarpeta(id); };
  $("fo").onchange=e=>{ FC.orden=e.target.value; vistaCarpeta(id); };
  $("fs").onchange=e=>{ FC.subs=e.target.checked; vistaCarpeta(id); };
  $("btnNueva").onclick=()=>dlgTarea(null,id);
  $("btnEdC").onclick=()=>dlgCarpeta(c);
  conectarFilas();
}

/* ============================ diálogos ============================ */
function abrirDlg(html,cls){ cerrarDlg(); const bg=document.createElement("div"); bg.className="bg"; bg.innerHTML=`<div class="dlg ${cls||""}">${html}</div>`; document.body.appendChild(bg); bg.onclick=e=>{ if(e.target===bg) cerrarDlg(); }; return bg; }
function cerrarDlg(){ document.querySelectorAll(".bg").forEach(b=>b.remove()); }
document.addEventListener("keydown",e=>{ if(e.key==="Escape") cerrarDlg(); });
const opcionesCarpetas=(sel,excluir)=>{ const out=[]; const rama=(padre,n)=>CARPETAS.filter(c=>(c.padre_id||null)===padre&&!(excluir||[]).includes(c.id)).forEach(c=>{ out.push(`<option value="${c.id}"${sel===c.id?" selected":""}>${"  ".repeat(n)}${n?"└ ":""}${esc(c.nombre)}</option>`); rama(c.id,n+1); }); rama(null,0); return out.join(""); };

function dlgCarpeta(c,padre){
  let color=(c&&c.color)||COLORES[0];
  const bg=abrirDlg(`<div class="dlg-h"><h3>${c?"Editar carpeta":"Nueva carpeta"}</h3><button class="x" data-x>Cerrar</button></div>
    <div class="dlg-b">
      <label class="f"><span>Nombre</span><input class="inp" id="cn" value="${esc(c?c.nombre:"")}" placeholder="Ej.: nombre de la empresa, proyecto o área"></label>
      <div class="g2"><label class="f"><span>Tipo</span><select class="inp" id="ct">${TIPOS.map(t=>`<option${c&&c.tipo===t?" selected":""}>${t}</option>`).join("")}</select></label>
      <label class="f"><span>Dentro de</span><select class="inp" id="cp"><option value="">— Nivel principal —</option>${opcionesCarpetas(c?c.padre_id:padre,c?descendientes(c.id):[])}</select></label></div>
      <div class="f"><span>Color</span><div class="colores" id="cc">${COLORES.map(k=>`<span class="color${k===color?" on":""}" data-k="${k}" style="background:${k}"></span>`).join("")}</div></div>
      <div class="err" id="cerr"></div>
    </div>
    <div class="dlg-f">${c?`<button class="btn danger" id="cdel">Eliminar</button>`:""}<span class="sp"></span><button class="btn" data-x>Cancelar</button><button class="btn pri" id="cok">Guardar</button></div>`,"sm");
  bg.querySelectorAll("[data-x]").forEach(b=>b.onclick=cerrarDlg);
  bg.querySelectorAll(".color").forEach(s=>s.onclick=()=>{ color=s.dataset.k; bg.querySelectorAll(".color").forEach(x=>x.classList.toggle("on",x===s)); });
  setTimeout(()=>$("cn").focus(),30);
  $("cok").onclick=async()=>{
    const fila={nombre:$("cn").value.trim(),tipo:$("ct").value,padre_id:$("cp").value?+$("cp").value:null,color};
    if(!fila.nombre){ $("cerr").textContent="Ponle un nombre."; return; }
    try{ if(c) await q(SB.from("ta_carpetas").update(fila).eq("id",c.id)); else await q(SB.from("ta_carpetas").insert(fila));
      cerrarDlg(); await cargar(); pintar(); toast(c?"Carpeta guardada":"Carpeta creada"); }
    catch(e){ $("cerr").textContent=e.message; }
  };
  if(c) $("cdel").onclick=async()=>{
    const n=TAREAS.filter(t=>descendientes(c.id).includes(t.carpeta_id)).length;
    if(!confirmar(`¿Eliminar “${c.nombre}”${CARPETAS.some(x=>x.padre_id===c.id)?" y sus subcarpetas":""}? ${n?`Sus ${n} tarea(s) quedan sin carpeta.`:""}`)) return;
    try{ await q(SB.from("ta_carpetas").delete().eq("id",c.id)); cerrarDlg(); if(VISTA.id===c.id) VISTA={v:"plan"}; await cargar(); pintar(); toast("Carpeta eliminada"); }
    catch(e){ $("cerr").textContent=e.message; }
  };
}
// confirmación dentro de la página (sin ventanas del navegador)
let CONF_OK=false;
function confirmar(texto){
  const err=document.querySelector(".bg .err");
  if(CONF_OK){ CONF_OK=false; return true; }
  if(err){ err.innerHTML=esc(texto)+' <button class="btn sm danger" id="confSi">Sí, eliminar</button>'; $("confSi").onclick=()=>{ CONF_OK=true; (document.getElementById("cdel")||document.getElementById("tdel")).click(); }; }
  return false;
}

async function dlgTarea(t,carpetaId){
  const nueva=!t;
  t=t||{titulo:"",carpeta_id:carpetaId||(VISTA.v==="carpeta"?VISTA.id:null),prioridad:"Media",estado:"Pendiente",responsable:YO,fecha_tentativa:"",fecha_real:"",descripcion:""};
  const bg=abrirDlg(`<div class="dlg-h"><h3>${nueva?"Nueva tarea":"Tarea"}</h3><button class="x" data-x>Cerrar</button></div>
    <div class="dlg-b">
      ${nueva?"":`<div class="info">Creada por <b>${esc(nombreDe(t.creado_por))}</b> el ${fHora(t.creado)} · Último cambio: ${fHora(t.actualizado)}</div>`}
      <label class="f"><span>Título</span><input class="inp" id="tt" value="${esc(t.titulo)}"></label>
      <div class="g2"><label class="f"><span>Carpeta / proyecto</span><select class="inp" id="tc"><option value="">— Sin carpeta —</option>${opcionesCarpetas(t.carpeta_id)}</select></label>
      <label class="f"><span>Prioridad</span><select class="inp" id="tp">${PRIOS.map(p=>`<option${p===t.prioridad?" selected":""}>${p}</option>`).join("")}</select></label></div>
      <div class="g3"><label class="f"><span>Estado</span><select class="inp" id="te">${ESTADOS.map(e=>`<option${e===t.estado?" selected":""}>${e}</option>`).join("")}</select></label>
      <label class="f"><span>Fecha tentativa de culminación</span><input class="inp" type="date" id="tf" value="${esc(t.fecha_tentativa||"")}"></label>
      <label class="f"><span>Fecha real de culminación</span><input class="inp" type="date" id="tr" value="${esc(t.fecha_real||"")}"></label></div>
      <label class="f"><span>Responsable</span><select class="inp" id="tu"><option value="">— Sin asignar —</option>${GENTE.map(g=>`<option value="${esc(g.email)}"${g.email===String(t.responsable||"").toLowerCase()?" selected":""}>${esc(g.nombre||g.email)}${g.cargo?" · "+esc(g.cargo):""}</option>`).join("")}</select></label>
      <label class="f"><span>Descripción / detalle</span><textarea class="inp" id="td">${esc(t.descripcion||"")}</textarea></label>
      ${nueva?`<div class="nota">Después de guardar puedes reportar avances, subir archivos y comentar.</div>`:`
      <div class="tabs"><button class="tab on" data-tab="av">Avances y archivos (<span id="nAv">…</span>)</button><button class="tab" data-tab="co">Comentarios (<span id="nCo">…</span>)</button><button class="tab" data-tab="hi">Historial</button></div>
      <div id="tabBody"></div>`}
      <div class="err" id="terr"></div>
    </div>
    <div class="dlg-f">${!nueva&&(ROL==="admin"||String(t.creado_por).toLowerCase()===YO)?`<button class="btn danger" id="tdel">Eliminar</button>`:""}<span class="sp"></span>
      ${!nueva&&abierta(t)?`<button class="btn" id="tdone">✓ Marcar como completada</button>`:""}
      <button class="btn" data-x>Cancelar</button><button class="btn pri" id="tok">Guardar</button></div>`);
  bg.querySelectorAll("[data-x]").forEach(b=>b.onclick=cerrarDlg);
  setTimeout(()=>$("tt").focus(),30);
  $("te").onchange=()=>{ if($("te").value==="Completada"&&!$("tr").value) $("tr").value=hoyISO(); };
  const leer=()=>({titulo:$("tt").value.trim(),carpeta_id:$("tc").value?+$("tc").value:null,prioridad:$("tp").value,estado:$("te").value,
    fecha_tentativa:$("tf").value||null,fecha_real:$("tr").value||null,responsable:$("tu").value||null,descripcion:$("td").value.trim()||null});
  $("tok").onclick=async()=>{
    const f=leer(); if(!f.titulo){ $("terr").textContent="Ponle un título."; return; }
    try{ if(nueva) await q(SB.from("ta_tareas").insert(f)); else await q(SB.from("ta_tareas").update(f).eq("id",t.id));
      cerrarDlg(); await cargar(); pintar(); toast(nueva?"Tarea creada":"Tarea guardada"); }
    catch(e){ $("terr").textContent=e.message; }
  };
  if($("tdone")) $("tdone").onclick=async()=>{ $("te").value="Completada"; if(!$("tr").value) $("tr").value=hoyISO(); $("tok").click(); };
  if($("tdel")) $("tdel").onclick=async()=>{
    if(!confirmar(`¿Eliminar la tarea “${t.titulo}” con sus avances y comentarios?`)) return;
    try{ await q(SB.from("ta_tareas").delete().eq("id",t.id)); cerrarDlg(); await cargar(); pintar(); toast("Tarea eliminada"); }
    catch(e){ $("terr").textContent=e.message; }

  if(!nueva){

      bg.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.tab===TAB));
      const body=$("tabBody"); if(!body) return;
      try{
        const [av,co]=await Promise.all([q(SB.from("ta_avances").select("*").eq("tarea_id",t.id).order("creado",{ascending:false})),q(SB.from("ta_comentarios").select("*").eq("tarea_id",t.id).order("creado",{ascending:true}))]);
        $("nAv").textContent=av.length; $("nCo").textContent=co.length;
        if(TAB==="av") body.innerHTML=`
          <div class="f"><span>Reportar avance</span><div style="display:flex;gap:8px;flex-wrap:wrap"><input type="file" id="af" class="inp" style="max-width:260px"><input class="inp grow" id="an" placeholder="Nota breve: qué cambió, qué se entregó, qué falta…"><button class="btn teal" id="aok">⇪ Subir</button></div></div>
          ${av.length?av.map(a=>`<div class="item">${a.nota?esc(a.nota):""}${a.archivo_path?` ${a.nota?"· ":""}<a href="#" data-arch="${esc(a.archivo_path)}" data-nom="${esc(a.archivo_nombre||"archivo")}">📎 ${esc(a.archivo_nombre||"archivo")}</a>`:""}<div class="who">${esc(nombreDe(a.usuario))} · ${fHora(a.creado)}</div></div>`).join(""):`<div class="nota">Aún no hay avances reportados en esta tarea.</div>`}`;
        else if(TAB==="co") body.innerHTML=`
          ${co.length?co.map(c=>`<div class="item">${esc(c.texto)}<div class="who">${esc(nombreDe(c.usuario))} · ${fHora(c.creado)}</div></div>`).join(""):`<div class="nota">Sin comentarios todavía.</div>`}
          <div style="display:flex;gap:8px;margin-top:10px"><input class="inp grow" id="cm" placeholder="Escribe un comentario…"><button class="btn teal" id="cok2">Enviar</button></div>`;
        else{ const hi=await q(SB.from("ta_historial").select("*").eq("tarea_id",t.id).order("creado",{ascending:false}));
          body.innerHTML=hi.length?hi.map(h=>`<div class="item">${esc(h.detalle)}<div class="who">${esc(nombreDe(h.usuario))} · ${fHora(h.creado)}</div></div>`).join(""):`<div class="nota">Sin historial.</div>`; }
        if($("aok")) $("aok").onclick=async()=>{
          const file=$("af").files[0], nota=$("an").value.trim(); if(!file&&!nota){ $("terr").textContent="Escribe una nota o elige un archivo."; return; }
          $("aok").disabled=true;
          try{ let path=null;
            if(file){ path=`${t.id}/${Date.now()}-${file.name.normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^\w.\-]/g,"_")}`;
              const up=await SB.storage.from("tareas").upload(path,file,{upsert:false,contentType:file.type||"application/octet-stream"}); if(up.error) throw new Error(up.error.message); }
            await q(SB.from("ta_avances").insert({tarea_id:t.id,nota:nota||null,archivo_path:path,archivo_nombre:file?file.name:null,usuario:YO}));
            toast("Avance reportado"); pintarTab(); }
          catch(e){ $("terr").textContent=e.message; $("aok").disabled=false; }
        };
        body.querySelectorAll("[data-arch]").forEach(a=>a.onclick=async e=>{ e.preventDefault();
          const {data,error}=await SB.storage.from("tareas").download(a.dataset.arch); if(error){ toast(error.message,true); return; }
          const u=URL.createObjectURL(data); const l=document.createElement("a"); l.href=u; l.download=a.dataset.nom; l.click(); setTimeout(()=>URL.revokeObjectURL(u),2000); });
        if($("cok2")){ const enviar=async()=>{ const tx=$("cm").value.trim(); if(!tx) return;
          try{ await q(SB.from("ta_comentarios").insert({tarea_id:t.id,texto:tx,usuario:YO})); pintarTab(); }catch(e){ $("terr").textContent=e.message; } };
          $("cok2").onclick=enviar; $("cm").onkeydown=e=>{ if(e.key==="Enter") enviar(); }; }
      }catch(e){ body.innerHTML=`<div class="err">${esc(e.message)}</div>`; }
    };
    bg.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{ TAB=b.dataset.tab; pintarTab(); });
    pintarTab();
  }
}

/* ============================ importar desde Excel ============================ */
const MAPEO={titulo:/^(task|tarea|t[ií]tulo|nombre|actividad)$/i,fecha:/^(due ?date|fecha|fecha tentativa|vence|vencimiento|deadline)$/i,
  estado:/^(status|estado)$/i,prioridad:/^(priority|prioridad)$/i,responsable:/^(owner|responsable|asignado|assigned ?to|encargado)$/i,
  carpeta:/^(project|proyecto|carpeta|empresa|[aá]rea)$/i,descripcion:/^(description|descripci[oó]n|detalle|notas?)$/i};
const EST_MAP=s=>{ s=String(s||"").trim().toLowerCase(); if(!s) return "Pendiente";
  if(/complet|done|terminad|finaliz|hecho/.test(s)) return "Completada"; if(/progres|curso/.test(s)) return "En progreso";
  if(/espera|waiting|respuesta/.test(s)) return "Esperando respuesta"; return "Pendiente"; };
const PRIO_MAP=s=>{ s=String(s||"").trim().toLowerCase(); if(/cr[ií]t|urgent/.test(s)) return "Crítica"; if(/alta|high/.test(s)) return "Alta"; if(/baja|low/.test(s)) return "Baja"; return "Media"; };
function fechaISO(v){
  if(v==null||v==="") return null;
  if(v instanceof Date&&!isNaN(v)) return new Date(v.getTime()-v.getTimezoneOffset()*60000).toISOString().slice(0,10);
  if(typeof v==="number"){ const d=XLSX.SSF.parse_date_code(v); return d?`${d.y}-${String(d.m).padStart(2,"0")}-${String(d.d).padStart(2,"0")}`:null; }
  const s=String(v).trim(); let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if(m) return `${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`;
  m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})$/); if(m){ const y=m[3].length===2?"20"+m[3]:m[3]; return `${y}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`; }
  return null;
}
function dlgImportar(){
  let FILAS=[];
  const bg=abrirDlg(`<div class="dlg-h"><h3>Importar tareas desde Excel</h3><button class="x" data-x>Cerrar</button></div>
    <div class="dlg-b">
      <div class="info">Sube la lista de tareas en Excel (.xlsx) o CSV. Se reconocen columnas como <b>Task / Tarea</b>, <b>Due date / Fecha</b>, <b>Status / Estado</b>, <b>Priority / Prioridad</b>, <b>Responsable / Owner</b>, <b>Proyecto / Carpeta</b> y <b>Descripción</b>. Los estados en inglés se traducen (“In progress” → En progreso, “Waiting” → Esperando respuesta, “Done” → Completada).</div>
      <label class="f"><span>Archivo</span><input class="inp" type="file" id="xf" accept=".xlsx,.xls,.csv"></label>
      <label class="f"><span>Carpeta para las filas sin proyecto</span><select class="inp" id="xc"><option value="">— Sin carpeta —</option>${opcionesCarpetas(VISTA.v==="carpeta"?VISTA.id:null)}</select></label>
      <div id="xprev" class="nota"></div><div class="err" id="xerr"></div>
    </div>
    <div class="dlg-f"><span class="sp"></span><button class="btn" data-x>Cancelar</button><button class="btn pri" id="xok" disabled>Importar</button></div>`,"sm");
  bg.querySelectorAll("[data-x]").forEach(b=>b.onclick=cerrarDlg);
  $("xf").onchange=async()=>{
    $("xerr").textContent=""; $("xprev").textContent=""; $("xok").disabled=true; FILAS=[];
    try{
      const f=$("xf").files[0]; if(!f) return;
      const wb=XLSX.read(await f.arrayBuffer(),{type:"array"});   // fechas como número de Excel (sin desfase de zona horaria)
      const ws=wb.Sheets[wb.SheetNames[0]]; const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:""});
      const hi=rows.findIndex(r=>r.some(c=>MAPEO.titulo.test(String(c).trim())));
      if(hi<0) throw new Error("No encontré una columna de tarea (Task / Tarea / Título).");
      const cab=rows[hi].map(c=>String(c).trim()); const col=k=>cab.findIndex(c=>MAPEO[k].test(c));
      const C={}; Object.keys(MAPEO).forEach(k=>C[k]=col(k));
      FILAS=rows.slice(hi+1).filter(r=>String(r[C.titulo]||"").trim()).map(r=>({
        titulo:String(r[C.titulo]).trim(), fecha_tentativa:C.fecha>=0?fechaISO(r[C.fecha]):null,
        estado:C.estado>=0?EST_MAP(r[C.estado]):"Pendiente", prioridad:C.prioridad>=0?PRIO_MAP(r[C.prioridad]):"Media",
        responsable:C.responsable>=0?String(r[C.responsable]||"").trim():"", carpeta:C.carpeta>=0?String(r[C.carpeta]||"").trim():"",
        descripcion:C.descripcion>=0?String(r[C.descripcion]||"").trim():"" }));
      const nuevas=[...new Set(FILAS.map(x=>x.carpeta).filter(n=>n&&!CARPETAS.some(c=>c.nombre.toLowerCase()===n.toLowerCase())))];
      $("xprev").innerHTML=`<b>${FILAS.length}</b> tarea(s) encontradas.${nuevas.length?` Se crearán ${nuevas.length} carpeta(s): ${nuevas.map(esc).join(", ")}.`:""}`;
      $("xok").disabled=!FILAS.length;
    }catch(e){ $("xerr").textContent=e.message; }
  };
  $("xok").onclick=async()=>{
    $("xok").disabled=true;
    try{
      const porNombre=new Map(CARPETAS.map(c=>[c.nombre.toLowerCase(),c.id]));
      for(const n of [...new Set(FILAS.map(x=>x.carpeta).filter(Boolean))]){
        if(!porNombre.has(n.toLowerCase())){ const r=await q(SB.from("ta_carpetas").insert({nombre:n,tipo:"Proyecto",color:COLORES[porNombre.size%COLORES.length]}).select("id").single()); porNombre.set(n.toLowerCase(),r.id); } }
      const resp=v=>{ if(!v) return YO; const l=v.toLowerCase(); const g=GENTE.find(p=>p.email===l||(p.nombre||"").toLowerCase()===l); return g?g.email:YO; };
      const def=$("xc").value?+$("xc").value:null;
      const filas=FILAS.map(x=>({titulo:x.titulo,fecha_tentativa:x.fecha_tentativa,estado:x.estado,prioridad:x.prioridad,responsable:resp(x.responsable),
        carpeta_id:x.carpeta?porNombre.get(x.carpeta.toLowerCase()):def,descripcion:x.descripcion||null,fecha_real:x.estado==="Completada"?(x.fecha_tentativa||hoyISO()):null}));
      for(let i=0;i<filas.length;i+=200) await q(SB.from("ta_tareas").insert(filas.slice(i,i+200)));
      cerrarDlg(); await cargar(); pintar(); toast(`✓ ${filas.length} tarea(s) importadas`);
    }catch(e){ $("xerr").textContent=e.message; $("xok").disabled=false; }
  };
}

/* ============================ usuarios y jerarquía (administradora) ============================ */
let SEL_P=null;
function vistaUsuarios(){
  if(ROL!=="admin"){ ir({v:"plan"}); return; }
  const ini=p=>(p.nombre||p.email).split(/[\s@.]+/).filter(Boolean).slice(0,2).map(x=>x[0].toUpperCase()).join("");
  const raiz=GENTE.filter(p=>!p.jefe||!GENTE.some(x=>x.email===p.jefe));
  const rama=p=>{ const hijos=GENTE.filter(x=>x.jefe===p.email); return `<li><span class="persona${SEL_P===p.email?" on":""}" data-p="${esc(p.email)}"><span class="av">${esc(ini(p))}</span><span><b>${esc(p.nombre||p.email)}</b><div class="meta">${esc(p.cargo||"Sin cargo")} · ${esc(p.email)}</div></span></span>${hijos.length?`<ul>${hijos.map(rama).join("")}</ul>`:""}</li>`; };
  const sel=GENTE.find(p=>p.email===SEL_P);
  $("main").innerHTML=`
    <div class="top"><div><div class="k">Administración</div><h1>Usuarios y jerarquía</h1><div class="sub">${GENTE.length} personas activas</div></div></div>
    <div class="info">Cada persona ve sus tareas, las que creó y las de quienes tiene por debajo en la jerarquía. Para crear usuarios o cambiar a qué dashboards entran, usa el botón <b>Usuarios</b> del inicio.</div>
    <div class="org-layout">
      <div class="card org"><b style="display:block;margin-bottom:6px">Organigrama</b><ul>${raiz.map(rama).join("")}</ul></div>
      <div class="card" style="padding:14px">${sel?`
        <b>Editar · ${esc(sel.nombre||sel.email)}</b><div class="meta" style="margin-bottom:10px">${esc(sel.email)}</div>
        <label class="f"><span>Cargo</span><input class="inp" id="pc" value="${esc(sel.cargo||"")}"></label>
        <label class="f"><span>Jefe directo</span><select class="inp" id="pj"><option value="">— Nadie (nivel superior) —</option>${GENTE.filter(x=>x.email!==sel.email).map(x=>`<option value="${esc(x.email)}"${sel.jefe===x.email?" selected":""}>${esc(x.nombre||x.email)}</option>`).join("")}</select></label>
        <div class="err" id="perr"></div><button class="btn pri" id="pok">Guardar</button>`
        :`<div class="nota">Elige una persona del organigrama para cambiar su cargo o su jefe directo.</div>`}</div>
    </div>`;
  $("main").querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{ SEL_P=b.dataset.p; vistaUsuarios(); });
  if(sel) $("pok").onclick=async()=>{
    try{ await q(SB.rpc("ma_jerarquia_guardar",{p_email:sel.email,p_cargo:$("pc").value,p_jefe:$("pj").value||null})); await cargar(); vistaUsuarios(); toast("Guardado"); }
    catch(e){ $("perr").textContent=e.message; }
  };
}
</script>
