# Mantiene activo el proyecto de Supabase (el plan gratis lo pausa tras 7 días sin uso).
# Cada 2 días hace una consulta de solo lectura. No cambia ningún dato.
# Usa la misma clave pública (anon) que ya usan las páginas.
name: Mantener Supabase activo

on:
  schedule:
    - cron: "17 13 */2 * *"   # cada 2 días, 8:17 a. m. hora de Panamá
  workflow_dispatch: {}        # botón "Run workflow" para probarlo a mano

permissions:
  actions: write               # para que GitHub no apague esta tarea por inactividad

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      SB_URL: https://oiongsqkcbovzsavjwql.supabase.co
      SB_ANON: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9pb25nc3FrY2JvdnpzYXZqd3FsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE3Njc5NTEsImV4cCI6MjEwNzM0Mzk1MX0.nV1qgE1gd3TybJKhF8q_JphvkqbJtCLldl63YBTaLqs
    steps:
      - name: Consultar Supabase
        run: |
          set -e
          for t in ma_usuarios ta_tareas lg_casos; do
            c=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
              "$SB_URL/rest/v1/$t?select=*&limit=1" \
              -H "apikey: $SB_ANON" -H "Authorization: Bearer $SB_ANON")
            echo "$t -> HTTP $c"
          done
          curl -sf --max-time 30 "$SB_URL/auth/v1/health" -H "apikey: $SB_ANON" && echo " auth OK"
      - name: Evitar que GitHub apague la tarea (60 días sin cambios)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/mantener-supabase.yml/enable" && echo "tarea activa"
